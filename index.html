    {q:"In the land sparing vs. land sharing debate, land sparing involves:", opts:["Low-yield farming spread across large areas","High-yield farming on small areas freeing large areas for natural habitat conservation","No farming at all","Farming only in cities"], ans:1, exp:"Land sparing: high-yield farming concentrated on small areas so that large tracts of natural habitat can be fully conserved — contrasting with land sharing where lower-intensity wildlife-friendly farming is spread more widely."}
  ],
  summary:`<h4>Overview</h4><p>Global change — including climate change, habitat fragmentation, and agricultural intensification — is fundamentally restructuring biodiversity and ecosystem function. Species must acclimate, adapt, move or die (Corlett et al. 2013).</p><h4>Species Responses</h4><p><strong>Acclimation:</strong> physiological adjustment within lifetime (Type I: rapid; Type II: gene expression). <strong>Adaptation:</strong> heritable genetic change over generations. <strong>Migration:</strong> latitudinal and elevational range shifts. Ectotherms especially vulnerable (body temperature = environment). Flying foxes: mass mortality at >42°C heatwaves — non-linear responses.</p><h4>Fragmentation & Insect Decline</h4><p>70% of forests within 1 km of an edge. Extinction risk scales with fragmentation and range size (IUCN). Insects declining ~1%/year. Causes: land-use change, pesticides, agriculture, climate. Consequences: food web disruption, pollination loss.</p><h4>Management</h4><p>Land sparing vs land sharing: context-dependent, no universal solution. Novel ecosystems: should we restore or adapt? Both approaches may be needed.</p><h4>Exam Tips</h4><div class="tip">The Corlett et al. 2013 quote is highly examinable. Distinguish acclimation (individual, not heritable) from adaptation (genetic, heritable). The flying fox heatwave example illustrates non-linear responses to extreme events — important point.</div>`,
  terms:[
    {t:"Acclimation", d:"Physiological or morphological adjustment by an individual organism in response to environmental change — occurs within a lifetime, not heritable. Type I: rapid substrate-driven; Type II: slower via gene expression."},
    {t:"Adaptation (evolutionary)", d:"Heritable genetic change over multiple generations through natural selection in response to environmental pressure — contrasts with acclimation."},
    {t:"Range shift", d:"Movement of a species' geographic distribution in response to climate change — typically poleward or upslope (elevation). Creates novel community compositions."},
    {t:"Ectotherm", d:"Organism whose body temperature depends on the external environment (e.g. reptiles, amphibians, fish, most invertebrates). Particularly vulnerable to climate change and extreme heat events."},
    {t:"Edge effect", d:"Changes in biological community structure and abiotic conditions near habitat boundaries (edges). Includes increased light, wind, desiccation, temperature extremes and invasive species."},
    {t:"Land sparing", d:"Conservation strategy using high-yield farming concentrated on small areas to free large areas of natural habitat — contrasts with land sharing (wildlife-friendly lower-intensity farming across wider areas)."},
    {t:"Novel ecosystem", d:"An ecosystem irreversibly altered by human activity that has no historical precedent; raises the question of whether to restore historical states or manage new states."},
    {t:"Insect decline", d:"Documented ~1%/year decline in terrestrial insect biomass, driven by land-use change, pesticides, agricultural intensification and climate change. Threatens pollination and food web integrity."}
  ]
}

    DATA: {
"2.1.1a": {
  cards:[
    {q:"What are the three main determinants of Earth's climate?", a:"1) Earth-sun geometry and continental location. 2) Heat transport efficiency from tropics to poles and to space. 3) Atmospheric greenhouse gas concentrations, controlled by ocean and land carbon uptake/release."},
    {q:"Compare Venus, Earth and Mars: why is Venus so much hotter despite similar solar input?", a:"Venus has >98% CO₂ atmosphere (vs 0.028% on Earth) creating a massive greenhouse effect, pushing surface temperature to 737K. Earth's moderate GHG mix gives 288K; Mars with thin 0.01 bar CO₂ atmosphere is only 220K."},
    {q:"Why is infrared emission to space concentrated in the tropics?", a:"The tropics are desert-dominated at ~30°N/S (subtropical high pressure, subsidence), making them the hottest regions. Hotter objects emit more longwave radiation (Stefan-Boltzmann law)."},
    {q:"What is the ITCZ and what happens there?", a:"The Intertropical Convergence Zone is a narrow band at the equator where trade winds converge. It features intense solar heating, rising moist air, deep convection and heavy precipitation — it is the ascending branch of the Hadley Cell."},
    {q:"Describe the Hadley Cell structure.", a:"Warm moist air rises at the equator (ITCZ), moves poleward aloft, sinks at ~30°N/S creating subtropical deserts and high pressure, then returns to equator as surface trade winds — a closed overturning cell."},
    {q:"What drives atmospheric and ocean circulation?", a:"The unequal distribution of solar energy — tropics absorb more shortwave radiation than they emit longwave, poles emit more than they absorb. This imbalance drives heat transport poleward through both atmosphere and oceans."},
    {q:"What are jet streams and where are they found?", a:"Strong, fast upper-tropospheric winds (~10 km altitude) at ~45–60°N/S, flowing westerly (west to east). Polar and subtropical jet streams form where strong horizontal temperature gradients create large pressure differences."},
    {q:"What characterises extratropic (midlatitude) circulation vs. tropical circulation?", a:"Tropics: deep moist convection driven by surface heating. Midlatitudes: large-scale eddies (cyclones/anticyclones) driven by baroclinic instability and Rossby waves — fundamentally different mechanisms."}
  ],
  quiz:[
    {q:"Venus is much hotter than Earth despite similar solar input mainly because:",opts:["Venus is closer to the Sun by 30%","Venus has a >98% CO2 atmosphere causing a massive greenhouse effect","Venus has no oceans to absorb heat","Venus spins much more slowly"],ans:1,exp:"Venus's >98% CO2 atmosphere creates an enormous greenhouse effect, pushing surface temperature to 737K compared to Earth's 288K despite similar solar input."},
    {q:"The ITCZ is located at:",opts:["30°N where Hadley Cell trade winds begin","60°N where polar fronts commonly form","The equator where trade winds converge and warm air rises","The poles where cold air sinks and diverges"],ans:2,exp:"The ITCZ sits at the equator where surface trade winds converge, warm moist air rises and deep convection produces heavy tropical rainfall."},
    {q:"Subtropical deserts form at ~30°N/S because:",opts:["Solar radiation is lowest at these latitudes","Hadley Cell subsidence creates high pressure and suppresses rainfall","Coriolis force deflects all moisture away from these zones","Cold ocean currents reduce evaporation in these regions"],ans:1,exp:"The descending branch of the Hadley Cell at ~30°N/S produces persistent high pressure, suppressing cloud formation and rainfall and creating the world's major hot deserts."},
    {q:"Earth's planetary albedo is approximately:",opts:["0.10 — reflecting about 10% of solar input","0.20 — reflecting about 20% of solar input","0.30 — reflecting about 30% of solar input","0.50 — reflecting about 50% of solar input"],ans:2,exp:"Earth's planetary albedo is ~0.30, meaning ~30% of incoming solar radiation is reflected back to space, primarily by clouds (~79 W/m2) and the surface (~23 W/m2)."},
    {q:"The Hadley Cell transports heat poleward by:",opts:["Moving ocean currents northward along the surface","Overturning: rising at ITCZ, poleward aloft, sinking at ~30°","Diffusing heat slowly through the troposphere","Radiating longwave energy directly toward the poles"],ans:1,exp:"The Hadley Cell is a direct overturning: warm moist air rises at the ITCZ, flows poleward aloft, sinks at ~30°N/S creating subtropical deserts, and returns equatorward as trade winds."},
    {q:"Jet streams are found at approximately:",opts:["2 km altitude near the equator","10 km altitude at 45-60°N/S","20 km altitude in the stratosphere","5 km altitude at the poles"],ans:1,exp:"Jet streams are fast upper-tropospheric westerly winds at ~10 km altitude at approximately 45-60°N/S, driven by strong temperature gradients between tropical and polar air masses."},
    {q:"The tropical-to-polar energy imbalance drives global circulation because:",opts:["The tropics receive less radiation than the poles on average","Tropics absorb more than they emit; poles emit more than they absorb","The tropics reflect all incoming solar radiation","Polar regions have no longwave emission to space"],ans:1,exp:"Tropics absorb more solar radiation than they emit as longwave; poles do the opposite. This imbalance drives atmospheric and oceanic circulation to transport heat poleward."},
    {q:"Midlatitude weather systems are primarily driven by:",opts:["Hadley Cell overturning extending to high latitudes","Ekman transport from wind-driven ocean surfaces","Baroclinic instability from strong horizontal temperature gradients","Direct solar heating of land surfaces in summer"],ans:2,exp:"Midlatitude weather is driven by baroclinic instability — strong horizontal temperature gradients store potential energy released as growing Rossby waves forming cyclones and anticyclones."}
  ],
  summary:`<h4>Overview</h4><p>Earth's climate is determined by the solar radiation balance, the efficiency of heat transport, and greenhouse gas concentrations. Venus (737K, >98% CO₂) and Mars (220K, 0.01 bar) demonstrate how GHGs and atmospheric pressure control surface temperature.</p><h4>Key Circulation Features</h4><p><strong>ITCZ:</strong> equatorial convergence zone, ascending Hadley branch, heavy rain. <strong>Hadley Cell:</strong> rises at equator, sinks at 30°N/S creating subtropical deserts. <strong>Jet streams:</strong> fast upper-tropospheric westerlies at 45–60°N/S.</p><h4>Energy Balance</h4><p>Tropics absorb more solar radiation than they emit; poles emit more than they absorb. This gradient drives all atmospheric and oceanic circulation, transporting heat poleward. Longwave emission is concentrated in the hot subtropical deserts.</p><h4>Key Diagrams</h4><svg viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg" style="width:100%;border-radius:8px;background:#f0f7ff;margin-bottom:4px">

"2.1.2": {
  cards:[
    {q:"State the Stefan-Boltzmann Law.", a:"Total radiation emitted per unit area H (W m⁻²) is proportional to the fourth power of the absolute temperature T: H = σT⁴. Earth emits ~401 W/m² at 290K; the Sun emits ~73,483,200 W/m² at 6000K."},
    {q:"What is a blackbody?", a:"An idealised object that absorbs all electromagnetic radiation falling on it and emits the maximum possible radiation at every wavelength for its temperature — described by the Planck function."},
    {q:"Why do the Sun and Earth emit radiation at different wavelengths?", a:"The Sun at ~6000K emits shortwave (visible, UV) radiation peaking at ~0.5 μm. Earth at ~290K emits longwave (infrared) radiation peaking at ~10 μm. There is almost no spectral overlap — this is what makes the greenhouse effect possible."},
    {q:"What causes electromagnetic radiation from heated matter?", a:"Heat causes electrons of atoms to collide and jump to higher energy shells. When they fall back, they release photons of electromagnetic radiation. The hotter the object, the more frequent these excitations and the shorter the peak wavelength."},
    {q:"What is planetary albedo and how is it calculated?", a:"The fraction of incoming solar radiation reflected back to space. Earth's albedo ≈ 0.30. Clouds reflect ~79 W/m² and the surface ~23 W/m². Albedo = reflected solar / incoming solar."},
    {q:"Why does the near-absence of spectral overlap between solar and terrestrial radiation matter?", a:"It means solar shortwave radiation can pass through the atmosphere relatively freely, but Earth's longwave (infrared) emission is absorbed and re-emitted by greenhouse gases — allowing GHGs to trap heat selectively."},
    {q:"What is the estimated equilibrium surface temperature of Earth without greenhouse gases?", a:"Approximately 255K (−18°C), compared to the actual ~288K (+15°C). The 33°C difference is the natural greenhouse warming effect of the atmosphere."},
    {q:"What did John Tyndall discover in 1862?", a:"That certain gases (CO₂, H₂O vapour) absorb infrared radiation, while others (N₂, O₂) are transparent to it. This was the first experimental demonstration of the mechanism behind the greenhouse effect."}
  ],
  quiz:[
    {q:"The Stefan-Boltzmann Law states that radiation emitted per unit area:",opts:["Is inversely proportional to temperature","Is proportional to temperature squared","Is proportional to the fourth power of absolute temperature","Equals temperature multiplied by the Stefan constant linearly"],ans:2,exp:"H = sigma*T^4. Total radiation emitted per unit area is proportional to the fourth power of absolute temperature. Earth at 290K emits ~401 W/m2."},
    {q:"The Sun peaks at ~0.5 micrometres while Earth peaks at ~10 micrometres because:",opts:["The Sun reflects more light than it emits","Hotter objects emit at shorter peak wavelengths — Wien's Law","The Sun is larger so emits at longer wavelengths","Earth emits only infrared due to its atmospheric composition"],ans:1,exp:"Wien's Law: peak wavelength decreases as temperature increases. Sun at ~6000K peaks at 0.5 um (visible); Earth at ~290K peaks at 10 um (thermal infrared)."},
    {q:"Without any greenhouse gases Earth's surface temperature would be approximately:",opts:["-50°C — well below the actual surface temperature","-18°C — about 33°C below the actual temperature","0°C — exactly at the freezing point of water","10°C — only slightly below the actual temperature"],ans:1,exp:"Without GHGs Earth would be ~255K (-18°C) — the blackbody equilibrium temperature. The natural greenhouse effect adds ~33°C to give the actual ~288K (+15°C)."},
    {q:"Tyndall's 1862 experiment showed that:",opts:["All atmospheric gases absorb infrared radiation equally","CO2 and water vapour absorb infrared while N2 and O2 are transparent to it","The greenhouse effect was too small to measure experimentally","Visible light is absorbed by CO2 more strongly than infrared"],ans:1,exp:"Tyndall showed experimentally that CO2 and H2O vapour absorb infrared while N2 and O2 are transparent — the first experimental demonstration of the physical greenhouse mechanism."},
    {q:"The near-absence of spectral overlap between solar and terrestrial radiation matters because:",opts:["It prevents the atmosphere from warming at all","It allows GHGs to absorb outgoing longwave without significantly blocking incoming solar","It means CO2 has no effect on incoming solar radiation","It causes ozone to absorb UV radiation in the stratosphere"],ans:1,exp:"Solar shortwave (~0.5 um peak) and terrestrial longwave (~10 um peak) barely overlap spectrally, so GHGs selectively absorb outgoing infrared without significantly blocking incoming solar radiation."},
    {q:"Earth emits approximately how much radiation according to Stefan-Boltzmann?",opts:["150 W/m2 at its average temperature","280 W/m2 at its average temperature","401 W/m2 at its average temperature","600 W/m2 at its average temperature"],ans:2,exp:"At ~290K Earth emits approximately 401 W/m2 according to H = sigma*T^4 where sigma = 5.67x10-8 W m-2 K-4."},
    {q:"A blackbody is defined as an object that:",opts:["Reflects all incoming radiation perfectly","Absorbs all incoming radiation and emits maximum possible radiation for its temperature","Emits only visible light regardless of temperature","Absorbs only infrared and reflects all visible light"],ans:1,exp:"A blackbody is an idealised perfect absorber and emitter — it absorbs all incident radiation and emits the maximum possible radiation at every wavelength for its temperature, described by the Planck function."},
    {q:"The ratio of radiation emitted by the Sun to Earth per unit area is approximately:",opts:["10:1 — the Sun emits 10 times more per unit area","1000:1 — a thousandfold difference per unit area","183000:1 — reflecting the T^4 relationship between ~6000K and ~290K","1000000:1 — the Sun is a million times more powerful per unit area"],ans:2,exp:"Stefan-Boltzmann: (6000/290)^4 ≈ 183,000. The Sun emits ~183,000 times more radiation per unit area than Earth — the vast difference between a 6000K star and a 290K planet."}
  ],
  summary:`<h4>Overview</h4><p>Earth's temperature is determined by the balance between incoming solar (shortwave) and outgoing terrestrial (longwave) radiation. The Stefan-Boltzmann law (H = σT⁴) connects temperature to radiation.</p><h4>Key Numbers</h4><p>Sun: 6000K, peak ~0.5 μm, ~73.5 million W/m². Earth: 290K, peak ~10 μm, ~401 W/m². Ratio: 183,237:1. Without GHGs: −18°C. With GHGs: +15°C. Difference = 33°C greenhouse effect.</p><h4>Why GHGs Work</h4><p>Solar shortwave and terrestrial longwave have almost no spectral overlap. Greenhouse gases (CO₂, H₂O) are transparent to shortwave but absorb longwave — discovered experimentally by Tyndall (1862).</p><h4>Key Diagrams</h4><svg viewBox="0 0 480 190" xmlns="http://www.w3.org/2000/svg" style="width:100%;border-radius:8px;background:#fffbf0;margin-bottom:4px">

  <text x="340" y="172" font-size="8" fill="#555">10</text>

  terms:[
    {t:"Stefan-Boltzmann Law", d:"H = σT⁴; total radiation emitted per unit area scales with the fourth power of absolute temperature. Earth: ~401 W/m² at 290K."},
    {t:"Blackbody", d:"An idealised perfect absorber and emitter of radiation at all wavelengths; real objects approximate this to varying degrees."},

"1.3.1": {
  cards:[
    {q:"What is the Beer-Lambert Law?", a:"Radiation intensity decreases exponentially with distance through an absorbing medium: I = I₀ × e^(−kx). Used to quantify how much infrared radiation is absorbed by a greenhouse gas of known concentration."},
    {q:"Why do CO₂, H₂O and CH₄ absorb infrared but N₂ and O₂ do not?", a:"Infrared absorption requires molecules to have vibrational modes that create a changing dipole moment. CO₂, H₂O and CH₄ are triatomic/polyatomic molecules with asymmetric vibration modes. N₂ and O₂ are symmetric diatomic — their vibrations produce no dipole change."},
    {q:"What are the quantised energy levels in a molecule?", a:"Electronic levels (electron shell jumps), vibrational levels (stretching/bending of bonds), and rotational levels. GHGs absorb IR by exciting vibrational and rotational transitions — the photon energy must exactly match the energy gap between levels."},
    {q:"What is the dual wave-particle nature of light, and how does it apply to GHG absorption?", a:"Light has both wave properties (frequency, wavelength) and particle properties (photons). A photon with energy E = hv is absorbed only if its energy exactly matches the difference between quantised molecular energy levels (Planck's relation)."},
    {q:"Describe the terrestrial heat radiation spectrum as observed by Nimbus 4 satellite.", a:"The outgoing longwave spectrum from the Sahara Desert shows dips (absorption bands) at specific wavelengths: the CO₂ absorption band at ~15 μm is a deep trough — Earth radiates less at this wavelength because CO₂ absorbs and re-emits it within the atmosphere."},
    {q:"What vibration modes does CO₂ have?", a:"CO₂ (linear triatomic): symmetric stretch (IR-inactive — no dipole change), asymmetric stretch (IR-active, ~15 μm), and two bending modes (IR-active, ~15 μm). The bending and asymmetric stretch absorb strongly in the infrared."},
    {q:"Why is the greenhouse effect described as 'radiation easily comes in but less easily goes out'?", a:"Solar shortwave radiation passes through GHGs largely unimpeded (GHGs are transparent to visible light). Outgoing longwave from Earth is absorbed and re-emitted at these same wavelengths — slowing the escape of heat to space."},
    {q:"What does observed solar vs terrestrial spectrum overlap tell us?", a:"There is almost zero spectral overlap between solar shortwave (~0.5 μm peak) and terrestrial longwave (~10 μm peak). This separation allows GHGs to selectively impede only outgoing longwave radiation without blocking incoming solar energy."}
  ],
  quiz:[
    {q:"CO2 absorbs infrared but N2 does not primarily because:",opts:["CO2 is much denser and absorbs more energy per molecule","CO2 has vibrational modes creating a changing dipole moment; N2 as a symmetric diatomic does not","N2 molecules are too small to interact with infrared photons","CO2 has a higher boiling point making it more reactive to radiation"],ans:1,exp:"Infrared absorption requires vibrational modes that create a changing dipole moment. CO2's bending and asymmetric stretch qualify; N2's symmetric stretch produces no dipole change and is IR-inactive."},
    {q:"The Beer-Lambert Law (I = I0 * e^-kx) describes:",opts:["How temperature affects radiation emission rates","Exponential decrease of radiation intensity through an absorbing medium","How albedo varies with different surface types","The relationship between wavelength and photon energy"],ans:1,exp:"Beer-Lambert: radiation intensity decreases exponentially with concentration (k) and path length (x) through an absorbing medium — quantifying how much IR CO2 absorbs in the atmosphere."},
    {q:"The CO2 absorption band in the outgoing longwave spectrum is centred at approximately:",opts:["1 micrometre — near infrared region","5 micrometres — mid infrared region","15 micrometres — thermal infrared region","50 micrometres — far infrared region"],ans:2,exp:"CO2 absorbs strongly at ~15 micrometres (bending and asymmetric stretch modes), creating a deep trough in Earth's outgoing longwave spectrum as observed by satellites like Nimbus 4 over the Sahara."},
    {q:"Planck's relation E = hv tells us that:",opts:["Energy equals heat times volume of the gas","Photon energy equals Planck's constant times its frequency","Energy is proportional to wavelength squared","Heat flow equals frequency divided by molecular mass"],ans:1,exp:"E = hv: photon energy equals Planck's constant (h) multiplied by frequency (v). A GHG molecule absorbs a photon only if its energy exactly matches an allowed quantum energy level transition."},
    {q:"The Nimbus 4 satellite spectrum of outgoing radiation shows:",opts:["Uniform emission at all wavelengths with no features","A near-blackbody curve with deep troughs at GHG absorption bands including CO2 at ~15 um","Higher emission than a perfect blackbody at all wavelengths","No emission whatsoever in the 10-20 micrometre region"],ans:1,exp:"The Nimbus 4 spectrum shows a near-blackbody emission curve with deep troughs — the CO2 band at ~15 um being most prominent — where GHGs absorb outgoing radiation before it escapes to space."},
    {q:"CO2's symmetric stretch vibration is infrared-inactive because:",opts:["It occurs at too high a frequency for infrared photons to excite","It produces no change in the electric dipole moment of the CO2 molecule","It requires more energy than visible light photons can provide","It only occurs at very high temperatures above 1000 degrees"],ans:1,exp:"The symmetric stretch moves both O atoms equally away from C producing no net dipole change — so it cannot interact with IR radiation. The asymmetric stretch and bending modes create dipole changes and absorb IR at ~15 um."},
    {q:"The greenhouse effect can be summarised as:",opts:["Incoming solar radiation is blocked from entering the atmosphere by CO2","Incoming shortwave passes through largely unimpeded; outgoing longwave is selectively absorbed by GHGs","All radiation is trapped permanently in the lower atmosphere","GHGs reflect incoming solar radiation back to space increasing Earth's albedo"],ans:1,exp:"GHGs are largely transparent to shortwave solar radiation but absorb outgoing longwave infrared from Earth's surface — slowing escape of heat to space and warming the lower atmosphere."},
    {q:"Which gases are the most important natural greenhouse gases?",opts:["N2 and O2 — the most abundant atmospheric gases","CO2 and N2 — carbon and nitrogen compounds","H2O vapour and CO2 — with CH4 and N2O also significant","O3 and Ar — the reactive minor components of the atmosphere"],ans:2,exp:"Water vapour is the most abundant natural GHG and provides the strongest natural warming. CO2 is next most important. CH4 and N2O are significant despite lower concentrations due to higher per-molecule warming potentials."}
  ],
  summary:`<h4>Overview</h4><p>Greenhouse gases absorb infrared radiation through specific molecular vibration and rotation modes. The key insight: energy levels are quantised — a photon of exactly the right frequency must match the energy gap between levels.</p><h4>Why Some Gases Absorb IR</h4><p><strong>GHGs (CO₂, H₂O, CH₄):</strong> polyatomic/triatomic molecules with vibrational modes creating changing dipole moments — absorb IR. <strong>N₂, O₂:</strong> symmetric diatomic, no dipole change — transparent to IR.</p><h4>Key Physics</h4><p>E = hv (photon energy = Planck's constant × frequency). CO₂ absorbs strongly at ~15 μm. Beer-Lambert Law: I = I₀e^(-kx). Nimbus 4 satellite observed the CO₂ absorption trough in outgoing longwave spectrum.</p><h4>Key Diagrams</h4><svg viewBox="0 0 480 175" xmlns="http://www.w3.org/2000/svg" style="width:100%;border-radius:8px;background:#fffbf0;margin-bottom:4px">

<div style="font-size:10px;color:var(--muted);margin-bottom:10px;font-style:italic">GHGs absorb outgoing longwave at specific bands. CO₂ at ~15μm is the most important for climate forcing. The 'atmospheric window' (~8–13μm) allows some IR to escape to space. N₂ and O₂ are IR-transparent.</div><h4>Exam Tips</h4><div class="tip">The dipole moment argument is the key mechanistic explanation for WHY CO₂ absorbs IR. Don't just say "CO₂ is a GHG" — explain the vibration mode and changing dipole.</div>`,
  terms:[

"1.4.1": {
  cards:[
    {q:"How does increasing CO₂ warm the surface via changes in emission height?", a:"CO₂ absorbs outgoing IR, so the altitude from which radiation escapes to space shifts higher into the colder atmosphere. Colder layers emit less radiation (Stefan-Boltzmann). To restore energy balance, the whole troposphere — including the surface — must warm up."},
    {q:"What are the four main layers of the atmosphere and their key properties?", a:"Troposphere (0–12km): temperature decreases with height, 75% of mass, weather. Stratosphere (12–50km): temperature increases with height (ozone absorbs UV). Mesosphere: temperature decreases. Thermosphere: temperature increases again."},
    {q:"Define the Dry Adiabatic Lapse Rate (DALR) and its value.", a:"The rate at which a dry (unsaturated) air parcel cools when it rises adiabatically (without exchanging heat). DALR ≈ 9.8°C/km (approximately 1°C per 100m ascent)."},
    {q:"Define the Moist Adiabatic Lapse Rate (MALR) and why it differs from DALR.", a:"MALR ≈ 6°C/km. When moist air rises and condensation occurs, latent heat is released, offsetting the adiabatic cooling — so moist air cools more slowly than dry air."},
    {q:"State the three atmospheric stability conditions.", a:"Stable: environmental lapse rate < DALR — displaced parcel returns to original level. Neutral: ELR = DALR. Unstable: ELR > DALR — displaced parcel continues to rise (convection develops)."},
    {q:"What is hydrostatic balance?", a:"The balance between the downward gravitational force on an air parcel and the upward pressure gradient force. This is why atmospheric pressure decreases exponentially with altitude."},
    {q:"What is radiative-convective equilibrium?", a:"The steady state where solar heating of the surface (driving instability and convection) is balanced by infrared radiative cooling of the atmosphere. The observed average lapse rate of ~6.5°C/km reflects this balance."},
    {q:"What is the Lifting Condensation Level (LCL)?", a:"The altitude at which rising air becomes saturated and condensation begins, forming clouds. Below the LCL, air rises dry adiabatically (DALR). Above it, latent heat release reduces the cooling rate (MALR), potentially driving deep convection."}
  ],
  quiz:[
    {q:"The Dry Adiabatic Lapse Rate (DALR) is approximately:",opts:["1°C per kilometre — very gradual cooling rate","4°C per kilometre — moderate cooling rate","9.8°C per kilometre — standard adiabatic cooling rate","15°C per kilometre — extreme cooling rate"],ans:2,exp:"The DALR is ~9.8°C/km — the rate at which a dry unsaturated air parcel cools when it rises adiabatically without exchanging heat with surroundings."},
    {q:"Temperature increases with height in the stratosphere because:",opts:["There is less CO2 to absorb infrared at high altitude","Ozone absorbs incoming solar UV radiation heating the stratospheric layer","Pressure is lower so remaining molecules move faster on average","Water vapour condensation releases latent heat in the stratosphere"],ans:1,exp:"Ozone in the stratosphere absorbs solar UV radiation converting it to heat. This temperature inversion makes the stratosphere very stable and prevents vertical mixing with the troposphere below."},
    {q:"The atmosphere is considered unstable when:",opts:["Environmental lapse rate is less than the DALR","Environmental lapse rate equals the DALR exactly","Environmental lapse rate exceeds the DALR","Relative humidity falls below 50% throughout the column"],ans:2,exp:"Instability: ELR > DALR — rising air parcels remain warmer than surroundings and continue to rise spontaneously, developing into convection and potentially storms."},
    {q:"Doubling CO2 raises the effective emission height by approximately:",opts:["15 metres — a negligible atmospheric change","150 metres — reducing emission temperature by ~1 degree","1500 metres — a very large shift in emission altitude","15 kilometres — moving emission to the stratosphere"],ans:1,exp:"Doubling CO2 raises the effective emission height by ~150m, reducing emission temperature by ~1°C (using the 6.5°C/km lapse rate), requiring ~1°C surface warming to restore radiative balance."},
    {q:"The observed average environmental lapse rate of ~6.5°C/km reflects:",opts:["The dry adiabatic lapse rate operating everywhere","The moist adiabatic lapse rate operating globally","Radiative-convective equilibrium between solar surface heating and radiative atmospheric cooling","The stratospheric lapse rate extending downward into the troposphere"],ans:2,exp:"The ~6.5°C/km average reflects radiative-convective equilibrium — balance between solar heating of the surface driving convection and radiative cooling of the atmosphere. It lies between DALR (9.8) and MALR (~6)."},
    {q:"The Moist Adiabatic Lapse Rate (~6°C/km) is lower than the DALR (9.8°C/km) because:",opts:["Moist air is heavier and therefore rises more slowly","Latent heat released during condensation partly offsets adiabatic cooling","Water vapour absorbs solar radiation directly during ascent","Moist air has higher albedo reflecting more solar radiation"],ans:1,exp:"When saturating air rises and water vapour condenses, latent heat is released partially offsetting the adiabatic cooling. So moist air cools at only ~6°C/km rather than the dry 9.8°C/km rate."},
    {q:"Hydrostatic balance in the atmosphere means:",opts:["Water vapour and dry air are in chemical equilibrium","Downward gravitational force on air is balanced by the upward pressure gradient force","Incoming and outgoing radiation are in exact balance","Wind speed is balanced by the Coriolis force at all levels"],ans:1,exp:"Hydrostatic balance: downward pull of gravity on air is balanced by the upward pressure gradient force, causing atmospheric pressure to decrease exponentially with altitude."},
    {q:"The emission height mechanism explains CO2-driven warming because:",opts:["CO2 directly heats the troposphere by absorbing solar radiation","More CO2 raises the emission altitude to a colder level reducing outgoing radiation until the surface warms","CO2 increases water vapour which then heats the surface directly","More CO2 reduces surface albedo absorbing more incoming solar radiation"],ans:1,exp:"More CO2 means radiation must escape from higher colder levels — less is lost to space — creating an energy imbalance — so the surface and atmosphere warm until a new radiative balance is achieved."}
  ],
  summary:`<h4>Overview</h4><p>The atmosphere has a vertical structure determined by temperature, pressure and composition. The key concept linking GHGs to warming is the emission height mechanism.</p><h4>Emission Height Mechanism</h4><p>More CO₂ → radiation escapes from higher, colder altitude → less radiation lost to space → surface must warm to restore balance. CO₂ doubling: +150m emission height → −1°C emission temp → ~+1°C surface warming (Planck response).</p><h4>Lapse Rates</h4><p>DALR = 9.8°C/km. MALR ≈ 6°C/km (latent heat offsets cooling). Observed average = 6.5°C/km (radiative-convective equilibrium). Stability: unstable if ELR > DALR.</p><h4>Key Diagrams</h4><svg viewBox="0 0 480 210" xmlns="http://www.w3.org/2000/svg" style="width:100%;border-radius:8px;background:#f0f9ff;margin-bottom:4px">

<div style="font-size:10px;color:var(--muted);margin-bottom:10px;font-style:italic">Troposphere cools with height (convection). Stratosphere warms (ozone absorbs UV). The emission height mechanism: more CO₂ → emission from higher, colder level → less heat escapes → surface warms.</div><h4>Exam Tips</h4><div class="tip">The emission height mechanism is THE central explanation for CO₂-driven warming. Practise explaining it step by step: more CO₂ → higher emission altitude → colder emission → less outgoing radiation → surface warms.</div>`,
  terms:[
    {t:"Emission height mechanism", d:"How CO₂ warms the surface: more CO₂ → radiation escapes from higher, colder altitude → less outgoing radiation → surface must warm to restore balance."},
    {t:"Dry Adiabatic Lapse Rate (DALR)", d:"Rate of cooling of a dry unsaturated air parcel rising adiabatically: ~9.8°C/km (~1°C/100m)."},
    {t:"Moist Adiabatic Lapse Rate (MALR)", d:"Rate of cooling of a saturating rising air parcel: ~6°C/km. Lower than DALR because latent heat from condensation offsets cooling."},
    {t:"Hydrostatic balance", d:"Equilibrium between downward gravity and upward pressure gradient force, causing exponential decrease of pressure with altitude."},
    {t:"Radiative-convective equilibrium", d:"Steady state where solar surface heating (triggering convection) balances atmospheric radiative cooling, producing an average lapse rate of ~6.5°C/km."},
    {t:"Lifting Condensation Level (LCL)", d:"The altitude at which rising air becomes saturated and cloud formation begins; marks the transition from dry to moist adiabatic cooling."}
  ]
},
"1.5.1": {
  cards:[
    {q:"What are the three major forces driving atmospheric and ocean motion?", a:"Pressure gradient force (fluid moves from high to low pressure), Coriolis force (due to Earth's rotation), and frictional drag (viscosity and turbulence near boundaries)."},
    {q:"What is geostrophic balance?", a:"When the pressure gradient force and Coriolis force exactly balance. Winds flow parallel to isobars rather than directly from high to low pressure. Most large-scale upper-atmosphere winds are approximately geostrophic."},
    {q:"How does the Coriolis force affect wind direction in each hemisphere?", a:"Northern Hemisphere: deflects wind to the right. Southern Hemisphere: deflects to the left. The effect is zero at the equator and increases with latitude. It acts perpendicular to velocity and does no work."},
    {q:"What is the Ekman spiral and what causes it?", a:"Wind stress on the ocean surface drives surface water in the direction of wind, but Coriolis deflects it. Successive deeper layers rotate further. The result is a spiral of current directions with depth (Ekman spiral). Net Ekman transport is 90° to the wind."},
    {q:"What drives monsoon circulation?", a:"Seasonal differential heating between land and ocean. Summer: land heats faster → surface low pressure → moist oceanic air flows inland → heavy rainfall. Winter: land cools → high pressure → dry offshore winds."},
    {q:"What is coastal upwelling and how is it caused?", a:"When wind-driven Ekman transport moves surface water away from the coast, deep nutrient-rich water rises to replace it. Example: Peru — supports anchovy fisheries, but upwelling collapses during El Niño when warm surface water displaces cold deep water."},
    {q:"What is Ekman pumping in subtropical gyres?", a:"Circular wind patterns (anticyclonic) over subtropical gyres drive convergent Ekman transport, pushing surface water downward (downwelling). This suppresses upwelling of nutrients, creating oligotrophic ocean deserts."},
    {q:"What is the pressure gradient force in an ocean context?", a:"Differential heating/cooling or Ekman convergence creates sea surface height differences. Water flows from high surface elevation toward low, generating geostrophic currents that flow parallel to the height contours (isobars)."}
  ],
  quiz:[
    {q:"Geostrophic balance involves a balance between:",opts:["Gravity and the Coriolis force acting on air parcels","The pressure gradient force and the Coriolis force","Surface wind drag and the pressure gradient force","The Coriolis force and turbulent frictional drag"],ans:1,exp:"Geostrophic balance: pressure gradient force exactly balances the Coriolis force, resulting in flow parallel to isobars rather than directly across them from high to low pressure."},
    {q:"Net Ekman transport is directed at what angle to the wind?",opts:["Same direction as the surface wind — no deflection","45° to the right of the wind in the Northern Hemisphere","90° to the right of the wind in the Northern Hemisphere","180° opposite to the surface wind direction"],ans:2,exp:"Integrating the Ekman spiral through the full water depth gives net transport exactly 90° to the right of the wind in the Northern Hemisphere (90° to the left in the Southern Hemisphere)."},
    {q:"Coastal upwelling along the Peru coast occurs because:",opts:["Deep ocean tides periodically force cold water to the surface","SE trade winds drive surface water offshore via Ekman transport drawing cold nutrient-rich water up from depth","The seafloor is unusually shallow along the South American coast","El Nino permanently forces cold deep water toward the Peruvian coast"],ans:1,exp:"South-east trade winds drive Ekman transport of surface water offshore westward. Cold nutrient-rich deep water upwells to replace it supporting one of the world's most productive fisheries."},
    {q:"During El Nino the Peru upwelling system:",opts:["Strengthens considerably as trade winds intensify","Shifts southward by about 10 degrees of latitude","Collapses as warm surface water suppresses upwelling of cold deep water","Deepens and becomes even more biologically productive"],ans:2,exp:"El Nino brings anomalously warm surface water to the eastern Pacific suppressing upwelling of cold nutrient-rich water — causing collapse of phytoplankton productivity and the anchovy fishery."},
    {q:"Subtropical ocean gyres are oligotrophic because:",opts:["They are too cold for phytoplankton to grow","Ekman convergence drives downwelling preventing nutrient supply to the sunlit surface","Wind speeds are too low for any nutrient mixing","They receive insufficient solar radiation for photosynthesis"],ans:1,exp:"Anticyclonic wind patterns drive Ekman convergence in subtropical gyres pushing surface water downward. This prevents nutrient-rich deep water reaching the photic zone creating ocean deserts confirmed by satellite chlorophyll maps."},
    {q:"Monsoon circulation is driven primarily by:",opts:["Orbital variations in solar insolation on millennial timescales","Seasonal differential heating between land and ocean creating pressure gradients","The Coriolis force reversing direction at the equator seasonally","Ocean current reversals in the Indian Ocean triggering atmospheric changes"],ans:1,exp:"Monsoons arise from seasonal heating contrasts: in summer land heats faster than ocean creating low pressure drawing in moist onshore winds. In winter land cools faster creating high pressure and dry offshore winds."},
    {q:"The Coriolis force is zero at the equator because:",opts:["Wind speeds are effectively zero at the equatorial surface","The sine of latitude equals zero at the equator (f = 2*omega*sin(lat))","Pressure gradients cancel exactly at the equator","The atmosphere is thinnest at the equator reducing the effect"],ans:1,exp:"The Coriolis parameter f = 2*omega*sin(lat). At the equator lat = 0, sin(0) = 0 and f = 0. This is why tropical cyclones cannot form within ~5° of the equator — insufficient Coriolis force to sustain rotation."},
    {q:"Ekman pumping in the open ocean creates:",opts:["Only surface currents with no associated vertical motion","Upwelling where Ekman transport diverges and downwelling where it converges","Horizontal mixing without any significant vertical displacement","Temperature inversions in the permanent thermocline"],ans:1,exp:"Ekman divergence (e.g. equatorial regions) causes upwelling; Ekman convergence (subtropical gyres) causes downwelling. These vertical motions fundamentally control biological productivity patterns across the ocean."}
  ],
  summary:`<h4>Overview</h4><p>Atmospheric and ocean circulation is governed by three forces: pressure gradient, Coriolis and friction. Their interactions produce geostrophic balance, Ekman transport and the global circulation patterns.</p><h4>Key Concepts</h4><p><strong>Coriolis:</strong> deflects right (NH), left (SH), zero at equator. <strong>Geostrophic balance:</strong> wind parallel to isobars. <strong>Ekman transport:</strong> 90° to wind. <strong>Monsoon:</strong> seasonal land-sea heating contrast.</p><h4>Oceanographic Applications</h4><p>Coastal upwelling (Peru): Ekman transport offshore → cold nutrient-rich water rises. Subtropical gyres: Ekman convergence → downwelling → oligotrophic. Chlorophyll from space confirms subtropical gyres as 'ocean deserts'.</p><h4>Key Diagrams</h4><svg viewBox="0 0 480 185" xmlns="http://www.w3.org/2000/svg" style="width:100%;border-radius:8px;background:#f0f9ff;margin-bottom:4px">

  <text x="32" y="100" font-size="8" fill="#555">~20m</text>
  <text x="32" y="140" font-size="8" fill="#555">~100m</text>
  <!-- Wind arrow -->

  <!-- Spiralling current arrows -->

  <line x1="125" y1="85" x2="182" y2="98" stroke="#f97316" stroke-width="2" marker-end="url(#arr_o2)"/>
  <line x1="125" y1="110" x2="170" y2="130" stroke="#16a34a" stroke-width="2" marker-end="url(#arr_g5)"/>

  <text x="328" y="121" font-size="9" fill="#16a34a" font-weight="bold">90° to wind</text>
  <text x="328" y="132" font-size="8" fill="#16a34a">(to the right</text>
  <text x="328" y="141" font-size="8" fill="#16a34a">in NH)</text>
  <!-- Application -->

<div style="font-size:10px;color:var(--muted);margin-bottom:10px;font-style:italic">Ekman spiral (left): each layer rotates 15° clockwise (NH) relative to layer above. Net transport (right): 90° to the right of wind in NH. This drives coastal upwelling when wind is parallel to coast.</div><h4>Exam Tips</h4><div class="tip">The Peru upwelling–El Niño story is frequently examined. Know both the normal state (upwelling, high productivity) AND the El Niño state (warm surface water, collapsed upwelling, fishery failure).</div>`,
  terms:[
    {t:"Geostrophic balance", d:"Balance between pressure gradient force and Coriolis force, resulting in flow parallel to isobars/pressure contours rather than across them."},
    {t:"Coriolis force", d:"Apparent force due to Earth's rotation; deflects moving objects to the right in NH, left in SH; zero at equator; increases with latitude."},
    {t:"Ekman spiral", d:"Systematic rotation of current direction with depth caused by the interplay of wind stress, Coriolis force and friction; net transport is 90° to wind."},
    {t:"Ekman pumping", d:"Divergence or convergence of Ekman transport driven by wind patterns — creates upwelling (divergence) or downwelling (convergence) in the interior ocean."},
    {t:"Coastal upwelling", d:"Rising of cold, nutrient-rich deep water along coastlines where Ekman transport moves surface water offshore; supports high biological productivity."},
    {t:"Monsoon", d:"Seasonal reversal of wind patterns driven by differential heating of land and ocean; summer onshore winds bring rain, winter offshore winds bring dry conditions."}
  ]
},
"1.7.1": {
  cards:[
    {q:"What are the main features of global ocean surface circulation?", a:"Subtropical gyres (clockwise NH, anticlockwise SH), polar gyres, equatorial currents (westward), equatorial counter-current, and the Antarctic Circumpolar Current (ACC) — the only current that circles the globe unimpeded."},
    {q:"What is the ACC and why is it unique?", a:"The Antarctic Circumpolar Current flows eastward around Antarctica driven by strong westerly winds. It is the only current to flow continuously around the full circumference of Earth, connecting all three major ocean basins."},
    {q:"What are the main ocean water masses and where do they form?", a:"NADW (North Atlantic Deep Water) forms in the N. Atlantic; AABW (Antarctic Bottom Water) forms around Antarctica; AAIW (Antarctic Intermediate Water); NPDW (North Pacific Deep Water). These form at the surface where specific T/S conditions exist, then sink and spread globally."},
    {q:"What is a CTD profile and what does it measure?", a:"CTD = Conductivity (salinity), Temperature, Depth. A CTD instrument lowered through the water column produces vertical profiles of salinity and temperature, revealing distinct water masses."},
    {q:"What factors control ocean salinity?", a:"Higher evaporation increases salinity (concentration). Higher precipitation and river input decreases salinity. Open ocean range is 32–37 g/L. Freezing also increases salinity (ice excludes salt as it forms, concentrating brine in remaining water)."},
    {q:"Why does sea ice formation cause deep water formation?", a:"When sea water freezes, ice excludes salt, releasing cold salty brine into the surrounding water. This increases density, causing the dense water to sink — driving bottom water formation (AABW around Antarctica, NADW in N. Atlantic)."},
    {q:"What is the East-West asymmetry in ocean current speed?", a:"Western boundary currents (Gulf Stream, Kuroshio) are narrow, fast and intense. Eastern boundary currents are broad, slow and shallow. This asymmetry (western intensification) results from the β-effect (variation of Coriolis with latitude)."},
    {q:"Why are subtropical gyres low in chlorophyll?", a:"Ekman convergence within subtropical gyres drives downwelling — nutrient-rich deep water cannot upwell to the sunlit surface. Without nutrients, phytoplankton growth is severely limited, creating 'ocean deserts'."}
  ],
  quiz:[
    {q:"The Antarctic Circumpolar Current is unique because:",opts:["It is the deepest-flowing current in the world ocean","It is the only current to flow continuously around the globe without any land barrier","It flows westward against all other major ocean currents","It only forms and flows strongly during winter months"],ans:1,exp:"The ACC flows eastward around Antarctica driven by persistent westerly winds — the only ocean current to circle the globe unimpeded by any landmass, connecting Atlantic, Pacific and Indian Ocean basins."},
    {q:"North Atlantic Deep Water (NADW) forms primarily because:",opts:["High rainfall in the North Atlantic freshens and sinks the surface water","Cold temperatures and high salinity increase density causing surface water to sink to depth","Ekman pumping forces surface water downward in the North Atlantic","Strong tidal mixing at the continental shelf pushes surface water down"],ans:1,exp:"In the North Atlantic (Labrador and Nordic Seas), cold temperatures reduce buoyancy while high salinity increases density. This dense water sinks forming NADW — a key driver of global overturning circulation."},
    {q:"Open ocean salinity typically ranges from:",opts:["1-5 g/L — a very dilute solution","10-20 g/L — moderately saline water","32-37 g/L — consistently saline across ocean basins","50-60 g/L — highly concentrated brine"],ans:2,exp:"Open ocean salinity is typically 32-37 g/L. Higher where evaporation exceeds precipitation (subtropical gyres) and lower where precipitation and river input dominate (high latitudes)."},
    {q:"Western boundary currents (Gulf Stream, Kuroshio) are narrow and fast due to:",opts:["Stronger prevailing winds on the western side of ocean basins","The beta-effect — poleward increase of Coriolis parameter concentrating return flow at western margins","Higher salinity on the western side increasing density gradients","Shallower seafloor on the western side of ocean basins"],ans:1,exp:"Western intensification arises from the beta-effect (f increases poleward). Via Sverdrup balance this concentrates the gyre's return flow into narrow fast western boundary currents like the Gulf Stream."},
    {q:"Antarctic Bottom Water (AABW) forms because:",opts:["Antarctic rivers deliver large freshwater volumes to the Southern Ocean","Freezing seawater excludes salt (brine rejection) increasing density of surrounding water causing it to sink","Strong tidal forces in the Antarctic push surface water to depth","Antarctic ice sheet meltwater sinks as cold dense water to the seafloor"],ans:1,exp:"When seawater freezes around Antarctica salt is excluded (brine rejection) concentrating salinity in remaining water. This cold dense brine sinks to become AABW — the densest water mass filling all ocean basins."},
    {q:"CTD profilers measure:",opts:["Seafloor topography using acoustic pulses","Conductivity (salinity) Temperature and Depth revealing distinct water masses","Surface currents using GPS-tracked autonomous floats","Atmospheric pressure and humidity above the ocean surface"],ans:1,exp:"CTD instruments lowered through the water column measure Conductivity (from which salinity is calculated), Temperature and Depth, producing vertical profiles revealing boundaries and properties of distinct water masses."},
    {q:"Satellite chlorophyll maps confirm subtropical gyres are ocean deserts because:",opts:["They show high chlorophyll indicating paradoxically low productivity","They show very low chlorophyll due to nutrient-poor downwelling surface waters","They show the surface is too dark to support photosynthesis","They show high salinity preventing phytoplankton growth in gyres"],ans:1,exp:"Satellite chlorophyll maps show deep blue (very low chlorophyll) in subtropical gyres — direct evidence of low phytoplankton productivity caused by Ekman convergence preventing nutrient supply to the surface."},
    {q:"The global thermohaline circulation completes a full circuit in approximately:",opts:["1-10 years — a relatively fast circulation","100-200 years — a moderately slow overturning","500-2000 years — a very slow deep circulation","Over 10000 years — on glacial-interglacial timescales"],ans:2,exp:"The full global thermohaline conveyor takes approximately 500-2,000 years to complete, explaining why deep ocean properties change slowly and why the ocean has enormous thermal inertia for climate."}
  ],
  summary:`<h4>Overview</h4><p>Global ocean circulation consists of wind-driven surface gyres and the deep thermohaline overturning circulation. These together redistribute heat globally and are intimately connected to climate.</p><h4>Surface Circulation</h4><p>Subtropical gyres (CW in NH, CCW in SH), equatorial currents (westward), ACC (unique, circumglobal). Western boundary currents intensified (β-effect). Subtropical gyres: Ekman downwelling → ocean deserts (confirmed by satellite chlorophyll maps).</p><h4>Deep Circulation</h4><p>NADW forms in N. Atlantic (cold + salty = dense). AABW forms around Antarctica (freezing + brine release). CTD profiles reveal distinct water masses. Global overturning takes hundreds–thousands of years.</p><h4>Key Diagrams</h4><svg viewBox="0 0 480 200" xmlns="http://www.w3.org/2000/svg" style="width:100%;border-radius:8px;background:#f0f9ff;margin-bottom:4px">

<div style="font-size:10px;color:var(--muted);margin-bottom:10px;font-style:italic">Warm salty surface water (red) flows north as Gulf Stream, releases heat, sinks as NADW, returns south as cold deep flow (blue) — completing in 500–2000 years.</div><h4>Exam Tips</h4><div class="tip">Be able to identify and explain the major water masses (NADW, AABW, AAIW). The link between sea ice formation, brine rejection, and deep water formation is a key mechanism — explain it step by step.</div>`,
  terms:[
    {t:"Antarctic Circumpolar Current (ACC)", d:"The world's largest ocean current, flowing eastward around Antarctica driven by westerly winds; the only current to circle the globe without being blocked by land."},
    {t:"NADW", d:"North Atlantic Deep Water — dense water mass formed by cooling and sinking in the North Atlantic (especially Labrador and Nordic Seas); a key component of global overturning circulation."},
    {t:"AABW", d:"Antarctic Bottom Water — the densest water mass in the ocean, formed around Antarctica by freezing (brine rejection) and cooling; fills the bottom of all ocean basins."},
    {t:"Western intensification", d:"The concentration of fast, narrow currents along western ocean boundaries (Gulf Stream, Kuroshio) due to the β-effect (poleward increase of Coriolis parameter)."},
    {t:"CTD profiler", d:"Conductivity-Temperature-Depth instrument that measures salinity and temperature through the water column, revealing distinct water masses."},
    {t:"Brine rejection", d:"Process during sea ice formation where freezing water expels dissolved salts, increasing the salinity and density of adjacent water, causing it to sink."}
  ]
},
"1.8.1": {
  cards:[
    {q:"Describe the two theories for what drives deep ocean overturning circulation.", a:"1) Turbulent mixing theory: turbulence mixes warm surface water down; cold deep water rises to compensate. 2) Southern Ocean wind theory: westerly winds drive Ekman transport that 'pulls' deep water upward around Antarctica, allowing sinking elsewhere (N. Atlantic)."},
    {q:"What drives Western boundary current intensification?", a:"The β-effect: Coriolis parameter (f) increases with latitude. By Sverdrup balance, this means return flows concentrate into narrow, fast western boundary currents rather than being evenly distributed across the ocean."},
    {q:"What was the WOCE (World Ocean Circulation Experiment) and why was it important?", a:"A global oceanographic survey (1990–1998) that mapped ocean properties along transects across all three major basins. Aim: provide the basis to predict heat and carbon uptake by oceans in a warming world."},
    {q:"How does equatorial upwelling work?", a:"Trade winds blow surface water westward away from the equator via Coriolis effects — diverging north and south. Deep, cold nutrient-rich water upwells to replace it, producing productive equatorial ocean zones."},
    {q:"What are the consequences of downwelling in subtropical gyres?", a:"Ekman convergence pushes surface water downward. Deep nutrient-rich water cannot rise to the sunlit surface, making subtropical gyres nutrient-poor and low-chlorophyll 'ocean deserts', as confirmed by satellite chlorophyll measurements."},
    {q:"What does 'the atmosphere acts as a transmission belt from sun to oceans' mean?", a:"Solar energy heats the atmosphere differentially, creating wind patterns. These wind patterns exert stress on the ocean surface, driving ocean surface currents. The atmosphere thus transmits solar energy into ocean motion."},
    {q:"How are heat transport and climate linked through ocean circulation?", a:"Warm surface currents (Gulf Stream) transport heat poleward, warming North Atlantic climate. Deep cold currents return southward completing the conveyor. Changes in this circulation (e.g. AMOC weakening) can cause abrupt regional climate shifts."},
    {q:"What is Sverdrup balance?", a:"A geostrophic balance including the β-effect (varying Coriolis). It predicts that horizontal divergence/convergence of Ekman flow drives vertical motion (upwelling/downwelling) in the ocean interior, and governs the large-scale gyre structure."}
  ],
  quiz:[
    {q:"The WOCE (1990-1998) aimed to:",opts:["Measure sea surface temperatures globally from satellites","Provide baseline data to predict heat and carbon uptake of oceans in a warming world","Map global marine species diversity across all ocean basins","Drill ocean sediment cores to reconstruct past climate changes"],ans:1,exp:"WOCE was the first comprehensive global oceanographic survey, conducting hydrographic sections across all major ocean basins to characterise water mass properties and provide climate prediction baseline data."},
    {q:"The turbulent mixing theory of deep overturning proposes:",opts:["Wind stress alone drives all deep circulation","Turbulence mixes warm water downward requiring cold deep water to rise as compensation","Temperature gradients alone cause deep water to upwell spontaneously","Tidal forces from the Moon drive cold water up continental slopes"],ans:1,exp:"Turbulent mixing theory: turbulence (from tidal forcing, storms, internal waves) diffuses warm surface water downward requiring deep cold water to rise as compensation — needing continuous mechanical energy input."},
    {q:"The Southern Ocean wind theory proposes that deep overturning is driven by:",opts:["Freshwater input from Antarctic ice melt freshening the surface ocean","Westerly winds around Antarctica driving Ekman upwelling enabling global overturning","Geothermal heating from Antarctic submarine volcanism","Tidal mixing over Antarctic underwater ridges and seamounts"],ans:1,exp:"Strong westerly winds around Antarctica drive Ekman transport that upwells deep water in the Southern Ocean. This allows NADW formation in the North Atlantic as part of the same closed global circulation."},
    {q:"Equatorial upwelling in the Pacific occurs because:",opts:["The equatorial seafloor is unusually shallow along the ITCZ","Trade winds on either side of equator drive diverging Ekman transport drawing up cold deep water","The Coriolis force is strongest at the equator maximising upwelling","Freshwater from tropical rivers creates density instabilities driving upwelling"],ans:1,exp:"Trade winds north and south of equator drive Ekman transport diverging away from equator, creating Ekman divergence and upwelling of cold nutrient-rich water along the equatorial Pacific."},
    {q:"Western boundary current intensification is explained by:",opts:["Higher wind stress on the western side of ocean basins","The beta-effect and Sverdrup balance requiring concentrated return flow along western margins","Greater evaporation on western sides creating density gradients","Submarine ridges on western margins funnelling current flow"],ans:1,exp:"Sverdrup balance incorporating the beta-effect (poleward increase of f) requires the wind-driven gyre's return flow to concentrate into narrow western boundary currents — hence Gulf Stream and Kuroshio are fast and narrow."},
    {q:"The AMOC carries heat poleward by:",opts:["Flowing cold water northward at the surface releasing heat as it warms","Flowing warm salty surface water northward (Gulf Stream) releasing heat then sinking as NADW and returning south as deep flow","Flowing warm water eastward across the North Atlantic directly to Europe","Flowing cold deep water northward and warm surface water southward simultaneously"],ans:1,exp:"AMOC: warm salty Gulf Stream flows northward, releases heat to the atmosphere warming NW Europe, cools and sinks in Labrador/Nordic Seas as NADW, then returns southward as a deep western boundary current."},
    {q:"The atmosphere acts as a transmission belt from Sun to oceans meaning:",opts:["The atmosphere physically transports ocean water between different basins","Differential solar heating creates winds which drive ocean surface currents transmitting solar energy to ocean kinetic energy","The ocean transports atmospheric gases redistributed by solar heating","Solar energy heats the ocean directly without any atmospheric intermediate step"],ans:1,exp:"Differential solar heating creates pressure gradients and winds. These winds exert frictional stress on the ocean surface driving surface currents. The atmosphere thus transmits solar energy into ocean kinetic energy."},
    {q:"Both theories of deep overturning (turbulent mixing and Southern Ocean winds) are relevant because:",opts:["They give identical results making either one sufficient","They explain complementary aspects: winds provide mechanical energy while mixing transforms upwelled water back to lighter warm water","One applies to the Atlantic and the other to the Pacific only","They operate at different depths: winds at surface and mixing only at depth"],ans:1,exp:"Both contribute: Southern Ocean winds provide mechanical energy to pull deep water upward, while turbulent mixing is needed to transform cold dense upwelled water back to warmer lighter water — both essential parts of the same global overturning."}
  ],
  summary:`<h4>Overview</h4><p>Ocean circulation mechanisms link surface wind forcing to deep overturning circulation. The global conveyor transports heat across all ocean basins on timescales of hundreds to thousands of years.</p><h4>Driving Mechanisms</h4><p><strong>Turbulent mixing theory:</strong> mixing pulls deep water up. <strong>Southern Ocean wind theory:</strong> westerly winds drive upwelling around Antarctica, enabling NADW formation. Both contribute.</p><h4>Key Systems</h4><p>Western intensification (β-effect → Gulf Stream). Equatorial upwelling (trade wind divergence). Subtropical downwelling (Ekman convergence → ocean deserts). WOCE (1990–98): global ocean survey for climate prediction.</p><h4>Key Diagrams</h4><svg viewBox="0 0 480 190" xmlns="http://www.w3.org/2000/svg" style="width:100%;border-radius:8px;background:#f0f9ff;margin-bottom:4px">

  terms:[
    {t:"Sverdrup balance", d:"Large-scale balance between wind-driven Ekman divergence and the stretching of vortex tubes due to the β-effect; governs interior ocean gyre structure."},
    {t:"β-effect", d:"The variation of the Coriolis parameter with latitude (df/dy > 0); responsible for western intensification and Rossby wave propagation."},
    {t:"Turbulent mixing theory", d:"Theory that deep ocean upwelling is driven by turbulent mixing that diffuses warm water downward; requires a continuous source of mechanical energy."},
    {t:"Southern Ocean wind theory", d:"Theory that westerly winds around Antarctica drive Ekman upwelling of deep water, enabling the overturning circulation to operate."},
    {t:"WOCE", d:"World Ocean Circulation Experiment (1990–1998); first global survey of all major ocean basins to provide baseline data for climate prediction."},
    {t:"Overturning circulation", d:"The global 3D circulation of the ocean including both wind-driven surface gyres and the density-driven deep circulation (thermohaline circulation)."}
  ]

"1.9.1": {
  cards:[
    {q:"What is the main purpose of atmospheric circulation?", a:"To transport excess heat from the tropics to higher latitudes — the tropics receive more solar radiation than they emit infrared; poles emit more than they receive. Without circulation, heat would accumulate in the tropics."},
    {q:"What is baroclinic instability?", a:"Occurs in midlatitudes where surfaces of constant pressure and density are not aligned (strong horizontal temperature gradients). Rossby waves grow, become unstable, break into cyclones and anticyclones, and transport heat poleward — the main midlatitude heat transport mechanism."},
    {q:"What are Rossby waves and what causes them?", a:"Large-scale planetary waves (undulations in the jet stream) caused by conservation of absolute vorticity. When air moves poleward, increasing planetary vorticity causes anticyclonic spin; equatorward, cyclonic spin. They propagate westward relative to the mean flow."},
    {q:"How does the atmosphere transport heat poleward?", a:"In the tropics: Hadley Cells transport heat via overturning circulation (rising at ITCZ, poleward aloft). In midlatitudes: baroclinic eddies (cyclones/anticyclones from Rossby wave breaking) transport heat poleward — eddies dominate in midlatitudes."},
    {q:"Why can purely zonal (west-east) flow not transport heat poleward?", a:"Heat transport requires motion across latitude circles (meridional/north-south movement). Purely zonal flow moves air along latitude lines only — no net poleward transport occurs. Hadley circulation and baroclinic eddies break zonal symmetry."},
    {q:"What is the ITCZ and how does it relate to the Hadley Cell?", a:"The Intertropical Convergence Zone is the ascending branch of the Hadley Cell. Surface trade winds from both hemispheres converge here; rising moist air produces deep convection and tropical rainfall belts. Its position shifts seasonally following the solar maximum."},
    {q:"What causes jet streams and where are they found?", a:"Strong horizontal temperature gradients between tropics and poles create large upper-tropospheric pressure gradients. Geostrophic balance produces fast westerly winds (~10 km altitude) — the polar and subtropical jet streams at ~45–60°N/S."},
    {q:"Why does the UK experience variable weather?", a:"The UK lies in the midlatitude Rossby wave-breaking region (~50°N). Frequent cyclones and anticyclones associated with Rossby wave breaking and baroclinic instability create highly variable weather — the same eddies that transport heat poleward produce UK weather systems."}
  ],
  quiz:[
    {q:"The dominant heat transport mechanism in the tropics is:",opts:["Baroclinic eddies creating cyclones and anticyclones at low latitudes","The Hadley Cell direct thermally-driven overturning circulation","Longwave radiation emitted directly from hot surfaces toward the poles","Ocean currents including the Gulf Stream and tropical gyres"],ans:1,exp:"In the tropics the Hadley Cell directly transports heat: warm moist air rises at ITCZ flows poleward aloft sinks at ~30°N/S and returns equatorward as trade winds."},
    {q:"Baroclinic instability develops when:",opts:["The atmosphere becomes too humid and unstable in the boundary layer","Pressure and density surfaces are not aligned storing large available potential energy","Solar heating is too intense for the troposphere to remain stable","The Coriolis force greatly exceeds the pressure gradient force"],ans:1,exp:"Baroclinic instability: pressure and density surfaces tilted relative to each other (characteristic of strong temperature gradients in midlatitudes). Stored potential energy is released as growing Rossby waves."},
    {q:"Rossby waves propagate relative to the mean westerly flow:",opts:["Eastward faster than the mean flow","At exactly the same speed as the mean flow","Westward relative to the mean flow","Perpendicular to the mean westerly flow"],ans:2,exp:"Rossby waves propagate westward relative to the mean westerly flow due to the beta-effect — conservation of absolute vorticity as air moves to latitudes with different planetary vorticity."},
    {q:"Purely zonal (west-east) flow cannot transport heat poleward because:",opts:["Zonal flow is too slow to carry heat over hemispheric distances","It moves air only along latitude lines with no net north-south component","The Coriolis force prevents any poleward displacement in purely zonal flow","Zonal flow is blocked by mountain ranges before reaching the poles"],ans:1,exp:"Heat transport requires meridional (north-south) flow to carry warm air poleward and cold air equatorward. Purely zonal flow has no net component across latitude circles — zero meridional heat transport."},
    {q:"The UK experiences highly variable weather primarily because:",opts:["It has mountain ranges that force air upward creating persistent rainfall","It sits in the midlatitude Rossby wave-breaking region where cyclones and anticyclones are frequent","It is surrounded entirely by warm ocean providing constant moisture supply","It lies at the boundary between tropical and polar air masses year-round"],ans:1,exp:"The UK (~50-55°N) lies in the midlatitude Rossby wave-breaking region where baroclinic instability generates frequent cyclones and anticyclones — the same eddies responsible for poleward heat transport create the UK's variable weather."},
    {q:"The polar front jet stream is driven by:",opts:["Temperature differences between ocean and land at midlatitudes","The sharp temperature gradient between polar and tropical air creating large upper-tropospheric pressure gradients","Differential solar heating between the day and night sides of Earth","Ozone absorption in the stratosphere above polar regions"],ans:1,exp:"The polar front jet stream forms where cold polar and warm tropical air masses create large horizontal temperature gradients. Via thermal wind balance these gradients produce fast upper-tropospheric westerly winds at ~50-60°N/S."},
    {q:"In midlatitudes poleward heat transport is accomplished primarily by:",opts:["A large Ferrel Cell overturning analogous to the Hadley Cell","Baroclinic eddies — cyclones and anticyclones from Rossby wave breaking","Direct longwave radiation emission poleward from tropical surfaces","Stratospheric sudden warmings propagating downward from the poles"],ans:1,exp:"Poleward of ~30° baroclinic eddies dominate heat transport. Growing Rossby waves break into cyclones and anticyclones that carry warm air poleward and cold air equatorward — fundamentally different from the Hadley Cell mechanism."},
    {q:"Conservation of absolute vorticity means that as air moves poleward:",opts:["Wind speed stays constant and only direction changes","Planetary vorticity (f) increases so relative vorticity must decrease — developing anticyclonic spin","The air parcel accelerates to conserve angular momentum","Only the vertical component of vorticity changes"],ans:1,exp:"Absolute vorticity = f + relative vorticity. If f increases as air moves poleward relative vorticity must decrease (anticyclonic spin develops). This creates the restoring force that causes Rossby waves to propagate westward."}
  ],
  summary:`<h4>Overview</h4><p>The atmosphere's primary function is to transport heat from tropics to poles. Two different mechanisms operate in different latitude bands.</p><h4>Tropical: Hadley Cell</h4><p>Direct overturning: rise at ITCZ → poleward aloft → sink at 30°N/S → return trade winds. Drives tropical rainfall belts, subtropical deserts.</p><h4>Midlatitudes: Baroclinic Eddies</h4><p>Strong temperature gradient → stored potential energy → Rossby waves grow → baroclinic instability → cyclones/anticyclones → poleward heat transport. UK weather = product of this process.</p><h4>Key Diagrams</h4><svg viewBox="0 0 480 175" xmlns="http://www.w3.org/2000/svg" style="width:100%;border-radius:8px;background:#f0f9ff;margin-bottom:4px">
