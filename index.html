    {q:"In the land sparing vs. land sharing debate, land sparing involves:", opts:["Low-yield farming spread across large areas","High-yield farming on small areas freeing large areas for natural habitat conservation","No farming at all","Farming only in cities"], ans:1, exp:"Land sparing: high-yield farming concentrated on small areas so that large tracts of natural habitat can be fully conserved — contrasting with land sharing where lower-intensity wildlife-friendly farming is spread more widely."}
  ],
  summary:`<h4>Overview</h4><p>Global change — including climate change, habitat fragmentation, and agricultural intensification — is fundamentally restructuring biodiversity and ecosystem function. Species must acclimate, adapt, move or die (Corlett et al. 2013).</p><h4>Species Responses</h4><p><strong>Acclimation:</strong> physiological adjustment within lifetime (Type I: rapid; Type II: gene expression). <strong>Adaptation:</strong> heritable genetic change over generations. <strong>Migration:</strong> latitudinal and elevational range shifts. Ectotherms especially vulnerable (body temperature = environment). Flying foxes: mass mortality at >42°C heatwaves — non-linear responses.</p><h4>Fragmentation & Insect Decline</h4><p>70% of forests within 1 km of an edge. Extinction risk scales with fragmentation and range size (IUCN). Insects declining ~1%/year. Causes: land-use change, pesticides, agriculture, climate. Consequences: food web disruption, pollination loss.</p><h4>Management</h4><p>Land sparing vs land sharing: context-dependent, no universal solution. Novel ecosystems: should we restore or adapt? Both approaches may be needed.</p><h4>Exam Tips</h4><div class="tip">The Corlett et al. 2013 quote is highly examinable. Distinguish acclimation (individual, not heritable) from adaptation (genetic, heritable). The flying fox heatwave example illustrates non-linear responses to extreme events — important point.</div>`,
  terms:[
    {t:"Acclimation", d:"Physiological or morphological adjustment by an individual organism in response to environmental change — occurs within a lifetime, not heritable. Type I: rapid substrate-driven; Type II: slower via gene expression."},
    {t:"Adaptation (evolutionary)", d:"Heritable genetic change over multiple generations through natural selection in response to environmental pressure — contrasts with acclimation."},
    {t:"Range shift", d:"Movement of a species' geographic distribution in response to climate change — typically poleward or upslope (elevation). Creates novel community compositions."},
    {t:"Ectotherm", d:"Organism whose body temperature depends on the external environment (e.g. reptiles, amphibians, fish, most invertebrates). Particularly vulnerable to climate change and extreme heat events."},
    {t:"Edge effect", d:"Changes in biological community structure and abiotic conditions near habitat boundaries (edges). Includes increased light, wind, desiccation, temperature extremes and invasive species."},
    {t:"Land sparing", d:"Conservation strategy using high-yield farming concentrated on small areas to free large areas of natural habitat — contrasts with land sharing (wildlife-friendly lower-intensity farming across wider areas)."},
    {t:"Novel ecosystem", d:"An ecosystem irreversibly altered by human activity that has no historical precedent; raises the question of whether to restore historical states or manage new states."},
    {t:"Insect decline", d:"Documented ~1%/year decline in terrestrial insect biomass, driven by land-use change, pesticides, agricultural intensification and climate change. Threatens pollination and food web integrity."}
  ]
}
}

    DATA: {
"2.1.1a": {
  cards:[
    {q:"What are the three main determinants of Earth's climate?", a:"1) Earth-sun geometry and continental location. 2) Heat transport efficiency from tropics to poles and to space. 3) Atmospheric greenhouse gas concentrations, controlled by ocean and land carbon uptake/release."},
    {q:"Compare Venus, Earth and Mars: why is Venus so much hotter despite similar solar input?", a:"Venus has >98% CO₂ atmosphere (vs 0.028% on Earth) creating a massive greenhouse effect, pushing surface temperature to 737K. Earth's moderate GHG mix gives 288K; Mars with thin 0.01 bar CO₂ atmosphere is only 220K."},
    {q:"Why is infrared emission to space concentrated in the tropics?", a:"The tropics are desert-dominated at ~30°N/S (subtropical high pressure, subsidence), making them the hottest regions. Hotter objects emit more longwave radiation (Stefan-Boltzmann law)."},
    {q:"What is the ITCZ and what happens there?", a:"The Intertropical Convergence Zone is a narrow band at the equator where trade winds converge. It features intense solar heating, rising moist air, deep convection and heavy precipitation — it is the ascending branch of the Hadley Cell."},
    {q:"Describe the Hadley Cell structure.", a:"Warm moist air rises at the equator (ITCZ), moves poleward aloft, sinks at ~30°N/S creating subtropical deserts and high pressure, then returns to equator as surface trade winds — a closed overturning cell."},
    {q:"What drives atmospheric and ocean circulation?", a:"The unequal distribution of solar energy — tropics absorb more shortwave radiation than they emit longwave, poles emit more than they absorb. This imbalance drives heat transport poleward through both atmosphere and oceans."},
    {q:"What are jet streams and where are they found?", a:"Strong, fast upper-tropospheric winds (~10 km altitude) at ~45–60°N/S, flowing westerly (west to east). Polar and subtropical jet streams form where strong horizontal temperature gradients create large pressure differences."},
    {q:"What characterises extratropic (midlatitude) circulation vs. tropical circulation?", a:"Tropics: deep moist convection driven by surface heating. Midlatitudes: large-scale eddies (cyclones/anticyclones) driven by baroclinic instability and Rossby waves — fundamentally different mechanisms."}
  ],
  quiz:[
    {q:"What is the surface temperature of Venus (K)?", opts:["288","373","737","1000"], ans:2, exp:"Venus has a surface temperature of 737K due to its massive CO₂ greenhouse effect, compared to Earth's 288K."},
    {q:"The ITCZ is the ascending branch of which circulation?", opts:["Polar Cell","Ferrel Cell","Hadley Cell","Ekman Cell"], ans:2, exp:"The ITCZ marks where surface trade winds converge and warm moist air rises — it is the ascending branch of the Hadley Cell."},
    {q:"Why do subtropical deserts form at ~30°N/S?", opts:["Low solar radiation","Hadley Cell subsidence creating high pressure and dry conditions","Cold ocean currents","Low wind speeds"], ans:1, exp:"The descending branch of the Hadley Cell creates subtropical high pressure belts at ~30°N/S, suppressing rainfall and forming deserts."},
    {q:"Earth's planetary albedo (fraction of solar radiation reflected) is approximately:", opts:["0.03","0.10","0.30","0.60"], ans:2, exp:"Earth's planetary albedo is about 0.30, meaning ~30% of incoming solar radiation is reflected back to space, mainly by clouds and ice."},
    {q:"What is the ratio of electromagnetic radiation emitted by the Sun vs Earth?", opts:["100:1","1000:1","183,237:1","1,000,000:1"], ans:2, exp:"The Stefan-Boltzmann law gives a ratio of ~183,237:1 because the Sun is at ~6000K and Earth at ~290K, and emission scales as T⁴."}
  ],
  summary:`<h4>Overview</h4><p>Earth's climate is determined by the solar radiation balance, the efficiency of heat transport, and greenhouse gas concentrations. Venus (737K, >98% CO₂) and Mars (220K, 0.01 bar) demonstrate how GHGs and atmospheric pressure control surface temperature.</p><h4>Key Circulation Features</h4><p><strong>ITCZ:</strong> equatorial convergence zone, ascending Hadley branch, heavy rain. <strong>Hadley Cell:</strong> rises at equator, sinks at 30°N/S creating subtropical deserts. <strong>Jet streams:</strong> fast upper-tropospheric westerlies at 45–60°N/S.</p><h4>Energy Balance</h4><p>Tropics absorb more solar radiation than they emit; poles emit more than they absorb. This gradient drives all atmospheric and oceanic circulation, transporting heat poleward. Longwave emission is concentrated in the hot subtropical deserts.</p><h4>Exam Tips</h4><div class="tip">Know the Venus/Earth/Mars comparison numbers cold — they appear in questions on planetary albedo (0.77/0.30/0.14) and surface temperature (737/288/220K). Always explain WHY using GHG concentrations.</div>`,
  terms:[
    {t:"ITCZ", d:"Intertropical Convergence Zone — narrow equatorial band where trade winds converge, warm moist air rises, and deep convection produces heavy rainfall."},
    {t:"Hadley Cell", d:"A tropical atmospheric overturning circulation: rising air at ITCZ, poleward flow aloft, sinking at ~30°N/S, return surface trade winds."},
    {t:"Planetary albedo", d:"The fraction of incoming solar radiation reflected back to space (~0.30 for Earth); controlled by clouds (~79 W/m²) and surface (~23 W/m²)."},
    {t:"Stefan-Boltzmann Law", d:"Total radiation emitted by an object scales as the fourth power of its absolute temperature (H ∝ T⁴). At 6000K the Sun emits ~183,000× more than Earth at 290K."},
    {t:"Jet stream", d:"Strong (~100 m/s) upper-tropospheric westerly winds at ~10 km altitude, ~45–60°N/S, driven by strong horizontal temperature gradients."}
  ]
},
"2.1.2": {
  cards:[
    {q:"State the Stefan-Boltzmann Law.", a:"Total radiation emitted per unit area H (W m⁻²) is proportional to the fourth power of the absolute temperature T: H = σT⁴. Earth emits ~401 W/m² at 290K; the Sun emits ~73,483,200 W/m² at 6000K."},
    {q:"What is a blackbody?", a:"An idealised object that absorbs all electromagnetic radiation falling on it and emits the maximum possible radiation at every wavelength for its temperature — described by the Planck function."},
    {q:"Why do the Sun and Earth emit radiation at different wavelengths?", a:"The Sun at ~6000K emits shortwave (visible, UV) radiation peaking at ~0.5 μm. Earth at ~290K emits longwave (infrared) radiation peaking at ~10 μm. There is almost no spectral overlap — this is what makes the greenhouse effect possible."},
    {q:"What causes electromagnetic radiation from heated matter?", a:"Heat causes electrons of atoms to collide and jump to higher energy shells. When they fall back, they release photons of electromagnetic radiation. The hotter the object, the more frequent these excitations and the shorter the peak wavelength."},
    {q:"What is planetary albedo and how is it calculated?", a:"The fraction of incoming solar radiation reflected back to space. Earth's albedo ≈ 0.30. Clouds reflect ~79 W/m² and the surface ~23 W/m². Albedo = reflected solar / incoming solar."},
    {q:"Why does the near-absence of spectral overlap between solar and terrestrial radiation matter?", a:"It means solar shortwave radiation can pass through the atmosphere relatively freely, but Earth's longwave (infrared) emission is absorbed and re-emitted by greenhouse gases — allowing GHGs to trap heat selectively."},
    {q:"What is the estimated equilibrium surface temperature of Earth without greenhouse gases?", a:"Approximately 255K (−18°C), compared to the actual ~288K (+15°C). The 33°C difference is the natural greenhouse warming effect of the atmosphere."},
    {q:"What did John Tyndall discover in 1862?", a:"That certain gases (CO₂, H₂O vapour) absorb infrared radiation, while others (N₂, O₂) are transparent to it. This was the first experimental demonstration of the mechanism behind the greenhouse effect."}
  ],
  quiz:[
    {q:"Earth emits approximately how much radiation according to the Stefan-Boltzmann law?", opts:["150 W/m²","280 W/m²","401 W/m²","500 W/m²"], ans:2, exp:"At ~290K, Earth emits approximately 401 W/m² according to the Stefan-Boltzmann law (H = σT⁴ where σ = 5.67×10⁻⁸)."},
    {q:"The Sun's peak emission wavelength is approximately:", opts:["0.5 μm (visible/shortwave)","5 μm (near-infrared)","10 μm (longwave infrared)","100 μm (far infrared)"], ans:0, exp:"The Sun at ~6000K peaks at ~0.5 μm in the visible spectrum. Earth at ~290K peaks at ~10 μm in the longwave infrared."},
    {q:"Without the greenhouse effect, Earth's surface temperature would be approximately:", opts:["−50°C","−18°C","0°C","+10°C"], ans:1, exp:"Without GHGs, Earth would be approximately 255K (−18°C). The greenhouse effect adds about +33°C, giving the actual ~288K (+15°C)."},
    {q:"John Tyndall's 1862 experiment demonstrated that:", opts:["CO₂ reflects visible light","Some gases absorb infrared radiation while others (N₂, O₂) are transparent","All gases have equal radiative properties","Water vapour has no effect on radiation"], ans:1, exp:"Tyndall showed CO₂ and water vapour absorb infrared radiation while nitrogen and oxygen are effectively transparent — the physical basis of the greenhouse effect."},
    {q:"The near absence of spectral overlap between solar and terrestrial radiation is important because:", opts:["It proves Earth is cooling","It allows GHGs to selectively trap outgoing longwave radiation","It causes ozone depletion","It makes solar panels more efficient"], ans:1, exp:"Solar shortwave can enter the atmosphere freely; Earth's outgoing longwave is absorbed by GHGs — the spectral separation is what makes selective trapping by GHGs possible."}
  ],
  summary:`<h4>Overview</h4><p>Earth's temperature is determined by the balance between incoming solar (shortwave) and outgoing terrestrial (longwave) radiation. The Stefan-Boltzmann law (H = σT⁴) connects temperature to radiation.</p><h4>Key Numbers</h4><p>Sun: 6000K, peak ~0.5 μm, ~73.5 million W/m². Earth: 290K, peak ~10 μm, ~401 W/m². Ratio: 183,237:1. Without GHGs: −18°C. With GHGs: +15°C. Difference = 33°C greenhouse effect.</p><h4>Why GHGs Work</h4><p>Solar shortwave and terrestrial longwave have almost no spectral overlap. Greenhouse gases (CO₂, H₂O) are transparent to shortwave but absorb longwave — discovered experimentally by Tyndall (1862).</p><h4>Exam Tips</h4><div class="tip">Know the key numbers: Earth 401 W/m², 290K, −18°C without GHGs. The spectral separation argument is essential — explain it clearly. Tyndall 1862 is always worth naming.</div>`,
  terms:[
    {t:"Stefan-Boltzmann Law", d:"H = σT⁴; total radiation emitted per unit area scales with the fourth power of absolute temperature. Earth: ~401 W/m² at 290K."},
    {t:"Blackbody", d:"An idealised perfect absorber and emitter of radiation at all wavelengths; real objects approximate this to varying degrees."},
    {t:"Planck function", d:"Describes the spectral distribution of radiation emitted by a blackbody at temperature T — determines the peak emission wavelength (shorter for hotter objects)."},
    {t:"Wien's displacement law", d:"Peak emission wavelength is inversely proportional to temperature: λ_max = b/T. Sun (~6000K) peaks at ~0.5 μm; Earth (~290K) peaks at ~10 μm."},
    {t:"Natural greenhouse effect", d:"The 33°C warming of Earth's surface above the blackbody temperature (−18°C) caused by the absorption and re-emission of longwave radiation by H₂O, CO₂ and other GHGs."},
    {t:"Beer-Lambert Law", d:"The intensity of radiation decreases exponentially as it passes through an absorbing medium; used to quantify how much infrared is absorbed by a given GHG concentration."}
  ]
},
"1.3.1": {
  cards:[
    {q:"What is the Beer-Lambert Law?", a:"Radiation intensity decreases exponentially with distance through an absorbing medium: I = I₀ × e^(−kx). Used to quantify how much infrared radiation is absorbed by a greenhouse gas of known concentration."},
    {q:"Why do CO₂, H₂O and CH₄ absorb infrared but N₂ and O₂ do not?", a:"Infrared absorption requires molecules to have vibrational modes that create a changing dipole moment. CO₂, H₂O and CH₄ are triatomic/polyatomic molecules with asymmetric vibration modes. N₂ and O₂ are symmetric diatomic — their vibrations produce no dipole change."},
    {q:"What are the quantised energy levels in a molecule?", a:"Electronic levels (electron shell jumps), vibrational levels (stretching/bending of bonds), and rotational levels. GHGs absorb IR by exciting vibrational and rotational transitions — the photon energy must exactly match the energy gap between levels."},
    {q:"What is the dual wave-particle nature of light, and how does it apply to GHG absorption?", a:"Light has both wave properties (frequency, wavelength) and particle properties (photons). A photon with energy E = hv is absorbed only if its energy exactly matches the difference between quantised molecular energy levels (Planck's relation)."},
    {q:"Describe the terrestrial heat radiation spectrum as observed by Nimbus 4 satellite.", a:"The outgoing longwave spectrum from the Sahara Desert shows dips (absorption bands) at specific wavelengths: the CO₂ absorption band at ~15 μm is a deep trough — Earth radiates less at this wavelength because CO₂ absorbs and re-emits it within the atmosphere."},
    {q:"What vibration modes does CO₂ have?", a:"CO₂ (linear triatomic): symmetric stretch (IR-inactive — no dipole change), asymmetric stretch (IR-active, ~15 μm), and two bending modes (IR-active, ~15 μm). The bending and asymmetric stretch absorb strongly in the infrared."},
    {q:"Why is the greenhouse effect described as 'radiation easily comes in but less easily goes out'?", a:"Solar shortwave radiation passes through GHGs largely unimpeded (GHGs are transparent to visible light). Outgoing longwave from Earth is absorbed and re-emitted at these same wavelengths — slowing the escape of heat to space."},
    {q:"What does observed solar vs terrestrial spectrum overlap tell us?", a:"There is almost zero spectral overlap between solar shortwave (~0.5 μm peak) and terrestrial longwave (~10 μm peak). This separation allows GHGs to selectively impede only outgoing longwave radiation without blocking incoming solar energy."}
  ],
  quiz:[
    {q:"Why does CO₂ absorb infrared radiation but N₂ does not?", opts:["N₂ is too light","CO₂ has vibrational modes that create a changing dipole moment; N₂ (symmetric diatomic) does not","N₂ has a higher boiling point","CO₂ is more abundant"], ans:1, exp:"Only molecules with asymmetric vibration modes that create a changing dipole moment can absorb IR photons. CO₂'s bending and asymmetric stretch modes qualify; N₂'s symmetric stretch does not."},
    {q:"The energy of a photon is given by:", opts:["E = mc²","E = hv (h × frequency)","E = ½mv²","E = σT⁴"], ans:1, exp:"E = hv, where h is Planck's constant and v is frequency. A GHG molecule absorbs a photon only if its energy exactly matches an allowed transition between quantised energy levels."},
    {q:"The CO₂ absorption band in the terrestrial radiation spectrum is centred at approximately:", opts:["1 μm","5 μm","15 μm","50 μm"], ans:2, exp:"CO₂ has a strong absorption band centred at ~15 μm in the thermal infrared, creating a deep trough in Earth's outgoing longwave spectrum."},
    {q:"Molecular energy levels relevant to GHG absorption are:", opts:["Electronic only","Electronic, vibrational and rotational (vibrational/rotational for IR)","Translational only","Nuclear"], ans:1, exp:"Greenhouse gas absorption of infrared occurs via transitions in vibrational and rotational energy levels (which are quantised). Electronic transitions require higher energy UV/visible photons."},
    {q:"The Beer-Lambert Law describes:", opts:["Planetary albedo","Exponential decrease in radiation intensity through an absorbing medium","Temperature lapse rates","Ocean salinity profiles"], ans:1, exp:"The Beer-Lambert Law states radiation intensity decreases exponentially with concentration and path length through an absorbing medium: I = I₀e^(-kx)."}
  ],
  summary:`<h4>Overview</h4><p>Greenhouse gases absorb infrared radiation through specific molecular vibration and rotation modes. The key insight: energy levels are quantised — a photon of exactly the right frequency must match the energy gap between levels.</p><h4>Why Some Gases Absorb IR</h4><p><strong>GHGs (CO₂, H₂O, CH₄):</strong> polyatomic/triatomic molecules with vibrational modes creating changing dipole moments — absorb IR. <strong>N₂, O₂:</strong> symmetric diatomic, no dipole change — transparent to IR.</p><h4>Key Physics</h4><p>E = hv (photon energy = Planck's constant × frequency). CO₂ absorbs strongly at ~15 μm. Beer-Lambert Law: I = I₀e^(-kx). Nimbus 4 satellite observed the CO₂ absorption trough in outgoing longwave spectrum.</p><h4>Exam Tips</h4><div class="tip">The dipole moment argument is the key mechanistic explanation for WHY CO₂ absorbs IR. Don't just say "CO₂ is a GHG" — explain the vibration mode and changing dipole.</div>`,
  terms:[
    {t:"Beer-Lambert Law", d:"I = I₀e^(-kx); radiation intensity decreases exponentially with concentration (k) and path length (x) through an absorbing medium."},
    {t:"Dipole moment", d:"A separation of positive and negative charge in a molecule. Changing dipole moment during vibration is required for a molecule to absorb infrared radiation."},
    {t:"Quantised energy levels", d:"Molecular energy exists only in discrete (quantised) states — electronic, vibrational and rotational. IR absorption occurs when photon energy exactly matches a transition between levels."},
    {t:"E = hv", d:"Planck's relation: energy of a photon equals Planck's constant (h = 6.626×10⁻³⁴ J·s) multiplied by the photon's frequency (v in s⁻¹)."},
    {t:"CO₂ absorption band", d:"CO₂ absorbs strongly at ~15 μm (bending and asymmetric stretch modes), creating a deep trough in Earth's outgoing longwave spectrum observed by satellite."},
    {t:"Vibrational modes", d:"Ways a polyatomic molecule can stretch or bend its bonds. CO₂ has symmetric stretch (IR-inactive), asymmetric stretch and two bending modes (both IR-active at ~15 μm)."}
  ]
},
"1.4.1": {
  cards:[
    {q:"How does increasing CO₂ warm the surface via changes in emission height?", a:"CO₂ absorbs outgoing IR, so the altitude from which radiation escapes to space shifts higher into the colder atmosphere. Colder layers emit less radiation (Stefan-Boltzmann). To restore energy balance, the whole troposphere — including the surface — must warm up."},
    {q:"What are the four main layers of the atmosphere and their key properties?", a:"Troposphere (0–12km): temperature decreases with height, 75% of mass, weather. Stratosphere (12–50km): temperature increases with height (ozone absorbs UV). Mesosphere: temperature decreases. Thermosphere: temperature increases again."},
    {q:"Define the Dry Adiabatic Lapse Rate (DALR) and its value.", a:"The rate at which a dry (unsaturated) air parcel cools when it rises adiabatically (without exchanging heat). DALR ≈ 9.8°C/km (approximately 1°C per 100m ascent)."},
    {q:"Define the Moist Adiabatic Lapse Rate (MALR) and why it differs from DALR.", a:"MALR ≈ 6°C/km. When moist air rises and condensation occurs, latent heat is released, offsetting the adiabatic cooling — so moist air cools more slowly than dry air."},
    {q:"State the three atmospheric stability conditions.", a:"Stable: environmental lapse rate < DALR — displaced parcel returns to original level. Neutral: ELR = DALR. Unstable: ELR > DALR — displaced parcel continues to rise (convection develops)."},
    {q:"What is hydrostatic balance?", a:"The balance between the downward gravitational force on an air parcel and the upward pressure gradient force. This is why atmospheric pressure decreases exponentially with altitude."},
    {q:"What is radiative-convective equilibrium?", a:"The steady state where solar heating of the surface (driving instability and convection) is balanced by infrared radiative cooling of the atmosphere. The observed average lapse rate of ~6.5°C/km reflects this balance."},
    {q:"What is the Lifting Condensation Level (LCL)?", a:"The altitude at which rising air becomes saturated and condensation begins, forming clouds. Below the LCL, air rises dry adiabatically (DALR). Above it, latent heat release reduces the cooling rate (MALR), potentially driving deep convection."}
  ],
  quiz:[
    {q:"The Dry Adiabatic Lapse Rate is approximately:", opts:["1°C/km","4°C/km","9.8°C/km","15°C/km"], ans:2, exp:"The DALR is ~9.8°C/km (or ~1°C per 100m) — the rate at which a dry unsaturated air parcel cools as it rises adiabatically."},
    {q:"Why does temperature increase with height in the stratosphere?", opts:["Less CO₂","Ozone absorbs incoming solar UV radiation","Higher humidity","Pressure is too low"], ans:1, exp:"Ozone in the stratosphere absorbs solar UV radiation, heating the layer. This temperature inversion makes the stratosphere very stable."},
    {q:"The atmosphere is unstable when:", opts:["ELR < DALR","ELR = DALR","ELR > DALR","Humidity is low"], ans:2, exp:"Unstable conditions occur when the environmental lapse rate (actual temperature decrease with height) exceeds the DALR — rising parcels remain warmer than surroundings and keep rising."},
    {q:"What is the observed average environmental lapse rate?", opts:["3°C/km","6.5°C/km","9.8°C/km","12°C/km"], ans:1, exp:"The observed average environmental lapse rate is ~6.5°C/km — between the MALR (6°C/km) and DALR (9.8°C/km), reflecting radiative-convective equilibrium."},
    {q:"Doubling CO₂ raises the effective emission height by approximately:", opts:["15m","150m","1500m","15km"], ans:1, exp:"Doubling CO₂ raises the effective emission height by ~150m, reducing emission temperature by ~1°C, directly causing ~1°C warming at the surface (Planck response only, before feedbacks)."}
  ],
  summary:`<h4>Overview</h4><p>The atmosphere has a vertical structure determined by temperature, pressure and composition. The key concept linking GHGs to warming is the emission height mechanism.</p><h4>Emission Height Mechanism</h4><p>More CO₂ → radiation escapes from higher, colder altitude → less radiation lost to space → surface must warm to restore balance. CO₂ doubling: +150m emission height → −1°C emission temp → ~+1°C surface warming (Planck response).</p><h4>Lapse Rates</h4><p>DALR = 9.8°C/km. MALR ≈ 6°C/km (latent heat offsets cooling). Observed average = 6.5°C/km (radiative-convective equilibrium). Stability: unstable if ELR > DALR.</p><h4>Exam Tips</h4><div class="tip">The emission height mechanism is THE central explanation for CO₂-driven warming. Practise explaining it step by step: more CO₂ → higher emission altitude → colder emission → less outgoing radiation → surface warms.</div>`,
  terms:[
    {t:"Emission height mechanism", d:"How CO₂ warms the surface: more CO₂ → radiation escapes from higher, colder altitude → less outgoing radiation → surface must warm to restore balance."},
    {t:"Dry Adiabatic Lapse Rate (DALR)", d:"Rate of cooling of a dry unsaturated air parcel rising adiabatically: ~9.8°C/km (~1°C/100m)."},
    {t:"Moist Adiabatic Lapse Rate (MALR)", d:"Rate of cooling of a saturating rising air parcel: ~6°C/km. Lower than DALR because latent heat from condensation offsets cooling."},
    {t:"Hydrostatic balance", d:"Equilibrium between downward gravity and upward pressure gradient force, causing exponential decrease of pressure with altitude."},
    {t:"Radiative-convective equilibrium", d:"Steady state where solar surface heating (triggering convection) balances atmospheric radiative cooling, producing an average lapse rate of ~6.5°C/km."},
    {t:"Lifting Condensation Level (LCL)", d:"The altitude at which rising air becomes saturated and cloud formation begins; marks the transition from dry to moist adiabatic cooling."}
  ]
},
"1.5.1": {
  cards:[
    {q:"What are the three major forces driving atmospheric and ocean motion?", a:"Pressure gradient force (fluid moves from high to low pressure), Coriolis force (due to Earth's rotation), and frictional drag (viscosity and turbulence near boundaries)."},
    {q:"What is geostrophic balance?", a:"When the pressure gradient force and Coriolis force exactly balance. Winds flow parallel to isobars rather than directly from high to low pressure. Most large-scale upper-atmosphere winds are approximately geostrophic."},
    {q:"How does the Coriolis force affect wind direction in each hemisphere?", a:"Northern Hemisphere: deflects wind to the right. Southern Hemisphere: deflects to the left. The effect is zero at the equator and increases with latitude. It acts perpendicular to velocity and does no work."},
    {q:"What is the Ekman spiral and what causes it?", a:"Wind stress on the ocean surface drives surface water in the direction of wind, but Coriolis deflects it. Successive deeper layers rotate further. The result is a spiral of current directions with depth (Ekman spiral). Net Ekman transport is 90° to the wind."},
    {q:"What drives monsoon circulation?", a:"Seasonal differential heating between land and ocean. Summer: land heats faster → surface low pressure → moist oceanic air flows inland → heavy rainfall. Winter: land cools → high pressure → dry offshore winds."},
    {q:"What is coastal upwelling and how is it caused?", a:"When wind-driven Ekman transport moves surface water away from the coast, deep nutrient-rich water rises to replace it. Example: Peru — supports anchovy fisheries, but upwelling collapses during El Niño when warm surface water displaces cold deep water."},
    {q:"What is Ekman pumping in subtropical gyres?", a:"Circular wind patterns (anticyclonic) over subtropical gyres drive convergent Ekman transport, pushing surface water downward (downwelling). This suppresses upwelling of nutrients, creating oligotrophic ocean deserts."},
    {q:"What is the pressure gradient force in an ocean context?", a:"Differential heating/cooling or Ekman convergence creates sea surface height differences. Water flows from high surface elevation toward low, generating geostrophic currents that flow parallel to the height contours (isobars)."}
  ],
  quiz:[
    {q:"Geostrophic balance involves:", opts:["Gravity and Coriolis","Pressure gradient force and Coriolis force","Wind and friction","Coriolis and friction"], ans:1, exp:"Geostrophic balance occurs when the pressure gradient force (pushing fluid toward low pressure) exactly balances the Coriolis force, resulting in flow parallel to pressure contours."},
    {q:"Net Ekman transport is directed relative to the wind at:", opts:["Same direction as wind","45° to the right","90° to the right (NH)","180° opposite to wind"], ans:2, exp:"Integrating the Ekman spiral through depth gives net transport 90° to the right of the wind in the Northern Hemisphere (90° to the left in the Southern Hemisphere)."},
    {q:"Coastal upwelling along the Peru coast occurs because:", opts:["Trade winds blow water offshore via Ekman transport, drawing up cold nutrient-rich water","Tides are unusually strong","The seafloor is very shallow","El Niño forces water upward"], ans:0, exp:"South-east trade winds drive Ekman transport of surface water offshore (westward), and cold, nutrient-rich deep water upwells to replace it — supporting highly productive fisheries."},
    {q:"During El Niño, the Peru upwelling system:", opts:["Strengthens and productivity increases","Collapses as warm surface water suppresses upwelling","Shifts northward","Reverses direction"], ans:1, exp:"El Niño brings warm surface water to the eastern Pacific, suppressing the upwelling of cold nutrient-rich water — causing collapse of the anchovy fishery."},
    {q:"Subtropical ocean gyres are oligotrophic ('ocean deserts') because:", opts:["They are too cold","Ekman convergence drives downwelling, suppressing nutrient upwelling","They have no sunlight","Wind speeds are too low"], ans:1, exp:"Anticyclonic wind patterns drive Ekman convergence in subtropical gyres, pushing surface water downward — preventing nutrient-rich deep water from reaching the surface."}
  ],
  summary:`<h4>Overview</h4><p>Atmospheric and ocean circulation is governed by three forces: pressure gradient, Coriolis and friction. Their interactions produce geostrophic balance, Ekman transport and the global circulation patterns.</p><h4>Key Concepts</h4><p><strong>Coriolis:</strong> deflects right (NH), left (SH), zero at equator. <strong>Geostrophic balance:</strong> wind parallel to isobars. <strong>Ekman transport:</strong> 90° to wind. <strong>Monsoon:</strong> seasonal land-sea heating contrast.</p><h4>Oceanographic Applications</h4><p>Coastal upwelling (Peru): Ekman transport offshore → cold nutrient-rich water rises. Subtropical gyres: Ekman convergence → downwelling → oligotrophic. Chlorophyll from space confirms subtropical gyres as 'ocean deserts'.</p><h4>Exam Tips</h4><div class="tip">The Peru upwelling–El Niño story is frequently examined. Know both the normal state (upwelling, high productivity) AND the El Niño state (warm surface water, collapsed upwelling, fishery failure).</div>`,
  terms:[
    {t:"Geostrophic balance", d:"Balance between pressure gradient force and Coriolis force, resulting in flow parallel to isobars/pressure contours rather than across them."},
    {t:"Coriolis force", d:"Apparent force due to Earth's rotation; deflects moving objects to the right in NH, left in SH; zero at equator; increases with latitude."},
    {t:"Ekman spiral", d:"Systematic rotation of current direction with depth caused by the interplay of wind stress, Coriolis force and friction; net transport is 90° to wind."},
    {t:"Ekman pumping", d:"Divergence or convergence of Ekman transport driven by wind patterns — creates upwelling (divergence) or downwelling (convergence) in the interior ocean."},
    {t:"Coastal upwelling", d:"Rising of cold, nutrient-rich deep water along coastlines where Ekman transport moves surface water offshore; supports high biological productivity."},
    {t:"Monsoon", d:"Seasonal reversal of wind patterns driven by differential heating of land and ocean; summer onshore winds bring rain, winter offshore winds bring dry conditions."}
  ]
},
"1.7.1": {
  cards:[
    {q:"What are the main features of global ocean surface circulation?", a:"Subtropical gyres (clockwise NH, anticlockwise SH), polar gyres, equatorial currents (westward), equatorial counter-current, and the Antarctic Circumpolar Current (ACC) — the only current that circles the globe unimpeded."},
    {q:"What is the ACC and why is it unique?", a:"The Antarctic Circumpolar Current flows eastward around Antarctica driven by strong westerly winds. It is the only current to flow continuously around the full circumference of Earth, connecting all three major ocean basins."},
    {q:"What are the main ocean water masses and where do they form?", a:"NADW (North Atlantic Deep Water) forms in the N. Atlantic; AABW (Antarctic Bottom Water) forms around Antarctica; AAIW (Antarctic Intermediate Water); NPDW (North Pacific Deep Water). These form at the surface where specific T/S conditions exist, then sink and spread globally."},
    {q:"What is a CTD profile and what does it measure?", a:"CTD = Conductivity (salinity), Temperature, Depth. A CTD instrument lowered through the water column produces vertical profiles of salinity and temperature, revealing distinct water masses."},
    {q:"What factors control ocean salinity?", a:"Higher evaporation increases salinity (concentration). Higher precipitation and river input decreases salinity. Open ocean range is 32–37 g/L. Freezing also increases salinity (ice excludes salt as it forms, concentrating brine in remaining water)."},
    {q:"Why does sea ice formation cause deep water formation?", a:"When sea water freezes, ice excludes salt, releasing cold salty brine into the surrounding water. This increases density, causing the dense water to sink — driving bottom water formation (AABW around Antarctica, NADW in N. Atlantic)."},
    {q:"What is the East-West asymmetry in ocean current speed?", a:"Western boundary currents (Gulf Stream, Kuroshio) are narrow, fast and intense. Eastern boundary currents are broad, slow and shallow. This asymmetry (western intensification) results from the β-effect (variation of Coriolis with latitude)."},
    {q:"Why are subtropical gyres low in chlorophyll?", a:"Ekman convergence within subtropical gyres drives downwelling — nutrient-rich deep water cannot upwell to the sunlit surface. Without nutrients, phytoplankton growth is severely limited, creating 'ocean deserts'."}
  ],
  quiz:[
    {q:"The Antarctic Circumpolar Current is unique because:", opts:["It is the deepest current","It is the only current to circle the globe unimpeded","It flows westward","It only forms in winter"], ans:1, exp:"The ACC flows continuously around Antarctica, connecting all three major ocean basins — the only ocean current to do so, driven by persistent westerly winds."},
    {q:"NADW (North Atlantic Deep Water) forms primarily because:", opts:["High precipitation dilutes surface water","Cold temperatures and high salinity increase density, causing sinking","Ekman pumping drives downwelling","Wind drives surface water to depth"], ans:1, exp:"In the North Atlantic, cold temperatures reduce buoyancy while high salinity (from the salty Atlantic) increases density. This dense water sinks to form NADW, driving the overturning circulation."},
    {q:"Open ocean salinity typically ranges from:", opts:["1–5 g/L","10–20 g/L","32–37 g/L","50–60 g/L"], ans:2, exp:"Open ocean salinity is typically 32–37 g/L (or practical salinity units). It is higher where evaporation exceeds precipitation and lower where precipitation/river input is high."},
    {q:"Western boundary currents (e.g. Gulf Stream) are narrow and fast because of:", opts:["Wind forcing is stronger in the west","The β-effect (Coriolis variation with latitude) concentrates flow in the west","The seafloor is shallower in the west","Salinity is higher in the west"], ans:1, exp:"Western intensification arises from the β-effect — Coriolis force increases with latitude, which via Sverdrup balance concentrates and intensifies flow along western ocean boundaries."},
    {q:"Chlorophyll measured from space shows subtropical gyres as 'ocean deserts' because:", opts:["They are too deep","Ekman convergence drives downwelling, preventing nutrient supply to sunlit surface","They are too cold","Solar radiation is insufficient"], ans:1, exp:"Ekman convergence in subtropical anticyclonic gyres pushes surface water down, preventing upwelling of nutrients from depth — phytoplankton cannot grow without nutrients."}
  ],
  summary:`<h4>Overview</h4><p>Global ocean circulation consists of wind-driven surface gyres and the deep thermohaline overturning circulation. These together redistribute heat globally and are intimately connected to climate.</p><h4>Surface Circulation</h4><p>Subtropical gyres (CW in NH, CCW in SH), equatorial currents (westward), ACC (unique, circumglobal). Western boundary currents intensified (β-effect). Subtropical gyres: Ekman downwelling → ocean deserts (confirmed by satellite chlorophyll maps).</p><h4>Deep Circulation</h4><p>NADW forms in N. Atlantic (cold + salty = dense). AABW forms around Antarctica (freezing + brine release). CTD profiles reveal distinct water masses. Global overturning takes hundreds–thousands of years.</p><h4>Exam Tips</h4><div class="tip">Be able to identify and explain the major water masses (NADW, AABW, AAIW). The link between sea ice formation, brine rejection, and deep water formation is a key mechanism — explain it step by step.</div>`,
  terms:[
    {t:"Antarctic Circumpolar Current (ACC)", d:"The world's largest ocean current, flowing eastward around Antarctica driven by westerly winds; the only current to circle the globe without being blocked by land."},
    {t:"NADW", d:"North Atlantic Deep Water — dense water mass formed by cooling and sinking in the North Atlantic (especially Labrador and Nordic Seas); a key component of global overturning circulation."},
    {t:"AABW", d:"Antarctic Bottom Water — the densest water mass in the ocean, formed around Antarctica by freezing (brine rejection) and cooling; fills the bottom of all ocean basins."},
    {t:"Western intensification", d:"The concentration of fast, narrow currents along western ocean boundaries (Gulf Stream, Kuroshio) due to the β-effect (poleward increase of Coriolis parameter)."},
    {t:"CTD profiler", d:"Conductivity-Temperature-Depth instrument that measures salinity and temperature through the water column, revealing distinct water masses."},
    {t:"Brine rejection", d:"Process during sea ice formation where freezing water expels dissolved salts, increasing the salinity and density of adjacent water, causing it to sink."}
  ]
},
"1.8.1": {
  cards:[
    {q:"Describe the two theories for what drives deep ocean overturning circulation.", a:"1) Turbulent mixing theory: turbulence mixes warm surface water down; cold deep water rises to compensate. 2) Southern Ocean wind theory: westerly winds drive Ekman transport that 'pulls' deep water upward around Antarctica, allowing sinking elsewhere (N. Atlantic)."},
    {q:"What drives Western boundary current intensification?", a:"The β-effect: Coriolis parameter (f) increases with latitude. By Sverdrup balance, this means return flows concentrate into narrow, fast western boundary currents rather than being evenly distributed across the ocean."},
    {q:"What was the WOCE (World Ocean Circulation Experiment) and why was it important?", a:"A global oceanographic survey (1990–1998) that mapped ocean properties along transects across all three major basins. Aim: provide the basis to predict heat and carbon uptake by oceans in a warming world."},
    {q:"How does equatorial upwelling work?", a:"Trade winds blow surface water westward away from the equator via Coriolis effects — diverging north and south. Deep, cold nutrient-rich water upwells to replace it, producing productive equatorial ocean zones."},
    {q:"What are the consequences of downwelling in subtropical gyres?", a:"Ekman convergence pushes surface water downward. Deep nutrient-rich water cannot rise to the sunlit surface, making subtropical gyres nutrient-poor and low-chlorophyll 'ocean deserts', as confirmed by satellite chlorophyll measurements."},
    {q:"What does 'the atmosphere acts as a transmission belt from sun to oceans' mean?", a:"Solar energy heats the atmosphere differentially, creating wind patterns. These wind patterns exert stress on the ocean surface, driving ocean surface currents. The atmosphere thus transmits solar energy into ocean motion."},
    {q:"How are heat transport and climate linked through ocean circulation?", a:"Warm surface currents (Gulf Stream) transport heat poleward, warming North Atlantic climate. Deep cold currents return southward completing the conveyor. Changes in this circulation (e.g. AMOC weakening) can cause abrupt regional climate shifts."},
    {q:"What is Sverdrup balance?", a:"A geostrophic balance including the β-effect (varying Coriolis). It predicts that horizontal divergence/convergence of Ekman flow drives vertical motion (upwelling/downwelling) in the ocean interior, and governs the large-scale gyre structure."}
  ],
  quiz:[
    {q:"The WOCE (1990–1998) aimed to:", opts:["Map fish populations","Predict heat and carbon uptake of oceans in a warming world","Drill ocean floor sediments","Measure ocean salinity only"], ans:1, exp:"WOCE was a massive international oceanographic survey across all major ocean basins aiming to provide baseline data for predicting how oceans will take up heat and carbon under climate change."},
    {q:"According to the Southern Ocean wind theory of overturning circulation:", opts:["Deep water forms only in the North Atlantic","Westerly winds around Antarctica pull deep water upward, enabling sinking elsewhere","Mixing alone drives the circulation","Temperature differences are unimportant"], ans:1, exp:"The Southern Ocean wind theory proposes that strong westerly winds drive Ekman transport that pulls deep water upward around Antarctica — this allows deep water formation (sinking) in the North Atlantic as part of the same closed circulation."},
    {q:"Why are equatorial ocean regions productive?", opts:["Higher solar radiation","Trade winds drive Ekman divergence and upwelling of nutrient-rich water","Lower salinity allows more growth","Deeper water column"], ans:1, exp:"Trade winds on either side of the equator diverge (north goes right, south goes left via Coriolis), driving upwelling of cold, nutrient-rich water along the equator."},
    {q:"Western boundary currents are narrower and faster than eastern boundary currents due to:", opts:["Higher salinity in western oceans","The β-effect causing Coriolis force to increase with latitude","Stronger winds on the western side","Deeper bathymetry on the western side"], ans:1, exp:"The β-effect (Coriolis parameter increasing poleward) means gyre dynamics require concentrated return flow along western margins — producing narrow, fast western boundary currents."},
    {q:"Turbulent mixing theory of overturning circulation proposes:", opts:["Wind drives all deep circulation","Turbulence mixes warm water downward, causing cold deep water to rise in compensation","Temperature alone drives sinking","River input drives overturning"], ans:1, exp:"The turbulent mixing theory proposes that turbulence (from tidal forcing, storms etc.) mixes warm surface water downward, requiring cold deep water to upwell as compensation — maintained by continuous mixing energy input."}
  ],
  summary:`<h4>Overview</h4><p>Ocean circulation mechanisms link surface wind forcing to deep overturning circulation. The global conveyor transports heat across all ocean basins on timescales of hundreds to thousands of years.</p><h4>Driving Mechanisms</h4><p><strong>Turbulent mixing theory:</strong> mixing pulls deep water up. <strong>Southern Ocean wind theory:</strong> westerly winds drive upwelling around Antarctica, enabling NADW formation. Both contribute.</p><h4>Key Systems</h4><p>Western intensification (β-effect → Gulf Stream). Equatorial upwelling (trade wind divergence). Subtropical downwelling (Ekman convergence → ocean deserts). WOCE (1990–98): global ocean survey for climate prediction.</p><h4>Exam Tips</h4><div class="tip">Be prepared to compare both theories of deep overturning. The AMOC schematic (Gulf Stream → NADW → deep return flow → upwelling → Gulf Stream) is a key diagram to be able to describe.</div>`,
  terms:[
    {t:"Sverdrup balance", d:"Large-scale balance between wind-driven Ekman divergence and the stretching of vortex tubes due to the β-effect; governs interior ocean gyre structure."},
    {t:"β-effect", d:"The variation of the Coriolis parameter with latitude (df/dy > 0); responsible for western intensification and Rossby wave propagation."},
    {t:"Turbulent mixing theory", d:"Theory that deep ocean upwelling is driven by turbulent mixing that diffuses warm water downward; requires a continuous source of mechanical energy."},
    {t:"Southern Ocean wind theory", d:"Theory that westerly winds around Antarctica drive Ekman upwelling of deep water, enabling the overturning circulation to operate."},
    {t:"WOCE", d:"World Ocean Circulation Experiment (1990–1998); first global survey of all major ocean basins to provide baseline data for climate prediction."},
    {t:"Overturning circulation", d:"The global 3D circulation of the ocean including both wind-driven surface gyres and the density-driven deep circulation (thermohaline circulation)."}
  ]
},
"1.9.1": {
  cards:[
    {q:"What is the main purpose of atmospheric circulation?", a:"To transport excess heat from the tropics to higher latitudes — the tropics receive more solar radiation than they emit infrared; poles emit more than they receive. Without circulation, heat would accumulate in the tropics."},
    {q:"What is baroclinic instability?", a:"Occurs in midlatitudes where surfaces of constant pressure and density are not aligned (strong horizontal temperature gradients). Rossby waves grow, become unstable, break into cyclones and anticyclones, and transport heat poleward — the main midlatitude heat transport mechanism."},
    {q:"What are Rossby waves and what causes them?", a:"Large-scale planetary waves (undulations in the jet stream) caused by conservation of absolute vorticity. When air moves poleward, increasing planetary vorticity causes anticyclonic spin; equatorward, cyclonic spin. They propagate westward relative to the mean flow."},
    {q:"How does the atmosphere transport heat poleward?", a:"In the tropics: Hadley Cells transport heat via overturning circulation (rising at ITCZ, poleward aloft). In midlatitudes: baroclinic eddies (cyclones/anticyclones from Rossby wave breaking) transport heat poleward — eddies dominate in midlatitudes."},
    {q:"Why can purely zonal (west-east) flow not transport heat poleward?", a:"Heat transport requires motion across latitude circles (meridional/north-south movement). Purely zonal flow moves air along latitude lines only — no net poleward transport occurs. Hadley circulation and baroclinic eddies break zonal symmetry."},
    {q:"What is the ITCZ and how does it relate to the Hadley Cell?", a:"The Intertropical Convergence Zone is the ascending branch of the Hadley Cell. Surface trade winds from both hemispheres converge here; rising moist air produces deep convection and tropical rainfall belts. Its position shifts seasonally following the solar maximum."},
    {q:"What causes jet streams and where are they found?", a:"Strong horizontal temperature gradients between tropics and poles create large upper-tropospheric pressure gradients. Geostrophic balance produces fast westerly winds (~10 km altitude) — the polar and subtropical jet streams at ~45–60°N/S."},
    {q:"Why does the UK experience variable weather?", a:"The UK lies in the midlatitude Rossby wave-breaking region (~50°N). Frequent cyclones and anticyclones associated with Rossby wave breaking and baroclinic instability create highly variable weather — the same eddies that transport heat poleward produce UK weather systems."}
  ],
  quiz:[
    {q:"The dominant heat transport mechanism in midlatitudes is:", opts:["Hadley Cell overturning","Baroclinic eddies from Rossby wave breaking","Longwave radiation","Ocean currents"], ans:1, exp:"Baroclinic instability grows Rossby waves into cyclones and anticyclones that transport heat poleward in midlatitudes — this is the primary mechanism poleward of ~30°."},
    {q:"Rossby waves propagate:", opts:["Eastward faster than mean flow","Westward relative to mean flow","Only in the Southern Hemisphere","Downward into the ocean"], ans:1, exp:"Rossby waves propagate westward relative to the mean westerly flow due to the β-effect (conservation of absolute vorticity with changing planetary vorticity)."},
    {q:"Purely zonal (west-east) atmospheric flow cannot transport heat poleward because:", opts:["It is too slow","It only moves air along latitude lines with no net north-south motion","It has too much friction","It only occurs at the equator"], ans:1, exp:"Heat transport requires meridional (north-south) motion to carry warm air poleward and cold air equatorward. Purely zonal flow has no net component across latitude lines."},
    {q:"Baroclinic instability occurs when:", opts:["The atmosphere is too humid","Surfaces of constant pressure and density are not aligned, storing large available potential energy","Solar radiation is very strong","Coriolis force is zero"], ans:1, exp:"Baroclinic instability arises when pressure and density surfaces are tilted relative to each other — characteristic of strong temperature gradients. The stored potential energy is released as growing Rossby waves."},
    {q:"The Hadley Cell transports heat poleward in the tropics by:", opts:["Eastward wave motion","Overturning: warm moist air rises at ITCZ, moves poleward aloft, sinks at 30°","Diffusion only","Deep ocean currents"], ans:1, exp:"The Hadley Cell is a direct overturning circulation: air rises at the ITCZ carrying heat upward, moves poleward in the upper troposphere, sinks at ~30°, and returns equatorward at the surface."}
  ],
  summary:`<h4>Overview</h4><p>The atmosphere's primary function is to transport heat from tropics to poles. Two different mechanisms operate in different latitude bands.</p><h4>Tropical: Hadley Cell</h4><p>Direct overturning: rise at ITCZ → poleward aloft → sink at 30°N/S → return trade winds. Drives tropical rainfall belts, subtropical deserts.</p><h4>Midlatitudes: Baroclinic Eddies</h4><p>Strong temperature gradient → stored potential energy → Rossby waves grow → baroclinic instability → cyclones/anticyclones → poleward heat transport. UK weather = product of this process.</p><h4>Exam Tips</h4><div class="tip">Distinguish tropical (Hadley, direct) from midlatitude (baroclinic eddies, indirect) heat transport clearly. Examiners expect you to explain WHY zonal flow is insufficient and how eddies break the symmetry.</div>`,
  terms:[
    {t:"Baroclinic instability", d:"Instability arising when pressure and density surfaces are not aligned (strong temperature gradients); releases potential energy through growing Rossby waves into cyclones and anticyclones."},
    {t:"Rossby waves", d:"Large-scale planetary waves in the jet stream caused by conservation of absolute vorticity; propagate westward; responsible for midlatitude weather and poleward heat transport."},
    {t:"Absolute vorticity", d:"Sum of planetary vorticity (due to Earth's rotation, = f = 2Ω sinφ) and relative vorticity (spin of air parcel); conserved in frictionless horizontal flow."},
    {t:"Meridional heat transport", d:"Transport of heat from tropics toward poles; accomplished by Hadley Cells in the tropics and baroclinic eddies in midlatitudes."},
    {t:"Hadley Cell", d:"Tropical overturning circulation: rising at ITCZ, poleward aloft, sinking at ~30°, return surface trade winds. The dominant heat transport in tropics."},
    {t:"Polar front jet stream", d:"Strong upper-tropospheric westerly winds at ~50–60°N/S driven by the sharp temperature gradient between polar and tropical air masses."}
  ]
},
"1.10.1": {
  cards:[
    {q:"What is climate sensitivity and what is the best estimate for CO₂ doubling?", a:"Climate sensitivity S = equilibrium temperature change per unit radiative forcing (°C per W/m²), or equivalently the warming for CO₂ doubling. Best estimate: ~2.5–3°C; likely range 1.5–4.5°C. The relationship is ΔT = F/λ where λ is the feedback parameter."},
    {q:"What is the Planck (blackbody) response to CO₂ doubling and why is it an underestimate?", a:"~1°C without feedbacks (CO₂ doubling raises emission height ~150m, cooling emission temperature by ~1°C, so surface must warm ~1°C to restore balance). It's an underestimate because positive feedbacks (water vapour, ice-albedo, clouds) amplify the initial warming."},
    {q:"Describe the water vapour feedback.", a:"Warmer air holds more water vapour (Clausius-Clapeyron: ~7% more per °C). Water vapour is itself a greenhouse gas, causing additional warming, which allows even more water vapour. Strong positive feedback — roughly doubles the Planck response."},
    {q:"Describe the ice-albedo feedback.", a:"Warming melts ice → exposes darker ocean/land surface → lower albedo → more solar absorption → further warming. Strong positive feedback, especially important at high latitudes and for glacial-interglacial cycles."},
    {q:"Why do oceans dominate climate system inertia?", a:"Oceans have an enormous heat capacity. Even if GHG emissions stopped today, oceans would continue absorbing heat for centuries, delaying the full equilibrium temperature response. Sea level rise continues even after surface temperature stabilises."},
    {q:"What is the 'rich get richer, poor get poorer' pattern in hydrological cycle change?", a:"A warming atmosphere holds ~7% more water vapour per °C (Clausius-Clapeyron), but global precipitation increases only ~2%/°C (limited by ability to radiate latent heat to space). Wet regions get wetter; dry regions get drier — intensifying existing patterns."},
    {q:"What Pliocene and Eocene analogues tell us about long-term CO₂ warming?", a:"Pliocene (~400 ppm CO₂): +1.8–3.6°C warmer, sea level several metres higher. Early Eocene (~1400 ppm CO₂): +13°C globally, no permanent ice anywhere. These show long-term consequences of sustained high CO₂ concentrations."},
    {q:"What are negative emissions and why are they controversial?", a:"Removing CO₂ from atmosphere: bioenergy + carbon capture (BECCS), direct air capture (DAC), afforestation. Controversial because scale required is enormous, technology is unproven at scale, and there are ethical issues (land use competition with food). Risky as primary strategy."}
  ],
  quiz:[
    {q:"The best estimate of warming for CO₂ doubling (climate sensitivity) is:", opts:["~0.5°C","~1.1°C (Planck only)","~2.5–3°C","~10°C"], ans:2, exp:"Climate sensitivity (equilibrium warming for CO₂ doubling) is estimated at ~2.5–3°C (likely range 1.5–4.5°C) once all fast feedbacks are included. The Planck-only response (~1.1°C) is much lower."},
    {q:"The water vapour feedback is:", opts:["Negative — more vapour increases reflection","Positive — warmer air holds more WV which amplifies greenhouse warming","Neutral — WV has no GHG effect","Negative — WV increases cloud cover that cools"], ans:1, exp:"Water vapour feedback is strongly positive: warming increases atmospheric WV (Clausius-Clapeyron: ~7%/°C), and WV is itself a greenhouse gas, causing further warming — roughly doubling the Planck response."},
    {q:"The Clausius-Clapeyron relation states that the atmosphere holds approximately how much more water vapour per °C warming?", opts:["1%","3%","7%","15%"], ans:2, exp:"The Clausius-Clapeyron relation gives ~7% more water vapour capacity per °C increase in temperature — the basis of the strong water vapour feedback."},
    {q:"Global mean precipitation is predicted to increase at a rate of approximately:", opts:["7%/°C","4%/°C","2%/°C","0.5%/°C"], ans:2, exp:"Despite 7%/°C more atmospheric WV, global precipitation increases only ~2%/°C because precipitation is limited by the ability to radiate latent heat to space (energy constraint)."},
    {q:"Carbon budgets show that to avoid >1.5°C warming:", opts:["All reserves and resources can be burned","About two-thirds of remaining fossil fuel reserves should not be burned","Only coal must be eliminated","Solar and wind are sufficient without limiting fossil fuels"], ans:1, exp:"Estimates suggest burning all known reserves would give ~400+ ppm additional CO₂. To stay within 1.5–2°C, approximately two-thirds of remaining fossil fuel reserves must stay in the ground."}
  ],
  summary:`<h4>Overview</h4><p>Climate change predictions involve radiative forcing, feedbacks, and the delayed response of the climate system due to ocean inertia.</p><h4>Climate Sensitivity</h4><p>ΔT = F/λ. Planck response ~1.1°C for CO₂ doubling. With feedbacks: ~2.5–3°C (range 1.5–4.5°C). Key feedbacks: water vapour (+, strong), ice-albedo (+), cloud (uncertain, weakly +), Planck (−, stabilising).</p><h4>Hydrological Cycle</h4><p>+7%/°C more WV (Clausius-Clapeyron) but only +2%/°C more rain. Wet regions wetter, dry regions drier. More extreme events.</p><h4>Exam Tips</h4><div class="tip">Know the feedback types, signs and mechanisms. The climate sensitivity range (1.5–4.5°C) with best estimate ~3°C is a standard exam answer. Always distinguish the Planck response from the full sensitivity.</div>`,
  terms:[
    {t:"Climate sensitivity (S)", d:"Equilibrium temperature change for a given radiative forcing; typically quoted as °C per CO₂ doubling. Best estimate ~3°C; likely range 1.5–4.5°C."},
    {t:"Radiative forcing", d:"Change in Earth's energy balance (W/m²) due to a perturbation such as increased CO₂. CO₂ doubling ≈ +4 W/m² forcing."},
    {t:"Planck (blackbody) feedback", d:"Negative feedback: warmer Earth emits more longwave radiation, stabilising temperature. Alone gives ~1.1°C for CO₂ doubling."},
    {t:"Water vapour feedback", d:"Strong positive feedback: warming → more atmospheric WV → stronger greenhouse effect → more warming. Roughly doubles the Planck response."},
    {t:"Ice-albedo feedback", d:"Positive feedback: warming melts ice → lower albedo → more solar absorption → more warming. Especially strong at high latitudes."},
    {t:"Clausius-Clapeyron relation", d:"Thermodynamic relationship showing saturation water vapour pressure increases ~7% per °C temperature rise — basis of the water vapour feedback."},
    {t:"Climate inertia", d:"The delayed response of the climate system to forcing, dominated by ocean heat capacity; even after emissions stop, warming continues for centuries."}
  ]
},
"1.11.1": {
  cards:[
    {q:"By how much has global mean surface temperature increased since pre-industrial times?", a:"By approximately 1–1.5°C. Warming is stronger over land (~2–3°C in many regions), faster in the Northern Hemisphere, and strongest in the Arctic (Arctic amplification)."},
    {q:"What is Arctic amplification?", a:"The pattern where high northern latitudes warm faster than the global average. Driven by ice-albedo feedback (melting ice exposes darker surfaces) and reduced heat loss from the now ice-free Arctic Ocean, amplifying initial warming."},
    {q:"What changes are observed in the cryosphere?", a:"Arctic sea ice has declined rapidly since the 1970s (thinner, younger ice; summer Arctic now often navigable). Mountain glaciers retreating globally. Greenland and Antarctic ice sheets losing mass. Permafrost thawing at high northern latitudes."},
    {q:"What drives observed sea level rise and what are projections?", a:"Sea level rises from: ocean thermal expansion + melting land ice (glaciers, ice sheets). Rise has been steady and accelerating since the 19th century. By 2100 ~1 metre rise is plausible under high-emission scenarios. Complete Greenland + Antarctic melting = ~70m over very long timescales."},
    {q:"What changes in atmospheric structure are observed?", a:"Tropopause moving upward (troposphere warming and expanding). Stratosphere cooling (less IR escapes from the stratosphere to space as it increasingly escapes from lower in the troposphere). Atmospheric water vapour increasing."},
    {q:"What does ocean salinity data tell us about the hydrological cycle?", a:"Salty ocean regions are getting saltier; fresh regions are getting fresher. This confirms hydrological cycle intensification: more evaporation in already-salty subtropical regions, more rainfall (diluting) in already-fresh high-latitude regions."},
    {q:"How are tropical cyclones changing under climate change?", a:"More intense rainfall (warmer atmosphere holds more moisture). Maximum intensity likely increasing. Not necessarily more frequent, but when they occur they produce more extreme rainfall due to higher sea surface temperatures and atmospheric moisture content."},
    {q:"What circulation changes are observed?", a:"Tropical belt widening, subtropical dry zones shifting poleward. Hadley Cell likely weakening. Jet streams shifting poleward (especially Southern Hemisphere). AMOC changes debated — evidence for weakening exists but is disputed."}
  ],
  quiz:[
    {q:"Global mean surface temperature has increased by approximately how much since pre-industrial times?", opts:["0.2–0.5°C","1–1.5°C","3–4°C","5–6°C"], ans:1, exp:"Global mean surface temperature has risen by about 1–1.5°C since the pre-industrial period (~1850), with land areas warming roughly twice as fast as oceans."},
    {q:"The stratosphere is cooling under climate change because:", opts:["Ozone is increasing","Less infrared radiation reaches the stratosphere as it increasingly escapes from lower in the troposphere","Winds have changed","The Sun is dimming"], ans:1, exp:"As tropospheric GHGs increase, more IR is emitted from lower, warmer levels — less reaches the stratosphere to warm it. The stratosphere therefore cools (while the troposphere warms)."},
    {q:"Arctic sea ice loss is accelerating primarily due to:", opts:["Increased methane only","Ice-albedo positive feedback amplifying regional warming","Changes in ocean salinity","Reduced wind speed"], ans:1, exp:"Ice-albedo feedback is the main driver: warming melts ice → dark ocean absorbs more solar radiation → further warming → more melting. This creates rapid Arctic amplification."},
    {q:"Complete melting of Greenland and Antarctic ice sheets would raise global sea level by approximately:", opts:["1 metre","10 metres","70 metres","200 metres"], ans:2, exp:"Complete melting of Greenland (~7m) and Antarctica (~60m) ice sheets would raise global sea level by approximately 70 metres — but this would take thousands of years."},
    {q:"The observation that salty ocean regions are getting saltier and fresh regions fresher indicates:", opts:["Ocean circulation is reversing","Intensification of the hydrological cycle","Reduced evaporation globally","Changes in river runoff only"], ans:1, exp:"Increased evaporation in subtropical (already salty) regions and more precipitation in high-latitude (already fresh) regions are fingerprints of an intensifying hydrological cycle under warming."}
  ],
  summary:`<h4>Overview</h4><p>Observed climate change is measured across multiple variables — temperature, cryosphere, sea level, oceans, atmosphere structure and extreme events. The evidence is consistent and robust.</p><h4>Key Observations</h4><p>+1–1.5°C global mean T since pre-industrial. Arctic amplification (strongest warming at high latitudes). Tropopause rising, stratosphere cooling. WV increasing. Arctic sea ice declining rapidly.</p><h4>Sea Level & Ice</h4><p>Sea level rising: thermal expansion + ice melt. Mountain glaciers retreating. Greenland and Antarctic ice sheets losing mass. ~70m if complete melting (millennial timescale). ~1m by 2100 under high emissions.</p><h4>Exam Tips</h4><div class="tip">Arctic amplification and why the stratosphere is COOLING while the troposphere warms are classic exam traps. Practise explaining the opposite trends clearly.</div>`,
  terms:[
    {t:"Arctic amplification", d:"The pattern where Arctic regions warm 2–4× faster than the global average, driven primarily by ice-albedo feedback."},
    {t:"Thermal expansion", d:"The increase in ocean volume as water warms; a major contributor to sea level rise alongside melting land ice."},
    {t:"Stratospheric cooling", d:"The observed cooling of the stratosphere under climate change — a fingerprint of greenhouse warming (more IR escapes from lower troposphere, less reaches stratosphere)."},
    {t:"Cryosphere", d:"The frozen parts of the Earth system: sea ice, glaciers, ice sheets, snow cover, permafrost. All components are showing declining mass or extent under climate change."},
    {t:"Hydrological cycle intensification", d:"The observed speeding up of the global water cycle under warming: more evaporation, more precipitation, stronger extremes. Confirmed by salinity patterns (saltier salty, fresher fresh)."},
    {t:"AMOC", d:"Atlantic Meridional Overturning Circulation — the Atlantic 'conveyor belt' transporting warm surface water northward; evidence for weakening exists but remains debated."}
  ]
},
"2.1.1b": {
  cards:[
    {q:"Why do we study palaeoclimate?", a:"1) Understand climate change mechanisms at different timescales. 2) Distinguish natural from anthropogenic climate variability. 3) Test and improve climate models. 4) Independently estimate climate sensitivity to CO₂ from empirical data rather than models."},
    {q:"What is a climate proxy?", a:"A source of climate information from a natural archive used to reconstruct past climate before instrumental records. Examples: ice cores, tree rings, speleothems, pollen, foraminifera, corals, lake sediments."},
    {q:"What are the main climate archives and what do they record?", a:"Ice cores: temperature, CO₂, CH₄, dust. Marine sediments: deep-sea temperature, ice volume (foraminifera δ¹⁸O). Tree rings: temperature and precipitation. Pollen: vegetation, inferred T and P. Speleothems: cave T and P. Corals: sea surface T."},
    {q:"What are the limitations of instrumental temperature records?", a:"Only ~250 years long — far too short to capture glacial-interglacial cycles, Cenozoic cooling, or longer-term variability. Sparse coverage initially (mainly Europe/N. America). Proxy records are needed for anything older than ~1750."},
    {q:"What is the Late Paleocene Thermal Maximum (LPTM)?", a:"A rapid warming event ~55 million years ago: temperatures rose up to 8°C within <10,000 years. Marked by large spikes in carbon isotopes. Possibly caused by melting of methane clathrates on the seafloor, releasing massive quantities of carbon."},
    {q:"What was the Early Eocene Climatic Optimum?", a:"~50 million years ago, the warmest period of the past 65 million years. Global temperature ~28°C (vs today's ~15°C), no permanent polar ice, temperate forests in the Arctic, rainforests in Northern Europe. CO₂ was ~1400 ppm."},
    {q:"How long do the longest instrumental temperature datasets extend?", a:"Approximately 250 years — the Central England Temperature record (CET) and a few other long series. This is a tiny window compared to the scale of climate change we need to understand."},
    {q:"What Cenozoic climate event began ~35 million years ago?", a:"The onset of Antarctic glaciation, marking the beginning of Cenozoic cooling. This coincided with the opening of the Drake Passage (~25 mya), allowing the Antarctic Circumpolar Current to form and thermally isolate Antarctica."}
  ],
  quiz:[
    {q:"The longest instrumental temperature records extend back approximately:", opts:["50 years","250 years","1,000 years","10,000 years"], ans:1, exp:"The longest instrumental records (e.g. Central England Temperature) extend back only ~250 years — tiny compared to the timescales of glacial cycles and Cenozoic cooling."},
    {q:"The Late Paleocene Thermal Maximum (~55 Ma) was characterised by:", opts:["Gradual cooling over 1 million years","Rapid warming of up to 8°C within <10,000 years, with carbon isotope spikes","An ice age","No temperature change"], ans:1, exp:"The LPTM was a sudden hyperthermal event: ~8°C warming in <10,000 years with massive carbon isotope excursions, possibly from methane clathrate melting."},
    {q:"Climate proxies are needed because:", opts:["Instruments are unreliable","Instrumental records only extend ~250 years — far shorter than glacial cycles or Cenozoic timescales","Proxies are more accurate than instruments","Models cannot use instrumental data"], ans:1, exp:"Instrumental records only go back ~250 years. To understand ice ages, Cenozoic cooling, and multi-million-year climate changes, we need proxy archives like ice cores, foraminifera and tree rings."},
    {q:"The Early Eocene Climatic Optimum (~50 Ma) saw global temperatures approximately:", opts:["−5°C (colder than today)","Same as today","~28°C (about 13°C warmer than today)","50°C"], ans:2, exp:"The Early Eocene was the warmest period of the last 65 million years with global T ~28°C, no permanent ice, and CO₂ ~1400 ppm — about 13°C warmer than today."},
    {q:"One reason for studying palaeoclimate is to estimate climate sensitivity empirically. This means:", opts:["Using models to simulate past climates","Using reconstructed CO₂ and temperature to determine the T response per CO₂ change without relying on models","Measuring current temperatures","Extrapolating recent trends"],  ans:1, exp:"Past climates allow us to pair reconstructed CO₂ concentrations with reconstructed temperatures — giving an empirical (observation-based) estimate of climate sensitivity independent of model assumptions."}
  ],
  summary:`<h4>Overview</h4><p>Palaeoclimatology extends our understanding of climate beyond the ~250-year instrumental record using proxy data from ice cores, sediments, tree rings, and other natural archives.</p><h4>Why It Matters</h4><p>1) Understand mechanisms at all timescales. 2) Separate natural from anthropogenic change. 3) Test climate models. 4) Empirically estimate climate sensitivity from CO₂-T relationships.</p><h4>Key Events in the Cenozoic</h4><p>Early Eocene Climatic Optimum (~50 Ma): 28°C, CO₂ ~1400 ppm, no ice. LPTM (~55 Ma): +8°C in &lt;10 kyr, methane clathrates? Antarctic glaciation onset ~35 Ma. Continuing cooling to present.</p><h4>Exam Tips</h4><div class="tip">Always justify WHY proxies are needed (250-year limit of instruments). The LPTM and Eocene Optimum numbers (8°C, 28°C, 1400 ppm) are highly examinable.</div>`,
  terms:[
    {t:"Climate proxy", d:"Natural archives recording past climate conditions; examples include ice cores, foraminifera, tree rings, speleothems, pollen, corals, lake sediments."},
    {t:"LPTM", d:"Late Paleocene Thermal Maximum (~55 Ma) — rapid warming of up to 8°C in <10,000 years, likely from methane clathrate destabilisation; marked by large carbon isotope excursions."},
    {t:"Early Eocene Climatic Optimum", d:"The warmest period of the past 65 million years (~50 Ma); global T ~28°C, CO₂ ~1400 ppm, no permanent ice, forests at the poles."},
    {t:"Drake Passage opening", d:"Tectonic opening of the gap between South America and Antarctica (~25 Ma), allowing formation of the Antarctic Circumpolar Current and thermal isolation of Antarctica."},
    {t:"Cenozoic cooling", d:"The long-term cooling trend over the past ~35 million years from the Eocene Optimum to present, driven by declining CO₂ and changes in ocean circulation."},
    {t:"Methane clathrate", d:"Ice-like compounds trapping methane in seafloor sediments; destabilisation during warming can release massive CH₄ pulses (a potential amplifier of rapid warming events like the LPTM)."}
  ]
},
"2.2.1": {
  cards:[
    {q:"What information can be extracted from ice cores?", a:"Air temperature (from δ¹⁸O and δD isotopes), atmospheric composition (CO₂, CH₄ from trapped air bubbles), precipitation amounts, dust (wind strength), volcanic aerosols (volcanic layers), solar output (¹⁰Be and ¹⁴C production rates)."},
    {q:"How does oxygen isotope fractionation record temperature in ice cores?", a:"Heavy water (H₂¹⁸O) behaves differently in the water cycle: it evaporates less readily but condenses more readily than normal water (H₂¹⁶O). Temperature-dependent fractionation means warmer temperatures produce less isotopically depleted precipitation — more depleted (lower δ¹⁸O) = colder temperatures."},
    {q:"Name the major ice core drilling projects and their records.", a:"Greenland: GRIP, GISP2, NGRIP (100,000-year record, last interglacial). NEEM (deeper). Antarctica: Vostok (400,000 years), EPICA/Dome-C (800,000 years = 8 glacial cycles, costs €20 million, drills 3km). Byrd."},
    {q:"How are ice cores dated?", a:"Layer counting (annual layers visible in fresh ice, <1% error but fails in compressed deep ice). Ice flow modelling (mathematical model of thinning with depth). Volcanic ash layers (dated eruptions provide tie points). Wiggle-matching to independently dated records."},
    {q:"What are foraminifera and why are they useful for palaeoclimate?", a:"Single-celled marine amoeboid protists (0.4–10mm) that build calcium carbonate shells. Both planktonic (surface ocean) and benthic (seafloor) forms exist. Their δ¹⁸O and Mg/Ca ratios record past ocean temperature and ice volume."},
    {q:"Explain the two effects that control benthic vs planktonic foraminifera δ¹⁸O.", a:"1) Ice volume effect: more water locked in ice sheets → ocean more enriched in ¹⁸O (higher δ¹⁸O; ~1‰ per 100m sea level drop). 2) Temperature effect: colder water → higher δ¹⁸O in shells (~0.25‰/°C). Benthic forams mainly record ice volume; planktonic reflect T, salinity and ice volume."},
    {q:"What is Marine Isotope Stratigraphy (MIS)?", a:"A global stratigraphic framework based on δ¹⁸O cycles in benthic foraminifera, which are consistent worldwide. MIS odd numbers = warm interglacials (low δ¹⁸O); even numbers = cold glacials (high δ¹⁸O). Used to correlate ocean sediment records globally."},
    {q:"What are the two alternative palaeothermometers beyond δ¹⁸O?", a:"1) Alkenones: organic compounds (long-chain ketones) produced by coccolithophore algae — their 'saturation index' (Uk'37) correlates with sea surface temperature. 2) Mg/Ca ratio in foram shells: higher Mg/Ca = warmer formation temperature."}
  ],
  quiz:[
    {q:"EPICA/Dome-C ice core provides a climate record spanning:", opts:["10,000 years","100,000 years","400,000 years","800,000 years (8 glacial cycles)"], ans:3, exp:"The EPICA Dome-C ice core drilled 3km deep in Antarctica provides an 800,000-year record covering 8 complete glacial cycles — the longest continuous ice core climate record."},
    {q:"In ice cores, a more depleted (lower) δ¹⁸O value indicates:", opts:["Higher temperatures","Lower temperatures (more fractionation during cold conditions)","More precipitation","Higher CO₂"], ans:1, exp:"In ice cores, colder temperatures produce greater isotopic depletion (lower δ¹⁸O) because heavy water is more efficiently removed from vapour during long cold transport paths. Opposite of marine forams!"},
    {q:"In marine (benthic) foraminifera, higher δ¹⁸O indicates:", opts:["Warmer temperatures","Less ice, lower sea level","More ice, lower sea level, colder deep ocean","More fresh water input"], ans:2, exp:"Higher benthic foram δ¹⁸O indicates more water locked in ice sheets (ocean enriched in ¹⁸O) AND colder deep-ocean temperatures. It is OPPOSITE to ice core isotope direction."},
    {q:"The Mg/Ca ratio in foraminifera shells is used as a palaeothermometer because:", opts:["Mg is more abundant in warm water","Higher Mg/Ca in shells reflects higher formation temperature","Mg controls shell thickness","Ca is temperature-independent"], ans:1, exp:"Mg substitution for Ca in calcium carbonate shells increases with temperature, providing a proxy for past sea surface or deep-ocean temperature independent of isotope effects."},
    {q:"Marine Isotope Stages (MIS) with odd numbers represent:", opts:["Glacial periods","Transitional periods","Warm interglacials (lower ice volume, lower δ¹⁸O)","Periods of high volcanic activity"], ans:2, exp:"By convention, odd MIS numbers (MIS 1, 3, 5, 7...) represent warm interglacial periods (low δ¹⁸O = less ice), while even numbers represent cold glacials."}
  ],
  summary:`<h4>Overview</h4><p>Ice cores and marine sediments are the primary tools for reconstructing past climate on glacial-interglacial timescales. They record complementary signals.</p><h4>Ice Cores</h4><p>EPICA: 800 kyr, 8 glacial cycles. Temperature from δ¹⁸O and δD (MORE depleted = COLDER). CO₂ and CH₄ from trapped bubbles. Dust = wind. Volcanic layers = dating.</p><h4>Marine Foraminifera</h4><p>Benthic δ¹⁸O: mainly ice volume (also deep-ocean T). Higher δ¹⁸O = more ice. OPPOSITE direction to ice cores! MIS: odd = interglacial (warm), even = glacial (cold). Alternative thermometers: alkenones (Uk'37), Mg/Ca.</p><h4>Exam Tips</h4><div class="tip">The opposite isotope directions in ice cores vs forams is a classic exam trap. Ice core: depleted = cold. Marine foram: enriched = cold + more ice. Make sure you can explain WHY each works in its direction.</div>`,
  terms:[
    {t:"δ¹⁸O (delta-18-O)", d:"Isotopic ratio of ¹⁸O to ¹⁶O relative to a standard; records temperature in ice cores (depleted = cold) and ice volume + temperature in marine forams (enriched = more ice/colder)."},
    {t:"Isotope fractionation", d:"Temperature-dependent differential partitioning of heavy and light isotopes during phase transitions (evaporation, condensation) in the water cycle."},
