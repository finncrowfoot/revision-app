    {t:"EPICA", d:"European Project for Ice Coring in Antarctica — Dome-C ice core providing 800,000-year record of 8 complete glacial cycles; drilled 3km."},
    {t:"Benthic foraminifera", d:"Seafloor-dwelling single-celled organisms whose shell δ¹⁸O records deep-ocean temperature and continental ice volume; basis of Marine Isotope Stratigraphy."},
    {t:"Marine Isotope Stratigraphy (MIS)", d:"Global stratigraphic framework using benthic foram δ¹⁸O cycles; odd stages = warm interglacials, even stages = cold glacials."},
    {t:"Alkenones (Uk'37)", d:"Long-chain organic compounds produced by coccolithophores; the degree of unsaturation (Uk'37 index) is a sea surface temperature proxy."},
    {t:"Mg/Ca thermometry", d:"Use of Mg/Ca ratio in foraminiferal shells as a palaeothermometer; higher Mg/Ca indicates higher formation temperature."}
  ]
},
"2.3.1": {
  cards:[
    {q:"What is the BLAG model and what does it propose?", a:"Berner, Lasaga & Garrels (1983): long-term CO₂ decline driven by decreasing volcanic outgassing rates. As seafloor spreading rates decline, less CO₂ is emitted by volcanoes relative to weathering sequestration. Problem: spreading increased again ~15 Ma while cooling continued."},
    {q:"What is the Uplift-Weathering model and what does it propose?", a:"Raymo & Ruddiman (1992): CO₂ decline driven by increased chemical weathering due to Himalayan uplift. India-Asia collision ~50 Ma → Himalayan uplift → physical weathering increases surface area → faster chemical weathering → more CO₂ drawdown. Supported by large Himalayan sediment production especially in last 15 Myr."},
    {q:"What opened the Drake Passage and what were the consequences?", a:"Separation of South America from Antarctica ~25 Ma opened the Drake Passage, allowing formation of the Antarctic Circumpolar Current. This thermally isolated Antarctica from warm tropical water, reducing heat transport to the S. pole and initiating Antarctic glaciation."},
    {q:"Describe the Snowball Earth events.", a:"~716 Ma and ~635 Ma: glaciation extended to equatorial latitudes (glacial paleolatitude near 0°). Between snowball episodes: ice-free hot-house conditions. Ended by CO₂ buildup from continuous volcanic outgassing when the carbon cycle was interrupted by ice cover."},
    {q:"What are the three main proposed drivers of Cenozoic CO₂ decline?", a:"1) BLAG: decreased volcanic outgassing (decreasing seafloor spreading). 2) Uplift-weathering: increased weathering from Himalayan uplift (Raymo & Ruddiman). 3) Equatorial convergence of India: outgassing and subsequent weathering of Deccan Traps (Kent & Muttoni). All three contributed."},
    {q:"What is the weathering feedback and why does it prevent CO₂ from disappearing entirely?", a:"When CO₂ falls too low, global temperature drops, reducing weathering rates (slower chemical reactions in cold conditions). Less CO₂ drawdown → CO₂ stabilises. And vice versa. This negative feedback stabilises long-term CO₂, preventing it from dropping to zero."},
    {q:"What evidence supports the Uplift-Weathering model?", a:"The Himalayas are unusually large and have produced anomalously large volumes of sediment, especially in the last 15 million years — consistent with accelerating physical and chemical weathering driving CO₂ drawdown. Strontium isotope records in marine sediments support increased continental weathering."},
    {q:"Why did continuous Cenozoic cooling not stop the sun getting stronger?", a:"Solar luminosity has increased ~30% since Earth formed and was stronger during Cenozoic than earlier. The long-term Cenozoic cooling despite a stronger sun shows the cooling was driven by declining CO₂ (and related changes), not solar output — which actually opposes the cooling trend."}
  ],
  quiz:[
    {q:"The opening of Drake Passage (~25 Ma) contributed to Antarctic glaciation by:", opts:["Increasing CO₂","Allowing the ACC to form, thermally isolating Antarctica from warm tropical water","Increasing solar radiation at the pole","Closing the Tethys Sea"], ans:1, exp:"Drake Passage opening allowed the Antarctic Circumpolar Current to form, cutting off the transport of warm tropical water to Antarctica — leading to thermal isolation and the build-up of the Antarctic ice sheet."},
    {q:"The BLAG model proposes that Cenozoic CO₂ decline was caused by:", opts:["Himalayan weathering increasing CO₂ uptake","Decreasing volcanic outgassing as seafloor spreading rates declined","Increased burial of organic carbon","Ozone layer formation"], ans:1, exp:"BLAG (Berner, Lasaga & Garrels 1983) proposes that declining seafloor spreading rates reduced volcanic CO₂ outgassing, tipping the balance toward net CO₂ drawdown by weathering."},
    {q:"The Uplift-Weathering model (Raymo & Ruddiman 1992) proposes CO₂ decline due to:", opts:["Decreased river runoff","India-Asia collision → Himalayan uplift → increased weathering → more CO₂ drawdown","Reduced solar output","Ocean acidification"], ans:1, exp:"Himalayan uplift increased physical weathering (more exposed rock surface area), accelerating chemical weathering that draws CO₂ from the atmosphere through silicate weathering reactions."},
    {q:"Snowball Earth events (~716 and 635 Ma) were ended by:", opts:["Increase in solar luminosity","CO₂ buildup from continuous volcanic outgassing while weathering was shut down by ice","Meteorite impact","Biological photosynthesis"], ans:1, exp:"With Earth frozen, weathering (which removes CO₂) stopped, but volcanoes continued emitting CO₂. Over millions of years, volcanic CO₂ accumulated until it was strong enough to melt the ice."},
    {q:"Why doesn't the weathering feedback allow CO₂ to drop to zero?", opts:["Weathering rates increase indefinitely","Lower CO₂ → cooler temperatures → slower weathering → less CO₂ drawdown → stabilisation","Volcanoes always outweigh weathering","Ocean absorption prevents any further decline"], ans:1, exp:"Negative feedback: lower CO₂ → lower T → reduced weathering rates → CO₂ drawdown slows → equilibrium. This prevents CO₂ from falling to zero — a long-term climate stabiliser."}
  ],
  summary:`<h4>Overview</h4><p>The Cenozoic (last 65 million years) shows a long-term cooling trend driven by declining CO₂, despite the Sun getting stronger — demonstrating CO₂'s dominant role in long-term climate.</p><h4>Three CO₂ Decline Hypotheses</h4><p><strong>BLAG:</strong> less volcanic outgassing. <strong>Uplift-weathering:</strong> Himalayan uplift → more weathering. <strong>Equatorial India convergence:</strong> Deccan Traps. All three contributed. Negative weathering feedback prevents CO₂ reaching zero.</p><h4>Key Events</h4><p>Snowball Earth: ~716 Ma and ~635 Ma. Drake Passage ~25 Ma → ACC → Antarctic isolation → glaciation. LPTM ~55 Ma: +8°C in <10 kyr (methane clathrates?). Eocene Optimum ~50 Ma: warmest Cenozoic period.</p><h4>Exam Tips</h4><div class="tip">Be ready to compare all three CO₂ decline hypotheses and their evidence/problems. The weathering feedback (negative, stabilising) is a key concept. Drake Passage → ACC → Antarctic glaciation is a classic chain of causation.</div>`,
  terms:[
    {t:"BLAG model", d:"Berner, Lasaga & Garrels (1983): explains Cenozoic CO₂ decline through decreasing volcanic outgassing as seafloor spreading rates fell."},
    {t:"Uplift-Weathering model", d:"Raymo & Ruddiman (1992): Himalayan uplift from India-Asia collision increased physical and chemical weathering, drawing down atmospheric CO₂."},
    {t:"Silicate weathering", d:"Chemical reaction where CO₂ reacts with silicate rocks, drawing CO₂ from atmosphere into soils and eventually oceans. The main long-term CO₂ sink."},
    {t:"Weathering feedback", d:"Negative feedback that stabilises long-term CO₂: lower T → slower weathering → less CO₂ drawdown → CO₂ stabilises. Prevents CO₂ from reaching zero."},
    {t:"Snowball Earth", d:"Periods of extreme glaciation (~716 Ma and ~635 Ma) when ice extended to equatorial latitudes; ended by volcanic CO₂ buildup."},
    {t:"Thermal isolation (Antarctica)", d:"The process by which the formation of the ACC after Drake Passage opening cut off warm water transport to Antarctica, initiating glaciation ~35 Ma."},
    {t:"Deccan Traps", d:"Large basalt fields in India formed by volcanic outgassing during equatorial convergence; one of three proposed drivers of Cenozoic CO₂ change (Kent & Muttoni 2008)."}
  ]
},
"2.4.1": {
  cards:[
    {q:"Name the three Milankovitch cycles with their periods.", a:"Eccentricity (100 kyr and 400 kyr): shape of orbit from circular to elliptical. Obliquity (41 kyr): axial tilt varies 22–24.5°. Precession (19–23 kyr): wobble of Earth's axis, shifts timing of perihelion."},
    {q:"Why is Northern Hemisphere summer insolation the key control on glacial cycles?", a:"Antarctica is ocean-isolated and cannot grow large ice sheets. Only NH ice sheets respond to orbital forcing. Ice sheets melt primarily in summer, so NH summer insolation determines whether ice grows or shrinks. Low summer insolation → more ice; high summer insolation → ice melt."},
    {q:"What is the 100 kyr problem?", a:"Eccentricity has a weak direct effect on total insolation, yet the last 800,000 years show dominant 100 kyr glacial cycles. Huybers & Wunsch (2005) argue glacials are actually 80 or 120 kyr (combining 2–3 obliquity cycles), and obliquity is the true pacemaker, not eccentricity."},
    {q:"What is the Mid-Pleistocene Transition (MPT)?", a:"Between 1.2–0.8 million years ago, glacial cycles shifted from 41 kyr (obliquity-paced) to longer 80–120 kyr cycles. Before 900 ka, every obliquity peak triggered deglaciation. After, only particularly strong orbital combinations could melt the larger ice sheets that formed under cooler boundary conditions."},
    {q:"How does CO₂ amplify orbital forcing?", a:"Milankovitch cycles initiate climate change (low summer insolation → ice growth). Feedback: colder ocean absorbs more CO₂ (higher solubility) + reduced deep-water formation strengthens biological pump → CO₂ drops further → amplifies cooling. Ice-core records show CO₂ and temperature are tightly coupled, with CO₂ acting as an amplifier."},
    {q:"Why do larger ice sheets melt more easily?", a:"Three mechanisms: 1) Larger ice sheets store more internal heat and flow faster (ice dynamics). 2) Their surfaces accumulate more dust (from arid glacial conditions), lowering albedo. 3) Changed ocean circulation releases CO₂ from the deep ocean, amplifying warming."},
    {q:"What does spectral analysis of marine δ¹⁸O records show?", a:"Strong spectral peaks at 100 kyr, 41 kyr, 23 kyr and 19 kyr — exactly matching the Milankovitch frequencies of eccentricity, obliquity and precession (two precession components). This is strong evidence for orbital control of glacial cycles."},
    {q:"Define ablation and accumulation in the context of ice sheets.", a:"Accumulation = addition of ice/snow to an ice sheet. Ablation = loss of ice through melting, calving and sublimation. Ice sheet mass balance = accumulation minus ablation. Minimum summer insolation → reduced ablation → positive mass balance → ice sheet grows."}
  ],
  quiz:[
    {q:"The obliquity Milankovitch cycle has a period of approximately:", opts:["19–23 kyr","41 kyr","100 kyr","400 kyr"], ans:1, exp:"Obliquity (variation in Earth's axial tilt between 22–24.5°) has a cycle of ~41 kyr. It was the dominant glacial pacemaker before the Mid-Pleistocene Transition (~800 ka)."},
    {q:"The 100 kyr problem refers to:", opts:["Eccentricity having a strong direct insolation effect","Eccentricity having a weak direct insolation effect yet dominating glacial cycles in the last 800 kyr","Obliquity driving 100 kyr cycles","Sea level changes of 100m"], ans:1, exp:"Eccentricity directly changes total insolation by only <0.1% yet glacial cycles show a dominant ~100 kyr period over the past 800 kyr. Huybers & Wunsch propose this apparent period arises from glacials being 80 or 120 kyr (2-3 obliquity cycles) combined."},
    {q:"Before the Mid-Pleistocene Transition (~800 ka), glacial cycles were dominated by:", opts:["100 kyr eccentricity cycles","41 kyr obliquity cycles","23 kyr precession cycles","No regular cycles"], ans:1, exp:"Before the MPT, every 41 kyr obliquity peak triggered deglaciation. After 800 ka, cooler boundary conditions meant only strong orbital combinations could melt larger ice sheets — producing longer 80–120 kyr cycles."},
    {q:"CO₂ acts as an amplifier of Milankovitch forcing primarily because:", opts:["CO₂ drives orbital changes","Colder water absorbs more CO₂ (higher solubility) and the biological pump strengthens, further reducing atmospheric CO₂","CO₂ changes cause ice sheet instability","Volcanic CO₂ increases during glacials"], ans:1, exp:"During glacials, colder oceans absorb more CO₂ and reduced overturning strengthens the biological pump. Atmospheric CO₂ drops further, amplifying cooling beyond what orbital forcing alone would cause."},
    {q:"NH summer insolation is the key control on glacial cycles because:", opts:["Antarctica cannot grow large ice sheets","Ice sheets grow in winter only","Precession only affects the Northern Hemisphere","Sea level only matters in the North Atlantic"], ans:0, exp:"Antarctica is ocean-surrounded and thermally isolated — it cannot grow large ice sheets that would respond to orbital forcing. Only NH ice sheets control global ice volume, and they respond to summer insolation (melt season)."}
  ],
  summary:`<h4>Overview</h4><p>Milankovitch cycles are the primary pacemaker of Quaternary glacial-interglacial oscillations, though CO₂ feedbacks amplify the initial orbital signal substantially.</p><h4>Three Cycles</h4><p><strong>Eccentricity:</strong> 100/400 kyr, orbital shape. <strong>Obliquity:</strong> 41 kyr, axial tilt (22–24.5°). <strong>Precession:</strong> 19–23 kyr, axis wobble. NH summer insolation = the critical variable.</p><h4>100 kyr Problem & MPT</h4><p>Eccentricity has weak direct effect yet dominates last 800 kyr. Huybers & Wunsch: glacials are 80 or 120 kyr (2-3 obliquity cycles). MPT ~800 ka: switch from 41 kyr to longer cycles as boundary conditions cooled.</p><h4>Exam Tips</h4><div class="tip">Know all three cycles, their periods, and their effects. The CO₂ amplification mechanism (cold ocean absorbs more CO₂ → further cooling) is key. The 100 kyr problem is a classic topic for critical evaluation questions.</div>`,
  terms:[
    {t:"Milankovitch cycles", d:"Periodic variations in Earth's orbital parameters (eccentricity, obliquity, precession) that alter the seasonal and latitudinal distribution of insolation, pacing glacial-interglacial cycles."},
    {t:"Eccentricity", d:"The shape of Earth's orbit (circular to elliptical); cycles at 100 kyr and 400 kyr. Weak direct insolation effect but modulates precession amplitude."},
    {t:"Obliquity", d:"The tilt of Earth's axis (22–24.5°); 41 kyr cycle. Controls seasonal contrast and high-latitude insolation — was the dominant glacial pacemaker before 800 ka."},
    {t:"Precession", d:"The wobble of Earth's rotational axis shifting perihelion timing; 19–23 kyr period. Controls which hemisphere gets more insolation at what season."},
    {t:"Mid-Pleistocene Transition (MPT)", d:"Shift in dominant glacial cycle period from 41 kyr to ~100 kyr between 1.2 and 0.8 Ma, driven by changing boundary conditions allowing larger ice sheets to develop."},
    {t:"100 kyr problem", d:"The puzzle that eccentricity has a weak direct insolation effect yet apparent ~100 kyr cycles dominate the last 800 kyr; Huybers & Wunsch explain this as 80+120 kyr obliquity-paced cycles combined."}
  ]
},
"2.5.1": {
  cards:[
    {q:"What are Dansgaard-Oeschger (D-O) events?", a:"Rapid climate oscillations during the last glacial period, recorded in Greenland ice cores. Characterised by a sawtooth pattern: rapid warming of ~10–15°C within decades (interstadials), followed by gradual cooling back to stadial conditions. ~25 events during the last glacial, with ~1,470-year periodicity."},
    {q:"What are Heinrich events?", a:"Episodes of massive iceberg discharge from the Laurentide Ice Sheet into the N. Atlantic. Heinrich (1988) found 6 peaks of ice-rafted debris (IRD, H1–H6) in North Atlantic sediments, coinciding with periods of low sea surface temperature. They occur during the coldest phases of D-O cycles."},
    {q:"What was the Younger Dryas and what caused it?", a:"A ~1,000-year reversal to near-full-glacial conditions (12.9–11.6 ka), interrupting the post-glacial warming. NOT caused by Milankovitch. Caused by a meltwater pulse from the retreating Laurentide Ice Sheet into the North Atlantic, disrupting AMOC and reducing northward heat transport to Europe."},
    {q:"What is the 'salt oscillator' hypothesis for D-O cycles?", a:"Ganopolski & Rahmstorf's model: Strong AMOC → northward heat transport → melts ice → freshwater reduces salinity → weakens AMOC → freshwater input decreases → salinity increases → AMOC restarts. Creates oscillation. The forcing only triggers; events follow their own internal dynamics."},
    {q:"What is the bipolar thermal seesaw?", a:"When AMOC is 'on' (strong), North Atlantic is warm and Southern Ocean is cold (heat drawn north). When AMOC is 'off' (Heinrich event), North Atlantic cools but excess heat accumulates in South Atlantic/Antarctica — creating an anti-phase relationship between Greenland and Antarctic temperatures."},
    {q:"What triggered D-O cycles? What evidence suggests external forcing?", a:"Unknown, but the ~1,470-year periodicity is almost exactly 1,470 years — only 1% probability of being random. Possible forcing: solar cycles (de Vries/Suess cycles at ~208 years and Gleissberg cycles), lunisolar tidal cycles. But the mechanism is unproven. G&R argue once triggered, events follow internal dynamics."},
    {q:"How did Greenland ice cores (GRIP, NGRIP) revolutionise understanding of rapid climate change?", a:"3km cores drilled at Summit, Greenland revealed 25+ D-O events during the last glacial with unprecedented resolution — rapid warming in decades, cooling over centuries. Showed climate can shift dramatically in decades, not just millennia."},
    {q:"Where did the freshwater come from that disrupted AMOC during D-O events and the Younger Dryas?", a:"Laurentide Ice Sheet retreat (~18 ka to ~6 ka). Meltwater pulses released large volumes of freshwater into the North Atlantic. A second meltwater pulse towards the Arctic may have stopped the MOC, triggering the Younger Dryas (~12.9 ka)."}
  ],
  quiz:[
    {q:"Dansgaard-Oeschger events are characterised by:", opts:["Gradual warming over millions of years","Sawtooth rapid warming (decades) followed by gradual cooling, ~1,470 year period during the last glacial","Orbital forcing-driven 41 kyr cycles","Regular 100 kyr ice age cycles"], ans:1, exp:"D-O events show an asymmetric (sawtooth) pattern: rapid warming of ~10–15°C within decades to centuries, followed by gradual cooling back to stadial conditions, repeating ~every 1,470 years."},
    {q:"Heinrich events are characterised by:", opts:["Enhanced ocean circulation","Massive iceberg discharge from the Laurentide Ice Sheet, recorded as ice-rafted debris peaks in N. Atlantic sediments","Tropical warming","Increased volcanic activity"], ans:1, exp:"Heinrich events (H1–H6) are periods of massive iceberg discharge from the Laurentide Ice Sheet, leaving distinct layers of ice-rafted debris (IRD) in North Atlantic sediment cores."},
    {q:"The Younger Dryas (12.9–11.6 ka) was caused by:", opts:["A Milankovitch orbital minimum","A meltwater pulse from the Laurentide Ice Sheet that disrupted AMOC","A large volcanic eruption","Solar minimum"], ans:1, exp:"The Younger Dryas was caused by a massive freshwater pulse from the retreating Laurentide Ice Sheet into the North Atlantic, disrupting AMOC and cutting off northward heat transport to Europe."},
    {q:"The bipolar thermal seesaw means:", opts:["Both poles warm simultaneously","When North Atlantic is cold (AMOC off), Antarctica warms anti-phase because heat accumulates in the South Atlantic","Both poles are always the same temperature","Southern Ocean drives Northern Hemisphere climate"], ans:1, exp:"When AMOC is off (e.g. during Heinrich events), heat is not drawn northward — it accumulates in the South Atlantic, warming Antarctica. This anti-phase relationship is called the bipolar seesaw."},
    {q:"The 'salt oscillator' (Ganopolski & Rahmstorf) explains D-O events as:", opts:["Solar-driven oscillations","An internal AMOC oscillation driven by freshwater-salinity feedbacks, triggered by small external forcing","Orbital forcing cycles","Random variability with no mechanism"], ans:1, exp:"The salt oscillator: AMOC on → heat transport → melt → freshwater → AMOC weakens → less freshwater → salinity rises → AMOC restarts. D-O events are the output of this self-sustaining oscillation once triggered."}
  ],
  summary:`<h4>Overview</h4><p>During the last glacial period (~115–11.7 ka), climate was highly unstable — far more variable than the Holocene. Rapid shifts linked to AMOC changes caused dramatic temperature changes in decades.</p><h4>D-O Events</h4><p>Sawtooth oscillations: rapid warming (~10–15°C in decades) then slow cooling. ~1,470-year period. 25 events. Driven by AMOC 'salt oscillator' (Ganopolski & Rahmstorf). Bipolar seesaw: NH and SH anti-phase.</p><h4>Heinrich Events & Younger Dryas</h4><p>Heinrich events: iceberg surges from Laurentide Ice Sheet → IRD in sediments → AMOC disruption. Younger Dryas (12.9–11.6 ka): meltwater pulse → AMOC off → 1,000-year cold reversal. NOT Milankovitch.</p><h4>Exam Tips</h4><div class="tip">Distinguish D-O events (internal oscillation), Heinrich events (ice surges), and the Younger Dryas (meltwater event). The Dokken et al. 2013 schematic of stadial vs interstadial ocean structure is highly illustrative.</div>`,
  terms:[
    {t:"Dansgaard-Oeschger (D-O) events", d:"Rapid climate oscillations during the last glacial: rapid warming (decades) followed by gradual cooling, repeating ~1,470 years. Driven by AMOC salt oscillator."},
    {t:"Heinrich events", d:"Periods of massive iceberg discharge from the Laurentide Ice Sheet into the N. Atlantic, recorded as ice-rafted debris (IRD) layers (H1–H6); cause AMOC weakening."},
    {t:"Younger Dryas", d:"A ~1,000-year return to near-glacial conditions (12.9–11.6 ka) caused by meltwater disruption of AMOC. NOT Milankovitch-driven."},
    {t:"Bipolar seesaw", d:"Anti-phase temperature relationship between North Atlantic and Antarctica: when AMOC is off, N. Atlantic cools but heat accumulates in S. Atlantic, warming Antarctica."},
    {t:"Ice-rafted debris (IRD)", d:"Rock fragments and sediment dropped from melting icebergs onto the seafloor; IRD peaks in N. Atlantic sediments mark Heinrich events."},
    {t:"Salt oscillator", d:"G&R hypothesis: AMOC switches on/off due to self-sustaining freshwater-salinity feedbacks; the mechanism for D-O event cyclicity."}
  ]
},
"2.6.1": {
  cards:[
    {q:"What is the thermohaline circulation (THC)?", a:"Ocean circulation driven by density differences caused by temperature (thermo) and salinity (haline) variations. Warm, salty, dense water sinks in specific locations (North Atlantic, around Antarctica) and flows along the seafloor, returning as upwelling — the global 'conveyor belt'. Also called the MOC or AMOC for the Atlantic component."},
    {q:"What is the difference between THC, MOC and AMOC?", a:"THC = general term for density-driven ocean circulation. MOC (Meridional Overturning Circulation) = sinking of water in the Atlantic Arctic driving the Atlantic conveyor. AMOC = specifically the Atlantic component. The global circulation takes hundreds to thousands of years."},
    {q:"Describe the stadial vs interstadial ocean configuration (Dokken et al. 2013).", a:"Stadial: cold air, sea ice forms, halocline (cold fresh surface layer) with warm subsurface Atlantic water trapped below. Gradual subsurface warming. Interstadial: sudden decrease in sea ice → warm Atlantic water reaches surface → massive heat release to atmosphere → rapid Arctic warming."},
    {q:"What does Ganopolski & Rahmstorf (2001) show about D-O event dynamics?", a:"'The shape of D-O events does not depend on the imposed forcing cycle. The forcing only acts as a trigger; once an event is set off it follows its own internal dynamics.' Models reproduce bipolar thermal seesaw and 1,470-year cyclicity."},
    {q:"What are the three climate states identified in glacial models?", a:"Warm (>2.7 Ma): no NH ice growth. Intermediate (2.7–0.9 Ma): some insolation minima cross threshold, some glaciation. Cold (<0.9 Ma): even insolation maxima often below threshold — large ice sheets persist through multiple orbital cycles."},
    {q:"How does the 8.2 ka event relate to AMOC and the Holocene?", a:"At ~8,200 years ago, sudden drainage of proglacial Lake Agassiz released a large freshwater pulse into the North Atlantic. This disrupted AMOC briefly, causing a cold event of ~1–5°C lasting ~300 years. Weaker than the Younger Dryas but the same mechanism."},
    {q:"What is the Holocene's significance for AMOC stability?", a:"G&R modelling shows that under Holocene (interglacial) conditions, AMOC requires a LARGE change to affect its strength — more stable than during glacial conditions. This explains why D-O oscillations occurred during the glacial but not the Holocene."},
    {q:"What evidence exists for potential future AMOC weakening?", a:"Freshwater input from accelerating Greenland ice sheet melt could reduce North Atlantic deep-water formation. Palaeoclimate evidence shows AMOC has collapsed before (Younger Dryas). Some observational data suggest weakening since the mid-20th century, though this remains debated."}
  ],
  quiz:[
    {q:"According to Ganopolski & Rahmstorf (2001), D-O events:", opts:["Are driven entirely by solar forcing","Are triggered by external forcing but follow their own internal dynamics","Depend strongly on the periodicity of the forcing","Are driven by orbital precession"], ans:1, exp:"G&R 2001: 'The forcing only acts as a trigger; once an event is set off it follows its own internal dynamics.' The shape and duration are determined by internal AMOC feedbacks, not the forcing cycle."},
    {q:"In stadial conditions (Dokken et al. 2013), sub-surface ocean heat is:", opts:["Released to atmosphere immediately","Trapped below a halocline of cold fresh water while gradual subsurface warming occurs","Fully dissipated","Transported to Antarctica"], ans:1, exp:"During stadials, sea ice formation and cold fresh meltwater create a halocline that insulates warm sub-surface Atlantic water from the atmosphere. This warm water gradually heats the sub-surface until the transition to interstadial."},
    {q:"The 8.2 ka event was caused by:", opts:["A volcanic eruption","Drainage of proglacial Lake Agassiz releasing freshwater into the North Atlantic, briefly disrupting AMOC","A solar minimum","Milankovitch forcing"], ans:1, exp:"Sudden drainage of Lake Agassiz (~8,200 years ago) released a massive freshwater pulse into the N. Atlantic, temporarily disrupting AMOC and causing a ~1–5°C cold event lasting ~300 years."},
    {q:"D-O oscillations occurred during the glacial but NOT during the Holocene because:", opts:["Greenhouse gases were different","Holocene AMOC is more stable and requires a much larger perturbation to shift","Ice sheets were absent","Solar activity was different"], ans:1, exp:"G&R modelling shows that interglacial (Holocene) conditions make AMOC more stable — it requires a much larger freshwater perturbation to disrupt than during the glacial, when AMOC was in a more sensitive bistable regime."},
    {q:"AMOC transports heat by:", opts:["Mixing cold and warm water equally","Carrying warm salty surface water northward (Gulf Stream) and returning cold deep water southward","Driving wind patterns","Changing cloud cover"], ans:1, exp:"AMOC carries warm salty surface water northward in the Gulf Stream, releasing heat to the atmosphere over the N. Atlantic and Europe. Cold dense water sinks (forming NADW) and returns southward as a deep western boundary current."}
  ],
  summary:`<h4>Overview</h4><p>Climate instability arises from threshold behaviour in the ocean circulation — particularly AMOC. Small triggers can cause large, rapid climate shifts when the system is in a sensitive state.</p><h4>AMOC Mechanism</h4><p>THC driven by T and salinity. AMOC: warm surface flow north (Gulf Stream) → sinks as NADW → returns south as deep current. Global circuit: hundreds to thousands of years.</p><h4>Stadial-Interstadial (Dokken 2013)</h4><p>Stadial: halocline traps warm subsurface water. Gradual warming. Interstadial: sea ice decreases → warm water reaches surface → rapid atmospheric warming. G&R: forcing triggers; events follow internal dynamics.</p><h4>Exam Tips</h4><div class="tip">The G&R quote about internal dynamics is examinable. Know the stadial/interstadial ocean structure from Dokken 2013. The 8.2 ka event = weaker Younger Dryas via same Lake Agassiz mechanism.</div>`,
  terms:[
    {t:"Thermohaline circulation (THC)", d:"Density-driven ocean circulation caused by temperature (thermo) and salinity (haline) differences; the global oceanic 'conveyor belt' operating on 100–1,000-year timescales."},
    {t:"Halocline", d:"A layer of sharp salinity (and density) increase with depth; during stadial conditions, cold fresh surface water forms a halocline insulating warm sub-surface Atlantic water."},
    {t:"Interstadial", d:"Warm phase within a glacial period associated with strong AMOC, northward heat transport and reduced sea ice; transitions from stadials are rapid (decades)."},
    {t:"Stadial", d:"Cold phase within a glacial period with weak AMOC, cold surface North Atlantic, extensive sea ice; transitions to stadials are gradual."},
    {t:"8.2 ka event", d:"An abrupt cold event ~8,200 years ago caused by Lake Agassiz drainage into the N. Atlantic, briefly disrupting AMOC; lasted ~300 years with ~1–5°C cooling."},
    {t:"Bistability", d:"The property of a system (like AMOC) that can exist in two stable states (e.g. 'on' and 'off'); small perturbations can trigger irreversible transitions when boundary conditions are marginal."}
  ]
},
"2.7.1": {
  cards:[
    {q:"When did the Holocene begin and what defines it?", a:"~11,700 years ago, after the end of the last glacial period (Younger Dryas). Defined by: no continental ice sheets in the Northern Hemisphere, high sea levels, widespread forest expansion, and relatively warm stable climate. Contains nearly all of recorded human history."},
    {q:"By how much did sea level rise during deglaciation and what were the consequences?", a:"Sea level rose ~120 metres as Northern Hemisphere ice sheets (Laurentide, Fenno-Scandinavian) melted. Coastlines shifted dramatically — the UK was connected to mainland Europe until ~8,000 years ago (Doggerland), when rising seas severed it."},
    {q:"What is the Holocene Climatic Optimum?", a:"A period ~6,000–7,000 years ago when Northern Hemisphere temperatures reached their Holocene maximum, particularly at high latitudes. Driven by maximum Northern Hemisphere summer insolation (orbital forcing: obliquity peak). Followed by a long-term cooling trend."},
    {q:"What was the Medieval Warm Period and how does it compare to current warming?", a:"Roughly 950–1250 CE, relatively warm in parts of the N. Atlantic. NOT globally uniform. Tree-ring reconstructions show recent warming exceeds Medieval Warm Period temperatures — current warming is both faster and more globally coherent."},
    {q:"What was the Little Ice Age and what caused it?", a:"Roughly 1400–1700 CE, cooler and more spatially coherent than the Medieval Warm Period. Driven by: volcanic eruptions (sulfate aerosols → cooling), solar minima (Maunder Minimum ~1645–1715 CE), possibly early changes in ocean circulation. More globally synchronous than the Medieval Warm Period."},
    {q:"What is the Early Anthropocene Hypothesis?", a:"Ruddiman's hypothesis that human influence began ~5,000–6,000 years ago through deforestation, rice agriculture, and livestock. CO₂ and CH₄ deviate from expected natural declines in the mid-Holocene — possibly due to early agricultural emissions that delayed onset of the next ice age."},
    {q:"What are the main drivers of Holocene climate variability?", a:"1) Orbital forcing (decreasing NH summer insolation → long-term cooling after 6 ka). 2) Volcanic eruptions (brief cooling from aerosols). 3) Solar irradiance changes (Maunder Minimum etc., ~0.1% variation). 4) CO₂ (dominant in recent centuries)."},
    {q:"How does the Holocene compare to the last glacial in terms of climate variability?", a:"Holocene is exceptionally stable: temperature variations limited to ~1–2°C over millennia. Last glacial had rapid D-O shifts of ~10–15°C in decades. Holocene stability enabled development of agriculture, settlements, and complex civilisations."}
  ],
  quiz:[
    {q:"The Holocene began approximately:", opts:["100,000 years ago","25,000 years ago","11,700 years ago","5,000 years ago"], ans:2, exp:"The Holocene began ~11,700 years ago, marking the end of the Younger Dryas cold event and the beginning of the current warm interglacial period."},
    {q:"Sea level during deglaciation rose by approximately:", opts:["10 metres","40 metres","120 metres","500 metres"], ans:2, exp:"The melting of large NH ice sheets (Laurentide, Fenno-Scandinavian) caused sea level to rise ~120 metres, flooding vast coastal areas including Doggerland (connecting UK to Europe)."},
    {q:"The Little Ice Age was more spatially coherent than the Medieval Warm Period because:", opts:["It was driven by the same volcanic forcing everywhere","Multiple drivers (volcanoes, solar minimum) acted globally rather than regionally","It lasted longer","It coincided with an orbital minimum"], ans:1, exp:"The Little Ice Age (~1400–1700 CE) was driven by combinations of volcanic forcing and solar minima that operated globally, making it more spatially coherent than the regional Medieval Warm Period."},
    {q:"Long-term Holocene cooling after 6,000 years ago is primarily driven by:", opts:["Declining CO₂","Decreasing Northern Hemisphere summer insolation due to orbital forcing","Increasing volcanic activity","AMOC weakening"], ans:1, exp:"After the Holocene Climatic Optimum (~6 ka), decreasing NH summer insolation (driven by orbital changes — decreasing obliquity and changing precession) caused the long-term cooling trend seen in proxy records."},
    {q:"The Early Anthropocene Hypothesis (Ruddiman) proposes:", opts:["Industrial CO₂ emissions began before 1750","Human agricultural activities beginning ~5,000–6,000 years ago may have altered CO₂ and CH₄, delaying the next ice age","The Holocene is entirely natural","CO₂ changes in the Holocene were negligible"], ans:1, exp:"Ruddiman argues that CO₂ and CH₄ deviate from expected natural Holocene declines from ~5,000–6,000 years ago due to deforestation, rice agriculture and livestock — potentially delaying glaciation."}
  ],
  summary:`<h4>Overview</h4><p>The Holocene is an unusually stable interglacial that enabled human civilisation. However, it contains significant climate variability driven by orbital, volcanic, solar and anthropogenic forcing.</p><h4>Key Events</h4><p>Deglaciation: +120m sea level. 8.2 ka event (Lake Agassiz, AMOC). Holocene Optimum: ~6–7 ka (NH summer insolation maximum). Medieval Warm Period: 950–1250 CE (regional). Little Ice Age: 1400–1700 CE (volcanic + solar).</p><h4>Long-Term Trend</h4><p>Orbital forcing drives gradual cooling after 6 ka. Solar variability (~0.1%) limited effect. Volcanic forcing: brief (years) but intense. Early Anthropocene (Ruddiman): ~5–6 ka human impact? Industrial CO₂: dominant from ~1750.</p><h4>Exam Tips</h4><div class="tip">Always compare the Holocene Optimum (natural, ~6 ka, orbital-driven) with the modern warming (anthropogenic, starting ~1750, unprecedented in rate). Recent warming exceeds Medieval Warm Period — know the evidence (tree rings).</div>`,
  terms:[
    {t:"Holocene", d:"The current geological epoch beginning ~11,700 years ago; characterised by relatively warm, stable climate and containing nearly all of human civilisation."},

    {t:"Little Ice Age", d:"Period ~1400–1700 CE of globally coherent cooling driven by volcanic aerosols and solar minima (Maunder Minimum); more spatially coherent than the Medieval Warm Period."},

    {t:"Early Anthropocene Hypothesis", d:"Ruddiman's proposal that deforestation and agriculture ~5–6 ka caused CO₂ and CH₄ to deviate from expected natural declines, potentially delaying glaciation."},

"2.8.1": {
  cards:[
    {q:"What is the difference between fossil fuel 'reserves' and 'resources'?", a:"Reserves: subset recoverable under CURRENT economic conditions with defined probability. Resources: ALL remaining recoverable with current AND future technology, irrespective of economics. Resources >> reserves."},
    {q:"What would burning all remaining fossil fuel reserves do to atmospheric CO₂?", a:"Burning all reserves (as of 2011) = ~791 PgC → ~400 ppm additional CO₂. With 2011 levels at ~390 ppm, total would be ~790 ppm. Approximately two-thirds of remaining reserves should not be burned to stay within 2°C."},
    {q:"What would burning ALL fossil fuel resources cause?", a:"Would release ~10,000 PgC, causing ~20 W/m² radiative forcing, ~15–20°C global warming. Earth would become largely uninhabitable — agriculture would collapse and most of Earth's surface would be at lethally high temperatures."},
    {q:"What is fast-feedback climate sensitivity vs. Earth system sensitivity?", a:"Fast-feedback: ~3°C per CO₂ doubling — includes water vapour, cloud, sea ice responses (fast-acting). Earth system sensitivity: higher, includes slow feedbacks (ice sheet melt, vegetation changes, carbon cycle changes) on millennial timescales."},
    {q:"How can palaeoclimate be used to infer climate sensitivity?", a:"Past climates provide CO₂ and temperature data pairs. For example, LGM→Holocene warming (~4.5°C) linked to GHG forcing gives fast-feedback sensitivity ~0.75°C per W/m² (~3°C per CO₂ doubling). Independent of climate model assumptions."},
    {q:"What do Pliocene conditions tell us about long-term consequences of 400 ppm CO₂?", a:"Pliocene (~3–5 Ma): CO₂ ~400 ppm (similar to today), temperatures 2–3.5°C warmer, sea level +15 to +25m. This suggests that current CO₂ levels will eventually produce several degrees of warming and significant sea level rise — even if it takes centuries."},

    {q:"Fast-feedback climate sensitivity is approximately:", opts:["0.3°C per CO₂ doubling","1.1°C (Planck only)","~3°C per CO₂ doubling","~10°C per CO₂ doubling"], ans:2, exp:"Fast-feedback climate sensitivity is ~3°C (±1°C) per CO₂ doubling — derived from palaeoclimate records (LGM to Holocene) and consistent with model estimates."},

    {q:"During the Pliocene (~3–5 Ma) with CO₂ ~400 ppm, sea level was approximately:", opts:["Same as today","10cm higher","15–25 metres higher","200 metres higher"], ans:2, exp:"Pliocene CO₂ of ~400 ppm (similar to today) was associated with temperatures 2–3.5°C warmer and sea level 15–25 metres higher — indicating long-term equilibrium consequences of current CO₂."},

  ],
  summary:`<h4>Overview</h4><p>Anthropogenic GHG emissions are unprecedented in rate and, if all fossil fuels are burned, would produce catastrophic warming well beyond anything in the Cenozoic interglacial period.</p><h4>Carbon Budget</h4><p>Reserves vs resources. Burning all reserves = +~400 ppm. To stay within 2°C: ~2/3 of reserves must stay unburned. Already emitted ~440 PgC (~180 ppm). Burning all resources = +15–20°C.</p><h4>Palaeoclimate Evidence for Sensitivity</h4><p>Fast feedback S ~3°C/CO₂ doubling (LGM→Holocene empirical). Earth system S higher. Pliocene: 400 ppm → +3°C, +15–25m sea level. Eocene: 1400 ppm → +13°C, no ice.</p><h4>Exam Tips</h4><div class="tip">The Pliocene analogue is critical: today's CO₂ (~420+ ppm) mirrors Pliocene levels, and Pliocene sea levels were 15–25m higher — demonstrating the committed warming already baked in.</div>`,

    {q:"What happened during the 4.2 ka event and what civilisations were affected?", a:"~4,200 years ago: widespread aridity likely caused by disruptions in ocean circulation and monsoon systems. Associated with collapse/transformation of the Akkadian Empire, Ancient Egypt (First Intermediate Period), and Indus Valley civilisation — reduced agricultural output, urban abandonment, social reorganisation."},

  summary:`<h4>Overview</h4><p>Climate variability has repeatedly intersected with societal vulnerabilities throughout history. However, climate is a contributing factor, not a sole determinant, of societal outcomes.</p><h4>Key Case Studies</h4><p><strong>4.2 ka event:</strong> arid period → Akkadian, Egyptian, Indus Valley stress. <strong>Maya collapse:</strong> 40–54% rainfall reduction + warfare + deforestation. <strong>Norse Greenland:</strong> Little Ice Age + economic isolation. <strong>Late Antique LIA:</strong> 536–547 CE eruptions → Justinian plague, Roman decline.</p><h4>Methodological Caution</h4><p>Causation is hard to establish. Same climate event → different outcomes in different societies. Human agency, governance, equity determine resilience. Climate determines context; history determines outcome.</p><h4>Exam Tips</h4><div class="tip">The Maya case is the best-documented — know the four proxy types (speleothems, lake sediments, Cariaco Basin, tree rings) and the precipitation estimates (40–54%). Always add the caveat that climate acted alongside non-climatic factors.</div>`,

// ── STATE ─────────────────────────────────────────────────────────────────────
let currentModule = null;
let TOPICS = [];
let DATA = {};
let curTopic = '', fcIdx = 0, fcFlipped = false;
let qzQs = [], qzIdx = 0, qzScore = 0;

// ── MODULE SELECTION ──────────────────────────────────────────────────────────
function chooseModule(mod) {
  currentModule = mod;
  const m = MODULES[mod];
  TOPICS = m.TOPICS;
  DATA = m.DATA;

  // Set accent colours via CSS variables
  document.documentElement.style.setProperty('--acc', m.accent);
  document.documentElement.style.setProperty('--acc-lt', m.accentLt);
  document.documentElement.style.setProperty('--acc-dk', m.accentDk);

  // Update bar
  document.getElementById('bar-title').textContent = m.icon + ' ' + m.name + ' Revision';
  document.getElementById('bar-sub').textContent = m.barSub;
  document.getElementById('main-bar').style.background = m.accent;

  // Update countdown
  document.getElementById('exam-dt').textContent = m.examLabel;
  document.getElementById('home-cd').style.background = m.accent;
  calcDays();

  // Show app, hide module select
  document.getElementById('module-select').style.display = 'none';
  document.getElementById('main-app').style.display = 'block';

  // Reset all pickers and sessions
  resetApp();
  buildGrids();
  buildTimetable();
}

function goHome() {
  document.getElementById('main-app').style.display = 'none';
  document.getElementById('module-select').style.display = 'flex';
  // Reset tab state
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('on', i===0));
  document.querySelectorAll('.scr').forEach((s,i) => s.classList.toggle('on', s.id==='s-home'));
}

function resetApp() {
  // Reset all sessions to pick state
  ['fc','qz','sm','tr'].forEach(m => bk(m));
  document.getElementById('all-body').innerHTML = '';
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('on', i===0));
  document.querySelectorAll('.scr').forEach(s => s.classList.toggle('on', s.id==='s-home'));
  curTopic = ''; fcIdx = 0; fcFlipped = false;
  qzQs = []; qzIdx = 0; qzScore = 0;
}

// ── COUNTDOWN ─────────────────────────────────────────────────────────────────
const MENACING_MSGS = [
  ["The exam is watching you.", "It has always been watching."],
  ["Your lecturer is sharpening their red pen.", "Sleep well."],
  ["Every minute you waste, it gets closer.", "It does not sleep."],
  ["The exam does not care about your feelings.", "Nor does the mark scheme."],
  ["You thought you had more time.", "You were wrong."],
  ["The exam has been ready since day one.", "Have you?"],
  ["It lurks. It waits. It marks.", "Mostly it marks."],
  ["Somewhere, a mark scheme exists.", "It is not on your side."],
  ["The clock is not your friend.", "Neither is procrastination."],
  ["Tick. Tock.", "That is the sound of your grade deciding its fate."],
  ["The exam has no mercy.", "It has a rubric though."],
  ["Days are numbered.", "So are the marks you might lose."],
  ["You can run. You cannot hide.", "Also the exam is on Thursday."],
  ["The invigilator will say begin.", "Will you be ready?"],
  ["Carbon cycling does not care about your Netflix queue.", "Neither does the exam."]
];

function calcDays() {
  if (!currentModule) return;
  const examDate = new Date(MODULES[currentModule].examDate);
  const now = new Date();
  const diffMs = examDate - now;
  
  const msgEl = document.getElementById('menace-msg');
  const timeEl = document.getElementById('menace-time');
  if (!msgEl || !timeEl) return;

  if (diffMs <= 0) {
    msgEl.textContent = "It is here.";
    timeEl.textContent = "Good luck. You have got this. 🌿";
    return;
  }

  const days = Math.floor(diffMs / 86400000);
  const hours = Math.floor((diffMs % 86400000) / 3600000);
  const mins = Math.floor((diffMs % 3600000) / 60000);
  const secs = Math.floor((diffMs % 60000) / 1000);

  // Pick message based on days remaining
  const idx = Math.min(Math.floor((14 - Math.min(days, 14)) / 1), MENACING_MSGS.length - 1);
  const pair = MENACING_MSGS[Math.max(0, idx)];

  if (days > 1) {
    msgEl.innerHTML = pair[0] + '<br><span style="font-size:16px;opacity:0.85">' + pair[1] + '</span>';
    timeEl.textContent = days + 'd ' + hours + 'h ' + mins + 'm ' + secs + 's remaining.';
  } else if (days === 1) {
    msgEl.innerHTML = 'Tomorrow.<br><span style="font-size:16px;opacity:0.85">It is literally tomorrow.</span>';
    timeEl.textContent = hours + 'h ' + mins + 'm ' + secs + 's remaining.';
  } else {
    msgEl.innerHTML = 'TODAY.<br><span style="font-size:16px;opacity:0.85">No more time. Only exam.</span>';
    timeEl.textContent = hours + 'h ' + mins + 'm ' + secs + 's remaining.';
  }
}

// Tick every second
setInterval(() => { if (currentModule) calcDays(); }, 1000);

// ── GRIDS ─────────────────────────────────────────────────────────────────────
function buildGrids() {

// ── FLASHCARDS ────────────────────────────────────────────────────────────────
function fcStart(id) {
  curTopic = id;
  document.getElementById('fc-pick').style.display = 'none';
  document.getElementById('fc-sess').style.display = '';
  if (id === 'ALL') {
    const all = TOPICS.flatMap(t => DATA[t.id] ? DATA[t.id].cards.map(c => ({...c, _topic: t.id, _topicName: t.name})) : []);
    DATA['ALL'] = { _shuffled: all.sort(() => Math.random() - 0.5) };
  } else {
    DATA[id]._shuffled = [...DATA[id].cards].sort(() => Math.random() - 0.5);
  }
  fcIdx = 0;
  renderFC();
}

function renderFC() {
  fcFlipped = false;
  const cards = DATA[curTopic]._shuffled || DATA[curTopic].cards;
  const c = cards[fcIdx];
  const pct = Math.round(fcIdx / cards.length * 100);
  document.getElementById('fc-pl').textContent = 'Card ' + (fcIdx+1) + ' of ' + cards.length;
  document.getElementById('fc-pf').style.width = pct + '%';
  const _tag = c._topic ? `<div class="fc-topic-tag">${c._topic} · ${c._topicName}</div>` : '';
  document.getElementById('fc-body').innerHTML = `
    <div class="fc" onclick="fcFlip()">
      ${_tag}
      <div class="fcl q">Question</div>
      <div class="fcq">${c.q}</div>
      <div class="fch">Tap or press Space to reveal</div>
    </div>`;
  document.getElementById('fc-flip').textContent = 'Reveal answer';
  document.getElementById('fc-flip').style.display = '';
  document.getElementById('fc-nxt').style.display = 'none';
}

function fcFlip() {
  if (fcFlipped) return;
  fcFlipped = true;
  const cards = DATA[curTopic]._shuffled || DATA[curTopic].cards;
  const c = cards[fcIdx];
  const _tagA = c._topic ? `<div class="fc-topic-tag">${c._topic} · ${c._topicName}</div>` : '';
  document.getElementById('fc-body').innerHTML = `
    <div class="fc">
      ${_tagA}
      <div class="fcl a">Answer</div>
      <div class="fcq">${c.q}</div>
      <div class="fca">${c.a}</div>
    </div>`;
  document.getElementById('fc-flip').style.display = 'none';
  document.getElementById('fc-nxt').style.display = '';
  document.getElementById('fc-nxt').textContent = fcIdx < cards.length - 1 ? 'Next →' : 'Finish';
}

function fcNext() {
  const cards = DATA[curTopic]._shuffled || DATA[curTopic].cards;
  if (fcIdx < cards.length - 1) { fcIdx++; renderFC(); }
  else {
    document.getElementById('fc-body').innerHTML =
      '<div class="card" style="text-align:center;padding:28px 16px">' +
      '<div style="font-size:40px;margin-bottom:12px">🎉</div>' +
      '<div style="font-weight:700;font-size:17px;margin-bottom:6px">All done!</div>' +
      '<div style="font-size:13px;color:var(--muted)">Reviewed all ' + cards.length + ' cards</div>' +
      '</div>';
    document.getElementById('fc-flip').style.display = 'none';
    document.getElementById('fc-nxt').style.display = 'none';
  }
}

// ── QUIZ ──────────────────────────────────────────────────────────────────────
function qzStart(id) {
  curTopic = id; qzIdx = 0; qzScore = 0;
  if (id === 'ALL') {
    const all = TOPICS.flatMap(t => DATA[t.id] ? DATA[t.id].quiz : []);
    qzQs = all.sort(() => Math.random() - 0.5);
  } else {
    qzQs = [...DATA[id].quiz].sort(() => Math.random() - 0.5);
  }
  document.getElementById('qz-pick').style.display = 'none';
  document.getElementById('qz-res').style.display = 'none';
  document.getElementById('qz-sess').style.display = '';
  renderQz();
}

function renderQz() {
  const q = qzQs[qzIdx];
  const pct = Math.round(qzIdx / qzQs.length * 100);
  document.getElementById('qz-pl').textContent = 'Q ' + (qzIdx+1) + ' of ' + qzQs.length;
  document.getElementById('qz-pf').style.width = pct + '%';
  document.getElementById('qz-body').innerHTML =
    '<div class="card">' +
    '<div class="qq">' + q.q + '</div>' +
    '<div class="opts">' + q.opts.map((o,i) => '<button class="opt" onclick="qzAns(' + i + ')">' + o + '</button>').join('') + '</div>' +
    '<div id="qz-fb" style="display:none"></div>' +
    '</div>';
}

function qzAns(chosen) {
  const q = qzQs[qzIdx];
  document.querySelectorAll('.opt').forEach(o => o.disabled = true);
  const ok = chosen === q.ans;
  if (ok) qzScore++;
  document.querySelectorAll('.opt')[q.ans].classList.add('ok');
  if (!ok) document.querySelectorAll('.opt')[chosen].classList.add('bad');
  const fb = document.getElementById('qz-fb');
  fb.style.display = 'block';
  fb.className = 'fb ' + (ok ? 'ok' : 'bad');
  fb.textContent = (ok ? '✓ Correct! ' : '✗ Incorrect. ') + q.exp;
  setTimeout(() => { qzIdx++; qzIdx < qzQs.length ? renderQz() : showRes(); }, 2300);
}

function showRes() {
  document.getElementById('qz-sess').style.display = 'none';
  document.getElementById('qz-res').style.display = '';
  const pct = Math.round(qzScore / qzQs.length * 100);
  const sc = document.getElementById('sc');
  const n = document.getElementById('sc-n');
  if (pct >= 80) { sc.style.background = 'var(--acc-lt)'; n.style.color = 'var(--acc)'; }
  else if (pct >= 60) { sc.style.background = 'var(--amber-lt)'; n.style.color = '#D97706'; }
  else { sc.style.background = 'var(--red-lt)'; n.style.color = '#DC2626'; }
  n.textContent = qzScore + '/' + qzQs.length;
  document.getElementById('sc-msg').textContent = ['Keep at it! 📚','Getting there! 💪','Good effort! 👍','Well done! ⭐','Excellent! 🏆'][Math.min(4,Math.floor(pct/20))];
}

function qzRetry() {
  qzIdx = 0; qzScore = 0;
  if (curTopic === 'ALL') {
    const all = TOPICS.flatMap(t => DATA[t.id] ? DATA[t.id].quiz : []);
    qzQs = all.sort(() => Math.random() - 0.5);
  } else {
    qzQs = [...DATA[curTopic].quiz].sort(() => Math.random() - 0.5);
  }
  document.getElementById('qz-res').style.display = 'none';
  document.getElementById('qz-sess').style.display = '';
  renderQz();
}

// ── CUSTOM MIX ───────────────────────────────────────────────────────────────
let mixSelected = new Set();

function showMixPicker() {
  document.getElementById('fc-pick').style.display = 'none';
  document.getElementById('fc-mix').style.display = '';
  // Build mix grid if not already built, or rebuild for current module
  buildMixGrid();
}

function hideMixPicker() {
  document.getElementById('fc-mix').style.display = 'none';
  document.getElementById('fc-pick').style.display = '';
  mixSelected.clear();
}

function buildMixGrid() {
  mixSelected.clear();
  const g = document.getElementById('mix-grid');
  g.innerHTML = '<div class="grid">' + TOPICS.map(t => `
    <button class="mix-topic" id="mix-${t.id}" onclick="toggleMix('${t.id}')">
      <div class="mt-check">☐</div>
      <div class="mt-num">${t.id}</div>
      <div class="mt-name">${t.name}</div>
    </button>`).join('') + '</div>';
  updateMixBtn();
}

function toggleMix(id) {
  const btn = document.getElementById('mix-' + id);
  if (mixSelected.has(id)) {
    mixSelected.delete(id);
    btn.classList.remove('selected');
    btn.querySelector('.mt-check').textContent = '☐';
  } else {
    mixSelected.add(id);
    btn.classList.add('selected');
    btn.querySelector('.mt-check').textContent = '☑';
  }
  updateMixBtn();
}

function mixSelectAll() {
  TOPICS.forEach(t => {
    mixSelected.add(t.id);
    const btn = document.getElementById('mix-' + t.id);
    if (btn) { btn.classList.add('selected'); btn.querySelector('.mt-check').textContent = '☑'; }
  });
  updateMixBtn();
}

function mixSelectNone() {
  TOPICS.forEach(t => {
    mixSelected.delete(t.id);
    const btn = document.getElementById('mix-' + t.id);
    if (btn) { btn.classList.remove('selected'); btn.querySelector('.mt-check').textContent = '☐'; }
  });
  updateMixBtn();
}

function updateMixBtn() {
  const btn = document.getElementById('mix-start-btn');
  const n = mixSelected.size;
  btn.textContent = n === 0 ? '🎛️ Select at least one topic' : `🔀 Start Mix (${n} topic${n > 1 ? 's' : ''}, ${countMixCards()} cards)`;
  btn.disabled = n === 0;
  btn.style.opacity = n === 0 ? '0.5' : '1';
}

function countMixCards() {
  return [...mixSelected].reduce((sum, id) => sum + (DATA[id] ? DATA[id].cards.length : 0), 0);
}

function startMix() {
  if (mixSelected.size === 0) return;
  document.getElementById('fc-mix').style.display = 'none';
  document.getElementById('fc-sess').style.display = '';
  const all = [...mixSelected].flatMap(id => {
    const t = TOPICS.find(t => t.id === id);
    return DATA[id] ? DATA[id].cards.map(c => ({...c, _topic: id, _topicName: t ? t.name : id})) : [];
  });
  curTopic = 'MIX';
  DATA['MIX'] = { _shuffled: all.sort(() => Math.random() - 0.5) };
  fcIdx = 0;
  renderFC();
}

// ── TIMETABLE RENDERING ───────────────────────────────────────────────────────
function ttItem(start, end, type, title, tab, desc, isNow, isNext) {
  const typeIcon = {revision:'📖', break:'☕', meal:'🍽️', free:'🎉', exam:'🎓', rest:'😴'};
  const goLabel = {fc:'→ Flashcards', qz:'→ Quiz', sm:'→ Summary', tr:'→ Key Terms', all:'→ All Summaries'};
  const clickable = tab && tab !== 'null';
  const cl = 'tt-item ' + type + (clickable ? ' clickable' : '');
  const onclick = clickable ? ' onclick="jumpToTab(\'' + tab + '\')"' : '';
  const timeStr = isNow ? '<span class="tt-now-dot"></span>' : start;
  const label = isNow ? 'Now · ' + desc : isNext ? 'Up next · ' + desc : start + '–' + end + ' · ' + desc;
  return '<div class="' + cl + '"' + onclick + '>' +
    '<div class="tt-time">' + timeStr + '</div>' +
    '<div class="tt-content">' +
    '<div class="tt-title">' + typeIcon[type] + ' ' + title + '</div>' +
    '<div class="tt-desc">' + label + '</div>' +
    (clickable ? '<div class="tt-go">' + (goLabel[tab]||'') + '</div>' : '') +
    '</div></div>';
}

function buildTimetable() {
  const mod = currentModule;
  const schedule = TIMETABLE[mod];
  if (!schedule) return;

  const now = new Date();
  const todayStr = now.toLocaleDateString('en-GB', {day:'numeric', month:'short'}).replace(/^0/, '');
  const currentMins = now.getHours() * 60 + now.getMinutes();

  // Build today section
  const todayData = schedule.find(([d]) => d === todayStr);
  const todaySection = document.getElementById('today-section');
  if (todayData) {
    const [, sessions] = todayData;
    const currentSession = sessions.find(([s, e]) => {
      const [sh, sm] = s.split(':').map(Number);
      const [eh, em] = e.split(':').map(Number);
      return currentMins >= sh*60+sm && currentMins < eh*60+em;
    });
    const nextSession = sessions.find(([s, e, type]) => {
      const [sh, sm] = s.split(':').map(Number);
      return currentMins < sh*60+sm && type !== 'break';
    });
    let todayHTML = '<div class="slbl">Today — ' + todayStr + '</div>';
    if (currentSession) {
      const [s, e, type, title, tab, desc] = currentSession;
      todayHTML += ttItem(s, e, type, title, tab, desc, true, false);
    }
    if (nextSession) {
      const [s, e, type, title, tab, desc] = nextSession;
      todayHTML += ttItem(s, e, type, title, tab, desc, false, true);
    }
    if (!currentSession && !nextSession) {
      todayHTML += '<div class="tt-item rest"><div class="tt-time">✓</div><div class="tt-content"><div class="tt-title">All done for today!</div><div class="tt-desc">Nice work. Relax.</div></div></div>';
    }
    todaySection.innerHTML = todayHTML;
  } else {
    todaySection.innerHTML = '';
  }

  // Build full schedule - skip past days
  let html = '';

  // Parse a schedule day string like "15 May" or "2 Jun" into a Date for comparison
  function parseDayStr(str) {
    return new Date(str + ' 2026');
  }

  const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());

  schedule.forEach(([day, sessions]) => {
    const dayDate = parseDayStr(day);
    if (dayDate < todayMidnight) return; // skip past days
    const isToday = day === todayStr;
    html += '<div class="tt-section">';
    html += '<div class="tt-day-hd ' + (isToday ? 'today-hd' : '') + '">' +
      (isToday ? '<span class="tt-today-badge">TODAY</span> ' : '') + day + '</div>';
    sessions.forEach(([s, e, type, title, tab, desc]) => {
      html += ttItem(s, e, type, title, tab, desc, false, false);
    });
    html += '</div>';
  });
  document.getElementById('tt-body').innerHTML = html;

  setTimeout(() => {
    const todayHd = document.querySelector('.today-hd');
    if (todayHd) todayHd.scrollIntoView({behavior:'smooth', block:'start'});
  }, 150);
}

function jumpToTab(tab) {
  const map = {fc:2, qz:3, sm:4, tr:5, all:6};
  const idx = map[tab];
  if (!idx) return;
  const btn = document.querySelector('.tabs button:nth-child(' + idx + ')');
  if (btn) { goTab(tab, btn); }
  if (tab === 'all') buildAllSummaries();
}

// ── SEARCH ───────────────────────────────────────────────────────────────────
function doSearch(query) {
  const results = document.getElementById('search-results');
  const meta = document.getElementById('search-meta');
  const q = query.trim().toLowerCase();

  if (!q) {
    results.innerHTML = '<div class="search-empty">Start typing to search across all key terms in this module.</div>';
    meta.textContent = '';
    return;
  }

  // Search all terms in all topics
  const matches = [];
  TOPICS.forEach(t => {
    const d = DATA[t.id];
    if (!d || !d.terms) return;
    d.terms.forEach(term => {
      const termLower = term.t.toLowerCase();
      const defLower = term.d.toLowerCase();
      if (termLower.includes(q) || defLower.includes(q)) {
        matches.push({ term: term.t, def: term.d, topicId: t.id, topicName: t.name, topicIco: t.ico });
      }
    });
  });

  meta.textContent = matches.length === 0 ? 'No results' : matches.length + ' result' + (matches.length > 1 ? 's' : '') + ' found';

  if (matches.length === 0) {
    results.innerHTML = '<div class="search-empty">No terms found for "' + query + '".<br>Try a shorter or different search.</div>';
    return;
  }

  function highlight(text, q) {
    const idx = text.toLowerCase().indexOf(q);
    if (idx === -1) return text;
    return text.slice(0, idx) + '<span class="search-highlight">' + text.slice(idx, idx + q.length) + '</span>' + highlight(text.slice(idx + q.length), q);
  }

  results.innerHTML = matches.map(m =>
    '<div class="search-result">' +
    '<div class="search-term">' + highlight(m.term, q) + '</div>' +
    '<div class="search-def">' + highlight(m.def, q) + '</div>' +
    '<span class="search-topic">' + m.topicIco + ' ' + m.topicId + ' ' + m.topicName + '</span>' +
    '</div>'
  ).join('');
}

function initSearch() {
  const input = document.getElementById('search-input');
  if (input) { input.value = ''; doSearch(''); }
}

// ── KEYBOARD SHORTCUTS ────────────────────────────────────────────────────────
document.addEventListener('keydown', function(e) {
  const fcVisible = document.getElementById('fc-sess').style.display !== 'none';
  if (!fcVisible) return;
  if (e.code === 'Space') {
    e.preventDefault();
    if (!fcFlipped) { fcFlip(); } else { fcNext(); }
  } else if (e.code === 'ArrowRight' || e.code === 'ArrowDown') {
    e.preventDefault();
    if (fcFlipped) fcNext();
  } else if (e.code === 'ArrowLeft' || e.code === 'ArrowUp') {
    e.preventDefault();
    if (fcIdx > 0) { fcIdx--; renderFC(); }
  }
});
