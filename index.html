<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Revision App</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --green:#1D9E75;--green-lt:#E1F5EE;--green-dk:#085041;
  --blue:#1d4ed8;--blue-lt:#DBEAFE;--blue-dk:#1E3A8A;
  --red:#DC2626;--red-lt:#FEE2E2;--red-dk:#7F1D1D;
  --amber:#D97706;--amber-lt:#FEF3C7;
  --acc:#1D9E75;--acc-lt:#E1F5EE;--acc-dk:#085041;
  --bg:#f5f6f7;--card:#fff;--text:#111;--muted:#6b7280;
  --border:rgba(0,0,0,0.1);--radius:12px;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#0e1117;--card:#1a1d24;--text:#eee;--muted:#9ca3af;--border:rgba(255,255,255,0.1);--acc-lt:#04342C;--red-lt:#4A1B1B;--blue-lt:#1E3A5F;--amber-lt:#412402}
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.6}

/* ── MODULE SELECT SCREEN ── */
#module-select{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:32px 20px;text-align:center;
}
.module-logo{font-size:48px;margin-bottom:8px}
.module-title{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px}
.module-sub{font-size:14px;color:var(--muted);margin-bottom:40px}
.module-cards{display:flex;flex-direction:column;gap:14px;width:100%;max-width:380px}
.module-card{
  border-radius:16px;padding:22px 20px;text-align:left;cursor:pointer;
  border:none;font-family:inherit;color:#fff;
  display:flex;flex-direction:column;gap:4px;
  transition:transform .15s,opacity .15s;
}
.module-card:active{transform:scale(0.97);opacity:0.9}
.module-card.eco{background:linear-gradient(135deg,#085041 0%,#1D9E75 100%)}
.module-card.cli{background:linear-gradient(135deg,#1E3A8A 0%,#1d4ed8 100%)}
.module-card .mc-ico{font-size:32px;margin-bottom:6px}
.module-card .mc-name{font-size:19px;font-weight:700}
.module-card .mc-detail{font-size:12px;opacity:.85}
.module-card .mc-date{font-size:11px;opacity:.7;margin-top:4px}

/* ── MAIN APP (hidden until module chosen) ── */
#main-app{display:none}

.bar{color:#fff;padding:13px 15px 9px;position:sticky;top:0;z-index:100}
.bar h1{font-size:16px;font-weight:700;letter-spacing:-.2px}
.bar p{font-size:11px;opacity:.85;margin-top:1px}
.bar-back{background:none;border:none;color:rgba(255,255,255,0.85);font-size:13px;font-weight:600;cursor:pointer;padding:0;margin-bottom:3px;display:flex;align-items:center;gap:4px;font-family:inherit}
.bar-back:hover{color:#fff}

.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;position:sticky;top:53px;z-index:99}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:11px 15px;font-size:13px;font-weight:500;color:var(--muted);background:none;border:none;border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap;font-family:inherit;transition:color .15s}
.tab.on{color:var(--acc);border-bottom-color:var(--acc)}

.scr{display:none;padding:14px}
.scr.on{display:block}
.cd{border-radius:var(--radius);padding:20px;text-align:center;color:#fff;margin-bottom:14px}
.cd .days{font-size:52px;font-weight:800;line-height:1}
.cd .lbl{font-size:12px;opacity:.85;margin-top:3px}
.cd .dt{font-size:11px;opacity:.65;margin-top:7px}
.slbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:14px 0 8px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-bottom:14px}
.tbtn{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:11px;text-align:left;cursor:pointer;color:var(--text);font-family:inherit;width:100%}
.tbtn:active{opacity:.7}
.tbtn .ico{font-size:20px;margin-bottom:5px}
.tbtn .num{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.4px;margin-bottom:2px}
.tbtn .nm{font-size:12px;font-weight:600;line-height:1.3}
.back{display:flex;align-items:center;gap:5px;background:none;border:none;color:var(--acc);font-size:13px;font-weight:600;cursor:pointer;padding:0;margin-bottom:14px;font-family:inherit}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 15px;margin-bottom:10px}
.plbl{font-size:12px;color:var(--muted);text-align:right;margin-bottom:5px}
.pbar{background:var(--border);border-radius:4px;height:4px;margin-bottom:14px;overflow:hidden}
.pfill{height:100%;border-radius:4px;transition:width .3s;background:var(--acc)}
.fc{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px 18px;min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;margin-bottom:12px;position:relative}
.fc:active{opacity:.8}
.fcl{font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin-bottom:10px}
.fcl.q{color:var(--acc)}
.fcl.a{color:#7c3aed}
.fcq{font-size:16px;font-weight:600;line-height:1.4}
.fca{font-size:13px;color:var(--muted);line-height:1.6;margin-top:9px}
.fch{font-size:11px;color:var(--muted);position:absolute;bottom:10px}
.mix-topic{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:11px;cursor:pointer;color:var(--text);font-family:inherit;width:100%;text-align:left;transition:border-color .15s,background .15s}
.mix-topic.selected{border-color:var(--acc);background:var(--acc-lt)}
.mix-topic:active{opacity:.7}
.mix-topic .mt-check{font-size:14px;margin-bottom:4px}
.mix-topic .mt-num{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.4px;margin-bottom:2px}
.mix-topic .mt-name{font-size:12px;font-weight:600;line-height:1.3}
.fc-topic-tag{position:absolute;top:10px;right:10px;font-size:10px;font-weight:700;color:var(--acc);background:var(--acc-lt);padding:3px 7px;border-radius:20px;letter-spacing:.3px;max-width:55%;text-align:right;line-height:1.3}
.qq{font-size:15px;font-weight:600;line-height:1.5;margin-bottom:15px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:12px 13px;font-size:13px;text-align:left;cursor:pointer;color:var(--text);font-family:inherit;line-height:1.4;transition:background .1s,border-color .1s;width:100%}
.opt:disabled{cursor:default}
.opt.ok{background:var(--acc-lt);border-color:var(--acc);color:var(--acc-dk)}
.opt.bad{background:var(--red-lt);border-color:var(--red);color:var(--red-dk)}
.fb{margin-top:12px;padding:11px;border-radius:9px;font-size:13px;line-height:1.5}
.fb.ok{background:var(--acc-lt);color:var(--acc-dk)}
.fb.bad{background:var(--red-lt);color:var(--red-dk)}
.rw{display:flex;gap:8px;margin-top:5px}
.rw .btn{margin-bottom:0}
.btn{width:100%;padding:13px;border-radius:10px;border:1px solid var(--border);font-size:14px;font-weight:600;cursor:pointer;margin-bottom:8px;font-family:inherit;background:var(--card);color:var(--text);transition:opacity .1s}
.btn.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn:active{opacity:.75}
.all-btn{margin-top:4px;font-size:14px}
.scr-c{width:90px;height:90px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;flex-direction:column}
.scr-n{font-size:28px;font-weight:800}
.scr-l{font-size:11px;font-weight:500;opacity:.8}
.ti{border-bottom:1px solid var(--border);padding:11px 0}
.ti:last-child{border-bottom:none}
.tn{font-size:14px;font-weight:600;margin-bottom:3px;color:var(--acc)}
.td{font-size:13px;color:var(--muted);line-height:1.5}
.sm{font-size:13px;line-height:1.8}
.sm h4{font-size:12px;font-weight:700;color:var(--acc);margin:13px 0 3px;text-transform:uppercase;letter-spacing:.4px}
.sm p{margin-bottom:6px}
.tip{background:var(--amber-lt);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:10px 12px;margin:10px 0;font-size:13px;line-height:1.5;color:var(--text)}
.search-result{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;margin-bottom:8px}
.search-term{font-size:14px;font-weight:700;color:var(--acc);margin-bottom:3px}
.search-def{font-size:13px;color:var(--text);line-height:1.5;margin-bottom:4px}
.search-topic{font-size:11px;font-weight:600;color:var(--muted);background:var(--bg);padding:2px 7px;border-radius:20px;display:inline-block}
.search-highlight{background:var(--acc-lt);color:var(--acc-dk);border-radius:3px;padding:0 2px}
.search-empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px}
.sum-acc{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden}
.sum-acc-hd{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;list-style:none;user-select:none}
.sum-acc-hd::-webkit-details-marker{display:none}
.sum-acc-ico{font-size:18px;flex-shrink:0}
.sum-acc-title{flex:1;font-size:13px;font-weight:600;line-height:1.3}
.sum-acc-arr{font-size:18px;color:var(--muted);transition:transform .2s;flex-shrink:0}
details[open] .sum-acc-arr{transform:rotate(90deg)}
.sum-acc-body{padding:0 14px 14px;font-size:13px;line-height:1.7;border-top:1px solid var(--border)}

/* ── TIMETABLE ── */
.tt-section{margin-bottom:20px}
.tt-day-hd{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 6px;display:flex;align-items:center;gap:6px}
.tt-day-hd.today-hd{color:var(--acc)}
.tt-today-badge{background:var(--acc);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;letter-spacing:.3px}
.tt-item{border-radius:10px;padding:10px 12px;margin-bottom:5px;display:flex;align-items:flex-start;gap:10px;cursor:default}
.tt-item.clickable{cursor:pointer}
.tt-item.clickable:active{opacity:.75}
.tt-item.revision{background:#E8F5F0;border-left:3px solid #1D9E75}
.tt-item.break{background:#F3F4F6;border-left:3px solid #9CA3AF}
.tt-item.meal{background:#FEF9C3;border-left:3px solid #CA8A04}
.tt-item.free{background:#EDE9FE;border-left:3px solid #7C3AED}
.tt-item.exam{background:#FEE2E2;border-left:3px solid #DC2626}
.tt-item.rest{background:#F0F9FF;border-left:3px solid #0EA5E9}
@media(prefers-color-scheme:dark){
  .tt-item.revision{background:#0A2E22;border-left-color:#1D9E75}
  .tt-item.break{background:#1F2937;border-left-color:#6B7280}
  .tt-item.meal{background:#2D2400;border-left-color:#CA8A04}
  .tt-item.free{background:#1E1635;border-left-color:#7C3AED}
  .tt-item.exam{background:#2D0A0A;border-left-color:#DC2626}
  .tt-item.rest{background:#0A1929;border-left-color:#0EA5E9}
}
.tt-time{font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap;min-width:40px;margin-top:2px}
.tt-content{flex:1}
.tt-title{font-size:13px;font-weight:600;line-height:1.3;margin-bottom:2px}
.tt-item.revision .tt-title{color:#085041}
.tt-item.meal .tt-title{color:#854D0E}
.tt-item.free .tt-title{color:#5B21B6}
.tt-item.exam .tt-title{color:#991B1B;font-size:14px}
.tt-item.rest .tt-title{color:#0369A1}
@media(prefers-color-scheme:dark){
  .tt-item.revision .tt-title{color:#6EE7B7}
  .tt-item.meal .tt-title{color:#FCD34D}
  .tt-item.free .tt-title{color:#C4B5FD}
  .tt-item.exam .tt-title{color:#FCA5A5}
  .tt-item.rest .tt-title{color:#7DD3FC}
}
.tt-desc{font-size:11px;color:var(--muted);line-height:1.4}
.tt-go{font-size:10px;font-weight:700;color:var(--acc);margin-top:3px}
.tt-now{position:relative}
.tt-now-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-right:4px;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.tt-legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tt-leg{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:500;color:var(--muted)}
.tt-leg-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.tt-leg-dot.revision{background:#1D9E75}
.tt-leg-dot.break{background:#9CA3AF}
.tt-leg-dot.meal{background:#CA8A04}
.tt-leg-dot.free{background:#7C3AED}
.tt-leg-dot.exam{background:#DC2626}
.tt-leg-dot.rest{background:#0EA5E9}
</style>
</head>
<body>

<!-- MODULE SELECT -->
<div id="module-select">
  <div class="module-logo">📚</div>
  <div class="module-title">Revision App</div>
  <div class="module-sub">Choose your module to get started</div>
  <div class="module-cards">
    <button class="module-card eco" onclick="chooseModule('eco')">
      <div class="mc-ico">🌿</div>
      <div class="mc-name">Ecosystems</div>
      <div class="mc-detail">20 topics · Flashcards, Quiz, Summaries, Key Terms</div>
      <div class="mc-date">📅 Exam: Friday 22 May 2026</div>
    </button>
    <button class="module-card cli" onclick="chooseModule('cli')">
      <div class="mc-ico">🌍</div>
      <div class="mc-name">Climate Systems</div>
      <div class="mc-detail">19 topics · Flashcards, Quiz, Summaries, Key Terms</div>
      <div class="mc-date">📅 Exam: Tuesday 2 June 2026</div>
    </button>
  </div>
</div>

<!-- MAIN APP -->
<div id="main-app">
  <div class="bar" id="main-bar">
    <button class="bar-back" onclick="goHome()">← Modules</button>
    <h1 id="bar-title"></h1>
    <p id="bar-sub"></p>
  </div>

  <div class="tabs" id="main-tabs">
    <button class="tab on" onclick="goTab('home',this)">Home</button>
    <button class="tab" onclick="goTab('fc',this)">Flashcards</button>
    <button class="tab" onclick="goTab('qz',this)">Quiz</button>
    <button class="tab" onclick="goTab('sm',this)">Summary</button>
    <button class="tab" onclick="goTab('tr',this)">Key Terms</button>
    <button class="tab" onclick="goTab('all',this)">All Summaries</button>
    <button class="tab" onclick="goTab('search',this)">🔍 Search</button>
  </div>

  <div id="s-home" class="scr on">
    <div class="cd" id="home-cd">
      <div id="menace-msg" style="font-size:22px;font-weight:800;line-height:1.2;margin-bottom:8px"></div>
      <div id="menace-time" style="font-size:13px;opacity:0.9;font-weight:600;letter-spacing:0.3px"></div>
      <div class="dt" id="exam-dt" style="margin-top:6px"></div>
    </div>
    <div id="today-section" style="margin-bottom:6px"></div>
    <div class="slbl">Revision Schedule</div>
    <div class="tt-legend">
      <div class="tt-leg"><div class="tt-leg-dot revision"></div>Revision</div>
      <div class="tt-leg"><div class="tt-leg-dot break"></div>Break</div>
      <div class="tt-leg"><div class="tt-leg-dot meal"></div>Food</div>
      <div class="tt-leg"><div class="tt-leg-dot free"></div>Free time</div>
      <div class="tt-leg"><div class="tt-leg-dot rest"></div>Rest</div>
      <div class="tt-leg"><div class="tt-leg-dot exam"></div>Exam</div>
    </div>
    <div id="tt-body"></div>
    <div class="slbl" style="margin-top:16px">Topics</div>
    <div class="grid" id="g-home"></div>
  </div>

  <div id="s-fc" class="scr">
    <div id="fc-pick">
      <div class="slbl">Flashcards — pick a topic</div>
      <div class="grid" id="g-fc"></div>
      <button class="btn p all-btn" onclick="fcStart('ALL')">🔀 All Topics (shuffle everything)</button>
      <button class="btn all-btn" style="border-color:var(--acc);color:var(--acc)" onclick="showMixPicker()">🎛️ Custom Mix (choose topics)</button>
    </div>
    <div id="fc-mix" style="display:none">
      <button class="back" onclick="hideMixPicker()">← Back</button>
      <div class="slbl">Select topics to include</div>
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <button class="btn p" style="margin-bottom:0;font-size:13px;padding:10px" onclick="mixSelectAll()">Select all</button>
        <button class="btn" style="margin-bottom:0;font-size:13px;padding:10px" onclick="mixSelectNone()">Clear all</button>
      </div>
      <div id="mix-grid"></div>
      <button class="btn p" style="margin-top:4px" onclick="startMix()" id="mix-start-btn">🔀 Start Custom Mix</button>
    </div>
    <div id="fc-sess" style="display:none">
      <button class="back" onclick="bk('fc')">← Back</button>
      <div class="plbl" id="fc-pl">Card 1 of 8</div>
      <div class="pbar"><div class="pfill" id="fc-pf" style="width:0%"></div></div>
      <div id="fc-body"></div>
      <div class="rw">
        <button class="btn" id="fc-flip" onclick="fcFlip()">Reveal answer</button>
        <button class="btn p" id="fc-nxt" onclick="fcNext()" style="display:none">Next →</button>
      </div>
      <button class="btn" onclick="fcStart(curTopic)" style="margin-top:8px">Shuffle new cards</button>
    </div>
  </div>

  <div id="s-qz" class="scr">
    <div id="qz-pick"><div class="slbl">Quiz — pick a topic</div><div class="grid" id="g-qz"></div><button class="btn p all-btn" onclick="qzStart('ALL')">🔀 All Topics (shuffle everything)</button></div>
    <div id="qz-sess" style="display:none">
      <button class="back" onclick="bk('qz')">← Back</button>
      <div class="plbl" id="qz-pl">Q 1 of 5</div>
      <div class="pbar"><div class="pfill" id="qz-pf" style="width:0%"></div></div>
      <div id="qz-body"></div>
    </div>
    <div id="qz-res" style="display:none">
      <div class="card" style="text-align:center;padding:24px">
        <div class="scr-c" id="sc"><div class="scr-n" id="sc-n"></div><div class="scr-l">score</div></div>
        <div style="font-size:16px;font-weight:700" id="sc-msg"></div>
      </div>
      <button class="btn p" onclick="qzRetry()">Try again</button>
      <button class="btn" onclick="bk('qz')">Change topic</button>
    </div>
  </div>

  <div id="s-sm" class="scr">
    <div id="sm-pick"><div class="slbl">Summary — pick a topic</div><div class="grid" id="g-sm"></div></div>
    <div id="sm-sess" style="display:none">
      <button class="back" onclick="bk('sm')">← Topics</button>
      <div id="sm-body"></div>
    </div>
  </div>

  <div id="s-tr" class="scr">
    <div id="tr-pick"><div class="slbl">Key Terms — pick a topic</div><div class="grid" id="g-tr"></div><button class="btn p all-btn" onclick="trStart('ALL')">🔀 All Topics (show everything)</button></div>
    <div id="tr-sess" style="display:none">
      <button class="back" onclick="bk('tr')">← Topics</button>
      <div id="tr-body"></div>
    </div>
  </div>

  <div id="s-search" class="scr">
  <div style="position:sticky;top:0;background:var(--bg);padding-bottom:10px;z-index:10">
    <div class="slbl" style="margin-top:0">Search Key Terms</div>
    <div style="position:relative">
      <input id="search-input" type="search" placeholder="Search terms, definitions..." 
        style="width:100%;padding:12px 40px 12px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--card);color:var(--text);font-size:15px;font-family:inherit;outline:none"
        oninput="doSearch(this.value)" />
      <span style="position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none">🔍</span>
    </div>
    <div id="search-meta" style="font-size:12px;color:var(--muted);margin-top:6px;min-height:16px"></div>
  </div>
  <div id="search-results"></div>
</div>

<div id="s-all" class="scr">
    <div class="slbl">All Topic Summaries</div>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <button class="btn p" style="margin-bottom:0;font-size:13px;padding:10px" onclick="allExpand()">Expand all</button>
      <button class="btn" style="margin-bottom:0;font-size:13px;padding:10px" onclick="allCollapse()">Collapse all</button>
    </div>
    <div id="all-body"></div>
  </div>
</div>

<script>
// ── MODULE DATA ───────────────────────────────────────────────────────────────
const MODULES = {
  eco: {
    name: 'Ecosystems',
    icon: '🌿',
    accent: '#1D9E75',
    accentLt: '#E1F5EE',
    accentDk: '#085041',
    examDate: '2026-05-22T09:00:00',
    examLabel: 'Friday 22 May 2026',

  summary:`<h4>Overview</h4><p>The biosphere encompasses all life on Earth and was first defined by Eduard Suess in 1875. Vernadsky's 1926 paper argued that living organisms actively shape planetary chemistry, not merely inhabit it. Arthur Tansley (1935) coined the term 'ecosystem' — emphasising the exchanges of materials between organisms and their abiotic environment, not just the organisms themselves.</p><h4>Key Concepts</h4><p><strong>Commensal microbiome:</strong> humans carry 10x more microbial cells than human cells. The gut alone hosts ~10,000 species. Functions include digestion, drug metabolism, immune regulation, and even brain functioning (anxiety, learning, memory).</p><h4>Human Footprint</h4><p>Croplands and pastures occupy ~40% of the ice-free land surface. Human activity is causing widespread habitat loss and fragmentation. Many argue we are in the midst of a 6th mass extinction crisis — making ecosystem understanding more urgent than ever.</p><h4>Exam Tips</h4><div class="tip">Remember: Suess coined 'biosphere' (1875), Vernadsky explained the mechanism (1926), Tansley coined 'ecosystem' (1935). The 40% cropland figure and 6th extinction framing are good opening points for an essay.</div>`,

"1.2.1": {
  cards:[
    {q:"What wavelength range is photosynthetically active radiation (PAR)?", a:"400–700 nm — the portion of the solar spectrum plants can use for photosynthesis."},
    {q:"What percentage of incident light energy on a leaf is used for photosynthesis?", a:"Less than 5% of light energy incident on a leaf is actually used for photosynthesis."},
    {q:"Define the light compensation point.", a:"The irradiance level at which photosynthesis exactly balances respiration — net carbon exchange is zero."},
    {q:"Define the light saturation point.", a:"The irradiance level above which photosynthesis no longer increases with increasing light intensity."},
    {q:"How does CO₂ enter a leaf for photosynthesis?", a:"CO₂ diffuses from the atmosphere through stomata along a concentration gradient, then to chloroplasts where it is fixed into sugars."},
    {q:"What is the dual role of stomata?", a:"They regulate CO₂ entry for photosynthesis while simultaneously limiting water loss through transpiration."},
    {q:"Why do plants not use the full solar spectrum?", a:"Chlorophyll only absorbs wavelengths in the PAR range (400–700 nm); radiation outside this range cannot drive photosynthesis."},
    {q:"What happens to net photosynthesis at very high light intensities?", a:"Net photosynthesis plateaus (saturates) — adding more light produces no further increase in carbon fixation."},
    {q:"Describe the light reactions and dark reactions of photosynthesis.", a:"Light reactions: convert light energy into chemical energy (ATP); involve electron transfer chain; take place in thylakoid membranes. Dark reactions (Calvin cycle): use chemical energy to reduce CO₂ to carbohydrates; take place in the stroma. CO₂ enters by diffusion through stomata."},
    {q:"What is RuBisCO and what is photorespiration?", a:"RuBisCO (Ribulose Biphosphate Carboxylase Oxygenase) catalyses the first major step of carbon fixation — carboxylation of RuBP. It is the most abundant protein in leaves (30–50% of total soluble leaf protein). Both CO₂ and O₂ compete for active sites. Photorespiration: when O₂ wins and RuBP is oxygenated instead, releasing CO₂ — wastes 25–40% of C fixed by photosynthesis."},
    {q:"Define GPP, NPP, NEP and NEE and describe the carbon sink/source rule.", a:"GPP = sum of all leaf photosynthesis. NPP = GPP minus autotrophic respiration. NEP = NPP minus heterotrophic respiration. NEE = instantaneous version of NEP. If NPP > R_heterotrophic: ecosystem is a carbon SINK. If R_heterotrophic > NPP: ecosystem is a carbon SOURCE."},
    {q:"What is carbon turnover and what is the key equation for biomass?", a:"Biomass pool sizes depend on NPP AND on turnover rate (rate of loss). Turnover rate = 1/Residence Time (τ). Biomass = Productivity × Residence Time. Leaves and fine roots: residence time 1–2 years. Wood: 20–200 years. In forests, most biomass is stored in wood; only 2–3% in leaves and fine roots."},
    {q:"What are the two limitations on net photosynthesis as CO₂ concentration rises?", a:"At low internal CO₂: limitation by CO₂ diffusion (stomatal/mesophyll conductance limits supply). At high internal CO₂: biochemical limitation (RuBisCO activity saturates, regeneration of RuBP limits rate). The CO₂ compensation point is where gross photosynthesis equals respiration."}
  ],

  summary:`<h4>Overview</h4><p>Photosynthesis is the foundation of ecosystem carbon cycling. Plants capture solar energy through two coupled reaction systems and fix CO₂ via the Calvin cycle. The ecosystem carbon balance determines whether an ecosystem is a source or sink.</p><h4>Photosynthesis Reactions</h4><p><strong>Light reactions:</strong> convert light energy to ATP in thylakoid membranes via electron transfer chain. <strong>Dark reactions (Calvin cycle):</strong> use ATP to reduce CO₂ to sugars in the stroma. CO₂ enters by diffusion through stomata. <strong>RuBisCO:</strong> catalyses CO₂ fixation; most abundant leaf protein (30–50%); susceptible to photorespiration (25–40% of C wasted when O₂ competes).</p><h4>Carbon Balance</h4><p>GPP = all photosynthesis. NPP = GPP − R_auto. NEP = NPP − R_hetero. If NPP > R_hetero → ecosystem is a SINK. Two CO₂ limitations: at low CO₂ = diffusion-limited; at high CO₂ = biochemical (RuBisCO saturation). Carbon turnover: Biomass = Productivity × Residence Time. Wood: 20–200 yr; leaves/fine roots: 1–2 yr.</p><h4>Exam Tips</h4><div class="tip">Know GPP → NPP → NEP chain. RuBisCO and photorespiration are often examined. The biomass = productivity × residence time equation explains why forests store most C in wood despite leaves having high turnover.</div>`,
  terms:[
    {t:"Photosynthetically Active Radiation (PAR)", d:"Solar radiation in the 400–700 nm wavelength range that plants can use to drive photosynthesis."},
    {t:"Light compensation point", d:"The irradiance at which the rate of photosynthesis exactly equals the rate of respiration; net CO₂ exchange is zero."},
    {t:"Light saturation point", d:"The irradiance above which the rate of photosynthesis no longer increases, even with more light."},
    {t:"Stomata", d:"Pores in leaf surfaces that regulate CO₂ entry for photosynthesis and control water loss through transpiration."},
    {t:"Carbon fixation", d:"The process by which CO₂ is converted into organic molecules (sugars) in chloroplasts during photosynthesis."},
    {t:"RuBisCO", d:"Ribulose Biphosphate Carboxylase Oxygenase — the enzyme catalysing carbon fixation in photosynthesis; most abundant leaf protein (30–50% of soluble protein); susceptible to photorespiration when O₂ competes with CO₂."},
    {t:"Photorespiration", d:"When RuBisCO reacts with O₂ instead of CO₂, releasing CO₂ — wastes 25–40% of carbon fixed by photosynthesis, especially in hot conditions (reduced by C4 pathway)."},
    {t:"GPP/NPP/NEP", d:"Gross Primary Production (all photosynthesis); Net Primary Production (GPP − autotrophic respiration); Net Ecosystem Production (NPP − heterotrophic respiration). NEP &gt; 0 = sink; NEP &lt; 0 = source."},
    {t:"Biomass = Productivity × Residence Time", d:"The key equation linking carbon stocks to productivity and turnover. Wood has long residence time (20–200 yr) so dominates forest biomass despite lower annual production than leaves."},
    {t:"Light reactions", d:"The first stage of photosynthesis: light energy converted to ATP via electron transfer chain in thylakoid membranes."},
    {t:"Calvin cycle (dark reactions)", d:"The second stage of photosynthesis: ATP used to reduce CO₂ to carbohydrates (sugars) in the stroma. Also called carbon fixation or light-independent reactions."}

"1.3.1": {
  cards:[
    {q:"What percentage of precipitation is intercepted by the canopy?", a:"10–20% of precipitation is intercepted by the canopy and readily evaporates back to the atmosphere."},
    {q:"What is Plant Available Water (PAW)?", a:"Water stored in soil between field capacity and the wilting point — the only soil water plants can actually access."},
    {q:"Where is the majority of plant root biomass located?", a:"The vast majority of roots (especially fine roots) are concentrated in the top 30 cm of soil."},
    {q:"Write the simplified ecosystem energy budget equation.", a:"R = H + λE, where R = net radiation, H = sensible heat flux, and λE = latent heat flux (evapotranspiration)."},
    {q:"What is sensible heat flux (H)?", a:"The transfer of heat energy between the surface and the atmosphere by convection; proportional to the temperature difference between surface and air."},
    {q:"What is latent heat flux (LE)?", a:"Heat energy lost from the ecosystem through evapotranspiration — water changing from liquid to vapour."},
    {q:"What is the difference between a positive and negative climate feedback?", a:"Positive feedback amplifies the original change; negative feedback dampens or counteracts the original change."},
    {q:"What are biogeophysical vs. biogeochemical ecosystem climate influences?", a:"Biogeophysical = physical effects on energy/water fluxes (e.g. albedo, evapotranspiration). Biogeochemical = effects via chemical cycles (e.g. CO₂ uptake)."},
    {q:"What are the key fluxes in the ecosystem water cycle?", a:"Precipitation, interception (10–20% evaporates from canopy), throughfall, stem flow, soil infiltration/percolation, soil evaporation, transpiration, and surface runoff. Evapotranspiration = soil evaporation + transpiration. Water balance: ΔS = P − Q − ET (change in storage = precipitation minus runoff minus ET)."},
    {q:"How does water move from soil to leaves and what is the cohesion-tension mechanism?", a:"Transpiration from leaves creates tension (suction) that pulls water up from soil. Water potential (ψ) drives flow from HIGH (soil, −0.01 MPa) to LOW (leaves, −1 MPa) to atmosphere (−100 MPa). Cohesion-tension: hydrogen bonds create cohesion between water molecules in xylem columns; adhesion to xylem walls prevents column breaking. Water flows via tracheids and vessels — flow rate proportional to radius⁴ (Hagen-Poiseuille law)."},
    {q:"What are isohydric vs. anisohydric plant water strategies?", a:"Isohydric (e.g. Piñon pine): regulate stomata tightly to maintain constant leaf water potential — conservative strategy, close stomata under drought. Anisohydric (e.g. Juniper): keep stomata open during dry periods to maintain carbon gain — acquisitive strategy, risk cavitation. McDowell et al. 2008."},
    {q:"What is cavitation and what is the hydraulic safety margin?", a:"As soils dry, xylem tension increases (water potential more negative). At high tensions, the water column 'breaks' and fills with air — cavitation (embolism). P50 = water potential causing 50% loss of hydraulic conductivity. Safety margin = P50 minus minimum seasonal water potential. Species with small safety margins are more vulnerable to drought mortality."},
    {q:"What are typical albedo values for different surfaces and why does it matter?", a:"Fresh snow: 0.75–0.95. Old snow: 0.40–0.70. Conifer forest: 0.09–0.15. Broadleaf forest: 0.15–0.20. Grassland: 0.16–0.26. Desert: 0.20–0.45. Oceans: 0.03–0.10. Lower albedo = more absorption. Emissivity of vegetation typically 0.95–0.99. Net radiation: R_net = (K_in − K_out) + (L_in − L_out) = (1−α)K_in + σ(ε_sky T_sky⁴ − ε_surf T_surf⁴)."},
    {q:"How does deforestation affect global temperature and why does it depend on region?", a:"Deforestation affects temperature via three competing processes: 1) Reduced carbon sequestration (warming). 2) Reduced evaporative cooling from ET (warming). 3) Increased albedo from replacing dark forest with lighter surface (cooling). Bala et al. 2007: Boreal deforestation → net cooling (albedo dominates). Tropical deforestation → net warming (carbon + ET effects dominate). Effects are regional: deforestation of different biomes impacts climate very differently."},
    {q:"What is the vegetation-precipitation feedback and vegetation-albedo feedback?", a:"Vegetation-precipitation (positive): forest increases transpiration → more atmospheric moisture → more precipitation → forest can expand further. Vegetation-albedo: tundra/snow has high albedo; if forest replaces tundra, lower albedo absorbs more radiation → warming → positive feedback. Spracklen et al. 2012: Amazon deforestation reduces regional rainfall by reducing moisture recycling."}
  ],
  quiz:[
    {q:"What proportion of precipitation is typically intercepted by forest canopies?", opts:["Less than 1%","10–20%","40–60%","Over 80%"], ans:1, exp:"10–20% of precipitation is intercepted by the canopy and evaporates before reaching the soil."},
    {q:"Plant Available Water (PAW) is defined as water held between which two thresholds?", opts:["Saturation and field capacity","Field capacity and wilting point","Wilting point and air-dry","Saturation and wilting point"], ans:1, exp:"PAW is the water between field capacity (upper limit) and wilting point (lower limit) that plants can extract."},
    {q:"What does the simplified energy budget equation R = H + λE represent?", opts:["Net radiation = ground flux + storage","Net radiation = sensible heat + latent heat","Respiration = humidity + evaporation","Radiation = heat + light energy"], ans:1, exp:"R (net radiation) = H (sensible heat flux) + λE (latent heat flux/evapotranspiration)."},
    {q:"A positive climate feedback means:", opts:["The change is reversed","The change is amplified","The system returns to equilibrium","Temperature decreases"], ans:1, exp:"Positive feedback amplifies the original change — the system moves further from its starting state."},
    {q:"Where are most plant fine roots concentrated?", opts:["Below 1 metre depth","50–100 cm depth","Top 30 cm of soil","At the water table"], ans:2, exp:"The vast majority of fine roots responsible for water and nutrient uptake are found in the top 30 cm of soil."}
  ],
  summary:`<h4>Overview</h4><p>Ecosystems regulate water and energy fluxes through a complex set of interconnected processes. Vegetation is a critical mediator of the water cycle and influences regional and global climate via multiple pathways.</p><h4>Water Cycle Fluxes</h4><p>Precipitation → interception (10–20% lost) → throughfall → infiltration → soil water → ET. Water balance: ΔS = P − Q − ET. Water potential gradient drives flow: soil (−0.01 MPa) → roots (−0.1 MPa) → leaves (−1 MPa) → air (−100 MPa). Cohesion-tension mechanism: H-bonds hold xylem water columns. Cavitation: water column breaks under extreme tension — drought mortality mechanism.</p><h4>Energy Balance and Albedo</h4><p>R_net = (1−α)K_in + longwave balance. Albedo (α): conifer forest 0.09–0.15; grassland 0.16–0.26; fresh snow 0.75–0.95. Evapotranspiration cools surfaces (λ = 2.48 MJ/kg at 20°C). R = H + λE.</p><h4>Deforestation Climatic Effects</h4><p>Three processes: carbon sequestration (lost → warming), evaporative cooling (lost → warming), albedo increase (cooling). Bala 2007: tropical deforestation warms; boreal deforestation cools. Spracklen 2012: Amazon deforestation reduces regional rainfall via moisture recycling feedback.</p><h4>Exam Tips</h4><div class="tip">The deforestation question (three competing effects) is a classic essay topic. Know all three and which dominates where. Isohydric vs anisohydric plant strategies frequently appear in drought/carbon questions.</div>`,
  terms:[
    {t:"Plant Available Water (PAW)", d:"Soil water held between field capacity and the wilting point; the only fraction accessible to plants."},
    {t:"Field capacity", d:"The amount of water soil holds after excess has drained away under gravity; the upper limit of PAW."},
    {t:"Wilting point", d:"The soil moisture content at which plants can no longer extract water and begin to wilt; the lower limit of PAW."},
    {t:"Sensible heat flux (H)", d:"Transfer of heat between the land surface and atmosphere by convection, proportional to temperature difference."},
    {t:"Latent heat flux (λE)", d:"Energy used to evaporate water from vegetation and soil surfaces; represents cooling by evapotranspiration."},
    {t:"Positive feedback", d:"A feedback where a change in a system amplifies the original change, pushing the system further from its initial state."},
    {t:"Negative feedback", d:"A feedback where a change in a system dampens or counteracts the original change, stabilising the system."},
    {t:"Cohesion-tension mechanism", d:"The process driving water movement from soil to leaves via continuous water columns in xylem, maintained by hydrogen bonding (cohesion) and adhesion to xylem walls."},
    {t:"Cavitation", d:"The breaking of the water column in xylem under high tension, causing air embolism and loss of hydraulic conductivity — a key mechanism of drought-induced tree mortality."},
    {t:"Isohydric strategy", d:"Plant water regulation strategy where stomata close tightly to maintain constant leaf water potential under drought — conservative, protects xylem from cavitation."},
    {t:"Anisohydric strategy", d:"Plant water regulation strategy where stomata remain open under drought, risking cavitation but maintaining carbon gain — acquisitive."},
    {t:"Albedo", d:"The fraction of incoming solar radiation reflected by a surface. Ranges from ~0.03 (ocean) to 0.75–0.95 (fresh snow). Low forest albedo contributes to warming if forests replace high-albedo surfaces."},
    {t:"Vegetation-precipitation feedback", d:"Positive feedback where forest increases atmospheric moisture via ET → more precipitation → forest can expand (Spracklen et al. 2012)."}
  ]
},
"1.4.1": {
  cards:[
    {q:"Name the three types of ecosystem change.", a:"Population change (birth/death/dispersal), individual change (physiological/behavioural), and successional change (long-term community shifts)."},
    {q:"What is eddy covariance and what does it measure?", a:"A technique used by flux towers to measure the exchange of CO₂, water vapour, and energy between the land surface and the atmosphere."},
    {q:"What are the two mechanisms of drought-induced tree mortality?", a:"Carbon starvation (stomata close → photosynthesis stops → no energy) and hydraulic failure (water columns in xylem break under tension — embolism)."},
    {q:"What happened to the Amazon carbon sink during the 2005 drought?", a:"The drought temporarily reversed the Amazon from a carbon sink to a carbon source (net CO₂ emitter), as shown by Phillips et al. 2009."},
    {q:"What are treefall gaps and why are they ecologically important?", a:"Gaps created when trees fall; they increase light and temperature at the forest floor, promoting regeneration, species turnover and diversity."},
    {q:"What is the snowshoe hare–lynx cycle an example of?", a:"Interannual variability driven by predator–prey dynamics, showing strong population fluctuations linked between species over years."},
    {q:"What consequence did megafauna extinction (~50,000 years ago) have on ecosystems?", a:"Loss of ecosystem engineers, reduced nutrient transport and cycling ('severed nutrient arteries'), simplified vegetation structure and reduced productivity."},
    {q:"Which disturbance events cause most biomass loss in tropical forests?", a:"Small, frequent events cause most total biomass loss — large events (e.g. blowdowns) account for less than 1% of total loss."}
  ],
  quiz:[
    {q:"What technique do flux towers use to measure CO₂ exchange?", opts:["Gas chromatography","Eddy covariance","Remote sensing","Isotope tracing"], ans:1, exp:"Flux towers use eddy covariance to continuously measure CO₂, water and energy exchange between land and atmosphere."},
    {q:"What did Phillips et al. (2009) find about the 2005 Amazon drought?", opts:["It had no effect on carbon balance","It increased carbon uptake","It temporarily reversed the Amazon to a carbon source","It killed 90% of trees"], ans:2, exp:"The 2005 drought temporarily reversed the Amazon carbon sink, making it a net source of CO₂."},
    {q:"Which mechanism of drought mortality involves xylem vessels?", opts:["Carbon starvation","Hydraulic failure","Leaf senescence","Root desiccation"], ans:1, exp:"Hydraulic failure occurs when water columns in xylem vessels break under tension (embolism), cutting off water supply."},
    {q:"Which disturbance size causes most total biomass loss in tropical forests?", opts:["Large blowdowns","Intermediate events","Small frequent events","All sizes equally"], ans:2, exp:"Small events are most frequent and collectively account for most total biomass loss; large events contribute less than 1%."},
    {q:"What is a consequence of megafauna extinction ~50,000 years ago?", opts:["Increased soil fertility","Enhanced seed dispersal","Severed nutrient arteries and simplified vegetation","Higher species richness"], ans:2, exp:"Loss of large animals reduced nutrient transport across landscapes, described as severing nutrient arteries, simplifying ecosystems."}
  ],
  summary:`<h4>Overview</h4><p>Ecosystems are dynamic across multiple timescales — diurnal, seasonal, interannual, and long-term — responding to both internal processes and external disturbances.</p><h4>Key Concepts</h4><p><strong>Flux towers/eddy covariance:</strong> measure land-atmosphere CO₂ and water exchange. <strong>Drought mortality:</strong> carbon starvation and hydraulic failure. <strong>Gap dynamics:</strong> treefall gaps drive forest regeneration.</p><h4>Key Examples</h4><p>2005 Amazon drought reversed the carbon sink (Phillips et al.). Snowshoe hare-lynx cycles show interannual predator-prey dynamics. Megafauna extinction severed nutrient arteries.</p><h4>Exam Tips</h4><div class="tip">Know BOTH mechanisms of drought mortality for full marks. Carbon starvation = stomata close → no photosynthesis. Hydraulic failure = embolism in xylem.</div>`,
  terms:[
    {t:"Eddy covariance", d:"A technique used by flux towers to measure turbulent exchange of CO₂, water vapour and heat between ecosystems and the atmosphere."},
    {t:"Carbon starvation", d:"A drought mortality mechanism where stomata close to prevent water loss, stopping photosynthesis and starving the plant of energy."},
    {t:"Hydraulic failure", d:"A drought mortality mechanism where water columns in xylem vessels break under tension (embolism), cutting off water supply to leaves."},
    {t:"Gap dynamics", d:"The process of canopy gap formation (e.g. from treefall) and subsequent regeneration that drives forest succession and diversity."},
    {t:"Interannual variability", d:"Year-to-year variation in ecosystem processes such as productivity, linked to climate events like El Niño."},
    {t:"Successional change", d:"Long-term, directional shifts in species composition and ecosystem structure following disturbance or over time."}
  ]
},
"1.5.1": {
  cards:[
    {q:"Give the Convention on Biological Diversity (1992) definition of biodiversity.", a:"'The biological diversity within species, between species and of ecosystems' — capturing genetic, species, and ecosystem diversity."},
    {q:"What are the three main evolutionary mechanisms that govern species?", a:"Natural selection, genetic drift, and gene flow."},
    {q:"Define allopatric speciation and give an example.", a:"Speciation via geographic barrier splitting a species into isolated groups that diverge until reproductively incompatible. Example: Baird's tapir vs lowland tapir separated by the Andes."},
    {q:"Distinguish alpha, beta, and gamma diversity.", a:"Alpha = local species count. Beta = species turnover between habitats. Gamma = total species richness across a landscape."},
    {q:"What is the latitudinal diversity gradient (LDG)?", a:"The pattern where biodiversity (species richness) steadily increases from the poles toward the tropics, seen across many animal and plant groups."},
    {q:"What is sympatric speciation? Give an example.", a:"Speciation in geographically overlapping populations without a physical barrier. Example: apple maggot flies diverging on different host plants."},
    {q:"What is genetic drift and why does it matter?", a:"Random, chance changes in allele frequencies between generations, especially important in small populations where it can cause loss of alleles."},
    {q:"Name four physical/historical factors affecting species richness.", a:"Any four of: latitude, rainfall, temperature, altitude, area, connectivity, disturbance frequency, environmental heterogeneity."},
    {q:"What is the Whittaker diversity framework and what scales does it distinguish?", a:"Whittaker 1977: links type of diversity with scale. Alpha (within community: 0.01–1000 ha). Gamma (landscape: 1000 ha – 1 million ha). Epsilon/regional (sampling units = 1 to 100 million ha). Beta = environmental gradients between alpha communities. Delta = geographic gradients. Distinguishes inventory diversities (how many species) from differentiation diversities (how composition changes)."},
    {q:"State and critique the climate tolerance and environmental stability hypotheses for the LDG.", a:"Hypothesis 1 (climate tolerance): diversity greatest in tropics because more species tolerate warm/moist than cold/dry. Critique: species are often absent from areas whose climate they can tolerate — competition and history also matter. Hypothesis 2 (environmental stability): stable tropics lower extinction rates and facilitate speciation. Critique: some very stable environments have very low diversity and vice versa."},
    {q:"Explain the tropics as 'cradle' and 'museum' of biodiversity (Rolland et al. 2014).", a:"Cradle: high tropical diversity due to high speciation rates. Museum: high diversity also maintained by low extinction rates. Rolland et al. 2014: both mechanisms operate — in some mammals (e.g. primates) high tropical diversity associated with low extinction; in others (e.g. artiodactyls) with high speciation rates."},
    {q:"What is the species-energy (productivity) hypothesis for the LDG and its critique?", a:"More energy → higher NPP → more individuals → lower extinction rates → more species. Currie et al. 2004: positive correlation between tree species richness and latitude suggests energy/productivity matters. Critique: tree species richness does not simply follow the total number of individuals — other factors operate."},
    {q:"State and critique the area and biotic interaction hypotheses for the LDG.", a:"Area hypothesis: larger tropical area → higher speciation, lower extinction. Critique: tropical and extratropical regions have varied in size over evolutionary time. Biotic interaction hypothesis: stronger competition/predation in tropics promotes coexistence and greater speciation. Critique: does not explain WHY interactions are stronger in tropics — circularity."},
    {q:"What is the Pantropical Diversity Disparity (PDD) and what does it reveal?", a:"Hagan et al. 2021 (PNAS): plant and vertebrate alpha diversity differs significantly between Neotropics, Afrotropics and Indo-Malayan tropics. Neotropics have highest diversity. Historical contingency (plate tectonics, past climate, time since colonisation) explains why diversity is not uniform across tropical regions even at similar latitudes."}
  ],
  quiz:[
    {q:"Alpha diversity refers to:", opts:["Total species in a landscape","Species turnover between habitats","Local species richness within a habitat","Genetic diversity within a species"], ans:2, exp:"Alpha diversity is the species count within a single local community or habitat patch."},
    {q:"Allopatric speciation requires:", opts:["Habitat overlap","A geographic barrier","High population density","Hybridisation"], ans:1, exp:"Allopatric speciation occurs when a geographic barrier separates populations, allowing them to diverge independently."},
    {q:"The latitudinal diversity gradient describes:", opts:["Higher diversity at poles","Higher diversity at mid-latitudes","Higher diversity toward the tropics","Uniform diversity globally"], ans:2, exp:"The LDG is the well-documented pattern of increasing species richness from the poles toward the equatorial tropics."},
    {q:"Beta diversity measures:", opts:["Total landscape richness","Local habitat richness","Species turnover between habitats","Genetic variation within species"], ans:2, exp:"Beta diversity captures how different species assemblages are between adjacent or different habitat types."},
    {q:"Sympatric speciation involves:", opts:["Geographically separated populations","A large ocean barrier","Overlapping populations diverging without a barrier","Only plants"], ans:2, exp:"Sympatric speciation occurs when populations in the same geographic area diverge into distinct species, e.g. apple maggot flies."}
  ],
  summary:`<h4>Overview</h4><p>Biodiversity encompasses genetic, species, and ecosystem diversity. The latitudinal diversity gradient (LDG) is one of ecology's strongest patterns, with multiple competing hypotheses each with supporting evidence and valid critiques.</p><h4>Diversity Scales (Whittaker 1977)</h4><p>α = within community. β = between communities (turnover). γ = landscape. δ = geographic gradients. ε = regional. Each links a type of diversity to a spatial scale.</p><h4>LDG Hypotheses and Critiques</h4><p><strong>Climate tolerance:</strong> more species tolerate warm/moist. Critique: species absent from tolerable climates. <strong>Environmental stability:</strong> lower tropical extinction. Critique: stable ≠ diverse. <strong>Species-energy:</strong> more energy → more individuals → more species (Currie 2004). Critique: richness ≠ individuals. <strong>Area and biotic interactions:</strong> larger area and stronger interactions. Critiques noted. <strong>Evolutionary rate:</strong> higher T → faster molecular evolution → more speciation. Critique: little evidence linking temperature to speciation rate. <strong>Cradle and Museum (Rolland 2014):</strong> tropics have both high speciation AND low extinction.</p><h4>Pantropical Diversity Disparity</h4><p>Hagan et al. 2021: Neotropics have highest plant/vertebrate alpha diversity — historical contingency (plate tectonics, past climate, colonisation time) matters across tropical regions.</p><h4>Exam Tips</h4><div class="tip">For LDG essays: present multiple hypotheses, each with evidence AND critique. Don't treat any single hypothesis as 'correct' — biodiversity patterns are multi-causal.</div>`,
  terms:[
    {t:"Latitudinal diversity gradient (LDG)", d:"The pattern of increasing species richness from the poles toward the tropics, observed across many taxonomic groups."},
    {t:"Allopatric speciation", d:"Speciation driven by geographic separation of populations, preventing gene flow until reproductive isolation evolves."},
    {t:"Sympatric speciation", d:"Speciation occurring within geographically overlapping populations without a physical barrier, e.g. host-race formation in insects."},
    {t:"Alpha (α) diversity", d:"Species richness within a single local community or habitat patch."},
    {t:"Beta (β) diversity", d:"The change or turnover in species composition between different habitats or along environmental gradients."},
    {t:"Gamma (γ) diversity", d:"Total species richness across an entire landscape or region."},
    {t:"Genetic drift", d:"Random changes in allele frequencies across generations due to chance, particularly significant in small populations."}
  ]
},
"1.7.1": {
  cards:[
    {q:"State the competitive exclusion principle.", a:"Two species competing for exactly the same limiting resource cannot coexist indefinitely — one will outcompete and exclude the other."},
    {q:"What is the 'Paradox of the Plankton'?", a:"Many phytoplankton species coexist in apparently simple, resource-limited environments — contradicting the competitive exclusion principle."},
    {q:"Explain the Intermediate Disturbance Hypothesis (IDH).", a:"Biodiversity is highest at intermediate levels of disturbance: too little disturbance leads to competitive exclusion, too much causes species loss."},
    {q:"What does the Janzen-Connell hypothesis predict?", a:"Seeds and seedlings near parent trees suffer higher mortality from specialist predators and pathogens, promoting spatial spacing and species coexistence in forests."},
    {q:"What is neutral theory in ecology?", a:"All individuals are assumed to have equal fitness regardless of species. Diversity patterns emerge from random birth, death, immigration, and speciation — no niche differences needed."},
    {q:"What is 'hyperdominance' in the Amazon?", a:"A pattern where ~1% of tree species account for ~50% of Amazon biomass and productivity, while most species are rare."},
    {q:"What is the insurance hypothesis regarding biodiversity?", a:"Higher species diversity buffers ecosystems against disturbance because different species respond differently — some will maintain function even if others fail."},
    {q:"Distinguish fundamental from realised niche.", a:"Fundamental niche = the full range of conditions a species can tolerate. Realised niche = the actual conditions it occupies after competition with other species."}
  ],
  quiz:[
    {q:"The Intermediate Disturbance Hypothesis predicts highest diversity at:", opts:["Very high disturbance","Very low disturbance","Intermediate levels of disturbance","Zero disturbance"], ans:2, exp:"IDH states diversity peaks at intermediate disturbance — low disturbance leads to competitive exclusion, high disturbance to species loss."},
    {q:"The Janzen-Connell hypothesis explains high tropical diversity through:", opts:["High productivity","Density-dependent mortality near parent trees","Low disturbance rates","Neutral fitness of species"], ans:1, exp:"Janzen-Connell: seeds near parent trees have higher predator/pathogen pressure, promoting spacing and coexistence."},
    {q:"In neutral theory, species coexist because:", opts:["They occupy different niches","They have equal fitness and diversity is stochastic","Competitive exclusion is prevented","Disturbance maintains diversity"], ans:1, exp:"Neutral theory assumes all individuals have equal fitness; diversity patterns arise from random birth, death and immigration."},
    {q:"Hyperdominance in the Amazon means:", opts:["All species are equally abundant","A small fraction of species dominates most biomass","High diversity across all species","No single species dominates"], ans:1, exp:"About 1% of Amazon tree species account for approximately 50% of biomass and productivity."},
    {q:"The insurance hypothesis proposes that biodiversity:", opts:["Reduces productivity","Has no effect on resilience","Buffers ecosystems against disturbance","Only matters in tropical forests"], ans:2, exp:"Higher diversity provides insurance: if some species fail under stress, others maintain ecosystem function."}
  ],
  summary:`<h4>Overview</h4><p>Maintaining high local species diversity requires explaining why competitive exclusion doesn't eliminate most species. Multiple mechanisms operate simultaneously.</p><h4>Mechanisms</h4><p><strong>Niche partitioning:</strong> species divide resources. <strong>IDH:</strong> intermediate disturbance prevents competitive exclusion. <strong>Lottery/Neutral theory:</strong> chance recruitment; equal fitness. <strong>Janzen-Connell:</strong> density-dependent enemy pressure near parents.</p><h4>Biodiversity & Ecosystem Function</h4><p>Positive biodiversity-productivity relationship (often saturates at low richness). Insurance hypothesis: diversity buffers disturbance.</p><h4>Exam Tips</h4><div class="tip">Structure answers as: paradox → niche theory → disturbance → stochastic models → Janzen-Connell → conclusion that multiple mechanisms interact.</div>`,
  terms:[
    {t:"Competitive exclusion principle", d:"Species competing for the same limiting resource cannot coexist indefinitely; one will exclude the other."},
    {t:"Paradox of the Plankton", d:"The observation that many phytoplankton species coexist in simple, resource-poor environments, apparently contradicting competitive exclusion."},
    {t:"Intermediate Disturbance Hypothesis (IDH)", d:"Biodiversity is maximised at intermediate disturbance levels — too little leads to exclusion, too much to species loss."},
    {t:"Janzen-Connell hypothesis", d:"Seeds and seedlings near parent trees suffer higher specialist predator/pathogen pressure, promoting coexistence by preventing any one species from dominating."},
    {t:"Neutral theory", d:"All individuals have equal per-capita rates of birth, death and dispersal regardless of species; diversity arises from stochastic processes."},
    {t:"Hyperdominance", d:"The pattern where a small fraction of species (~1%) dominates ecosystem biomass and productivity (e.g. Amazon), while most species are rare."},
    {t:"Insurance hypothesis", d:"Higher biodiversity buffers ecosystems against disturbance because species differ in their responses to stress."}
  ]
},
"1.8.1": {
  cards:[
    {q:"In what form must nutrients be for plants to take them up?", a:"Ionic form — e.g. K⁺, NO₃⁻, NH₄⁺. Most soil nutrients are locked in complex organic matter and must be decomposed first."},
    {q:"What is the rhizosphere?", a:"The volume of soil immediately surrounding roots (within 1–2 mm), constituting ~5% of soil volume, characterised by high microbial activity and acidity."},
    {q:"What role do root exudates play in nutrient cycling?", a:"Roots exude simple sugars and organic acids that provide energy for soil microbes, stimulating decomposition and nutrient release in the rhizosphere."},
    {q:"How does SOM quality (C:N ratio) affect nitrogen availability?", a:"High quality SOM (low C:N) → net mineralisation, N is released. Low quality SOM (high C:N) → net immobilisation, N is locked up in microbial biomass."},
    {q:"What are mycorrhizae and what benefit do they provide?", a:"Root–fungus symbioses that extend the nutrient acquisition zone far beyond root hairs, dramatically increasing the volume of soil a plant can access for water and nutrients."},
    {q:"Why is the rhizosphere acidic?", a:"Root exudates include low molecular weight organic acids (e.g. citric acid), and roots also release CO₂ via respiration, which forms carbonic acid."},
    {q:"Why can't plants access most soil nutrients directly?", a:"Most nutrients are bound in complex organic matter (SOM) or secondary minerals that plants cannot absorb — they require microbial decomposition to release ionic forms."},
    {q:"What gases are exchanged at the soil-root interface?", a:"Roots take up oxygen for respiration and release CO₂ as a respiratory byproduct — the opposite of leaf gas exchange."},
    {q:"What are the three mechanisms by which ions move from soil solution to root surface?", a:"1) Diffusion (slow transfer, controlled by concentration gradient): PO₄³⁻, K⁺, Fe³⁺, Zn²⁺. 2) Mass flow (fast transfer, controlled by transpiration): 80% of Ca, NO₃, SO₄ — carried with water. 3) Root interception: root grows into direct contact with nutrient molecule (Ca²⁺, Mg²⁺, Zn²⁺, Mn²⁺)."},
    {q:"What is the bidirectional exchange in mycorrhizal symbiosis?", a:"Fungus provides N, P and H₂O to plant (via hyphae extending far beyond root surface, beyond the nutrient depletion zone). Plant provides C (sugars) to fungus. The nutrient depletion zone around roots is replenished by fungal hyphae exploring a much larger soil volume."},
    {q:"Distinguish ectomycorrhizal (EM) from arbuscular mycorrhizal (AM) fungi and their effects.", a:"EM fungi (e.g. with Oak): associated with high soil organic matter, retard decomposition, promote N cycling via SOM — N flows from soil through EM to plant. AM fungi (e.g. with Maple): associated with low soil organic matter, promote SOM decomposition via free-living microbes — inorganic N flows to plant. Steidinger et al. 2019: EM forests dominate boreal/temperate; AM forests dominate tropics; N-fixer trees abundant where P is available (tropical young soils). Bradford 2014, Nature 505."},
    {q:"What is symbiotic nitrogen fixation and what are its costs and benefits?", a:"Symbiosis between plant roots and nitrogen-fixing bacteria (e.g. Rhizobium in legumes). Bacteria fix atmospheric N₂ into NH₄⁺ which the plant can use — allows plant to acquire N from atmosphere rather than from soil. Costly to the plant: must pay bacteria in carbon (sugars). Important in early succession and in N-limited ecosystems."},
    {q:"Why is much of soil phosphorus not available to plants?", a:"Total soil P declines over time as primary minerals weather. Available P (labile inorganic + organic fractions) is only a small fraction of total. Much P becomes occluded in secondary minerals or strongly adsorbed to iron/aluminium oxides. Available pools change over time — early in soil development inorganic P is highest; later mostly in organic forms and occluded minerals. This makes P increasingly unavailable in old tropical soils."}
  ],
  quiz:[
    {q:"Plants can only absorb soil nutrients in:", opts:["Gaseous form","Liquid water only","Ionic form","Solid mineral form"], ans:2, exp:"Plants can only take up nutrients as ions (e.g. K+, NO3-, NH4+); complex organic molecules must be decomposed first."},
    {q:"The rhizosphere is approximately what proportion of total soil volume?", opts:["50%","20%","5%","Less than 1%"], ans:2, exp:"The rhizosphere represents about 5% of soil volume but is a hotspot of microbial activity and chemical exchange."},
    {q:"A high C:N ratio in SOM leads to:", opts:["Net nitrogen mineralisation","Net nitrogen immobilisation","Rapid decomposition","High plant N availability"], ans:1, exp:"High C:N SOM means microbes need N and will immobilise it into biomass, reducing plant-available N."},
    {q:"What is the primary benefit of mycorrhizal associations for plants?", opts:["Photosynthesis enhancement","Extension of nutrient and water acquisition zone","Protection from herbivores","Nitrogen fixation"], ans:1, exp:"Mycorrhizal fungi extend hyphae far beyond root hairs, vastly increasing the volume of soil explored for nutrients and water."},
    {q:"Root exudates contribute to rhizosphere acidity by:", opts:["Releasing oxygen","Releasing carbonic acid and organic acids","Absorbing protons","Producing ammonia"], ans:1, exp:"Roots exude low molecular weight organic acids (e.g. citric acid) and respire CO2 which becomes carbonic acid, acidifying the rhizosphere."}
  ],
  summary:`<h4>Overview</h4><p>Plant nutrient uptake depends on the ionic forms of nutrients in soil solution and the mechanisms by which they reach root surfaces. The rhizosphere is the critical interface where plant, microbial and mineral processes intersect.</p><h4>Ion Movement to Roots</h4><p>Three mechanisms: (1) <strong>Diffusion</strong> (slow, concentration-gradient driven): PO₄³⁻, K⁺, Fe³⁺. (2) <strong>Mass flow</strong> (fast, transpiration-driven): Ca, NO₃, SO₄ (80% delivered by mass flow). (3) <strong>Root interception</strong>: root grows into contact with nutrient. Roots also take up O₂ and release CO₂ and exudates.</p><h4>Mycorrhizal Types</h4><p><strong>EM fungi</strong> (Oak, boreal/temperate): retard decomposition, increase SOM, provide organic N. <strong>AM fungi</strong> (Maple, tropical): promote decomposition via free-living microbes, provide inorganic N. Steidinger 2019: EM dominate boreal/temperate; AM dominate tropics.</p><h4>Nitrogen Fixation</h4><p>Symbiotic N fixation: plant-bacteria symbiosis (Rhizobium). Bacteria fix atmospheric N₂ → NH₄⁺ for plant. Plant pays in carbon. Important in N-limited early succession soils.</p><h4>Exam Tips</h4><div class="tip">Know all three ion movement mechanisms and which nutrients use which pathway. EM vs AM distinction is increasingly examinable in global carbon cycle context (Bradford 2014, Steidinger 2019).</div>`,
  terms:[
    {t:"Rhizosphere", d:"The zone of soil immediately surrounding plant roots (within ~2 mm), characterised by high microbial activity, root exudate enrichment, and acidity."},
    {t:"Mineralisation", d:"Microbial conversion of organically bound nutrients (e.g. N in SOM) into inorganic ionic forms (e.g. NH₄⁺) available to plants."},
    {t:"Immobilisation", d:"Uptake of inorganic nutrients (e.g. NH₄⁺) by soil microbes into their biomass, temporarily removing them from plant-available pools."},
    {t:"C:N ratio", d:"The ratio of carbon to nitrogen in organic matter; high C:N leads to N immobilisation; low C:N leads to N mineralisation."},
    {t:"Mycorrhizae", d:"Symbiotic associations between plant roots and fungi that extend the effective root surface area for nutrient and water uptake."},
    {t:"Root exudates", d:"Simple sugars, organic acids and other compounds released by roots into the rhizosphere, fuelling microbial activity and altering soil chemistry."}
  ]
},
"1.9.1": {
  cards:[
    {q:"Why does soil carbon start at zero on newly formed substrates?", a:"Newly formed substrates (volcanic rock, glacial till) have no organic matter — soil C accumulates only once plants establish and begin adding litter."},
    {q:"Name the five key microbial nitrogen transformation processes.", a:"Decomposition, mineralisation (organic N → NH₄⁺), immobilisation (N into microbial biomass), nitrification (NH₄⁺ → NO₃⁻, aerobic), denitrification (NO₃⁻ → N₂/N₂O, anaerobic)."},
    {q:"What does the Hawaiian Islands chronosequence show about nutrient limitation?", a:"Young volcanic islands are N-limited; older islands become P-limited as P weathers and leaches away over millions of years."},
    {q:"What is a space-for-time substitution in ecological research?", a:"Using sites of different ages across space as a proxy for how a single site would change over time — e.g. Hawaiian islands of different ages representing different stages of soil development."},
    {q:"What does the Franz Josef Glacier chronosequence show?", a:"As soils age following glacial retreat, nutrient limitation shifts from early N-limitation to later P-limitation, confirming the Hawaiian pattern."},
    {q:"How does decomposition rate change over time for a given litter sample?", a:"It follows exponential decay: rapid initial loss of labile (easily decomposed) material, then progressively slower breakdown of resistant compounds (lignin, recalcitrant C)."},
    {q:"What climate feedback is associated with faster decomposition?", a:"Warmer temperatures increase decomposition rates, releasing more CO₂ from soils — a positive feedback that could amplify climate warming."},
    {q:"Why does nitrification require aerobic conditions?", a:"Nitrification (NH₄⁺ → NO₃⁻) is carried out by aerobic bacteria that require oxygen; in waterlogged, anaerobic conditions, denitrification occurs instead."},
    {q:"What does the global map of mycorrhizal type distribution show (Steidinger et al. 2019)?", a:"EM (ectomycorrhizal) fungi dominate boreal and temperate forest tree basal area (high latitudes, oak/beech/pine dominated). AM (arbuscular mycorrhizal) fungi dominate tropical forest tree basal area (Amazon, Congo, SE Asia). N-fixing trees (legumes) are abundant mainly in tropical regions where soils are young and P is relatively available but N is limiting. Steidinger et al. 2019, Nature."},
    {q:"How does EM vs AM mycorrhizal type affect carbon and nitrogen cycling?", a:"EM fungi (e.g. Oak): hyphae produce enzymes that access organic N in SOM → retard decomposition → soil organic matter accumulates → C stored. AM fungi (e.g. Maple): rely on free-living microbes to decompose SOM → promote decomposition → less SOM → more inorganic N but less soil C. Bradford 2014, Nature 505. The mycorrhizal type of dominant trees strongly influences ecosystem-scale C and N cycling."}
  ],
  quiz:[
    {q:"In early succession, ecosystems are typically limited by which nutrient?", opts:["Phosphorus","Potassium","Nitrogen","Iron"], ans:2, exp:"Early successional soils are N-limited because N must accumulate through fixation and organic matter build-up."},
    {q:"In very old ecosystems (millions of years), which nutrient becomes limiting?", opts:["Nitrogen","Carbon","Phosphorus","Sulfur"], ans:2, exp:"P declines strongly over time as it is weathered from primary minerals and leached away, making old ecosystems P-limited."},
    {q:"Nitrification converts:", opts:["NO₃⁻ to NH₄⁺","NH₄⁺ to NO₃⁻","Organic N to NH₄⁺","N₂ to NH₄⁺"], ans:1, exp:"Nitrification is the aerobic microbial process converting NH₄⁺ (ammonium) to NO₃⁻ (nitrate)."},
    {q:"Denitrification occurs under:", opts:["High oxygen conditions","Aerobic conditions","Low oxygen/anaerobic conditions","Dry conditions"], ans:2, exp:"Denitrification converts NO₃⁻ to N gases (N₂O, N₂) under low-oxygen (anaerobic) conditions, e.g. waterlogged soils."},
    {q:"The Hawaiian Islands chronosequence is used because:", opts:["Hawaii has unique species","Islands of different ages represent different stages of soil development","It has the richest soils","It shows tropical forest dynamics"], ans:1, exp:"The islands form an age gradient from geologically young to millions of years old, allowing a space-for-time substitution for soil development."}
  ],
  summary:`<h4>Overview</h4><p>Soil nutrients accumulate gradually after ecosystem formation. The balance between inputs (litter, weathering) and outputs (decomposition, leaching) determines nutrient availability.</p><h4>Key N Transformations</h4><p>Decomposition → Mineralisation (organic N → NH₄⁺) → Nitrification (NH₄⁺ → NO₃⁻, aerobic) or Denitrification (NO₃⁻ → gases, anaerobic). Immobilisation locks N in microbial biomass.</p><h4>Nutrient Limitation Shift</h4><p>Critical exam concept: Early succession = <strong>N-limited</strong>. Old ecosystems = <strong>P-limited</strong>. Confirmed by Hawaiian fertilisation experiments and Franz Josef Glacier chronosequence.</p><h4>Exam Tips</h4><div class="tip">The N→P limitation shift is a core concept — know the evidence (Hawaii, Franz Josef). Know all five N cycle processes and the conditions each requires.</div>`,
  terms:[
    {t:"Mineralisation", d:"Microbial conversion of organic nitrogen in SOM into inorganic NH₄⁺, making N plant-available."},
    {t:"Nitrification", d:"Aerobic microbial conversion of NH₄⁺ to NO₃⁻; requires oxygen and is inhibited in waterlogged soils."},
    {t:"Denitrification", d:"Anaerobic microbial conversion of NO₃⁻ to gaseous N forms (N₂O, NO, N₂); occurs in waterlogged/low-oxygen soils."},
    {t:"Chronosequence", d:"A series of sites of different ages used as a proxy for how ecosystems change over time (space-for-time substitution)."},
    {t:"N→P limitation shift", d:"The pattern where early successional soils are nitrogen-limited but very old soils become phosphorus-limited as P is progressively depleted by weathering and leaching."},
    {t:"Exponential decay (decomposition)", d:"The pattern of decomposition where labile compounds break down rapidly at first, then the rate slows as only resistant compounds (lignin) remain."}
  ]
},
"1.10.1": {
  cards:[
    {q:"Why are C, N, and P concentrated near the soil surface?", a:"Because litter inputs, root biomass, and microbial activity are all concentrated near the surface — biological cycling dominates the upper layers."},
    {q:"Why do Mg, Na, Cl, and SO₄ concentrate deeper in the soil profile?", a:"These ions are controlled by weathering and leaching rather than biological cycling, and are less strongly recycled by plants."},
    {q:"Compare soil carbon storage in tundra vs. tropical forests.", a:"Tundra has large C stocks despite low productivity because cold conditions slow decomposition. Tropical forests have low soil C despite high inputs because warm, wet conditions drive very fast decomposition."},
    {q:"What is nitrogen saturation in an ecosystem?", a:"When chronic N inputs exceed the ecosystem's capacity to retain N — excess N is lost via leaching and gaseous emissions rather than being stored."},
    {q:"What are the consequences of nitrogen saturation?", a:"Nitrate leaching into waterways, N₂O emissions (greenhouse gas), coastal dead zones, loss of biodiversity, species shifts toward fast-growing competitive species."},
    {q:"What is the FACE experiment and what did it find?", a:"Free-Air CO₂ Enrichment experiment (Duke Forest). CO₂ initially increased tree growth but over 10 years caused progressive nitrogen limitation — growth response declined on nutrient-poor sites."},
    {q:"How does litter C:N ratio affect nitrogen retention?", a:"Low C:N (&lt;25) → rapid decomposition → more nitrate leaching. High C:N (&gt;25) → microbial immobilisation → greater N retention in soil."},
    {q:"Why doesn't elevated CO₂ guarantee long-term carbon uptake?", a:"Plants need nutrients (especially N and P) to use extra CO₂. On nutrient-poor soils, growth becomes progressively nutrient-limited, constraining the carbon sink response."},
    {q:"Why is not all soil nutrient content available to plants and how do Ca and K differ?", a:"Total nutrient content ≠ available nutrient. For Ca: primary mineral Ca declines over time; exchangeable (available) Ca peaks then declines. For K: primary mineral K declines; secondary K forms then also declines; exchangeable K remains low. Much depends on how individual minerals react with other soil components. Available pools change over time (more next lecture — P fractions)."},
    {q:"What are the fractions of soil phosphorus and why does availability change with soil age?", a:"P exists as: primary minerals (weatherable, declines with time), secondary/occluded minerals (increase then decline), inorganic available (labile — peaks early), and organic P (builds up with biological activity). Much of total soil P is NOT available — locked in occluded or secondary minerals. 'Labile' = readily available to microorganisms. In old tropical soils, almost all P is in unavailable occluded forms."}
  ],
  quiz:[
    {q:"Which biome stores the most soil carbon despite low productivity?", opts:["Tropical forest","Temperate forest","Tundra","Mediterranean shrubland"], ans:2, exp:"Tundra accumulates large soil C stocks because cold temperatures slow decomposition more than they slow production."},
    {q:"Nitrogen saturation occurs when:", opts:["N inputs equal plant demand","N inputs exceed the ecosystem's retention capacity","Soil pH becomes alkaline","Denitrification stops"], ans:1, exp:"N saturation occurs when chronic N loading exceeds the ecosystem's capacity to retain N, leading to N losses."},
    {q:"The FACE experiment showed that elevated CO₂ eventually leads to:", opts:["Unlimited forest growth","Phosphorus limitation only","Progressive nitrogen limitation and reduced growth response","No change in growth"], ans:2, exp:"FACE (Duke Forest) showed initial growth stimulation under elevated CO₂, followed by progressive N limitation as N was locked in extra biomass."},
    {q:"Litter with a C:N ratio below 25 will tend to cause:", opts:["High N immobilisation","More nitrate leaching","Greater N retention","Slower decomposition"], ans:1, exp:"Low C:N litter decomposes rapidly and releases excess N that can leach as nitrate into waterways."},
    {q:"Why do tropical forests often have low soil carbon stocks?", opts:["Low plant productivity","Low rainfall","Very fast decomposition under warm wet conditions","Frequent fires"], ans:2, exp:"Warm, moist tropical conditions drive very rapid decomposition, so organic inputs are quickly mineralised rather than accumulating in soil."}
  ],
  summary:`<h4>Overview</h4><p>Soil nutrients vary systematically with depth and across biomes. Human N deposition and rising CO₂ interact with these patterns in complex ways.</p><h4>Depth Patterns</h4><p>C, N, P: concentrated near surface (biologically cycled). Mg, Na, Cl, SO₄: deeper (weathering-controlled). Subsoil C stabilised by clay minerals.</p><h4>Biome Patterns</h4><p>Tundra & Boreal: high soil C (slow decomposition). Tropical: low soil C (fast decomposition). Storage = inputs minus outputs.</p><h4>N Saturation & CO₂</h4><p>Excess N → saturation → leaching, N₂O, biodiversity loss. Elevated CO₂ → initially more growth → then N-limited (FACE experiment).</p><h4>Exam Tips</h4><div class="tip">The biome C storage ranking is examinable: Tundra ≈ Boreal > Temperate > Tropical for soil C. Explain WHY using temperature/decomposition logic.</div>`,
  terms:[
    {t:"Nitrogen saturation", d:"State where chronic N inputs exceed an ecosystem's retention capacity, leading to N losses via leaching (NO₃⁻) and gas emissions (N₂O)."},
    {t:"FACE experiment", d:"Free-Air CO₂ Enrichment — a field experiment exposing mature forest to elevated CO₂; showed initial growth stimulation followed by progressive N limitation."},
    {t:"Progressive nitrogen limitation", d:"The hypothesis that as ecosystems accumulate biomass under elevated CO₂, N becomes increasingly locked in organic matter, limiting further growth."},
    {t:"N₂O", d:"Nitrous oxide — a potent greenhouse gas produced by denitrification; released in larger quantities when ecosystems become N-saturated."},
    {t:"Subsoil carbon", d:"Organic carbon stored in deeper soil layers, stabilised by association with clay minerals and physical protection from decomposition."}
  ]
},
"1.11.1": {
  cards:[
    {q:"What is a watershed (catchment) and why is it useful?", a:"The area of land draining water, nutrients and solutes to a common outlet. Useful because it links terrestrial and aquatic processes and provides an integrated signal of ecosystem function."},
    {q:"What are mobile anions and why do they matter for nutrient leaching?", a:"Ions not held on soil exchange sites (HCO₃⁻, SO₄²⁻, NO₃⁻, Cl⁻, DOC). They move freely through soil and carry base cations (Ca²⁺, Mg²⁺, K⁺) with them, driving nutrient loss and soil acidification."},
    {q:"Describe the conservative tracer approach in watershed science.", a:"Uses unreactive elements (usually Cl⁻) as tracers. Comparing observed ion concentrations to expected sea-salt ratios reveals whether ions are generated within or consumed by the watershed."},
    {q:"What did Hubbard Brook Experimental Forest research demonstrate?", a:"Forests strongly regulate nutrient retention; deforestation dramatically increases nutrient loss in stream water. Also led to discovery of acid rain impacts."},
    {q:"What are the two main watershed methods?", a:"(1) Input-output budgets: compare annual nutrient inputs vs outputs via water to determine source/sink status. (2) Conservative tracer approach: use Cl⁻ to trace water and ion movement."},
    {q:"Why does the river 'mirror' signal break down in large catchments?", a:"Solutes may be processed within streams; hydrological disconnection from some areas (e.g. peat); near-stream riparian processing dominates the signal; larger catchments have more spatial complexity."},
    {q:"Give three advantages of small watershed studies.", a:"Easier to sample and monitor; easier to manipulate experimentally; stronger terrestrial-aquatic coupling; longer datasets available; early warning of environmental change."},
    {q:"What is a paired watershed study?", a:"Comparing two similar watersheds — one treated (e.g. logged, burned) and one as a control — to isolate the effect of the treatment on water chemistry and nutrient export."}
  ],
  quiz:[
    {q:"Mobile anions are ecologically important because they:", opts:["Bind tightly to soil particles","Leach base cations and drive soil acidification","Are easily taken up by plants","Are immobile in soil water"], ans:1, exp:"Mobile anions (NO3-, SO42-, Cl- etc.) move freely through soil and carry positively-charged base cations (Ca2+, Mg2+) with them, causing nutrient loss and acidification."},
