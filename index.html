<div style="font-size:10px;color:var(--muted);margin-bottom:10px;font-style:italic">Rossby waves in the jet stream transport heat poleward by carrying warm air northward on their eastern flanks and cold air southward on their western flanks — the primary midlatitude heat transport mechanism.</div><h4>Exam Tips</h4><div class="tip">Distinguish tropical (Hadley, direct) from midlatitude (baroclinic eddies, indirect) heat transport clearly. Examiners expect you to explain WHY zonal flow is insufficient and how eddies break the symmetry.</div>`,
  terms:[
    {t:"Baroclinic instability", d:"Instability arising when pressure and density surfaces are not aligned (strong temperature gradients); releases potential energy through growing Rossby waves into cyclones and anticyclones."},
    {t:"Rossby waves", d:"Large-scale planetary waves in the jet stream caused by conservation of absolute vorticity; propagate westward; responsible for midlatitude weather and poleward heat transport."},
    {t:"Absolute vorticity", d:"Sum of planetary vorticity (due to Earth's rotation, = f = 2Ω sinφ) and relative vorticity (spin of air parcel); conserved in frictionless horizontal flow."},
    {t:"Meridional heat transport", d:"Transport of heat from tropics toward poles; accomplished by Hadley Cells in the tropics and baroclinic eddies in midlatitudes."},
    {t:"Hadley Cell", d:"Tropical overturning circulation: rising at ITCZ, poleward aloft, sinking at ~30°, return surface trade winds. The dominant heat transport in tropics."},
    {t:"Polar front jet stream", d:"Strong upper-tropospheric westerly winds at ~50–60°N/S driven by the sharp temperature gradient between polar and tropical air masses."}
  ]
},
"1.10.1": {
  cards:[
    {q:"What is climate sensitivity and what is the best estimate for CO₂ doubling?", a:"Climate sensitivity S = equilibrium temperature change per unit radiative forcing (°C per W/m²), or equivalently the warming for CO₂ doubling. Best estimate: ~2.5–3°C; likely range 1.5–4.5°C. The relationship is ΔT = F/λ where λ is the feedback parameter."},
    {q:"What is the Planck (blackbody) response to CO₂ doubling and why is it an underestimate?", a:"~1°C without feedbacks (CO₂ doubling raises emission height ~150m, cooling emission temperature by ~1°C, so surface must warm ~1°C to restore balance). It's an underestimate because positive feedbacks (water vapour, ice-albedo, clouds) amplify the initial warming."},
    {q:"Describe the water vapour feedback.", a:"Warmer air holds more water vapour (Clausius-Clapeyron: ~7% more per °C). Water vapour is itself a greenhouse gas, causing additional warming, which allows even more water vapour. Strong positive feedback — roughly doubles the Planck response."},
    {q:"Describe the ice-albedo feedback.", a:"Warming melts ice → exposes darker ocean/land surface → lower albedo → more solar absorption → further warming. Strong positive feedback, especially important at high latitudes and for glacial-interglacial cycles."},
    {q:"Why do oceans dominate climate system inertia?", a:"Oceans have an enormous heat capacity. Even if GHG emissions stopped today, oceans would continue absorbing heat for centuries, delaying the full equilibrium temperature response. Sea level rise continues even after surface temperature stabilises."},
    {q:"What is the 'rich get richer, poor get poorer' pattern in hydrological cycle change?", a:"A warming atmosphere holds ~7% more water vapour per °C (Clausius-Clapeyron), but global precipitation increases only ~2%/°C (limited by ability to radiate latent heat to space). Wet regions get wetter; dry regions get drier — intensifying existing patterns."},
    {q:"What Pliocene and Eocene analogues tell us about long-term CO₂ warming?", a:"Pliocene (~400 ppm CO₂): +1.8–3.6°C warmer, sea level several metres higher. Early Eocene (~1400 ppm CO₂): +13°C globally, no permanent ice anywhere. These show long-term consequences of sustained high CO₂ concentrations."},
    {q:"What are negative emissions and why are they controversial?", a:"Removing CO₂ from atmosphere: bioenergy + carbon capture (BECCS), direct air capture (DAC), afforestation. Controversial because scale required is enormous, technology is unproven at scale, and there are ethical issues (land use competition with food). Risky as primary strategy."}
  ],
  quiz:[
    {q:"The best estimate of equilibrium climate sensitivity for CO2 doubling is:",opts:["~0.5°C — extremely low sensitivity","~1.1°C — the Planck response with no feedbacks","~2.5-3°C — including all major fast feedbacks","~10°C — a high-end catastrophic estimate"],ans:2,exp:"Climate sensitivity is ~2.5-3°C per CO2 doubling (likely range 1.5-4.5°C) including fast feedbacks (water vapour, sea ice, clouds). The Planck-only response without feedbacks is ~1.1°C."},
    {q:"The water vapour feedback is strongly positive because:",opts:["Water vapour reflects incoming solar radiation back to space","Warmer air holds ~7% more WV per degree and WV is itself a GHG amplifying further warming","Water vapour forms more clouds which trap longwave radiation","Water vapour reduces surface albedo by keeping surfaces moist"],ans:1,exp:"Clausius-Clapeyron: ~7% more atmospheric WV per °C. Since WV is itself a GHG this creates a strong positive feedback that roughly doubles the Planck response to CO2 forcing."},
    {q:"The Clausius-Clapeyron relation gives approximately how much more water vapour per degree of warming?",opts:["1% per °C — a negligible thermodynamic effect","3% per °C — a moderate thermodynamic effect","7% per °C — a substantial thermodynamic effect","15% per °C — an extreme thermodynamic effect"],ans:2,exp:"The Clausius-Clapeyron relation gives ~7% increase in saturation water vapour per °C temperature rise — the thermodynamic basis for the powerful positive water vapour feedback amplifying climate sensitivity."},
    {q:"Global mean precipitation increases at only ~2%/°C despite 7%/°C more atmospheric WV because:",opts:["Most extra WV falls immediately as very localised intense storms","Global precipitation is energy-constrained by the ability to radiate latent heat to space","Extra WV is stored permanently in the stratosphere and never falls as rain","Ocean evaporation decreases to compensate for extra atmospheric WV"],ans:1,exp:"While atmospheric WV increases 7%/°C global precipitation is limited by the energy available to radiate latent heat to space — an energy budget constraint giving only ~2%/°C increase in global mean rainfall."},
    {q:"The ice-albedo feedback is a positive feedback because:",opts:["Ice absorbs more solar radiation per unit area than open ocean water","Warming melts ice exposing darker surfaces with lower albedo absorbing more solar radiation causing further warming","Ice formation releases latent heat that warms the surrounding atmosphere","Melting ice releases CO2 stored in glaciers amplifying the greenhouse effect"],ans:1,exp:"Ice-albedo feedback: warming melts ice/snow exposing darker ocean or land (lower albedo) absorbing more solar radiation causing further warming. Particularly important at high latitudes."},
    {q:"The 'rich get richer poor get poorer' hydrological pattern under warming means:",opts:["Wealthy nations get more rainfall while economically poor nations get less","Wet regions get wetter and dry regions get drier as the hydrological cycle intensifies","Global rainfall shifts permanently toward the tropical regions","Coastal regions flood while all inland regions dry out uniformly"],ans:1,exp:"As warming intensifies the hydrological cycle wet regions get more precipitation while dry regions experience more drought — amplifying existing patterns because extra WV falls preferentially where dynamics already cause ascent."},
    {q:"The Pliocene (~3-5 Ma) is climatically relevant because:",opts:["It had identical CO2 levels but lower temperatures than today","CO2 was ~400 ppm (similar to today) and sea levels were 15-25m higher — showing long-term consequences","It was the last time CO2 naturally exceeded 280 ppm before industrialisation","Its climate was identical to today making it a perfect analogue"],ans:1,exp:"Pliocene CO2 ~400 ppm (similar to today) but temperatures ~2-3.5°C warmer and sea levels 15-25m higher. This demonstrates the long-term committed warming and sea level rise from current CO2 concentrations."},
    {q:"Carbon budgets suggest that to stay below 2°C of warming:",opts:["All fossil fuel reserves can be burned if paired with sufficient carbon capture","About two-thirds of remaining fossil fuel reserves should not be burned","Only coal must be phased out while oil and gas can continue","Emissions must stop completely and immediately with no further fossil fuel use"],ans:1,exp:"Carbon budget analysis shows approximately two-thirds of remaining fossil fuel reserves must stay unburned to maintain a reasonable probability of staying below 2°C — requiring fundamental transformation of the global energy system."}
  ],
  summary:`<h4>Overview</h4><p>Climate change predictions involve radiative forcing, feedbacks, and the delayed response of the climate system due to ocean inertia.</p><h4>Climate Sensitivity</h4><p>ΔT = F/λ. Planck response ~1.1°C for CO₂ doubling. With feedbacks: ~2.5–3°C (range 1.5–4.5°C). Key feedbacks: water vapour (+, strong), ice-albedo (+), cloud (uncertain, weakly +), Planck (−, stabilising).</p><h4>Hydrological Cycle</h4><p>+7%/°C more WV (Clausius-Clapeyron) but only +2%/°C more rain. Wet regions wetter, dry regions drier. More extreme events.</p><h4>Key Diagrams</h4><svg viewBox="0 0 480 185" xmlns="http://www.w3.org/2000/svg" style="width:100%;border-radius:8px;background:#f0fdf4;margin-bottom:4px">

<div style="font-size:10px;color:var(--muted);margin-bottom:10px;font-style:italic">CO₂ doubling → +1.1°C (Planck only). Positive feedbacks (water vapour +, ice-albedo +) amplify this to ~2.5–3°C equilibrium sensitivity.</div><h4>Exam Tips</h4><div class="tip">Know the feedback types, signs and mechanisms. The climate sensitivity range (1.5–4.5°C) with best estimate ~3°C is a standard exam answer. Always distinguish the Planck response from the full sensitivity.</div>`,
  terms:[
    {t:"Climate sensitivity (S)", d:"Equilibrium temperature change for a given radiative forcing; typically quoted as °C per CO₂ doubling. Best estimate ~3°C; likely range 1.5–4.5°C."},
    {t:"Radiative forcing", d:"Change in Earth's energy balance (W/m²) due to a perturbation such as increased CO₂. CO₂ doubling ≈ +4 W/m² forcing."},
    {t:"Planck (blackbody) feedback", d:"Negative feedback: warmer Earth emits more longwave radiation, stabilising temperature. Alone gives ~1.1°C for CO₂ doubling."},
    {t:"Water vapour feedback", d:"Strong positive feedback: warming → more atmospheric WV → stronger greenhouse effect → more warming. Roughly doubles the Planck response."},
    {t:"Ice-albedo feedback", d:"Positive feedback: warming melts ice → lower albedo → more solar absorption → more warming. Especially strong at high latitudes."},
    {t:"Clausius-Clapeyron relation", d:"Thermodynamic relationship showing saturation water vapour pressure increases ~7% per °C temperature rise — basis of the water vapour feedback."},
    {t:"Climate inertia", d:"The delayed response of the climate system to forcing, dominated by ocean heat capacity; even after emissions stop, warming continues for centuries."}
  ]
},
"1.11.1": {
  cards:[
    {q:"By how much has global mean surface temperature increased since pre-industrial times?", a:"By approximately 1–1.5°C. Warming is stronger over land (~2–3°C in many regions), faster in the Northern Hemisphere, and strongest in the Arctic (Arctic amplification)."},
    {q:"What is Arctic amplification?", a:"The pattern where high northern latitudes warm faster than the global average. Driven by ice-albedo feedback (melting ice exposes darker surfaces) and reduced heat loss from the now ice-free Arctic Ocean, amplifying initial warming."},
    {q:"What changes are observed in the cryosphere?", a:"Arctic sea ice has declined rapidly since the 1970s (thinner, younger ice; summer Arctic now often navigable). Mountain glaciers retreating globally. Greenland and Antarctic ice sheets losing mass. Permafrost thawing at high northern latitudes."},
    {q:"What drives observed sea level rise and what are projections?", a:"Sea level rises from: ocean thermal expansion + melting land ice (glaciers, ice sheets). Rise has been steady and accelerating since the 19th century. By 2100 ~1 metre rise is plausible under high-emission scenarios. Complete Greenland + Antarctic melting = ~70m over very long timescales."},
    {q:"What changes in atmospheric structure are observed?", a:"Tropopause moving upward (troposphere warming and expanding). Stratosphere cooling (less IR escapes from the stratosphere to space as it increasingly escapes from lower in the troposphere). Atmospheric water vapour increasing."},
    {q:"What does ocean salinity data tell us about the hydrological cycle?", a:"Salty ocean regions are getting saltier; fresh regions are getting fresher. This confirms hydrological cycle intensification: more evaporation in already-salty subtropical regions, more rainfall (diluting) in already-fresh high-latitude regions."},
    {q:"How are tropical cyclones changing under climate change?", a:"More intense rainfall (warmer atmosphere holds more moisture). Maximum intensity likely increasing. Not necessarily more frequent, but when they occur they produce more extreme rainfall due to higher sea surface temperatures and atmospheric moisture content."},
    {q:"What circulation changes are observed?", a:"Tropical belt widening, subtropical dry zones shifting poleward. Hadley Cell likely weakening. Jet streams shifting poleward (especially Southern Hemisphere). AMOC changes debated — evidence for weakening exists but is disputed."}
  ],
  quiz:[
    {q:"Global mean surface temperature has increased by approximately how much since pre-industrial times?",opts:["0.2-0.5°C — a small but statistically detectable change","1-1.5°C — a significant and well-documented warming","3-4°C — already past the Paris Agreement targets","5-6°C — equivalent to a full glacial-interglacial cycle"],ans:1,exp:"Global mean surface temperature has risen ~1-1.5°C since ~1850. Land areas have warmed roughly twice as fast as oceans with Arctic regions warming fastest at 2-4 times the global average rate."},
    {q:"The stratosphere is cooling while the troposphere warms because:",opts:["Ozone depletion reduces UV absorption in the stratosphere","Less infrared radiation reaches the stratosphere as it increasingly escapes from lower tropospheric levels","Stratospheric winds transport heat downward into the warming troposphere","CO2 directly cools the stratosphere by emitting more radiation from that level"],ans:1,exp:"As tropospheric GHGs increase more IR escapes from lower warmer tropospheric levels — less reaches the stratosphere to warm it. Simultaneous tropospheric warming and stratospheric cooling is a distinctive fingerprint of greenhouse forcing."},
    {q:"Arctic amplification is primarily driven by:",opts:["Higher solar radiation reaching the Arctic during the long summer day","The ice-albedo positive feedback amplifying regional warming beyond the global average","Reduced ocean heat transport to the Arctic as overturning weakens","Arctic methane emissions from thawing permafrost directly warming the surface"],ans:1,exp:"Arctic amplification (2-4 times global average) is primarily driven by ice-albedo feedback: warming melts sea ice, dark ocean absorbs more solar radiation, further warming, more melting — a powerful self-reinforcing cycle."},
    {q:"Salty ocean regions getting saltier while fresh regions get fresher indicates:",opts:["Ocean circulation slowing down and reducing mixing","Intensification of the hydrological cycle — more evaporation in subtropical regions and more precipitation at high latitudes","Globally decreasing evaporation rates under warming","Changes only in river runoff patterns from glacial melt"],ans:1,exp:"This salinity pattern fingerprints hydrological cycle intensification: enhanced evaporation concentrates salt in already-salty subtropical regions while increased precipitation dilutes already-fresh high-latitude regions."},
    {q:"Complete melting of Greenland and Antarctic ice sheets would raise sea level by approximately:",opts:["1 metre — comparable to projections for 2100","10 metres — a significant but manageable long-term rise","70 metres — catastrophic for all low-lying coastal civilisation","200 metres — enough to flood most continental interiors"],ans:2,exp:"Greenland (~7m) plus Antarctica (~63m) complete melting would raise sea level by approximately 70 metres over thousands of years — demonstrating the enormous long-term commitment from sustained high CO2 concentrations."},
    {q:"Which observed change is a unique fingerprint specifically of greenhouse warming?",opts:["Increased summer temperatures across the tropics","Simultaneous tropospheric warming and stratospheric cooling together","Decreased precipitation in some tropical forest regions","Changes in ENSO frequency and intensity over recent decades"],ans:1,exp:"Simultaneous tropospheric warming with stratospheric cooling is unique to greenhouse forcing. Solar forcing warms both layers; volcanic aerosols cool both. Only GHG increases produce this distinctive vertical temperature pattern."},
    {q:"Arctic sea ice loss since the 1970s is described as unprecedented because:",opts:["It is smaller than natural variability and barely detectable","The rate and extent of decline far exceeds anything in the instrumental satellite record","Sea ice has always been absent during Arctic summers historically","Satellite measurement uncertainties are too large to confirm the trend"],ans:1,exp:"Arctic sea ice decline since 1979 — in both summer extent and ice thickness and age — is unprecedented in the observational record and consistent with ice-albedo feedback amplifying greenhouse warming."},
    {q:"Tropical cyclone intensity under climate change is projected to:",opts:["Decrease as the temperature gradient between tropics and poles reduces","Increase — higher SSTs and atmospheric moisture increase maximum intensity and rainfall rates","Remain unchanged as competing effects exactly cancel out","Increase in frequency but decrease in maximum wind speed"],ans:1,exp:"Higher sea surface temperatures and greater atmospheric WV content project to increase tropical cyclone maximum intensity and rainfall rates. The most intense storms are expected to become more common even if overall frequency changes little."}
  ],
  summary:`<h4>Overview</h4><p>Observed climate change is measured across multiple variables — temperature, cryosphere, sea level, oceans, atmosphere structure and extreme events. The evidence is consistent and robust.</p><h4>Key Observations</h4><p>+1–1.5°C global mean T since pre-industrial. Arctic amplification (strongest warming at high latitudes). Tropopause rising, stratosphere cooling. WV increasing. Arctic sea ice declining rapidly.</p><h4>Sea Level & Ice</h4><p>Sea level rising: thermal expansion + ice melt. Mountain glaciers retreating. Greenland and Antarctic ice sheets losing mass. ~70m if complete melting (millennial timescale). ~1m by 2100 under high emissions.</p><h4>Exam Tips</h4><div class="tip">Arctic amplification and why the stratosphere is COOLING while the troposphere warms are classic exam traps. Practise explaining the opposite trends clearly.</div>`,
  terms:[
    {t:"Arctic amplification", d:"The pattern where Arctic regions warm 2–4× faster than the global average, driven primarily by ice-albedo feedback."},
    {t:"Thermal expansion", d:"The increase in ocean volume as water warms; a major contributor to sea level rise alongside melting land ice."},
    {t:"Stratospheric cooling", d:"The observed cooling of the stratosphere under climate change — a fingerprint of greenhouse warming (more IR escapes from lower troposphere, less reaches stratosphere)."},
    {t:"Cryosphere", d:"The frozen parts of the Earth system: sea ice, glaciers, ice sheets, snow cover, permafrost. All components are showing declining mass or extent under climate change."},
    {t:"Hydrological cycle intensification", d:"The observed speeding up of the global water cycle under warming: more evaporation, more precipitation, stronger extremes. Confirmed by salinity patterns (saltier salty, fresher fresh)."},
    {t:"AMOC", d:"Atlantic Meridional Overturning Circulation — the Atlantic 'conveyor belt' transporting warm surface water northward; evidence for weakening exists but remains debated."}
  ]
},
"2.1.1b": {
  cards:[
    {q:"Why do we study palaeoclimate?", a:"1) Understand climate change mechanisms at different timescales. 2) Distinguish natural from anthropogenic climate variability. 3) Test and improve climate models. 4) Independently estimate climate sensitivity to CO₂ from empirical data rather than models."},
    {q:"What is a climate proxy?", a:"A source of climate information from a natural archive used to reconstruct past climate before instrumental records. Examples: ice cores, tree rings, speleothems, pollen, foraminifera, corals, lake sediments."},
    {q:"What are the main climate archives and what do they record?", a:"Ice cores: temperature, CO₂, CH₄, dust. Marine sediments: deep-sea temperature, ice volume (foraminifera δ¹⁸O). Tree rings: temperature and precipitation. Pollen: vegetation, inferred T and P. Speleothems: cave T and P. Corals: sea surface T."},
    {q:"What are the limitations of instrumental temperature records?", a:"Only ~250 years long — far too short to capture glacial-interglacial cycles, Cenozoic cooling, or longer-term variability. Sparse coverage initially (mainly Europe/N. America). Proxy records are needed for anything older than ~1750."},
    {q:"What is the Late Paleocene Thermal Maximum (LPTM)?", a:"A rapid warming event ~55 million years ago: temperatures rose up to 8°C within <10,000 years. Marked by large spikes in carbon isotopes. Possibly caused by melting of methane clathrates on the seafloor, releasing massive quantities of carbon."},
    {q:"What was the Early Eocene Climatic Optimum?", a:"~50 million years ago, the warmest period of the past 65 million years. Global temperature ~28°C (vs today's ~15°C), no permanent polar ice, temperate forests in the Arctic, rainforests in Northern Europe. CO₂ was ~1400 ppm."},
    {q:"How long do the longest instrumental temperature datasets extend?", a:"Approximately 250 years — the Central England Temperature record (CET) and a few other long series. This is a tiny window compared to the scale of climate change we need to understand."},
    {q:"What Cenozoic climate event began ~35 million years ago?", a:"The onset of Antarctic glaciation, marking the beginning of Cenozoic cooling. This coincided with the opening of the Drake Passage (~25 mya), allowing the Antarctic Circumpolar Current to form and thermally isolate Antarctica."}
  ],
  quiz:[
    {q:"The longest instrumental temperature records extend back approximately:",opts:["50 years — since widespread thermometer networks were established","250 years — the Central England Temperature record and similar series","1000 years — from the Medieval period to the present","10000 years — since the end of the last ice age"],ans:1,exp:"The longest instrumental records (e.g. Central England Temperature) extend back ~250 years — tiny compared to glacial cycle timescales (~100 kyr) and Cenozoic cooling (~65 Myr) that palaeoclimate must address."},
    {q:"The Late Paleocene Thermal Maximum (~55 Ma) was characterised by:",opts:["Gradual cooling over one million years leaving clear sediment layers","Rapid warming of up to 8°C within less than 10000 years with large carbon isotope excursions","A glaciation extending to tropical latitudes affecting all ocean basins","No significant temperature change but a major global sea level fall"],ans:1,exp:"The LPTM was a sudden hyperthermal event: ~8°C warming in less than 10,000 years with massive negative carbon isotope excursions — possibly from methane clathrate destabilisation on the seafloor."},
    {q:"We study palaeoclimate primarily to:",opts:["Find ancient fossil fuels from warm past geological periods","Understand climate mechanisms at all timescales test models and empirically estimate climate sensitivity","Predict exact future temperatures without relying on climate models","Identify precisely when humans first affected global climate"],ans:1,exp:"Palaeoclimate allows us to understand climate change mechanisms beyond the short instrumental record, validate climate models against past conditions, and derive empirical estimates of climate sensitivity from geological CO2-temperature pairings."},
    {q:"The Early Eocene Climatic Optimum (~50 Ma) had global temperatures approximately:",opts:["5°C cooler than today — a cold greenhouse world","Same as today — making it a useful modern analogue","~28°C — about 13°C warmer than today with no permanent polar ice","50°C — too hot for most complex life to survive"],ans:2,exp:"The Early Eocene was the warmest period of the last 65 million years: global T ~28°C (~13°C above today), CO2 ~1400 ppm, no permanent polar ice, and temperate forests in the Arctic."},
    {q:"The opening of Drake Passage (~25 Ma) contributed to Antarctic glaciation by:",opts:["Dramatically increasing volcanic activity around Antarctica","Allowing the ACC to form thermally isolating Antarctica from warm tropical water","Closing the Tethys Sea and redirecting warm currents","Directly reducing solar radiation reaching Antarctica through orbital changes"],ans:1,exp:"Drake Passage opening allowed the ACC to form cutting off exchange of warm tropical water with Antarctica. This thermal isolation facilitated build-up of the permanent Antarctic ice sheet beginning ~34 Ma."},
    {q:"Methane clathrates are potentially relevant to the LPTM because:",opts:["They form the main fossil fuel reserves of the Paleocene period","Their destabilisation could rapidly release large carbon amounts explaining the isotope excursion","They are found only in Arctic permafrost not in ocean floor sediments","They absorb atmospheric methane causing cooling rather than warming"],ans:1,exp:"Methane clathrates on the seafloor could destabilise if ocean temperatures rise rapidly releasing large CH4 pulses — consistent with the large negative carbon isotope excursion and geologically rapid warming of the LPTM."},
    {q:"Empirically estimating climate sensitivity from palaeoclimate data involves:",opts:["Running climate models with reconstructed past boundary conditions","Pairing reconstructed CO2 with reconstructed temperatures to derive T response per CO2 change independently of models","Measuring isotopes in modern ice cores to project future climate","Extrapolating modern instrumental temperature trends backward in time"],ans:1,exp:"Palaeoclimate empirical sensitivity: pair CO2 reconstructions (ice cores, boron isotopes) with temperature reconstructions (proxies) to derive sensitivity estimates independent of model assumptions — a powerful cross-check on model-based estimates."},
    {q:"The Cenozoic cooling trend occurred despite:",opts:["Declining solar luminosity weakening the greenhouse effect","Increasing solar luminosity — the Sun was getting stronger not weaker","Decreasing volcanic activity reducing CO2 outgassing","Ice-albedo feedbacks that should have amplified warming"],ans:1,exp:"Solar luminosity increased through the Cenozoic which should have caused warming. That cooling occurred despite a stronger Sun demonstrates declining CO2 was the dominant climate forcing — evidence for CO2's central climatic role."}
  ],
  summary:`<h4>Overview</h4><p>Palaeoclimatology extends our understanding of climate beyond the ~250-year instrumental record using proxy data from ice cores, sediments, tree rings, and other natural archives.</p><h4>Why It Matters</h4><p>1) Understand mechanisms at all timescales. 2) Separate natural from anthropogenic change. 3) Test climate models. 4) Empirically estimate climate sensitivity from CO₂-T relationships.</p><h4>Key Events in the Cenozoic</h4><p>Early Eocene Climatic Optimum (~50 Ma): 28°C, CO₂ ~1400 ppm, no ice. LPTM (~55 Ma): +8°C in &lt;10 kyr, methane clathrates? Antarctic glaciation onset ~35 Ma. Continuing cooling to present.</p><h4>Exam Tips</h4><div class="tip">Always justify WHY proxies are needed (250-year limit of instruments). The LPTM and Eocene Optimum numbers (8°C, 28°C, 1400 ppm) are highly examinable.</div>`,
  terms:[
    {t:"Climate proxy", d:"Natural archives recording past climate conditions; examples include ice cores, foraminifera, tree rings, speleothems, pollen, corals, lake sediments."},
    {t:"LPTM", d:"Late Paleocene Thermal Maximum (~55 Ma) — rapid warming of up to 8°C in <10,000 years, likely from methane clathrate destabilisation; marked by large carbon isotope excursions."},
    {t:"Early Eocene Climatic Optimum", d:"The warmest period of the past 65 million years (~50 Ma); global T ~28°C, CO₂ ~1400 ppm, no permanent ice, forests at the poles."},
    {t:"Drake Passage opening", d:"Tectonic opening of the gap between South America and Antarctica (~25 Ma), allowing formation of the Antarctic Circumpolar Current and thermal isolation of Antarctica."},
    {t:"Cenozoic cooling", d:"The long-term cooling trend over the past ~35 million years from the Eocene Optimum to present, driven by declining CO₂ and changes in ocean circulation."},
    {t:"Methane clathrate", d:"Ice-like compounds trapping methane in seafloor sediments; destabilisation during warming can release massive CH₄ pulses (a potential amplifier of rapid warming events like the LPTM)."}
  ]
},
"2.2.1": {
  cards:[
    {q:"What information can be extracted from ice cores?", a:"Air temperature (from δ¹⁸O and δD isotopes), atmospheric composition (CO₂, CH₄ from trapped air bubbles), precipitation amounts, dust (wind strength), volcanic aerosols (volcanic layers), solar output (¹⁰Be and ¹⁴C production rates)."},
    {q:"How does oxygen isotope fractionation record temperature in ice cores?", a:"Heavy water (H₂¹⁸O) behaves differently in the water cycle: it evaporates less readily but condenses more readily than normal water (H₂¹⁶O). Temperature-dependent fractionation means warmer temperatures produce less isotopically depleted precipitation — more depleted (lower δ¹⁸O) = colder temperatures."},
    {q:"Name the major ice core drilling projects and their records.", a:"Greenland: GRIP, GISP2, NGRIP (100,000-year record, last interglacial). NEEM (deeper). Antarctica: Vostok (400,000 years), EPICA/Dome-C (800,000 years = 8 glacial cycles, costs €20 million, drills 3km). Byrd."},
    {q:"How are ice cores dated?", a:"Layer counting (annual layers visible in fresh ice, <1% error but fails in compressed deep ice). Ice flow modelling (mathematical model of thinning with depth). Volcanic ash layers (dated eruptions provide tie points). Wiggle-matching to independently dated records."},
    {q:"What are foraminifera and why are they useful for palaeoclimate?", a:"Single-celled marine amoeboid protists (0.4–10mm) that build calcium carbonate shells. Both planktonic (surface ocean) and benthic (seafloor) forms exist. Their δ¹⁸O and Mg/Ca ratios record past ocean temperature and ice volume."},
    {q:"Explain the two effects that control benthic vs planktonic foraminifera δ¹⁸O.", a:"1) Ice volume effect: more water locked in ice sheets → ocean more enriched in ¹⁸O (higher δ¹⁸O; ~1‰ per 100m sea level drop). 2) Temperature effect: colder water → higher δ¹⁸O in shells (~0.25‰/°C). Benthic forams mainly record ice volume; planktonic reflect T, salinity and ice volume."},
    {q:"What is Marine Isotope Stratigraphy (MIS)?", a:"A global stratigraphic framework based on δ¹⁸O cycles in benthic foraminifera, which are consistent worldwide. MIS odd numbers = warm interglacials (low δ¹⁸O); even numbers = cold glacials (high δ¹⁸O). Used to correlate ocean sediment records globally."},
    {q:"What are the two alternative palaeothermometers beyond δ¹⁸O?", a:"1) Alkenones: organic compounds (long-chain ketones) produced by coccolithophore algae — their 'saturation index' (Uk'37) correlates with sea surface temperature. 2) Mg/Ca ratio in foram shells: higher Mg/Ca = warmer formation temperature."}
  ],
  quiz:[
    {q:"The EPICA Dome-C ice core provides a climate record spanning:",opts:["10000 years covering the Holocene only","100000 years covering one complete glacial cycle","400000 years covering four glacial cycles","800000 years covering eight complete glacial cycles"],ans:3,exp:"The EPICA Dome-C core drilled 3km deep in Antarctica provides 800,000 years of climate history covering eight complete glacial-interglacial cycles — the longest continuous climate record from any ice core."},
    {q:"In Antarctic ice cores more depleted (lower) delta-18-O values indicate:",opts:["Warmer temperatures during snowfall accumulation","Lower temperatures during snowfall — greater isotopic fractionation on cold transport paths","Higher sea levels at the time of snow deposition","Higher atmospheric CO2 concentrations during that period"],ans:1,exp:"In ice cores colder conditions produce greater isotopic depletion (lower delta-18-O) because heavy water molecules are preferentially removed from vapour during the long cold transport path to Antarctica."},
    {q:"In marine benthic foraminifera higher delta-18-O values indicate:",opts:["Warmer deep ocean temperatures and smaller ice sheets","Same temperature but higher ocean salinity","More continental ice volume and/or colder deep ocean temperatures","Higher surface productivity in ocean waters above"],ans:2,exp:"Higher benthic foram delta-18-O indicates MORE water locked in ice sheets (ocean enriched in 18-O) AND/OR colder deep ocean temperatures. This is OPPOSITE in direction to ice core delta-18-O — a classic exam trap."},
    {q:"Marine Isotope Stages with odd numbers (MIS 1, 3, 5) represent:",opts:["Cold glacial periods with large continental ice sheets","Transitional periods between full glacials and interglacials","Warm interglacial periods with low ice volume and low benthic delta-18-O","Periods of high volcanic activity causing brief warmings"],ans:2,exp:"Odd MIS numbers represent warm interglacials (low benthic delta-18-O = less ice and warmer deep ocean) while even numbers represent cold glacials with large ice sheets and high delta-18-O values."},
    {q:"The Mg/Ca ratio in foraminiferal shells is used as a palaeothermometer because:",opts:["Mg is more abundant in warm seawater and substitutes more for Ca in shells at higher temperatures","Ca/Mg ratios are constant at all temperatures providing a dating tool","Mg solubility decreases with temperature enriching cold-water shells","Mg is only incorporated into shells during warm interglacial periods"],ans:0,exp:"Mg substitution for Ca in CaCO3 shells increases systematically with temperature during shell formation, providing a palaeothermometer independent of the isotope effects that can complicate delta-18-O interpretation."},
    {q:"Ice cores record past atmospheric CO2 because:",opts:["CO2 reacts with ice to form carbonate minerals preserving the signal","Air bubbles trapped as snow compresses to ice preserve ancient atmospheric composition directly","CO2 concentrations are inferred indirectly from dust layer chemistry","Isotopic fractionation of carbon in the ice reflects past CO2 levels"],ans:1,exp:"As snow accumulates and compresses to firn and then glacial ice air bubbles are sealed in trapping samples of the ancient atmosphere. Direct analysis of these bubbles measures past CO2 CH4 and N2O concentrations."},
    {q:"The alkenone Uk'37 palaeothermometer works because:",opts:["Alkenones are produced only during warm interglacial conditions","The degree of unsaturation of alkenones produced by coccolithophores correlates with sea surface temperature","Alkenone concentration reflects ice volume rather than temperature","Alkenones have a radioactive decay rate useful for independent dating"],ans:1,exp:"Coccolithophores adjust the degree of unsaturation of their alkenone lipids in response to growth temperature. The Uk'37 unsaturation index preserved in sediments provides a quantitative sea surface temperature proxy."},
    {q:"The key difference between ice core and marine foram delta-18-O interpretations is:",opts:["They record exactly the same signal and can be directly compared","Ice cores: more depleted = COLDER; Marine forams: more enriched = MORE ICE AND COLDER — opposite directions","Ice cores record temperature only while forams record only ice volume","Marine forams are more reliable as they cover longer timescales"],ans:1,exp:"Ice cores: lower delta-18-O = colder. Marine benthic forams: higher delta-18-O = more ice and/or colder deep water. The signals work in OPPOSITE directions — a classic exam trap that catches many students."}
  ],
  summary:`<h4>Overview</h4><p>Ice cores and marine sediments are the primary tools for reconstructing past climate on glacial-interglacial timescales. They record complementary signals.</p><h4>Ice Cores</h4><p>EPICA: 800 kyr, 8 glacial cycles. Temperature from δ¹⁸O and δD (MORE depleted = COLDER). CO₂ and CH₄ from trapped bubbles. Dust = wind. Volcanic layers = dating.</p><h4>Marine Foraminifera</h4><p>Benthic δ¹⁸O: mainly ice volume (also deep-ocean T). Higher δ¹⁸O = more ice. OPPOSITE direction to ice cores! MIS: odd = interglacial (warm), even = glacial (cold). Alternative thermometers: alkenones (Uk'37), Mg/Ca.</p><h4>Key Diagrams</h4><svg viewBox="0 0 480 195" xmlns="http://www.w3.org/2000/svg" style="width:100%;border-radius:8px;background:#f0fdf4;margin-bottom:4px">
  <text x="240" y="15" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Ice Core vs Marine Foram δ¹⁸O — Opposite Directions!</text>
  <!-- Ice core panel -->
  <rect x="25" y="25" width="200" height="155" rx="5" fill="#dbeafe" opacity="0.4"/>
  <text x="125" y="40" text-anchor="middle" font-size="10" font-weight="bold" fill="#1d4ed8">Ice Core (Antarctic)</text>

  <line x1="40" y1="50" x2="40" y2="160" stroke="#333" stroke-width="1"/>
  <line x1="40" y1="160" x2="215" y2="160" stroke="#333" stroke-width="1"/>
  <text x="127" y="172" text-anchor="middle" font-size="8" fill="#555">Time →</text>
  <text x="35" y="50" font-size="8" fill="#1d4ed8" text-anchor="end">-400</text>
  <text x="35" y="160" font-size="8" fill="#1d4ed8" text-anchor="end">-470</text>
  <text x="18" y="107" font-size="8" fill="#1d4ed8" transform="rotate(-90,18,107)">δ¹⁸O (‰)</text>

  <!-- Labels -->
  <text x="125" y="68" text-anchor="middle" font-size="8" fill="#16a34a">← depleted = WARM</text>

  <path d="M 275,130 C 295,135 305,80 320,125 C 335,145 345,85 360,130 C 375,150 385,90 400,135 C 415,155 425,95 440,130" stroke="#d97706" stroke-width="2" fill="none"/>
  <text x="355" y="68" text-anchor="middle" font-size="8" fill="#16a34a">← depleted = LESS ICE</text>
  <text x="355" y="150" text-anchor="middle" font-size="8" fill="#e53e3e">← enriched = MORE ICE</text>
  <!-- Warning banner -->
  <rect x="25" y="180" width="430" height="14" rx="3" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>

<div style="font-size:10px;color:var(--muted);margin-bottom:10px;font-style:italic">The most common exam mistake — the two proxies work in opposite directions. Never confuse them.</div><h4>Exam Tips</h4><div class="tip">The opposite isotope directions in ice cores vs forams is a classic exam trap. Ice core: depleted = cold. Marine foram: enriched = cold + more ice. Make sure you can explain WHY each works in its direction.</div>`,
  terms:[
    {t:"δ¹⁸O (delta-18-O)", d:"Isotopic ratio of ¹⁸O to ¹⁶O relative to a standard; records temperature in ice cores (depleted = cold) and ice volume + temperature in marine forams (enriched = more ice/colder)."},
    {t:"Isotope fractionation", d:"Temperature-dependent differential partitioning of heavy and light isotopes during phase transitions (evaporation, condensation) in the water cycle."},
    {t:"EPICA", d:"European Project for Ice Coring in Antarctica — Dome-C ice core providing 800,000-year record of 8 complete glacial cycles; drilled 3km."},
    {t:"Benthic foraminifera", d:"Seafloor-dwelling single-celled organisms whose shell δ¹⁸O records deep-ocean temperature and continental ice volume; basis of Marine Isotope Stratigraphy."},
    {t:"Marine Isotope Stratigraphy (MIS)", d:"Global stratigraphic framework using benthic foram δ¹⁸O cycles; odd stages = warm interglacials, even stages = cold glacials."},
    {t:"Alkenones (Uk'37)", d:"Long-chain organic compounds produced by coccolithophores; the degree of unsaturation (Uk'37 index) is a sea surface temperature proxy."},
    {t:"Mg/Ca thermometry", d:"Use of Mg/Ca ratio in foraminiferal shells as a palaeothermometer; higher Mg/Ca indicates higher formation temperature."}
  ]

"2.3.1": {
  cards:[
    {q:"What is the BLAG model and what does it propose?", a:"Berner, Lasaga & Garrels (1983): long-term CO₂ decline driven by decreasing volcanic outgassing rates. As seafloor spreading rates decline, less CO₂ is emitted by volcanoes relative to weathering sequestration. Problem: spreading increased again ~15 Ma while cooling continued."},
    {q:"What is the Uplift-Weathering model and what does it propose?", a:"Raymo & Ruddiman (1992): CO₂ decline driven by increased chemical weathering due to Himalayan uplift. India-Asia collision ~50 Ma → Himalayan uplift → physical weathering increases surface area → faster chemical weathering → more CO₂ drawdown. Supported by large Himalayan sediment production especially in last 15 Myr."},
    {q:"What opened the Drake Passage and what were the consequences?", a:"Separation of South America from Antarctica ~25 Ma opened the Drake Passage, allowing formation of the Antarctic Circumpolar Current. This thermally isolated Antarctica from warm tropical water, reducing heat transport to the S. pole and initiating Antarctic glaciation."},
    {q:"Describe the Snowball Earth events.", a:"~716 Ma and ~635 Ma: glaciation extended to equatorial latitudes (glacial paleolatitude near 0°). Between snowball episodes: ice-free hot-house conditions. Ended by CO₂ buildup from continuous volcanic outgassing when the carbon cycle was interrupted by ice cover."},
    {q:"What are the three main proposed drivers of Cenozoic CO₂ decline?", a:"1) BLAG: decreased volcanic outgassing (decreasing seafloor spreading). 2) Uplift-weathering: increased weathering from Himalayan uplift (Raymo & Ruddiman). 3) Equatorial convergence of India: outgassing and subsequent weathering of Deccan Traps (Kent & Muttoni). All three contributed."},
    {q:"What is the weathering feedback and why does it prevent CO₂ from disappearing entirely?", a:"When CO₂ falls too low, global temperature drops, reducing weathering rates (slower chemical reactions in cold conditions). Less CO₂ drawdown → CO₂ stabilises. And vice versa. This negative feedback stabilises long-term CO₂, preventing it from dropping to zero."},
    {q:"What evidence supports the Uplift-Weathering model?", a:"The Himalayas are unusually large and have produced anomalously large volumes of sediment, especially in the last 15 million years — consistent with accelerating physical and chemical weathering driving CO₂ drawdown. Strontium isotope records in marine sediments support increased continental weathering."},
    {q:"Why did continuous Cenozoic cooling not stop the sun getting stronger?", a:"Solar luminosity has increased ~30% since Earth formed and was stronger during Cenozoic than earlier. The long-term Cenozoic cooling despite a stronger sun shows the cooling was driven by declining CO₂ (and related changes), not solar output — which actually opposes the cooling trend."}
  ],
  quiz:[
    {q:"The opening of Drake Passage contributed to Antarctic glaciation by:",opts:["Increasing CO2 from volcanic outgassing in the opening rift zone","Allowing the ACC to form thermally isolating Antarctica from warm oceanic water","Closing the Tethys Sea and cooling the global tropical ocean","Changing Earth's axial obliquity by removing continental mass constraints"],ans:1,exp:"Drake Passage opening (~25 Ma) allowed the Antarctic Circumpolar Current to form preventing warm tropical water from reaching Antarctica and facilitating development of the permanent Antarctic ice sheet."},
    {q:"The BLAG model explains Cenozoic CO2 decline through:",opts:["Himalayan uplift increasing weathering rates and CO2 drawdown","Declining volcanic outgassing as seafloor spreading rates fell through the Cenozoic","Increased organic carbon burial in expanding coal and peat deposits","Ocean acidification removing more CO2 from the atmosphere progressively"],ans:1,exp:"BLAG (Berner Lasaga & Garrels 1983): declining seafloor spreading rates reduced volcanic CO2 outgassing tipping the balance toward net drawdown by silicate weathering — producing long-term Cenozoic cooling."},
    {q:"The Uplift-Weathering model (Raymo & Ruddiman 1992) proposes CO2 decline due to:",opts:["Reduced volcanic activity as India separated from the Tethys region","India-Asia collision causing Himalayan uplift increasing physical weathering and CO2 drawdown","Expansion of C4 grasslands across Asia drawing down atmospheric CO2","Opening of the Drake Passage changing ocean circulation and carbon cycling"],ans:1,exp:"Himalayan uplift from India-Asia collision (~50 Ma) dramatically increased physical weathering of silicate rocks accelerating chemical weathering reactions that permanently remove CO2 from the atmosphere."},
    {q:"Snowball Earth events ended because:",opts:["Orbital forcing brought more solar radiation to equatorial latitudes","Volcanic CO2 accumulated while weathering was suppressed by ice until it melted the ice cover","Biological photosynthesis increased oxygen enough to trigger ice melting","A large asteroid impact released enough energy to thaw the global ice cover"],ans:1,exp:"With Earth frozen silicate weathering stopped removing CO2 but volcanoes continued emitting it. Over millions of years volcanic CO2 accumulated until the greenhouse effect was sufficient to melt the global ice cover."},
    {q:"The silicate weathering negative feedback prevents CO2 declining to zero because:",opts:["Plants always produce enough CO2 through respiration to maintain levels","Lower CO2 → cooler temperatures → slower weathering kinetics → less drawdown → CO2 stabilises","The ocean always releases stored CO2 when atmospheric levels fall","Volcanic outgassing perfectly tracks and compensates any change in weathering rate"],ans:1,exp:"Lower CO2 → cooler climate → slower chemical weathering reactions (temperature-dependent kinetics) → less CO2 drawdown → CO2 stabilises. This negative feedback prevents runaway CO2 depletion over geological timescales."},
    {q:"The Cenozoic cooling trend is significant because it occurred despite:",opts:["Declining solar luminosity weakening the greenhouse effect","Increasing solar luminosity — the Sun was getting stronger not weaker","Decreasing volcanic activity reducing greenhouse warming","Ice-albedo feedbacks that should have amplified warming"],ans:1,exp:"Solar luminosity increased through the Cenozoic which should have caused warming. Cooling despite a stronger Sun demonstrates declining CO2 was the dominant forcing — key evidence for CO2's role in long-term climate."},
    {q:"Evidence supporting the Uplift-Weathering model includes:",opts:["Declining seafloor spreading rates matching the CO2 decrease timeline","Anomalously large Himalayan sediment production especially from ~15 Ma and changing marine strontium isotope ratios","Fossil evidence of reduced plant diversity across southern Asia","Geochemical evidence of reduced ocean salinity near the Himalayas"],ans:1,exp:"Large Himalayan sediment volumes (especially from ~15 Ma) indicate rapid physical weathering. Marine Sr isotope ratios shift toward more radiogenic continental values consistent with increased weathering of fresh Himalayan rocks."},
    {q:"All three proposed causes of Cenozoic CO2 decline have limitations because:",opts:["None of them predict any significant CO2 change over the Cenozoic","Each explains some but not all features of the CO2 record — the true explanation likely involves all three","They all predict CO2 should have increased not decreased over this period","None of them are supported by any geological or geochemical evidence"],ans:1,exp:"BLAG has timing issues (spreading increased again ~15 Ma while cooling continued). Uplift-Weathering struggles with early Cenozoic cooling. All three likely contributed in combination — no single mechanism fully explains the observed long-term decline."}
  ],
  summary:`<h4>Overview</h4><p>The Cenozoic (last 65 million years) shows a long-term cooling trend driven by declining CO₂, despite the Sun getting stronger — demonstrating CO₂'s dominant role in long-term climate.</p><h4>Three CO₂ Decline Hypotheses</h4><p><strong>BLAG:</strong> less volcanic outgassing. <strong>Uplift-weathering:</strong> Himalayan uplift → more weathering. <strong>Equatorial India convergence:</strong> Deccan Traps. All three contributed. Negative weathering feedback prevents CO₂ reaching zero.</p><h4>Key Events</h4><p>Snowball Earth: ~716 Ma and ~635 Ma. Drake Passage ~25 Ma → ACC → Antarctic isolation → glaciation. LPTM ~55 Ma: +8°C in <10 kyr (methane clathrates?). Eocene Optimum ~50 Ma: warmest Cenozoic period.</p><h4>Key Diagrams</h4><svg viewBox="0 0 480 185" xmlns="http://www.w3.org/2000/svg" style="width:100%;border-radius:8px;background:#fff7ed;margin-bottom:4px">

"2.4.1": {
  cards:[
    {q:"Name the three Milankovitch cycles with their periods.", a:"Eccentricity (100 kyr and 400 kyr): shape of orbit from circular to elliptical. Obliquity (41 kyr): axial tilt varies 22–24.5°. Precession (19–23 kyr): wobble of Earth's axis, shifts timing of perihelion."},
    {q:"Why is Northern Hemisphere summer insolation the key control on glacial cycles?", a:"Antarctica is ocean-isolated and cannot grow large ice sheets. Only NH ice sheets respond to orbital forcing. Ice sheets melt primarily in summer, so NH summer insolation determines whether ice grows or shrinks. Low summer insolation → more ice; high summer insolation → ice melt."},
    {q:"What is the 100 kyr problem?", a:"Eccentricity has a weak direct effect on total insolation, yet the last 800,000 years show dominant 100 kyr glacial cycles. Huybers & Wunsch (2005) argue glacials are actually 80 or 120 kyr (combining 2–3 obliquity cycles), and obliquity is the true pacemaker, not eccentricity."},
    {q:"What is the Mid-Pleistocene Transition (MPT)?", a:"Between 1.2–0.8 million years ago, glacial cycles shifted from 41 kyr (obliquity-paced) to longer 80–120 kyr cycles. Before 900 ka, every obliquity peak triggered deglaciation. After, only particularly strong orbital combinations could melt the larger ice sheets that formed under cooler boundary conditions."},
    {q:"How does CO₂ amplify orbital forcing?", a:"Milankovitch cycles initiate climate change (low summer insolation → ice growth). Feedback: colder ocean absorbs more CO₂ (higher solubility) + reduced deep-water formation strengthens biological pump → CO₂ drops further → amplifies cooling. Ice-core records show CO₂ and temperature are tightly coupled, with CO₂ acting as an amplifier."},
    {q:"Why do larger ice sheets melt more easily?", a:"Three mechanisms: 1) Larger ice sheets store more internal heat and flow faster (ice dynamics). 2) Their surfaces accumulate more dust (from arid glacial conditions), lowering albedo. 3) Changed ocean circulation releases CO₂ from the deep ocean, amplifying warming."},
    {q:"What does spectral analysis of marine δ¹⁸O records show?", a:"Strong spectral peaks at 100 kyr, 41 kyr, 23 kyr and 19 kyr — exactly matching the Milankovitch frequencies of eccentricity, obliquity and precession (two precession components). This is strong evidence for orbital control of glacial cycles."},
    {q:"Define ablation and accumulation in the context of ice sheets.", a:"Accumulation = addition of ice/snow to an ice sheet. Ablation = loss of ice through melting, calving and sublimation. Ice sheet mass balance = accumulation minus ablation. Minimum summer insolation → reduced ablation → positive mass balance → ice sheet grows."}
  ],
  quiz:[
    {q:"The obliquity Milankovitch cycle has a period of approximately:",opts:["19-23 thousand years — the shortest Milankovitch cycle","41 thousand years — controlling variation in Earth's axial tilt","100 thousand years — the dominant recent glacial period","400 thousand years — the longest eccentricity cycle"],ans:1,exp:"Obliquity (variation in Earth's axial tilt between 22-24.5°) cycles at ~41 kyr. It was the dominant glacial pacemaker before the Mid-Pleistocene Transition (~800 ka) when every obliquity maximum triggered deglaciation."},
    {q:"Northern Hemisphere summer insolation controls glacial cycles because:",opts:["Antarctica cannot grow large ice sheets that respond to orbital forcing","Ice sheets are thickest in summer making it the dominant ablation season","The Southern Hemisphere has no land mass to support ice sheets","Precession affects only Northern Hemisphere insolation not Southern"],ans:0,exp:"Antarctica is thermally isolated by the ACC and ocean-surrounded — it cannot grow large dynamic ice sheets. Only NH ice sheets controlled global ice volume changes and they respond to NH summer insolation (the melt season)."},
    {q:"The '100 kyr problem' in Milankovitch theory refers to:",opts:["The mismatch between the 41 kyr obliquity period and observed glacial pacing","Eccentricity having a weak direct insolation effect yet dominant ~100 kyr glacial cycles in the last 800 kyr","Precession being unable to explain any observed glacial cycles","CO2 responding exactly 100 kyr after orbital forcing in ice core records"],ans:1,exp:"Eccentricity changes total annual insolation by less than 0.1% yet the last 800 kyr shows dominant ~100 kyr glacial cycles — far stronger than eccentricity forcing alone could directly produce."},
    {q:"Huybers and Wunsch (2005) proposed the apparent 100 kyr cycle is actually:",opts:["Driven by eccentricity through a nonlinear resonance mechanism","The result of glacials lasting either 80 or 120 kyr (two or three obliquity cycles) combined","An artefact of poor dating in deep sea sediment records","Caused by CO2 feedbacks amplifying the weak eccentricity forcing"],ans:1,exp:"Huybers & Wunsch: the apparent ~100 kyr is actually glacials of variable length — either 80 kyr (2 obliquity cycles) or 120 kyr (3 obliquity cycles). Averaging gives ~100 kyr with obliquity as the true pacemaker."},
    {q:"The Mid-Pleistocene Transition (~800 ka) involved:",opts:["A switch from 100 kyr cycles to 41 kyr cycles as ice sheets grew larger","A switch from 41 kyr obliquity-paced cycles to longer 80-120 kyr cycles as boundary conditions cooled","The onset of Northern Hemisphere glaciation for the first time","A major extinction event that reset global temperature patterns"],ans:1,exp:"Before ~800 ka every 41 kyr obliquity peak triggered deglaciation. After the MPT cooler background conditions allowed larger ice sheets to persist through one or more obliquity cycles before finally melting — producing apparent ~100 kyr cycles."},
    {q:"CO2 amplifies Milankovitch forcing primarily because:",opts:["CO2 changes directly cause the orbital variations in the first place","Colder glacial oceans absorb more CO2 (higher solubility) and the biological pump strengthens further reducing atmospheric CO2","Volcanic CO2 increases during glacials amplifying orbital cooling","CO2 changes cause ice-albedo feedback to operate faster and more strongly"],ans:1,exp:"During glacials colder oceans have higher CO2 solubility and reduced overturning strengthens the biological pump. Atmospheric CO2 drops amplifying cooling well beyond what insolation forcing alone could achieve."},
    {q:"Spectral analysis of marine benthic delta-18-O records shows peaks at:",opts:["Random periods with no correspondence to any orbital frequencies","Exactly 100, 41, 23 and 19 kyr matching eccentricity, obliquity and two precession components","Only 100 kyr with no signal at obliquity or precession periods","41 kyr only before 800 ka with no other orbital frequencies present"],ans:1,exp:"Marine isotope records show strong spectral peaks at 100, 41, 23 and 19 kyr — precisely matching the Milankovitch frequencies — compelling evidence for orbital pacemaking of glacial cycles."},
    {q:"Precession affects climate by:",opts:["Changing total annual solar radiation received by Earth by up to 5%","Shifting the timing of perihelion relative to seasons determining which hemisphere gets intense summer insolation","Changing Earth's axial tilt and the intensity of seasonal contrast","Changing the eccentricity of Earth's orbit on a 23 kyr timescale"],ans:1,exp:"Precession shifts perihelion timing through the year on a ~19-23 kyr cycle. Currently perihelion is in January (NH winter); 11 kyr ago it was in July giving NH summers much more intense insolation contributing to the last deglaciation."}
  ],
  summary:`<h4>Overview</h4><p>Milankovitch cycles are the primary pacemaker of Quaternary glacial-interglacial oscillations, though CO₂ feedbacks amplify the initial orbital signal substantially.</p><h4>Three Cycles</h4><p><strong>Eccentricity:</strong> 100/400 kyr, orbital shape. <strong>Obliquity:</strong> 41 kyr, axial tilt (22–24.5°). <strong>Precession:</strong> 19–23 kyr, axis wobble. NH summer insolation = the critical variable.</p><h4>100 kyr Problem & MPT</h4><p>Eccentricity has weak direct effect yet dominates last 800 kyr. Huybers & Wunsch: glacials are 80 or 120 kyr (2-3 obliquity cycles). MPT ~800 ka: switch from 41 kyr to longer cycles as boundary conditions cooled.</p><h4>Key Diagrams</h4><svg viewBox="0 0 480 210" xmlns="http://www.w3.org/2000/svg" style="width:100%;border-radius:8px;background:#fffbf0;margin-bottom:4px">

  terms:[
    {t:"Milankovitch cycles", d:"Periodic variations in Earth's orbital parameters (eccentricity, obliquity, precession) that alter the seasonal and latitudinal distribution of insolation, pacing glacial-interglacial cycles."},
    {t:"Eccentricity", d:"The shape of Earth's orbit (circular to elliptical); cycles at 100 kyr and 400 kyr. Weak direct insolation effect but modulates precession amplitude."},
    {t:"Obliquity", d:"The tilt of Earth's axis (22–24.5°); 41 kyr cycle. Controls seasonal contrast and high-latitude insolation — was the dominant glacial pacemaker before 800 ka."},
    {t:"Precession", d:"The wobble of Earth's rotational axis shifting perihelion timing; 19–23 kyr period. Controls which hemisphere gets more insolation at what season."},
    {t:"Mid-Pleistocene Transition (MPT)", d:"Shift in dominant glacial cycle period from 41 kyr to ~100 kyr between 1.2 and 0.8 Ma, driven by changing boundary conditions allowing larger ice sheets to develop."},
    {t:"100 kyr problem", d:"The puzzle that eccentricity has a weak direct insolation effect yet apparent ~100 kyr cycles dominate the last 800 kyr; Huybers & Wunsch explain this as 80+120 kyr obliquity-paced cycles combined."}

},
"2.5.1": {
  cards:[
    {q:"What are Dansgaard-Oeschger (D-O) events?", a:"Rapid climate oscillations during the last glacial period, recorded in Greenland ice cores. Characterised by a sawtooth pattern: rapid warming of ~10–15°C within decades (interstadials), followed by gradual cooling back to stadial conditions. ~25 events during the last glacial, with ~1,470-year periodicity."},
    {q:"What are Heinrich events?", a:"Episodes of massive iceberg discharge from the Laurentide Ice Sheet into the N. Atlantic. Heinrich (1988) found 6 peaks of ice-rafted debris (IRD, H1–H6) in North Atlantic sediments, coinciding with periods of low sea surface temperature. They occur during the coldest phases of D-O cycles."},
    {q:"What was the Younger Dryas and what caused it?", a:"A ~1,000-year reversal to near-full-glacial conditions (12.9–11.6 ka), interrupting the post-glacial warming. NOT caused by Milankovitch. Caused by a meltwater pulse from the retreating Laurentide Ice Sheet into the North Atlantic, disrupting AMOC and reducing northward heat transport to Europe."},
    {q:"What is the 'salt oscillator' hypothesis for D-O cycles?", a:"Ganopolski & Rahmstorf's model: Strong AMOC → northward heat transport → melts ice → freshwater reduces salinity → weakens AMOC → freshwater input decreases → salinity increases → AMOC restarts. Creates oscillation. The forcing only triggers; events follow their own internal dynamics."},
    {q:"What is the bipolar thermal seesaw?", a:"When AMOC is 'on' (strong), North Atlantic is warm and Southern Ocean is cold (heat drawn north). When AMOC is 'off' (Heinrich event), North Atlantic cools but excess heat accumulates in South Atlantic/Antarctica — creating an anti-phase relationship between Greenland and Antarctic temperatures."},
    {q:"What triggered D-O cycles? What evidence suggests external forcing?", a:"Unknown, but the ~1,470-year periodicity is almost exactly 1,470 years — only 1% probability of being random. Possible forcing: solar cycles (de Vries/Suess cycles at ~208 years and Gleissberg cycles), lunisolar tidal cycles. But the mechanism is unproven. G&R argue once triggered, events follow internal dynamics."},
    {q:"How did Greenland ice cores (GRIP, NGRIP) revolutionise understanding of rapid climate change?", a:"3km cores drilled at Summit, Greenland revealed 25+ D-O events during the last glacial with unprecedented resolution — rapid warming in decades, cooling over centuries. Showed climate can shift dramatically in decades, not just millennia."},
    {q:"Where did the freshwater come from that disrupted AMOC during D-O events and the Younger Dryas?", a:"Laurentide Ice Sheet retreat (~18 ka to ~6 ka). Meltwater pulses released large volumes of freshwater into the North Atlantic. A second meltwater pulse towards the Arctic may have stopped the MOC, triggering the Younger Dryas (~12.9 ka)."}
  ],
  quiz:[
    {q:"Dansgaard-Oeschger events are characterised by:",opts:["Gradual symmetrical oscillations of ~5°C over millions of years","Sawtooth pattern: rapid warming ~10-15°C in decades then gradual cooling repeating ~every 1470 years","Regular 41 kyr cycles directly paced by obliquity orbital forcing","Random temperature fluctuations with no detectable periodicity"],ans:1,exp:"D-O events show an asymmetric sawtooth: rapid warming of ~10-15°C within decades to centuries (interstadial onset) followed by gradual cooling back to cold stadial conditions — repeating approximately 25 times during the last glacial."},
    {q:"Heinrich events are identified in marine sediment cores by:",opts:["Large positive oxygen isotope excursions indicating rapid ice growth","Peaks of ice-rafted debris — rock fragments dropped from melting Laurentide icebergs","Increases in plankton productivity indicating sudden warming of surface waters","Large negative carbon isotope excursions similar to the LPTM"],ans:1,exp:"Heinrich events (H1-H6) are identified as distinct layers of ice-rafted debris (IRD) — coarse rock fragments released from icebergs during massive discharge events from the Laurentide Ice Sheet into the North Atlantic."},
    {q:"The Younger Dryas (12.9-11.6 ka) was caused by:",opts:["A Milankovitch orbital minimum reducing Northern Hemisphere summer insolation","A meltwater pulse from the retreating Laurentide Ice Sheet disrupting AMOC and reducing northward heat transport","A large volcanic eruption injecting stratospheric aerosols causing regional cooling","A sudden increase in solar activity causing paradoxical ice sheet collapse"],ans:1,exp:"The Younger Dryas was caused by freshwater pulse(s) from the retreating Laurentide Ice Sheet into the North Atlantic freshening surface waters reducing NADW formation and shutting down AMOC for ~1000 years."},
    {q:"The bipolar thermal seesaw describes:",opts:["Both poles warming simultaneously during interglacial periods","Anti-phase relationship: when AMOC weakens (North Atlantic cools) heat accumulates in South Atlantic warming Antarctica","Temperature oscillations alternating between hemispheres every 41 kyr","Equal warming of both Arctic and Antarctic during all D-O interstadials"],ans:1,exp:"When AMOC is weak/off heat is not drawn northward — it accumulates in the South Atlantic warming Antarctica while Greenland and the North Atlantic cool. This anti-phase relationship is recorded in both Greenland and Antarctic ice cores."},
    {q:"Ganopolski and Rahmstorf (2001) propose that D-O events:",opts:["Are directly and continuously forced by external solar cycle variations","Are triggered by small external forcings but follow their own internal AMOC dynamics","Are caused by orbital precession acting nonlinearly on the overturning circulation","Are random fluctuations with no underlying physical mechanism"],ans:1,exp:"G&R 2001: 'The forcing only acts as a trigger; once an event is set off it follows its own internal dynamics.' AMOC oscillates via a self-sustaining salt-freshwater feedback regardless of the exact triggering mechanism."},
    {q:"The ~1470 year periodicity of D-O events is significant because:",opts:["It exactly matches the obliquity orbital period divided by 28","It has less than 1% probability of being random suggesting a real pacemaker","It matches the solar sunspot cycle of exactly 1470 years","It is simply the time for ice sheets to grow and dynamically collapse"],ans:1,exp:"Statistical analysis shows the ~1470 year D-O periodicity has less than 1% probability of arising by chance — suggesting a real pacemaker though the exact mechanism (possibly solar or lunisolar tidal cycles) remains debated."},
    {q:"Greenland ice cores revolutionised understanding of rapid climate change by:",opts:["Extending the palaeoclimate record back 5 million years for the first time","Revealing 25+ D-O events during the last glacial with temperature changes of ~10-15°C within decades","Showing CO2 changes lagged temperature by exactly 800 years throughout glacials","Demonstrating Holocene climate was actually more variable than the last glacial period"],ans:1,exp:"GRIP and NGRIP cores from Summit Greenland revealed an extraordinary record of rapid oscillations — D-O events with warming of ~10-15°C within decades — showing the climate system can shift dramatically on timescales shorter than a human lifetime."},
    {q:"During stadial conditions (Dokken et al. 2013) sub-surface ocean heat is:",opts:["Released immediately to the atmosphere causing rapid Arctic warming","Trapped below a halocline of cold fresh meltwater leading to gradual sub-surface warming","Transported southward to warm Antarctica in the bipolar seesaw","Absorbed and stored within the growing sea ice itself"],ans:1,exp:"During stadials cold fresh meltwater creates a stable halocline insulating warm sub-surface Atlantic water from the atmosphere. The sub-surface gradually warms until the halocline breaks down triggering rapid heat release — the interstadial onset."}
  ],
  summary:`<h4>Overview</h4><p>During the last glacial period (~115–11.7 ka), climate was highly unstable — far more variable than the Holocene. Rapid shifts linked to AMOC changes caused dramatic temperature changes in decades.</p><h4>D-O Events</h4><p>Sawtooth oscillations: rapid warming (~10–15°C in decades) then slow cooling. ~1,470-year period. 25 events. Driven by AMOC 'salt oscillator' (Ganopolski & Rahmstorf). Bipolar seesaw: NH and SH anti-phase.</p><h4>Heinrich Events & Younger Dryas</h4><p>Heinrich events: iceberg surges from Laurentide Ice Sheet → IRD in sediments → AMOC disruption. Younger Dryas (12.9–11.6 ka): meltwater pulse → AMOC off → 1,000-year cold reversal. NOT Milankovitch.</p><h4>Key Diagrams</h4><svg viewBox="0 0 480 185" xmlns="http://www.w3.org/2000/svg" style="width:100%;border-radius:8px;background:#f0fdf4;margin-bottom:4px">
