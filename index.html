    {q:"The conservative tracer approach in watershed science uses:", opts:["Radioactive isotopes","Chloride ions","Nitrogen compounds","pH measurements"], ans:1, exp:"Cl- is used as a conservative tracer because it is largely unreactive and moves with water, allowing ion budgets to be calculated."},
    {q:"What key finding emerged from Hubbard Brook research?", opts:["Rivers create nutrients","Forests strongly regulate nutrient retention and acid rain was discovered","Small catchments are unimportant","Deforestation increases water storage"], ans:1, exp:"Hubbard Brook showed forests are critical for retaining nutrients and led to the discovery of acid rain effects on catchments."},
    {q:"An input-output budget classifies a watershed as a 'source' when:", opts:["Inputs equal outputs","Outputs exceed inputs","Inputs exceed outputs","No water flows through"], ans:1, exp:"A source means more nutrient leaves the watershed than enters — the ecosystem is losing stored nutrients."},
    {q:"Why are small watersheds particularly valuable in ecosystem science?", opts:["They have more biodiversity","They are easier to manipulate and show stronger land-water coupling","They receive more rainfall","They have lower nutrient losses"], ans:1, exp:"Small watersheds are easier to sample, monitor and experimentally manipulate, and show clearer links between terrestrial and aquatic processes."}
  ],
  summary:`<h4>Overview</h4><p>The watershed approach links terrestrial and aquatic ecosystems by tracking nutrient and water fluxes from land to stream. Rivers partially mirror ecosystem condition on land.</p><h4>Key Concepts</h4><p><strong>Mobile anions</strong> (NO₃⁻, SO₄²⁻, Cl⁻) drive nutrient leaching and acidification. <strong>Input-output budgets</strong> reveal source/sink status. <strong>Conservative tracer approach</strong> uses Cl⁻ to trace water movement.</p><h4>Key Study: Hubbard Brook</h4><p>Long-term manipulation experiments showed forests regulate nutrient retention and revealed acid rain. Deforestation → large increases in stream nitrate.</p><h4>Exam Tips</h4><div class="tip">"Useful but with important caveats" — always acknowledge limitations (assumes no internal water gains/losses, hard to upscale) when discussing the watershed approach.</div>`,
  terms:[
    {t:"Watershed (catchment)", d:"The area of land that drains water, nutrients and solutes to a single outlet such as a stream or river."},
    {t:"Mobile anions", d:"Ions not held on soil exchange sites (e.g. NO₃⁻, SO₄²⁻, Cl⁻, HCO₃⁻) that move freely through soil, leaching base cations and driving acidification."},
    {t:"Conservative tracer approach", d:"Using an unreactive ion (usually Cl⁻) to trace water movement and calculate ion budgets by comparing observed vs expected concentrations."},
    {t:"Input-output budget", d:"A method comparing annual nutrient inputs to a watershed (rainfall, weathering) vs outputs (stream export) to determine source or sink status."},
    {t:"Hubbard Brook", d:"Long-term experimental watershed in the USA that revealed the importance of forests for nutrient retention and documented acid rain effects."},
    {t:"Paired watershed study", d:"An experimental design comparing a treated watershed with an untreated control to isolate the effect of a specific treatment (e.g. deforestation, fire)."}
  ]
},
"2.1.1": {
  cards:[
    {q:"What proportion of all animal phyla are found exclusively in the sea?", a:"21 of 33 animal phyla are found ONLY in the sea; 32 of 33 occur there in total — yet only 15% of described species are marine."},
    {q:"What are the dominant primary producers in the ocean?", a:"Phytoplankton (single-celled algae) are dominant. Also seagrass in shallow coastal areas and multicellular algae (seaweed)."},
    {q:"Where does most marine primary production occur?", a:"At coasts (riverine nutrients), eastern ocean margins (cold upwelling), equatorial zones (equatorial upwelling), and polar regions. Central gyres are oligotrophic."},
    {q:"What is upwelling and why is it productive?", a:"The transport of deep, nutrient-rich water to the ocean surface. It supplies phytoplankton with the nutrients needed for growth, making upwelling zones highly productive."},
    {q:"What are HNLC regions?", a:"High Nutrient, Low Chlorophyll regions — areas with abundant macronutrients (N, P) but low phytoplankton growth because a micronutrient (usually iron) limits production."},
    {q:"What percentage of marine species live on the seafloor?", a:"98% of marine species are benthic (seafloor-dwelling), even though most energy enters the system via surface photosynthesis."},
    {q:"How do chemosynthetic ecosystems work?", a:"At hydrothermal vents, sulphide-oxidising bacteria derive energy from oxidising H₂S rather than from sunlight — they are the primary producers supporting these unique food webs."},
    {q:"What drives summer nutrient depletion in temperate seas?", a:"Summer stratification creates a warm surface layer that prevents vertical mixing, cutting off the supply of deep, nutrient-rich water to the photic zone."},
    {q:"Describe the three pelagic depth zones and their characteristic organisms.", a:"Photic zone: sunlit surface, phytoplankton (primary producers), zooplankton (copepods, amphipods, pteropods, radiolarians, foraminiferans), squid, mackerel. Dysphotic zone (twilight): vertical migrators, large sensitive eyes, bioluminescence — euphausiids, lantern fish. Aphotic zone (dark): hinged jaws and extendable stomachs, little swimming, innovative mating strategies — anglerfish, cyclothone."},
    {q:"What are the main types of marine phytoplankton and how do they differ?", a:"Coccolithophorids: calcite test (calcium carbonate shell), important in carbonate pump. Diatoms: silicate test (silica shell), often dominant in cold productive waters. Dinoflagellates: no mineral test, include some toxin producers. All perform photosynthesis and fix carbon; when they die they sink, forming the biological pump."},
    {q:"Describe the marine carbon cycle and biological pump.", a:"Phytoplankton fix CO₂ via photosynthesis in upper ocean. Zooplankton graze phytoplankton. Bacteria decompose organic matter, releasing CO₂. Organic carbon sinks as particles (biological pump) to ocean interior — oxidised back to CO₂ or buried in sediments. Deep consumers and deposit feeders access this sinking material. The biological pump transfers carbon from surface to depth, keeping atmospheric CO₂ lower than it would otherwise be."},
    {q:"Compare polar vs. coral reef ecosystems.", a:"Polar oceans: nutrient-rich (upwelling), large organisms, slow-growing, short food chains (phytoplankton → krill → whales). Coral reefs: oligotrophic (nutrient-poor), smaller organisms, faster-growing, complex food chains (phytoplankton → zooplankton → small fish → tuna). Highest marine biodiversity in Indo-Pacific (Coral Triangle). Global marine diversity hotspot is around Southeast Asia."},
    {q:"What are benthic organisms and what food web supports them?", a:"Benthic organisms live on or in the seafloor: polychaetes, bivalves, holothurians (sea cucumbers), lugworms, seastars, crustaceans. Supported by detritus food chain: phytoplankton → detritus → deposit feeders → predators/scavengers. 98% of marine species are benthic. Energy source is sinking particulate organic matter from the photic zone — energetically dilute by the time it reaches the deep seafloor."}
  ],
  quiz:[
    {q:"What proportion of all marine species are found on the seafloor?", opts:["20%","50%","75%","98%"], ans:3, exp:"98% of marine species are benthic — living on or in the seafloor, even though energy enters via surface photosynthesis."},
    {q:"HNLC regions have high nutrients but low chlorophyll because:", opts:["Water is too cold","Light is insufficient","A micronutrient (usually iron) limits phytoplankton","Salinity is too high"], ans:2, exp:"In HNLC regions, macronutrients (N, P) are abundant but iron limitation prevents phytoplankton growth."},
    {q:"What process supplies nutrients to productive eastern ocean margin zones?", opts:["River runoff","Upwelling of deep water","Rainfall","Volcanic inputs"], ans:1, exp:"Cold, nutrient-rich deep water is brought to the surface by upwelling along eastern ocean margins, fuelling high productivity."},
    {q:"Chemosynthetic ecosystems at hydrothermal vents are based on:", opts:["Photosynthesis by algae","Sulphide-oxidising bacteria as primary producers","Deep-sea fish as producers","Detritus from surface waters"], ans:1, exp:"Chemosynthetic bacteria oxidise hydrogen sulphide as an energy source, replacing sunlight as the base of the food web."},
    {q:"Why are central ocean gyres oligotrophic?", opts:["They receive too much light","Downwelling prevents nutrient resupply from depth","They are too warm for phytoplankton","High turbulence inhibits growth"], ans:1, exp:"Central gyres have downwelling which pushes surface waters down, preventing nutrient-rich deep water from rising."}
  ],
  summary:`<h4>Overview</h4><p>Marine ecosystems cover 71% of Earth's surface with extraordinary phylum-level diversity (32/33 animal phyla present; 21 exclusively marine). Three main depth zones in pelagic habitats; 98% of marine species are benthic.</p><h4>Phytoplankton and Primary Production</h4><p>Dominant producers: coccolithophorids (calcite), diatoms (silicate), dinoflagellates. Productive zones: coasts, eastern upwelling margins, equatorial upwelling, polar regions. Oligotrophic zones: subtropical gyres (Ekman convergence → downwelling). HNLC = iron-limited despite high N and P.</p><h4>Pelagic Zones</h4><p>Photic zone: photosynthesis, phyto/zooplankton food web. Dysphotic (twilight): vertical migrators, bioluminescence. Aphotic: anglerfish, cyclothone — hinged jaws, extendable stomachs.</p><h4>Biological Pump and Benthic Food Webs</h4><p>Sinking organic carbon → ocean interior oxidation or seabed burial. Benthic food web: detritus → deposit feeders (holothurians, polychaetes, bivalves) → predators. Polar: nutrient-rich, large organisms, short food chains. Coral reefs: oligotrophic, complex food chains, highest marine biodiversity (Indo-Pacific).</p><h4>Exam Tips</h4><div class="tip">Be able to compare polar vs coral reef food chains using Pinet 2012 diagram (standing stock vs body size). Know the three phytoplankton types and their shell material.</div>`,
  terms:[
    {t:"Upwelling", d:"The transport of cold, nutrient-rich deep ocean water to the surface, typically along eastern ocean margins and the equator, fuelling high productivity."},
    {t:"HNLC region", d:"High Nutrient Low Chlorophyll — ocean areas where macronutrients are abundant but phytoplankton is scarce due to micronutrient (iron) limitation."},
    {t:"Oligotrophic", d:"Nutrient-poor; central ocean gyres are oligotrophic due to downwelling that prevents nutrient resupply from depth."},
    {t:"Chemosynthesis", d:"Energy production using chemical reactions (e.g. sulphide oxidation) rather than sunlight; the basis of hydrothermal vent ecosystems."},
    {t:"Benthic-pelagic coupling", d:"The link between the seafloor (benthic) and open water (pelagic) zones via sinking organic matter and nutrient regeneration from sediments."},
    {t:"Phytoplankton", d:"Microscopic photosynthetic organisms (single-celled algae) that are the dominant primary producers in marine ecosystems."},
    {t:"Biological pump", d:"The transfer of carbon from surface waters to the deep ocean via sinking organic particles (dead phytoplankton, faecal pellets); reduces atmospheric CO₂."},
    {t:"Dysphotic zone", d:"The 'twilight zone' below the photic zone where light is too dim for photosynthesis; organisms have adaptations for vertical migration and bioluminescence."},
    {t:"Aphotic zone", d:"The permanently dark deep ocean below ~1000m; organisms have adaptations for extreme food scarcity (hinged jaws, extendable stomachs, innovative mating)."},
    {t:"Coccolithophorid", d:"Phytoplankton with calcium carbonate (calcite) shells; important in the carbonate pump; example: Emiliania huxleyi."},
    {t:"Diatom", d:"Phytoplankton with silicate shells; often dominant in cold, productive, nutrient-rich waters; form a key food source for zooplankton."},
    {t:"Pantropical Diversity Disparity", d:"The observation that tropical regions differ significantly in species diversity (Neotropics > Afrotropics > Indo-Malayan) due to historical contingency. Hagan et al. 2021."}
  ]
},
"2.2.1": {
  cards:[
    {q:"Why is there interest in deep sea mining?", a:"Growing demand for metals (Co, Ni, Cu, Mn) for EV batteries and electronics, while terrestrial supplies are controlled by few countries with limited environmental standards."},
    {q:"What are polymetallic nodules and where are they found?", a:"Fe-Mn oxyhydroxide nodules rich in Ni, Cu, and Co found on the seabed at 4,000–6,500m depth. They grow at only mm per million years."},
    {q:"What is the ISA and what is its current status?", a:"The International Seabed Authority governs deep sea resources. 31 exploration licences have been granted but no exploitation licences as of the time of study."},
    {q:"What are the key environmental impacts of deep sea mining?", a:"Direct habitat destruction, toxin release (dissolved metals, low pH, low O₂), smothering of benthic organisms by sediment plumes, noise and light pollution."},
    {q:"How long does recovery of deep sea communities take after mining disturbance?", a:"Meiofauna and mobile megafauna may recover within 1 year, but baseline community conditions have not been restored even after 26 years."},
    {q:"What are 'omics' approaches and how are they used in deep sea mining?", a:"Techniques measuring large groups of biological molecules — genomics (DNA), transcriptomics (RNA), proteomics (proteins), metabolomics. Used as early-warning biomarkers of environmental harm before organism-level effects are visible."},
    {q:"What are massive sulphide deposits and what metals do they contain?", a:"Mineral deposits at hydrothermal vents (&lt;500–5,000m), rich in Cu, Pb, Zn, Au, and Ag. Formed from precipitation of metal sulphides from hydrothermal fluids."},
    {q:"What happens chemically when sulphide ores contact seawater?", a:"Rapid oxidation produces dissolved heavy metals, low pH, and low dissolved oxygen — a toxic cocktail for deep sea organisms."},
    {q:"What did the DISCOL polymetallic nodule experiment show about long-term recovery?", a:"Peru Basin 1989: 8m wide plough harrow towed through sediment 78 times. Two disturbance types: direct impact (nodules buried, habitat fragmented) and sedimentation (up to 30mm). 26 years later: suspension feeder abundance still reduced; deposit feeder and predator/scavenger abundance elevated; community structure altered — baseline NOT restored. Response is taxon-specific. Simon-Lledo et al. 2019."},
    {q:"What did the 2022 large-scale deep sea mining vehicle test show?", a:"2022 test of a mining vehicle in Clarion-Clipperton Zone. Sampled 2 months after: 37% reduction in macrofaunal density, 32% reduction in species richness in vehicle tracks. Plume-impacted sites showed altered community composition. Stewart et al. 2025."},
    {q:"What is the Clarion-Clipperton Fracture Zone and why is it important?", a:"A 4.5 million km² area in the Pacific Ocean between Hawaii and Mexico — the world's richest polymetallic nodule field. Divided into exploration contract areas (held by companies from Belgium, China, Japan, Korea, UK, Russia, Singapore etc.) and Areas of Particular Environmental Interest (APEIs) set aside for conservation. Governed by ISA."},
    {q:"What are the effects of metals released by deep sea mining on aquatic invertebrates?", a:"Metals (Cu, Cd, Zn, Hg, Se, Pb) cause: feeding process modifications, oxidative stress changes, apoptosis (cell death), cell cycle interference, immune system deficiencies, nervous system/behavioural disorders, tissue disorganisation, endocrine changes, reduced reproduction and growth, DNA damage, mortality increase, respiratory changes, and abnormal embryo development. Sousa et al. 2024 reviewed 50 omics studies."},
    {q:"What are phosphirite nodules and where are they found?", a:"Phosphorus-rich nodules found at shallower depths (~450m) on continental margins such as Chatham Rise, New Zealand. Mining involves ploughing and sediment addition. Greatest loss of abundance when both disturbed AND sediment added. Recovery observed after 1 year but this is a shallow site — recovery correlated with sediment C:N ratio (food quality). Murray et al. 2024."},
    {q:"Where are the main deep sea mineral deposits located globally?", a:"Polymetallic nodules: large patches in Pacific (Clarion-Clipperton Zone is largest), Indian and Atlantic oceans. Polymetallic sulphides/vents: along mid-ocean ridges globally. Cobalt-rich crusts: on seamounts. Exclusive Economic Zones of Pacific island nations contain many deposits (Miller et al. 2018)."}
  ],
  quiz:[
    {q:"At what depths are polymetallic nodules typically found?", opts:["0–500m","500–2000m","2000–4000m","4000–6500m"], ans:3, exp:"Polymetallic nodules are found on the deep seabed at 4,000–6,500m depth where sedimentation rates are very low."},
    {q:"How fast do polymetallic nodules grow?", opts:["Centimetres per year","Millimetres per year","Millimetres per thousand years","Millimetres per million years"], ans:3, exp:"Polymetallic nodules grow extraordinarily slowly — only millimetres per million years — making them effectively non-renewable on human timescales."},
    {q:"Which body governs deep sea mining beyond national jurisdiction?", opts:["United Nations Environment Programme","International Seabed Authority (ISA)","World Trade Organisation","International Maritime Organisation"], ans:1, exp:"The ISA, established under UNCLOS, regulates exploration and exploitation of deep sea mineral resources beyond national EEZ boundaries."},
    {q:"Omics approaches in environmental monitoring detect harm by:", opts:["Counting individual organisms","Measuring molecular-level biological responses","Tracking sediment movement","Monitoring water temperature"], ans:1, exp:"Omics (genomics, transcriptomics, proteomics, metabolomics) detect changes at cellular/molecular level before whole-organism or community effects become visible."},
    {q:"After simulated mining, baseline conditions in deep sea communities:", opts:["Recover within 1 month","Are restored within 5 years","Have not been restored even after 26 years","Never recover"], ans:2, exp:"While some fauna recover within a year, baseline community composition and sediment properties have not been restored even 26 years after disturbance."}
  ],
  summary:`<h4>Overview</h4><p>Deep sea mining is driven by demand for transition metals (Co, Ni, Cu, Mn) for EVs and electronics. Three deposit types at different depths; governed by ISA under 'common heritage of mankind'.</p><h4>Deposit Types</h4><p><strong>Polymetallic nodules:</strong> 4,000–6,500m abyssal plains, grow mm/million years, rich in Ni/Cu/Co. Clarion-Clipperton Zone is the prime target (multiple exploration contracts). <strong>Massive sulphides:</strong> 1,000–4,000m at hydrothermal vents, Cu/Pb/Zn/Au/Ag. <strong>Cobalt-rich crusts:</strong> 800–2,500m on seamounts, form via ion accumulation at oxygen minimum zone. <strong>Phosphirite nodules:</strong> shallow (450m, e.g. Chatham Rise NZ) — recovery within 1 year but only sensitive taxa lost.</p><h4>Environmental Impacts</h4><p>Direct: habitat destruction, smothering, removal of non-renewable habitat (nodules grow mm/million years). Indirect: sediment plumes (alter composition of plume-impacted sites), metal toxicity (Cu, Cd, Zn, Hg cause DNA damage, reproductive failure, mortality — Sousa 2024). DISCOL (1989, Peru Basin): 26 years later community still altered (Simon-Lledo 2019). 2022 test: 37% macrofaunal density reduction, 32% species richness reduction (Stewart 2025).</p><h4>Exam Tips</h4><div class="tip">Know the three main deposit types, their depths, and the specific recovery evidence (DISCOL 26 yr, 2022 test, Chatham Rise 1 yr). Omics = early warning biomarkers BEFORE organism-level effects visible.</div>`,
  terms:[
    {t:"Polymetallic nodules", d:"Fe-Mn oxyhydroxide concretions on the deep seabed (4,000–6,500m), rich in Ni, Cu and Co; grow at mm per million years."},
    {t:"International Seabed Authority (ISA)", d:"The body that regulates exploration and exploitation of mineral resources on the deep seabed beyond national jurisdiction under UNCLOS."},
    {t:"Common Heritage of Mankind", d:"The principle that deep sea resources beyond national jurisdiction belong to all humanity and require the highest environmental protection standards."},
    {t:"Omics", d:"A suite of molecular techniques (genomics, transcriptomics, proteomics, metabolomics) used to detect biological responses to environmental stress at the molecular level."},
    {t:"Massive sulphide deposits", d:"Metal-rich deposits at hydrothermal vents formed by precipitation of sulphides; contain Cu, Pb, Zn, Au, Ag and support specialised fauna."},
    {t:"Sediment plume", d:"A cloud of disturbed seabed sediment generated by mining activity that can smother benthic communities over wide areas."},
    {t:"DISCOL experiment", d:"Peru Basin 1989 experiment disturbing polymetallic nodule sediment with a plough harrow; 26 years later community composition still altered — suspension feeders reduced, deposit feeders elevated (Simon-Lledo et al. 2019)."},
    {t:"Clarion-Clipperton Zone", d:"The world's largest polymetallic nodule field (~4.5 million km²) in the Pacific; divided between ISA exploration contracts and Areas of Particular Environmental Interest (APEIs) for conservation."},
    {t:"Metal toxicity (aquatic invertebrates)", d:"Metals released by mining (Cu, Cd, Zn, Hg, Se, Pb) cause DNA damage, oxidative stress, apoptosis, reproductive failure, immune deficiency, and mortality in benthic invertebrates (Sousa et al. 2024)."},
    {t:"Cobalt-rich crusts (formation mechanism)", d:"Metal ions (Ni, Co, Cu) transported by ocean currents accumulate on positively charged iron oxyhydroxides and negatively charged manganese oxide molecules on seamount surfaces at the oxygen minimum zone."}
  ]
},
"2.3.1": {
  cards:[
    {q:"How does freshwater biodiversity compare to its global area coverage?", a:"Freshwater covers only ~0.8% of Earth's surface but supports 6–10% of all biodiversity — a disproportionately high biodiversity."},
    {q:"Distinguish autochthonous and allochthonous energy sources in rivers.", a:"Autochthonous = internal production (algae, aquatic plants photosynthesising within the river). Allochthonous = external inputs from the surrounding catchment (leaf litter, woody debris)."},
    {q:"Name and describe the four Functional Feeding Groups (FFGs).", a:"Grazers/scrapers (eat periphyton/algae), shredders (eat CPOM — leaves, wood), collectors/filterers (eat FPOM), predators (eat other animals)."},
    {q:"What is the River Continuum Concept (RCC)?", a:"A framework describing predictable longitudinal changes in river ecosystems from headwaters to mouth, reflecting changes in channel size, light, temperature, and organic matter sources."},
    {q:"What do shredders eat and give two examples.", a:"Shredders consume coarse particulate organic matter (CPOM) — leaf litter and wood. Examples: cranefly larvae, crayfish, some caddisfly larvae, stonefly larvae."},
    {q:"What is the riparian zone?", a:"The transitional zone between terrestrial and aquatic systems along a river bank. It influences both aquatic and terrestrial communities through shade, nutrient input, and habitat provision."},
    {q:"What do collector-filterers feed on?", a:"Fine particulate organic matter (FPOM) — small particles suspended in the water column, filtered out using specialised mouthparts or nets (e.g. caddisfly nets, black fly fans)."},
    {q:"Why is freshwater biodiversity considered disproportionately high?", a:"Despite occupying &lt;1% of Earth's surface, rivers and lakes support 6–10% of all species, including 25% of all vertebrate species, due to high habitat diversity and connectivity."},
    {q:"What do riparian ecosystems provide and why are they highly productive?", a:"Gregory et al. 1991: riparian ecosystems provide critical physical and biological linkages between terrestrial and aquatic environments. Favourable water, nutrient, temperature and light regimes contribute to unusually high plant production. A considerable proportion of plant production (leaves, needles, wood) enters rivers and benefits detritivores (shredders — caddisfly larvae, cranefly larvae, freshwater shrimps)."}
  ],
  quiz:[
    {q:"Freshwater covers what percentage of Earth's surface?", opts:["0.8%","5%","10%","20%"], ans:0, exp:"Freshwater covers approximately 0.8% of Earth's surface yet supports 6–10% of global biodiversity."},
    {q:"Allochthonous energy inputs to rivers are:", opts:["Produced by algae within the river","Imported from the surrounding catchment (e.g. leaf litter)","Generated by fish excretion","Derived from bedrock weathering"], ans:1, exp:"Allochthonous inputs are external — organic matter entering rivers from surrounding terrestrial ecosystems such as leaf litter and wood."},
    {q:"Which Functional Feeding Group eats coarse particulate organic matter (CPOM)?", opts:["Grazers","Collectors","Shredders","Predators"], ans:2, exp:"Shredders break down CPOM (leaves, wood) into fine particles, playing a critical role in leaf litter processing."},
    {q:"The River Continuum Concept describes:", opts:["Seasonal changes in river flow","Vertical zonation of river organisms","Predictable longitudinal changes from headwaters to mouth","Fish migration patterns"], ans:2, exp:"The RCC describes how community composition, organic matter sources, and metabolic processes change predictably along the river's length."},
    {q:"What do collector-filterers consume?", opts:["CPOM — leaves and wood","Living algae and periphyton","FPOM — fine suspended particles","Other invertebrates"], ans:2, exp:"Collectors and filterers consume fine particulate organic matter (FPOM) suspended in the water column."}
  ],
  summary:`<h4>Overview</h4><p>Rivers support disproportionately high biodiversity relative to their area and are fuelled by both internal and external organic matter sources.</p><h4>Functional Feeding Groups</h4><p><strong>Grazers/scrapers:</strong> periphyton. <strong>Shredders:</strong> CPOM (leaves, wood). <strong>Collectors/filterers:</strong> FPOM. <strong>Predators:</strong> invertebrates/fish. FFGs reflect the source of organic matter available at each point along the river.</p><h4>River Continuum Concept (Vannote et al. 1980)</h4><p>Longitudinal gradient from headwaters to mouth. Headwaters (orders 1–3): shaded, CPOM dominated, shredders + collectors dominant, trout. Mid-reaches (4–6): more open, periphyton + FPOM, grazers + collectors, perch. Lower reaches (7–12): large open channel, phytoplankton + zooplankton, collectors + predators, catfish. Physical characteristics also change: channel widens, current slows, depth increases, temperature rises. Four key questions: how do physical characteristics change? how do basal resources change? how do FFGs change? how do fish species change?</p><h4>Major Threats</h4><p>Vorosmarty et al. 2010: human-induced water stress correlates with biodiversity risk. Holden 2020: water resource development, pollution, catchment disturbance, invasive species. Point and diffuse pollution historically important; emerging pollutants now a concern (Whelan et al. 2022, Hughes et al. 2013). UK has long history of macroinvertebrate-based monitoring (Armitage et al. 1983). BMWP modified to WHPT (Wright et al. 2000; Mason 2002; Paisley et al. 2013).</p><h4>Exam Tips</h4><div class="tip">Know all four FFGs and what they eat. The RCC (Vannote 1980) is a popular essay question — describe how community structure and FFGs change from source to sea. Use the four questions as a structure.</div>`,
  terms:[
    {t:"Autochthonous production", d:"Organic matter produced within the aquatic ecosystem itself by photosynthesis (algae, macrophytes)."},
    {t:"Allochthonous inputs", d:"Organic matter entering rivers from surrounding terrestrial ecosystems, e.g. leaf litter, woody debris, dissolved organic matter."},
    {t:"CPOM", d:"Coarse Particulate Organic Matter — leaves, wood and other large organic particles entering rivers from riparian zones; food for shredders."},
    {t:"FPOM", d:"Fine Particulate Organic Matter — small fragments produced by physical and biological breakdown of CPOM; food for collectors and filterers."},
    {t:"River Continuum Concept (RCC)", d:"A framework (Vannote et al. 1980) describing predictable longitudinal changes in river ecosystem structure and function from source to mouth."},
    {t:"Functional Feeding Groups (FFGs)", d:"Categories of aquatic invertebrates defined by how they obtain food: grazers, shredders, collectors/filterers, and predators."},
    {t:"Riparian zone", d:"The transitional zone between river and land, providing shade, nutrients, organic inputs and habitat that strongly influence river communities."}
  ]
},
"2.4.1": {
  cards:[
    {q:"What percentage of freshwater fish species are at risk of extinction?", a:"25% of freshwater fish species are considered at risk of extinction — a higher threat level than in most terrestrial groups."},
    {q:"Distinguish point source from diffuse source water pollution.", a:"Point sources are discrete, identifiable inputs (e.g. sewage outfall pipes, factory discharges). Diffuse sources are dispersed across the landscape (e.g. agricultural runoff, urban stormwater)."},
    {q:"What is vitellogenin and why is its presence in male fish significant?", a:"Vitellogenin is an egg-yolk protein normally produced only by female fish. Its presence in males indicates endocrine disruption (feminisation) from oestrogen-mimicking chemicals in sewage."},
    {q:"What are BMWP/WHPT scores?", a:"Biological Monitoring Working Party / Weighted Average of Scores scoring systems that use the presence/absence and sensitivity of aquatic macroinvertebrates (>250μm) to assess water quality."},
    {q:"Why are aquatic macroinvertebrates useful for biomonitoring?", a:"They are sensitive to pollution, sedentary (reflect local conditions), easy to sample, and have well-characterised tolerances — providing an integrated picture of water quality over time."},
    {q:"What are 'emerging contaminants' in freshwater?", a:"Pollutants not yet regulated but of growing concern: microplastics, pharmaceutical compounds, 'forever chemicals' (PFAS) — detected increasingly in rivers and groundwater."},
    {q:"What legislation drives freshwater biomonitoring in Europe?", a:"The EU Water Framework Directive (WFD), which requires member states to achieve 'good ecological status' in water bodies, assessed using biological, chemical, and hydromorphological indicators."},
    {q:"What physical symptoms of feminisation are seen in male fish from polluted rivers?", a:"Egg-producing cells (oocytes) in testes, reduced testis size and growth rates, development of female reproductive tracts, enlarged liver, and elevated vitellogenin."},
    {q:"What are the major categories of threat to freshwater biodiversity?", a:"Vorosmarty et al. 2010: human-induced water supply stress correlates strongly with biodiversity risk. Holden 2020: four major threat categories: (1) water resource development (dams, abstraction), (2) pollution (point and diffuse), (3) catchment disturbance (land use change, deforestation), (4) invasive species. Point and diffuse pollution historically most important; new 'emerging' pollutants now a concern (Whelan et al. 2022; Hughes et al. 2013)."},
    {q:"How has biological monitoring in the UK evolved?", a:"UK has a long history of using aquatic macroinvertebrates to monitor river water quality (Armitage et al. 1983). BMWP (Biological Monitoring Working Party) scoring method was widely used — assigns sensitivity scores to macroinvertebrate families. Recently modified to WHPT (Walley, Hawkes, Paisley and Trigg) which accounts for abundance as well as presence/absence (Wright et al. 2000; Mason 2002; Paisley et al. 2013)."}
  ],
  quiz:[
    {q:"What proportion of freshwater fish species are at risk of extinction?", opts:["5%","10%","25%","50%"], ans:2, exp:"Around 25% of freshwater fish species are considered imperilled — reflecting the disproportionately high threats to freshwater biodiversity."},
    {q:"Vitellogenin in male fish is a biomarker for:", opts:["Heavy metal pollution","Acidification","Endocrine disruption/feminisation","Nutrient enrichment"], ans:2, exp:"Vitellogenin is a female egg-yolk protein; its presence in males indicates exposure to oestrogen-mimicking compounds in sewage effluent."},
    {q:"BMWP/WHPT biomonitoring is based on:", opts:["Fish species composition","Aquatic macroinvertebrate communities","Phytoplankton abundance","Chemical analysis only"], ans:1, exp:"BMWP and WHPT systems use the presence and pollution sensitivity of aquatic macroinvertebrates to assign water quality scores."},
    {q:"Which EU legislation requires ecological status assessment of water bodies?", opts:["Habitats Directive","Nitrates Directive","Water Framework Directive","REACH Regulation"], ans:2, exp:"The EU Water Framework Directive requires member states to assess and achieve good ecological status in rivers, lakes and coastal waters."},
    {q:"Diffuse water pollution sources include:", opts:["Sewage treatment outfalls","Factory discharge pipes","Agricultural runoff and urban stormwater","Industrial cooling water"], ans:2, exp:"Diffuse sources are spread across the landscape and not dischargeable from a single identifiable point — e.g. fertiliser runoff, road runoff."}
  ],
  summary:`<h4>Overview</h4><p>Freshwater biodiversity is under severe threat from multiple pollutant sources. Biological monitoring using macroinvertebrates is a key tool for assessing water quality.</p><h4>Pollution Sources</h4><p><strong>Point sources:</strong> pipes, outfalls (identifiable). <strong>Diffuse sources:</strong> agricultural/urban runoff. <strong>Emerging:</strong> microplastics, pharmaceuticals, PFAS.</p><h4>Biomonitoring</h4><p>BMWP/WHPT: macroinvertebrates >250μm scored by pollution sensitivity. EU WFD drives ecological status assessment. Feminisation of fish = endocrine disruption from sewage (vitellogenin in males).</p><h4>Exam Tips</h4><div class="tip">Know the feminisation story in detail: sewage → oestrogens → vitellogenin in male fish → reduced testis size. Also know why macroinvertebrates are preferred over chemical monitoring alone.</div>`,
  terms:[
    {t:"Point source pollution", d:"Water pollution from a discrete, identifiable discharge point such as a sewage outfall pipe or factory discharge."},
    {t:"Diffuse source pollution", d:"Pollution entering water bodies from dispersed sources across the landscape, e.g. agricultural fertiliser runoff or urban stormwater."},
    {t:"Vitellogenin", d:"An egg-yolk precursor protein normally produced only by female fish; its presence in males indicates endocrine disruption from oestrogen-mimicking pollutants."},
    {t:"BMWP/WHPT", d:"Biological Monitoring Working Party / Weighted Average of Scores — systems that assess river water quality using the sensitivity of aquatic macroinvertebrate communities."},
    {t:"EU Water Framework Directive", d:"EU legislation requiring ecological status assessment and achievement of 'good ecological status' for all water bodies."},
    {t:"Endocrine disruption", d:"Interference with hormone signalling by chemical pollutants (e.g. oestrogens in sewage), causing reproductive abnormalities such as feminisation of male fish."},
    {t:"Emerging contaminants", d:"Pollutants not yet regulated but of growing concern in freshwaters: microplastics, pharmaceuticals, PFAS ('forever chemicals')."}
  ]
},
"2.5.1": {
  cards:[
    {q:"What are the four main forms of carbon transported by rivers?", a:"CPOM (coarse particulate organic matter), FPOM (fine particulate organic matter), DOM (dissolved organic matter), and DIC (dissolved inorganic carbon — mainly CO₂ and bicarbonate)."},
    {q:"How much carbon do rivers release to the atmosphere annually?", a:"Rivers release approximately 2.3 Pg C per year to the atmosphere as CO₂ — making them a significant component of the global carbon cycle."},
    {q:"What does a P:R ratio less than 1 indicate about a river?", a:"The river is heterotrophic — ecosystem respiration exceeds gross primary production, meaning the ecosystem consumes more carbon than it produces and relies on external organic inputs."},
    {q:"List the four drivers of leaf litter decomposition in rivers.", a:"Leaching (rapid loss of soluble compounds), microbial breakdown (bacteria and fungi), fungal conditioning (makes litter palatable to invertebrates), invertebrate shredding."},
    {q:"Why does willow decompose faster than oak or pine in rivers?", a:"Willow has nutrient-rich, soft tissue with low lignin content. Oak and pine have tough, lignin-rich, chemically defended leaves that resist microbial and invertebrate breakdown."},
    {q:"How does temperature affect river metabolism?", a:"Both respiration and photosynthesis increase with temperature (described by activation energy models). Warming increases overall metabolic rates, which can shift the P:R balance."},
    {q:"Why are most rivers heterotrophic?", a:"Most rivers, especially forested headwaters, are shaded and receive more organic carbon from the catchment than they produce via photosynthesis — they are net consumers of carbon."},
    {q:"What methods are used to measure river ecosystem function?", a:"Dissolved oxygen changes (estimate respiration), microcosm experiments, gas flux measurements (CO₂, O₂), algal growth studies, and nutrient uptake spiralling experiments."}
  ],
  quiz:[
    {q:"Rivers release approximately how much carbon to the atmosphere each year?", opts:["0.1 Pg C","0.5 Pg C","2.3 Pg C","10 Pg C"], ans:2, exp:"Rivers are estimated to release approximately 2.3 Pg C per year to the atmosphere, making them a significant component of the global carbon cycle."},
    {q:"A river with P:R &lt; 1 is described as:", opts:["Autotrophic","Oligotrophic","Heterotrophic","Eutrophic"], ans:2, exp:"P:R &lt; 1 means respiration exceeds production — the river is heterotrophic and depends on external organic matter inputs."},
    {q:"Why does willow decompose faster than oak in rivers?", opts:["Willow has more lignin","Willow is less palatable to invertebrates","Willow has nutrient-rich soft tissue with low lignin","Willow sinks faster"], ans:2, exp:"Willow litter is high in nutrients and low in lignin, making it readily decomposed by microbes and invertebrates."},
    {q:"Fungal conditioning of leaf litter in rivers:", opts:["Prevents decomposition","Makes litter more palatable and nutritious for invertebrates","Kills shredding invertebrates","Converts CPOM directly to DIC"], ans:1, exp:"Fungi colonise leaf litter and partially break it down, increasing its nitrogen content and palatability for shredding invertebrates."},
    {q:"Decomposition in rivers is mainly driven by four processes. Which is NOT one of them?", opts:["Leaching","Fungal conditioning","Invertebrate shredding","Photosynthesis"], ans:3, exp:"Photosynthesis produces organic matter but is not a decomposition process. The four decomposition drivers are leaching, microbial breakdown, fungal conditioning and invertebrate shredding."}
  ],
  summary:`<h4>Overview</h4><p>Rivers are active carbon processors, not just transport pipes. They transform organic matter, respire carbon, and release CO₂ to the atmosphere.</p><h4>Carbon Forms</h4><p>CPOM → shredded to FPOM → decomposed to DOM/DIC → respired as CO₂. Rivers release ~2.3 Pg C/year globally.</p><h4>Metabolism</h4><p>Most rivers are <strong>heterotrophic</strong> (P:R &lt; 1) — they consume more carbon than they produce. Decomposition drives food webs. Temperature and organic matter quality are key controls.</p><h4>Exam Tips</h4><div class="tip">Know what P:R ratio means and be able to say what controls it (shading, organic matter inputs, temperature). The 4 decomposition processes come up regularly.</div>`,
  terms:[
    {t:"Heterotrophic (rivers)", d:"A river where ecosystem respiration exceeds gross primary production (P:R &lt; 1); relies on external organic matter inputs to sustain food webs."},
    {t:"P:R ratio", d:"Production to Respiration ratio; &gt;1 = autotrophic (net C gain); &lt;1 = heterotrophic (net C loss); most rivers have P:R &lt; 1."},
    {t:"Fungal conditioning", d:"The colonisation of leaf litter by aquatic fungi that partially decompose and enrich it, making it more nutritious and palatable for invertebrate shredders."},
    {t:"DOM", d:"Dissolved Organic Matter — organic carbon dissolved in river water, including humic substances, sugars, and amino acids."},
    {t:"DIC", d:"Dissolved Inorganic Carbon — CO₂, carbonic acid, bicarbonate (HCO₃⁻) and carbonate in river water; can be outgassed as CO₂."},
    {t:"Activation energy model", d:"A model describing how biological reaction rates (respiration, decomposition) increase exponentially with temperature, with a characteristic activation energy."}
  ]
},
"2.6.1": {
  cards:[
    {q:"What is a riparian zone?", a:"The transitional zone between a river and the surrounding terrestrial environment, broadly defined to include floodplains and not just vegetated banks."},
    {q:"Name three lateral features of an unmodified river system.", a:"Main channel, exposed sediments/gravel bars, riparian zone, side channels, and parafluvial ponds (water in the hyporheic zone)."},
    {q:"What are reciprocal subsidies between land and water (give an example each way)?", a:"Land→water: leaf litter, terrestrial insects falling into rivers (allochthonous inputs). Water→land: aquatic insects emerging from rivers feeding riparian birds and spiders (aquatic subsidies to land)."},
    {q:"Why are riparian zones described as critical components of river ecosystems?", a:"They facilitate physical, biological, and social linkages between land and water — regulating inputs of organic matter, nutrients, and sediment while providing habitat for both aquatic and terrestrial species."},
    {q:"What did Nakano et al. (1999) and Baxter et al. (2005) demonstrate?", a:"That fluxes of energy and matter between terrestrial and aquatic systems are bidirectional and link food webs in both ecosystems — e.g. aquatic insect subsidies to riparian spiders and birds."},
    {q:"Describe the Nakano et al. 1999 experimental design for testing terrestrial-aquatic subsidies.", a:"Experimentally excluded falling terrestrial arthropods using a constructed greenhouse-type stream canopy covering 25m reaches (25m uncovered as control). Similar T, flow, light and depth between treatments. Replicated full factorial design: fish+natural arthropods, fish+reduced, no fish+reduced, no fish+natural. Showed terrestrial arthropods are a critical subsidy to stream fish."},
    {q:"What did Paetzold et al. 2011 show about aquatic-to-terrestrial subsidies?", a:"Pardosa spp. (wolf spiders, Arachnida) were found feeding on Leuctra spp. (stoneflies, Plecoptera). Biomass of aquatic insects (in-stream and emerged) was significantly higher in forested reaches than in agricultural reaches — and web spider biomass was correspondingly higher in forested reaches, demonstrating tight aquatic-to-terrestrial linkage."},
    {q:"What makes riparian ecosystems particularly valuable?", a:"Gregory et al. 1991: riparian ecosystems provide critical physical and biological linkages between terrestrial and aquatic environments. Favourable water, nutrient, temperature and light regimes produce unusually high plant production. Considerable proportion of plant production (leaves, needles, wood) enters rivers and benefits detritivores (shredders)."},
    {q:"How do laterally connected floodplains affect river ecosystem function?", a:"Floodplain connectivity provides habitat for fish (spawning, feeding), nutrient processing, organic matter inputs, and buffers flood pulses — greatly increasing overall productivity."},
    {q:"What is the hyporheic zone?", a:"The saturated zone beneath and beside the river channel where surface water and groundwater mix — an important habitat for invertebrates and a site of nutrient processing."},
    {q:"What does the plant tree of life reveal about forest evolution?", a:"Palmer et al. 2004: first land plants in the Ordovician (~450 Ma). Vascular plants (with xylem) evolved in the Devonian (~400 Ma); first forests appeared at end of Devonian (~350 Ma) as giant ferns (Equisetum, Lycopodiella). Gymnosperms dominated the Mesozoic. Angiosperms arose in the Triassic and diversified massively in the Cretaceous — now ~245,000 species. Eudicots ~175,000 spp, Monocots ~70,000 spp."},
    {q:"What are the key features of Giant Redwoods (Sequoia sempervirens)?", a:"The tallest trees on Earth (up to 100m) and very long-lived (up to 2,000 years). Large height explained by: ample rainfall, summer fog reduces evapotranspiration by lowering atmospheric demand, rich soil, and fire resistance. Found in California coastal forests."},
    {q:"Why are animals critical for tropical forest function?", a:"Up to 90% of tropical tree species require interaction with animals for reproduction (pollination or seed dispersal). Endozoochory (seed dispersal via animal guts) is the major dispersal mode. Key animals: tapirs, elephants (seed dispersal), toucans (fruit dispersal), fish like tambaqui (dispersing seeds in flooded forests). Brazil nuts require specific orchid bees for pollination and agoutis to cache/bury seeds — they cannot reproduce without both animal partners."}
  ],
  quiz:[
    {q:"Riparian zones are broadly defined to include:", opts:["Only the vegetated bank","Only the channel edge","Floodplains and transitional areas between water and land","Only areas above the flood line"], ans:2, exp:"Riparian zones are broadly defined to include floodplains and the full transitional zone between aquatic and terrestrial systems."},
    {q:"Terrestrial-aquatic linkages involve:", opts:["One-way flow from land to water only","Bidirectional fluxes of energy and matter","Only chemical fluxes","Only physical disturbances"], ans:1, exp:"Baxter et al. (2005) showed fluxes are bidirectional — terrestrial organic matter enters rivers, and emerging aquatic insects subsidise riparian food webs."},
    {q:"Parafluvial ponds are found:", opts:["In the open ocean","In the floodplain alongside river channels","In groundwater only","Above the riparian canopy"], ans:1, exp:"Parafluvial ponds form in floodplains adjacent to river channels, forming part of the lateral complexity of unmodified river systems."},
    {q:"An example of an aquatic subsidy to a terrestrial food web is:", opts:["Leaf litter falling into streams","Aquatic insects emerging and feeding riparian birds","Rainfall recharging rivers","Trees shading rivers"], ans:1, exp:"Emerging aquatic insects (e.g. mayflies, caddisflies) subsidise riparian predators like spiders, bats and birds — a key aquatic-to-terrestrial linkage."},
    {q:"The hyporheic zone is:", opts:["The deep ocean floor","The zone of saturated sediment beneath and beside river channels","The surface water column","The riparian tree canopy"], ans:1, exp:"The hyporheic zone is the subsurface zone where surface water and groundwater mix under and alongside the river channel."}
  ],
  summary:`<h4>Overview</h4><p>Rivers are not isolated systems — they are deeply connected to surrounding terrestrial environments through the riparian zone and lateral floodplain features.</p><h4>Lateral Complexity</h4><p>Unmodified rivers have: main channel, gravel bars, riparian zones, side channels, parafluvial ponds. All are functionally connected.</p><h4>Reciprocal Subsidies</h4><p>Land → water: leaf litter, terrestrial insects (allochthonous inputs). Water → land: emerging aquatic insects feeding riparian birds, bats and spiders. Both directions matter (Nakano 1999, Baxter 2005).</p><h4>Exam Tips</h4><div class="tip">Emphasise BIDIRECTIONALITY — most students only discuss land-to-water inputs. Always mention the aquatic-to-terrestrial subsidy to get full marks.</div>`,
  terms:[
    {t:"Riparian zone", d:"The transitional zone between river and land, including floodplains; facilitates physical, biological and chemical exchange between aquatic and terrestrial systems."},
    {t:"Parafluvial ponds", d:"Water bodies in the floodplain alongside river channels, hydrologically connected to the main channel and important for fish and invertebrates."},
    {t:"Hyporheic zone", d:"The saturated zone beneath and beside the river channel where surface and groundwater mix; an important habitat and nutrient processing zone."},
    {t:"Reciprocal subsidies", d:"Bidirectional flows of organic matter and energy between terrestrial and aquatic ecosystems: leaf litter enters rivers; emerging aquatic insects subsidise land food webs."},
    {t:"Allochthonous input", d:"Organic matter entering a river from outside the aquatic ecosystem (e.g. leaf litter, terrestrial insects) that fuels heterotrophic food webs."},
    {t:"Floodplain connectivity", d:"The degree to which a river is laterally connected to its floodplain during floods; high connectivity increases productivity, habitat diversity and nutrient processing."}
  ]
},
"2.7.1": {
  cards:[
    {q:"Distinguish gymnosperms from angiosperms.", a:"Gymnosperms = naked seeds (no fruit); include all conifers, cycads, and gingkoes. Angiosperms = flowering plants with seeds enclosed in fruit; include most broadleaved trees."},
    {q:"What are the key advantages of the tree life form?", a:"Competition for light (height), avoidance of ground-level disturbances, greater seed dispersal distances for wind-dispersed seeds, increased fecundity with longevity, and decreased extinction risk."},
    {q:"Distinguish sapwood from heartwood.", a:"Sapwood = outer, younger, living wood that conducts water from roots to leaves (xylem). Heartwood = older, inner dead wood that provides structural support."},
    {q:"Compare pioneer vs. old-growth tree species.", a:"Pioneers: light-demanding, small/many seeds, short-lived, R-strategists. Old-growth: shade-tolerant, large/few seeds, long-lived, K-strategists."},
    {q:"What are lianas and what effect do they have on tropical forests?", a:"Lianas are woody vines rooted in the ground that climb to the canopy using host trees. They suppress tree growth, increase mortality, and reduce forest productivity. Their density is increasing, possibly linked to rising CO₂."},
    {q:"What are epiphytes?", a:"Plants that grow on other plants (e.g. orchids, bromeliads, ferns on tree branches) but are not parasitic — they use the host only for physical support."},
    {q:"What are buttress roots and where are they found?", a:"Buttress roots are flanged, plank-like roots at the base of tropical forest trees that provide structural support in shallow tropical soils. Prop roots serve a similar function in flooded forests."},
    {q:"What are leaf thermal limits and what happens when they are exceeded?", a:"PSII photosystem efficiency (Fv/Fm) remains stable up to ~45–50°C then collapses abruptly. Sastry and Barua 2017: different species (Ficus religiosa vs Mangifera indica) have different thermal thresholds. High leaf temperatures alter carbon balance through both photosynthesis and respiration and ultimately cause irreversible damage. Leaf temperatures vary greatly during the day (mainly due to solar radiation changes) and between individual trees under the same conditions."},
    {q:"What are the concentration-carbon and climate-carbon feedbacks?", a:"Concentration-carbon feedback (negative): rising CO₂ → more land carbon uptake → dampens atmospheric CO₂ increase. This is responsible for the terrestrial carbon sink. Climate-carbon feedback (positive): higher temperature → higher respiration → CO₂ released from land → further warming. Chimuka et al. 2023, Biogeosciences. The positive climate-carbon feedback has the potential to amplify warming if land ecosystems switch from sinks to sources."},
    {q:"How many trees are estimated to exist on Earth?", a:"Approximately 3 trillion trees, according to Crowther et al. (2015)."}
  ],
  quiz:[
    {q:"Gymnosperms are characterised by:", opts:["Enclosed seeds within fruit","Naked seeds (no fruit)","Only herbaceous growth forms","Exclusively tropical distribution"], ans:1, exp:"Gymnosperms (conifers, cycads, gingkoes) have naked seeds not enclosed in fruit — 'gymnosperm' means 'naked seed'."},
    {q:"Sapwood differs from heartwood in that it:", opts:["Is dead and provides structural support","Conducts water and is the youngest outer wood","Is found only in tropical trees","Contains more lignin"], ans:1, exp:"Sapwood is the outer, younger, living wood that actively conducts water through xylem; heartwood is older, dead and structural."},
    {q:"Pioneer tree species are typically:", opts:["Shade-tolerant with large seeds","Light-demanding with many small seeds (R-strategists)","Long-lived K-strategists","Only found in old-growth forests"], ans:1, exp:"Pioneer species are light-demanding, produce many small seeds, grow fast and live shorter lives — classic R-selected traits."},
    {q:"Lianas in tropical forests:", opts:["Increase tree growth","Have no effect on tree mortality","Suppress tree growth and increase tree mortality","Are always beneficial to host trees"], ans:2, exp:"Lianas are structural parasites that reduce light access, suppress tree growth and can increase tree mortality rates."},
    {q:"Epiphytes are plants that:", opts:["Parasitise host trees","Grow on other plants for support but are not parasitic","Fix nitrogen in soil","Only grow in temperate forests"], ans:1, exp:"Epiphytes (orchids, bromeliads, mosses) use host trees for physical support only; they are not parasitic and obtain nutrients from rainfall and air."}
  ],
  summary:`<h4>Overview</h4><p>Trees dominate terrestrial biomes and drive major ecosystem processes. Their evolutionary history spans ~450 million years; their functional diversity shapes carbon, water and nutrient cycles.</p><h4>Evolutionary History (Palmer et al. 2004)</h4><p>First land plants ~450 Ma (Ordovician). Vascular plants ~400 Ma (Devonian). First forests ~350 Ma as giant ferns. Gymnosperms dominated Mesozoic. Angiosperms arose Triassic, diversified massively in Cretaceous — now ~175,000 eudicot + ~70,000 monocot species.</p><h4>Structure and Function</h4><p>Sapwood (living, water conduction) vs heartwood (dead, structural). Fine roots in top 30 cm. Cohesion-tension mechanism drives water to canopy. Giant Redwoods (Sequoia sempervirens): up to 100m tall, 2000 yr — summer fog reduces ET, fire-resistant bark, rich soils.</p><h4>Tropical Forest Ecology</h4><p>Up to 90% of tropical tree species need animals for reproduction/dispersal. Endozoochory = major dispersal mode. Brazil nut requires specific orchid bees AND agoutis — cannot reproduce without both. Lianas = structural parasites, increasing with CO₂/seasonality.</p><h4>Leaf Thermal Limits and Carbon Feedbacks</h4><p>PSII collapses above ~45–50°C (Sastry & Barua 2017). Concentration-carbon feedback (negative: more CO₂ → more uptake). Climate-carbon feedback (positive: warming → more respiration → more CO₂). Chimuka et al. 2023.</p><h4>Exam Tips</h4><div class="tip">The Brazil nut mutualism example illustrates why animals are essential to tropical forest function — use it as a case study. Know the two carbon cycle feedbacks and their signs.</div>`,
  terms:[
    {t:"Gymnosperms", d:"Plants with 'naked' seeds not enclosed in fruit; includes all conifers, cycads and gingkoes."},
    {t:"Angiosperms", d:"Flowering plants with seeds enclosed in fruit; the most species-rich plant group, including most broadleaved trees."},
    {t:"Sapwood", d:"The outer, younger, living wood of a tree trunk that conducts water from roots to leaves via xylem."},
    {t:"Heartwood", d:"The older, inner dead wood of a tree trunk that provides structural support but no longer conducts water."},
    {t:"Liana", d:"A woody vine rooted in the ground that climbs trees to access the canopy; acts as a structural parasite suppressing tree growth."},
    {t:"Epiphyte", d:"A plant that grows on another plant for physical support but is not parasitic; obtains nutrients from rainfall and air (e.g. orchids, bromeliads)."},
    {t:"Pioneer species", d:"Fast-growing, light-demanding, small-seeded tree species that colonise disturbed areas; R-strategists with short lifespans."},
    {t:"K-strategist (old-growth trees)", d:"Shade-tolerant, long-lived trees with large seeds and slow growth; invest in persistence rather than rapid reproduction."},
    {t:"Leaf thermal limits", d:"The temperature at which photosystem II efficiency collapses (typically 45–50°C); exceeded temperatures cause irreversible damage to photosynthetic machinery (Sastry & Barua 2017)."},
    {t:"Endozoochory", d:"Seed dispersal via passage through an animal's digestive tract; the major dispersal mode for tropical forest trees (up to 90% of species depend on animals)."},
    {t:"Concentration-carbon feedback", d:"Negative feedback where rising CO₂ stimulates terrestrial carbon uptake, partially offsetting atmospheric increase — responsible for the land carbon sink."},
    {t:"Climate-carbon feedback", d:"Positive feedback where warming increases ecosystem respiration, releasing CO₂ from land and further amplifying warming — a key risk under future climate change (Chimuka et al. 2023)."},
    {t:"Giant Redwood (Sequoia sempervirens)", d:"World's tallest trees (up to 100m) and very long-lived (up to 2000 yr). Success explained by ample rainfall, summer fog reducing ET, rich soils and fire-resistant bark."}
  ]
},
"2.8.1": {
  cards:[
    {q:"Why are grasses (Poaceae) considered the most important plant family for humans?", a:"They include the major crop species (wheat, rice, maize, sugarcane, sorghum) that provide the bulk of human caloric intake, and dominate the grassland biomes used for livestock."},
    {q:"What is the key adaptation of grasses that allows them to tolerate grazing and fire?", a:"The basal meristem — the growing point is located at the base of the plant, protected from damage. After grazing or burning removes the leaves, the plant regrows from the undamaged base."},
    {q:"Explain the C4 photosynthetic advantage over C3 in hot climates.", a:"C4 plants concentrate CO₂ around RuBisCO, minimising photorespiration which wastes energy in hot conditions. This makes C4 grasses more water-use efficient and more productive at high temperatures."},
    {q:"Distinguish climatic from edaphic savannas.", a:"Climatic savannas are controlled by seasonal rainfall patterns — tree cover varies with moisture. Edaphic savannas are controlled by soil conditions (e.g. waterlogging, shallow soils) regardless of rainfall."},
    {q:"How does fire maintain grasslands and prevent forest encroachment?", a:"Fire kills tree seedlings and saplings, removes woody biomass, and creates a positive feedback: more grass biomass → more fuel → more fire → suppresses trees further."},
    {q:"What is 'savannisation' and what drives it?", a:"The conversion of tropical forest to savanna driven by increasing drought, fire frequency, and temperature — a form of biome shift under climate change. Linked to deforestation feedback loops."},
    {q:"What is woody encroachment and what causes it?", a:"The increase in tree and shrub cover in grasslands and savannas. Caused by reduced fire frequency (often from fire suppression), rising atmospheric CO₂ (which favours woody plants), and reduced grazing."},
    {q:"Why are grassland soils among the most fertile in the world?", a:"Deep grass root systems deposit large amounts of organic matter into soil, and the lack of tree canopy means nutrients cycle rapidly at the surface. These soils (e.g. chernozems) have been heavily converted to agriculture."}
  ],
  quiz:[
    {q:"The basal meristem in grasses allows them to:", opts:["Fix nitrogen from the atmosphere","Regrow after grazing or fire from the protected base","Outcompete trees for water","Survive complete inundation"], ans:1, exp:"The basal meristem is at the base of the grass shoot, protected from grazing and fire, allowing rapid regrowth after disturbance."},
    {q:"C4 photosynthesis is advantageous in hot climates because:", opts:["It requires less water","It concentrates CO₂ and minimises photorespiration","It uses more light","It produces more seeds"], ans:1, exp:"C4 plants use an additional carbon-fixing pathway that concentrates CO₂ around RuBisCO, suppressing photorespiration and improving efficiency in hot, dry, high-light conditions."},
    {q:"Edaphic savannas are controlled by:", opts:["Rainfall patterns","Fire frequency","Soil conditions (e.g. waterlogging, shallow soils)","Animal grazing pressure"], ans:2, exp:"Edaphic savannas are determined by soil properties — shallow soils, waterlogging or impermeable layers — regardless of rainfall."},
    {q:"Savannisation of tropical forests is driven by:", opts:["Increasing rainfall","Reduced fire frequency","Increased drought, fire and temperature","Rising CO₂ alone"], ans:2, exp:"Savannisation is driven by increased drought frequency, higher temperatures and fire, often interacting with deforestation in a positive feedback."},
    {q:"Woody encroachment in savannas is caused by:", opts:["Increased fire frequency","Reduced fire frequency and rising CO₂","Higher rainfall","More herbivore pressure"], ans:1, exp:"Reduced fire frequency (often from fire suppression) combined with rising CO₂ that favours woody growth causes increased tree and shrub cover in savannas."}
  ],
  summary:`<h4>Overview</h4><p>Grasslands and savannas are actively maintained ecosystems — not simply areas too dry for forest. Disturbance (fire, grazing) is essential to their persistence.</p><h4>Key Adaptations</h4><p><strong>Basal meristem:</strong> regrowth after grazing/fire. <strong>C4 photosynthesis:</strong> efficient in hot/dry/high-light (tropical savannas). High root:shoot ratios for resource capture.</p><h4>Ecosystem Dynamics</h4><p>Grass-tree balance: water availability and disturbance regime. Fire positive feedback: grass → fuel → fire → suppresses trees. Alternative stable states: ecosystems can flip forest ↔ savanna.</p><h4>Exam Tips</h4><div class="tip">The alternative stable states concept is examinable — explain why boundaries between forest and grassland are often abrupt and can shift rapidly under changing fire regimes or climate.</div>`,
  terms:[
    {t:"Basal meristem", d:"The growing point at the base of grass shoots, protected from grazing and fire, allowing rapid regrowth after disturbance."},
    {t:"C4 photosynthesis", d:"A photosynthetic pathway that concentrates CO₂ around RuBisCO, minimising photorespiration and improving efficiency in hot, dry, high-light conditions; dominant in tropical savannas."},
    {t:"Photorespiration", d:"A wasteful process in C3 plants where RuBisCO reacts with O₂ instead of CO₂, especially in hot conditions; C4 plants largely avoid this."},
    {t:"Edaphic savanna", d:"A savanna maintained by soil conditions (shallow soils, waterlogging, impermeable layers) rather than by rainfall seasonality."},
    {t:"Savannisation", d:"The conversion of tropical forest to savanna driven by increased drought, fire and temperature — a form of biome shift under climate change."},
    {t:"Woody encroachment", d:"Increase in tree and shrub cover in grasslands/savannas, driven by reduced fire frequency and rising atmospheric CO₂."},
    {t:"Alternative stable states", d:"The concept that an ecosystem can exist in more than one self-maintaining state (e.g. forest or savanna) and can shift abruptly between them when thresholds are crossed."}
  ]
}
,"2.10.1": {
  cards:[
    {q:"What is the 'Great Acceleration' and when did it begin?", a:"A rapid increase in human activity since ~1950, driven by population growth, energy use, fertiliser use, urbanisation and global trade. Produced corresponding acceleration in Earth system impacts: rising CO₂, climate warming, land-use change, biodiversity loss, and altered biogeochemical cycles (C, N, P). Marks the onset of the Anthropocene."},
    {q:"What fraction of anthropogenic CO₂ emissions does the terrestrial biosphere absorb?", a:"Land ecosystems absorb approximately 25% of anthropogenic CO₂ emissions — the terrestrial carbon sink. Dominated by forests, especially tropical and temperate forests, plus secondary forest regrowth."},
    {q:"What are the main controls on the terrestrial carbon sink?", a:"CO₂ fertilisation (elevated CO₂ increases photosynthesis), temperature (increases respiration, can exceed thermal tolerance), water availability (drought reduces photosynthesis), disturbance (fire, drought, deforestation), and nutrient availability (especially phosphorus in tropical soils)."},
    {q:"What is the key tension between models and observations of the terrestrial carbon sink?", a:"Models suggest the terrestrial carbon sink will continue to grow with rising CO₂. Observations show regional weakening — e.g. Amazon forests absorbing less carbon than before — and high interannual variability linked to climate, land use, and CO₂. The sink is more vulnerable than models suggest."},
    {q:"Distinguish carbon sources and sinks in the Amazon land-use change context.", a:"Sources: deforestation, degradation (selective logging, fire damage), agriculture, peat disturbance. Sinks: old-growth forest uptake, secondary forest regrowth, reforestation. Key finding: forest degradation now exceeds deforestation as a carbon source in the Amazon."},
    {q:"What is the CO₂ fertilisation effect and what are its limitations?", a:"Elevated CO₂ increases photosynthesis — a central assumption of vegetation and Earth system models. Limitations: photosynthetic response does not equal long-term carbon storage; depends on nutrient availability (especially P in tropical soils), water, and temperature stress. CO₂ fertilisation is constrained by nutrients."},
    {q:"What role do secondary and old-growth forests play in the carbon cycle?", a:"Secondary forests: regrow rapidly after disturbance, accumulate biomass quickly, important short- to medium-term C sinks. Old-growth forests: still act as carbon sinks (not carbon neutral as once assumed) — observed biomass increases in African and Amazonian old-growth forests."},
    {q:"What are tipping elements and give three examples.", a:"Large-scale Earth system components with threshold behaviour — gradual pressure can lead to abrupt, potentially irreversible ecosystem shifts. Examples: Amazon rainforest (deforestation + drought → savannisation), boreal forests (warming → die-back), ice sheets (melt → albedo feedback). Cascading effects between tipping elements are a major concern."},
    {q:"What is the Planetary Boundaries framework?", a:"A framework defining the safe operating space for humanity by identifying thresholds for key Earth system processes: climate change, biodiversity, land use, biogeochemical flows (N, P), freshwater, and novel entities (chemicals, plastics). Several boundaries are already exceeded, raising the risk of irreversible Earth system change."},
    {q:"How does fire interact with the terrestrial carbon cycle under global change?", a:"Fire directly emits CO₂. It causes forest degradation, converting forest to less carbon-dense vegetation. Under warming and drying, fire frequency and intensity increase — creating a positive feedback: warming → drying → more fire → more CO₂ → more warming. Amazon fires linked to ENSO droughts (e.g. 2015/16)."}
  ],
  quiz:[
    {q:"The terrestrial biosphere currently absorbs approximately what fraction of anthropogenic CO₂ emissions?", opts:["5%","25%","50%","75%"], ans:1, exp:"Land ecosystems absorb ~25% of anthropogenic CO₂ emissions as the terrestrial carbon sink, dominated by forests (especially tropical and temperate) and secondary forest regrowth."},
    {q:"The 'Great Acceleration' refers to:", opts:["Accelerating species evolution since 1950","Rapid increase in human activity and Earth system impacts since ~1950","Acceleration of ocean circulation","Faster plant growth due to CO₂ fertilisation"], ans:1, exp:"The Great Acceleration describes the rapid post-1950 increase in human activity (population, energy, fertiliser, trade, urbanisation) and corresponding impacts on Earth system processes — defining the Anthropocene."},
    {q:"In the Amazon, which carbon source now exceeds deforestation in importance?", opts:["Agricultural burning","Peat disturbance","Forest degradation (selective logging, fire damage)","Urban expansion"], ans:2, exp:"Forest degradation — through selective logging, fire damage and other partial disturbances — now exceeds outright deforestation as a carbon source in the Amazon, making degradation a critical conservation target."},
    {q:"Why is CO₂ fertilisation limited as a long-term carbon sink mechanism?", opts:["Plants cannot use extra CO₂","The photosynthetic response does not translate to long-term storage because it is constrained by nutrient (especially P), water and temperature limitations","CO₂ reduces plant growth","Forests are already carbon saturated"], ans:1, exp:"CO₂ fertilisation increases photosynthesis but not necessarily long-term carbon storage — nutrient limitations (especially phosphorus in tropical soils), drought stress and temperature can all prevent the extra photosynthate from being stored as biomass."},
    {q:"The Planetary Boundaries framework identifies:", opts:["Economic growth limits","Safe operating space thresholds for key Earth system processes, several of which are already exceeded","Maximum human population size","Targets only for CO₂ emissions"], ans:1, exp:"Planetary Boundaries (Rockstrom et al.) defines safe operating space across nine Earth system processes — climate, biodiversity, land use, biogeochemical flows, freshwater, novel entities etc. Several are already transgressed, raising irreversible change risk."}
  ],
  summary:`<h4>Overview</h4><p>Human activity now dominates Earth system processes — the Anthropocene. The terrestrial biosphere currently buffers climate change by absorbing ~25% of anthropogenic CO₂, but this sink is vulnerable and constrained.</p><h4>The Great Acceleration</h4><p>Rapid increase since ~1950 in population, energy, fertiliser use, trade and urbanisation. Corresponding Earth system impacts: rising CO₂, warming, land-use change, biodiversity loss, altered N/P/C cycles.</p><h4>Terrestrial Carbon Sink</h4><p>Dominated by forests (tropical, temperate) and secondary regrowth. Key controls: CO₂ fertilisation (constrained by P), temperature, water, disturbance, nutrients. Old-growth forests are still sinks, not neutral. Amazon: degradation now exceeds deforestation as a C source. Models overestimate sink stability — observations show regional weakening.</p><h4>Tipping Points & Planetary Boundaries</h4><p>Tipping elements (Amazon, boreal forests, ice sheets) can shift abruptly. Planetary Boundaries: safe operating space — several already exceeded. Fire: positive feedback with warming and drying.</p><h4>Exam Tips</h4><div class="tip">Key exam phrase: 'CO₂ fertilisation is constrained by nutrients' — especially P in tropical soils. Know the difference between degradation and deforestation, and why degradation now matters more in the Amazon. Old-growth forests being active sinks (not neutral) is a common misconception to correct.</div>`,
  terms:[
    {t:"Great Acceleration", d:"Rapid post-1950 increase in human activity (population, energy, trade, urbanisation) and corresponding acceleration of Earth system impacts including rising CO₂, warming, and biodiversity loss."},
    {t:"Anthropocene", d:"Proposed geological epoch defined by human domination of Earth system processes; often dated from ~1950 with the Great Acceleration."},
    {t:"Terrestrial carbon sink", d:"The net uptake of CO₂ by land ecosystems (~25% of anthropogenic emissions), dominated by forests and secondary vegetation; vulnerable to climate and nutrient constraints."},
    {t:"CO₂ fertilisation", d:"The enhancement of plant photosynthesis by elevated atmospheric CO₂; a major assumption in climate models but constrained by nutrient (especially P), water and temperature limitations."},
    {t:"Forest degradation", d:"Partial damage to forest structure and function (through selective logging, fire, drought) that reduces carbon stocks without full deforestation; now exceeds deforestation as a C source in the Amazon."},
    {t:"Tipping element", d:"A large-scale Earth system component with threshold behaviour where gradual pressure can trigger abrupt, potentially irreversible change (e.g. Amazon, boreal forests, ice sheets)."},
    {t:"Planetary Boundaries", d:"A framework defining the safe operating space for humanity across nine Earth system processes; several boundaries (climate, biodiversity, biogeochemical flows, land use) are already exceeded."},
    {t:"Secondary forests", d:"Forests regrowing after disturbance; accumulate biomass rapidly and act as important short- to medium-term carbon sinks."},
    {t:"Concentration-carbon feedback", d:"A negative feedback where rising atmospheric CO₂ stimulates terrestrial carbon uptake, partially offsetting the original CO₂ increase — responsible for the ~25% land carbon sink."},
    {t:"Climate-carbon feedback", d:"A positive feedback where warming increases ecosystem respiration, releasing CO₂ from land and further amplifying warming — a key risk if land sinks weaken or reverse."}
  ]
}
,"2.11.1": {
  cards:[
    {q:"State the four options species face under anthropogenic climate change (Corlett et al. 2013).", a:"'In the face of anthropogenic climate change, species must acclimate, adapt, move or die.' — Corlett et al., Trends in Ecology and Evolution 2013."},
    {q:"Distinguish acclimation from adaptation in the context of climate change responses.", a:"Acclimation: physiological or morphological adjustment by an individual organism within its lifetime — not genetic. Examples: plant respiration adjusting to warmer conditions (Type I: rapid substrate-driven; Type II: slower via gene expression). Adaptation: genetic changes over multiple generations through natural selection — traits are heritable. Example: Amazon trees in drier forests have xylem more resistant to embolism."},
    {q:"What evidence exists for range shifts (migration) under climate change?", a:"Latitudinal shifts: northern species expanding ranges northward, southern species declining. Elevational shifts: species moving upslope in mountain regions (e.g. European Alps). These shifts result in novel community compositions as species respond at different rates."},
    {q:"What are climate 'winners' and 'losers' and what traits determine which a species is?", a:"Winners: species whose ranges expand or populations grow under climate change. Losers: species with declining ranges or populations. Determining traits: thermal tolerance breadth, dispersal ability, life history strategy (generalist vs specialist), habitat flexibility. Ectotherms (reptiles, amphibians, fish, many invertebrates) are especially vulnerable because body temperature depends on environment."},
    {q:"What happened to flying foxes (bats) during extreme heatwaves?", a:"Extreme heatwave events exceeding 42°C caused mass mortality of flying fox populations. Responses are non-linear: a single extreme event can cause large population losses disproportionate to the temperature exceedance. This illustrates how extreme events — not just means — are critical for biodiversity impacts."},
    {q:"What scale of habitat fragmentation currently affects forests?", a:"~70% of remaining forests lie within 1 km of a forest edge. Edge effects (altered microclimate, increased light, desiccation, invasive species) therefore increasingly dominate forest ecosystems globally."},
    {q:"How does habitat fragmentation affect extinction risk?", a:"Extinction risk increases with greater habitat fragmentation and smaller geographic range size — both are used in IUCN red list risk assessments. Sensitivity varies by taxon: amphibians very sensitive (desiccation risk at edges); large reptiles vulnerable to overheating; medium-sized mammals often most edge-sensitive; birds generally more tolerant."},
    {q:"What are the key patterns and causes of global insect decline?", a:"Terrestrial insects declining at ~1% per year on average. Large biomass declines documented even within nature reserves. Causes are interacting: land-use change, agricultural intensification, pesticides/insecticides, and climate change. Consequences: disruption of food webs, reduced pollination, threats to food security and ecosystem stability."},
    {q:"Explain the land sparing vs. land sharing debate in conservation.", a:"Land sparing: high-yield farming on small areas, freeing large areas of natural habitat for conservation. Land sharing: wildlife-friendly lower-intensity farming integrating biodiversity into agricultural landscapes. Trade-offs depend on species (generalist vs specialist), region, and conservation goals. No universal winner — context-dependent."},
    {q:"What are novel ecosystems and what question do they raise?", a:"Ecosystems irreversibly altered by human activity that have no historical precedent — new species combinations, altered processes. Key question: should conservation aim to restore historical ecosystem states, or manage and adapt to new novel states? Implies rethinking traditional restoration goals."}
  ],
  quiz:[
    {q:"According to Corlett et al. 2013, the four options species face under climate change are:", opts:["Grow, reproduce, compete, disperse","Acclimate, adapt, move or die","Evolve, migrate, hibernate, compete","Feed, breed, spread, die"], ans:1, exp:"Corlett et al. 2013 (Trends in Ecology and Evolution): 'In the face of anthropogenic climate change, species must acclimate, adapt, move or die' — the four possible responses to changing conditions."},
    {q:"Acclimation differs from adaptation because:", opts:["Acclimation is genetic; adaptation is not","Acclimation occurs within an individual's lifetime and is not heritable; adaptation involves heritable genetic change across generations","Acclimation only occurs in plants","Adaptation is always faster than acclimation"], ans:1, exp:"Acclimation is physiological/morphological adjustment within an individual's lifetime — not genetic. Adaptation requires heritable genetic change over multiple generations through natural selection."},
    {q:"Approximately what percentage of remaining forests lie within 1 km of a forest edge?", opts:["10%","30%","70%","90%"], ans:2, exp:"Around 70% of remaining forests lie within 1 km of an edge, meaning edge effects (altered microclimate, desiccation, invasive species) dominate most remaining forest globally."},
    {q:"Terrestrial insects are declining at approximately what rate?", opts:["0.1% per year","1% per year","10% per year","50% per year"], ans:1, exp:"Terrestrial insects are declining at approximately 1% per year on average — with large biomass losses documented even inside nature reserves, attributed to multiple interacting causes."},
